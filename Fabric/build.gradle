import com.modrinth.minotaur.dependencies.ModDependency
import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
    id 'idea'
    id 'net.darkhax.curseforgegradle' version '1.1.28'
    id "com.modrinth.minotaur" version "2.9.0"
}

base.archivesName = "${project.mod_name}-${project.minecraft_version}-fabric"

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation 'com.google.code.findbugs:jsr305:3.0.1'
    api(include("mysticdrew:common-networking-fabric:${common_networking_version}")) {
        transitive = false
    }
    include(implementation("com.electronwill.night-config:core:${nightconfig_version}"))
    include(implementation("com.electronwill.night-config:toml:${nightconfig_version}"))
}

loom {
    def aw = project(":Common").file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        useLegacyMixinAp = false
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            property("mixin.debug.export", "true")
            ideConfigGenerated(true)
            runDir("runs/client")
        }
        server {
            server()
            setConfigName("Fabric Server")
            property("mixin.debug.export", "true")
            ideConfigGenerated(true)
            runDir("runs/server")
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "${mod_id}-test"
        enableGameTests = true
        enableClientGameTests = true
        eula = true
        clearRunDirectory = true
        username = "MBTest"
    }
}

def persistenceRestartToken = UUID.randomUUID().toString()

loom {
    runs {
        persistenceWrite {
            inherit server
            property("fabric-api.gametest")
            property(
                    "fabric-api.gametest.report-file",
                    layout.buildDirectory.file('reports/gametest/persistence-write.xml').get().asFile.absolutePath)
            property("mismatchedboots.test.persistence.restartMode", "write")
            property("mismatchedboots.test.persistence.restartToken", persistenceRestartToken)
            runDir("build/run/persistenceGameTest")
            source("gametest")
        }
        persistenceRead {
            inherit server
            property("fabric-api.gametest")
            property(
                    "fabric-api.gametest.report-file",
                    layout.buildDirectory.file('reports/gametest/persistence-read.xml').get().asFile.absolutePath)
            property("mismatchedboots.test.persistence.restartMode", "read")
            property("mismatchedboots.test.persistence.restartToken", persistenceRestartToken)
            runDir("build/run/persistenceGameTest")
            source("gametest")
        }
        attributeRules {
            inherit server
            property("fabric-api.gametest")
            property(
                    "fabric-api.gametest.report-file",
                    layout.buildDirectory.file('reports/gametest/attribute-rules.xml').get().asFile.absolutePath)
            property("mismatchedboots.test.attributeRules", "true")
            runDir("build/run/attributeRulesGameTest")
            source("gametest")
        }
    }
}

tasks.register('preparePersistenceRestart', Delete) {
    group = 'verification'
    description = 'Deletes the dedicated persistence world before the write run.'
    delete layout.buildDirectory.dir('run/persistenceGameTest')
    doLast {
        def runDirectory = layout.buildDirectory.dir('run/persistenceGameTest').get().asFile
        runDirectory.mkdirs()
        new File(runDirectory, 'eula.txt').text = 'eula=true\n'
        new File(runDirectory, 'server.properties').text = 'online-mode=false\n'
    }
}

tasks.named('runPersistenceWrite') {
    dependsOn tasks.named('preparePersistenceRestart')
}

def preparePersistenceRestartRead = tasks.register('preparePersistenceRestartRead') {
    group = 'verification'
    description = 'Changes the isolated persistence config after the write process.'
    dependsOn tasks.named('runPersistenceWrite')
    doLast {
        def configFile = layout.buildDirectory.file(
                'run/persistenceGameTest/config/mismatchedboots-server.toml').get().asFile
        configFile.parentFile.mkdirs()
        configFile.text = '''[attributes]
fallback = "separate"

[attributes."minecraft:movement_speed"]
policy = "combine"
'''
    }
}

tasks.named('runPersistenceRead') {
    dependsOn preparePersistenceRestartRead
}

tasks.register('prepareAttributeRulesGameTest', Delete) {
    group = 'verification'
    description = 'Creates the isolated non-default attribute-rule GameTest config.'
    delete layout.buildDirectory.dir('run/attributeRulesGameTest')
    doLast {
        def runDirectory = layout.buildDirectory.dir('run/attributeRulesGameTest').get().asFile
        runDirectory.mkdirs()
        new File(runDirectory, 'eula.txt').text = 'eula=true\n'
        new File(runDirectory, 'server.properties').text = 'online-mode=false\n'
        def configFile = new File(runDirectory, 'config/mismatchedboots-server.toml')
        configFile.parentFile.mkdirs()
        configFile.text = '''[attributes]
fallback = "separate"

[attributes."minecraft:movement_speed"]
policy = "combine"

[attributes."minecraft:waypoint_transmit_range"]
policy = "reject"
'''
    }
}

tasks.named('runAttributeRules') {
    dependsOn tasks.named('prepareAttributeRulesGameTest')
}

tasks.register('verifyPersistenceRestart') {
    group = 'verification'
    description = 'Writes and reloads mixed boots across two Fabric server processes.'
    dependsOn tasks.named('runPersistenceRead')
}

tasks.register('verifyGameplay') {
    group = 'verification'
    description = 'Runs the canonical Fabric server GameTest suite.'
    dependsOn tasks.named('runGameTest'), tasks.named('runAttributeRules')
}

tasks.register('verifyClient') {
    group = 'verification'
    description = 'Runs the unattended Fabric client GameTest suite.'
    dependsOn tasks.named('runClientGameTest')
}

tasks.named('check') {
    dependsOn tasks.named('verifyGameplay')
}

tasks.named('runGameTest') {
    systemProperty 'fabric-api.gametest.report-file',
            layout.buildDirectory.file('reports/gametest/results.xml').get().asFile.absolutePath
}

tasks.named('runClientGameTest') {
    def showWindow = providers.gradleProperty('showClientGameTestWindow')
            .map { it.toBoolean() }
            .getOrElse(false)
    systemProperty 'mismatchedboots.test.hideClientWindow', !showWindow
    doFirst {
        def optionsFile = layout.buildDirectory.file('run/clientGameTest/options.txt').get().asFile
        optionsFile.parentFile.mkdirs()
        optionsFile.text = 'soundCategory_master:0.0\n'
    }
}

idea {
    module {
        excludeDirs += file('runs')
    }
}

registerProcessDocsTask(
        "Fabric API",
        fabric_api_version,
        ""
)

tasks.register('publishCurseForge', TaskPublishCurseForge) {
    apiToken = "${curseForgeApiKey}"
    def mainFile = upload(curseforge_project_id, jar)
    mainFile.displayName = "${minecraft_version}-${version}-fabric"
    mainFile.releaseType = release_type
    mainFile.addModLoader("Fabric", "Quilt")
    mainFile.addJavaVersion("Java 25")
    mainFile.addGameVersion("${minecraft_version}")
    mainFile.addEnvironment("Server", "Client")
    mainFile.changelogType = "markdown"
    mainFile.changelog = file("$project.buildDir/doc/changelog.md")
}

modrinth {
//    debugMode.set(true)
    token = "${modrinthApiKey}"
    projectId = modrinth_project_id
    versionNumber = "${minecraft_version}-${version}-fabric"
    versionName = "${mod_name}-${minecraft_version}-${version}-fabric"
    versionType = release_type
    uploadFile = jar
    gameVersions = ["${minecraft_version}"]
    loaders = ["fabric", "quilt"]
    dependencies = [
            new ModDependency("fabric-api", "required")
    ]
    changelog.set(providers.provider {
        file("$project.buildDir/doc/changelog.md").text
    })
}
