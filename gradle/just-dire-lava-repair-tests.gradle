// JDT Lava Repair, native settings and save/restart lifecycle.
def runBoundedGradleTask = rootProject.ext.runBoundedGradleTask

def fixtureBuildDirectory = layout.buildDirectory

def justDireSmithingMarkers = fixtureBuildDirectory.dir('just-dire-smithing-markers')

def justDireSmithingRunDirectory = fixtureBuildDirectory.dir('run/justDireSmithing')

def justDireJumpClientDirectory = fixtureBuildDirectory.dir('run/justDireJumpClient')

neoForge.runs {
    ['', 'ApiMissing', 'ParticlesMissing', 'EmissionFailure', 'QueryFailure', 'Absent'].each { variant ->
        register("justDireLavaRepair${variant}") {
            server()
            disableIdeRun()
            gameDirectory = justDireSmithingRunDirectory.get().asFile
            programArgument('--nogui')
            systemProperty('mismatchedboots.runtimetest.markers', justDireSmithingMarkers.get().asFile.absolutePath)
            systemProperty('mismatchedboots.runtimetest.justDireLavaRepairTest', 'true')
            systemProperty('mismatchedboots.runtimetest.justDireLavaRepairVariant', variant.uncapitalize())
            jvmArgument('-Xmx1G')
        }
    }

    justDireLavaRepairClient {
        client()
        disableIdeRun()
        gameDirectory = justDireJumpClientDirectory.get().asFile
        programArgument('--quickPlaySingleplayer')
        programArgument('jump')
        systemProperty('mismatchedboots.runtimetest.markers', justDireSmithingMarkers.get().asFile.absolutePath)
        systemProperty('mismatchedboots.runtimetest.justDireLavaRepairClientTest', 'true')
        systemProperty('mismatchedboots.test.hideClientWindow', 'true')
        systemProperty('mismatchedboots.runtimetest.dismissWarnings', 'true')
        jvmArgument('-Xmx1G')
    }

    ['Save', 'Restart'].each { mode ->
        register("justDireLavaLifecycle${mode}") {
            server()
            disableIdeRun()
            gameDirectory = justDireSmithingRunDirectory.get().asFile
            programArgument('--nogui')
            systemProperty('mismatchedboots.runtimetest.markers', justDireSmithingMarkers.get().asFile.absolutePath)
            systemProperty('mismatchedboots.runtimetest.justDireLavaLifecycle', mode.uncapitalize())
            jvmArgument('-Xmx1G')
        }
    }
}

['', 'ApiMissing', 'ParticlesMissing', 'EmissionFailure', 'QueryFailure'].each { variant ->
    tasks.named("runJustDireLavaRepair${variant}") { dependsOn tasks.named('prepareJustDireSmithing') }
}

tasks.named('runJustDireLavaRepairAbsent') { dependsOn tasks.named('prepareJustDireGroundStompStateAbsent') }

tasks.named('runJustDireLavaRepairClient') { dependsOn tasks.named('prepareJustDireJumpClient') }

tasks.named('runJustDireLavaLifecycleSave') {
    dependsOn 'prepareJustDireSmithing'
    doFirst {
        // This scheduler-owned scenario intentionally outlives vanilla's empty-server pause.
        new File(justDireSmithingRunDirectory.get().asFile, 'server.properties').append('pause-when-empty-seconds=0\n')
    }
}

tasks.named('runJustDireLavaLifecycleRestart') {
    dependsOn(':NeoForge:jar', tasks.named('jar'))
    doFirst {
        if (!new File(justDireSmithingMarkers.get().asFile, 'just-dire-lava-lifecycle-save-success.txt').isFile()) {
            throw new GradleException('Run Lava lifecycle Save before Restart; its world must not be reset')
        }
    }
}

tasks.register('verifyJustDireLavaLifecycle') {
    group = 'verification'
    description = 'Verifies scheduler-owned Lava entities, chunk unload, pickup/redrop, dimension transfer and actual world restart.'
    dependsOn(':NeoForge:jar', tasks.named('jar'))
    doLast {
        ['Save', 'Restart'].each { mode ->
            def log = fixtureBuildDirectory.file("reports/just-dire-lava-repair/${neoforge_version}/lifecycle${mode}-process.log").get().asFile
            runBoundedGradleTask(":RuntimeTests:NeoForge:runJustDireLavaLifecycle${mode}", log, 300)
            def directory = justDireSmithingMarkers.get().asFile
            def prefix = "just-dire-lava-lifecycle-${mode.uncapitalize()}"
            def failure = new File(directory, "${prefix}-failure.txt")
            def success = new File(directory, "${prefix}-success.txt")
            def report = new File(directory, "${prefix}-report.txt")
            if (failure.isFile() || !success.isFile() || success.text != 'neoforge\n' || !report.isFile()
                    || log.text.contains('/ERROR]') || log.readLines().any { it.contains('/WARN]') && it.contains('Just Dire Things Lava Repair') }) {
                throw new GradleException("Lava lifecycle ${mode} failed: ${failure.isFile() ? failure.text : log}")
            }
            new File(log.parentFile, "lifecycle${mode}-report.txt").text = report.text
            logger.lifecycle(report.text)
        }
    }
}

tasks.register('verifyJustDireLavaRepair') {
    group = 'verification'
    description = 'Verifies production intrinsic Lava Repair and native particle delivery, not the research candidate.'
    dependsOn(':NeoForge:jar', tasks.named('jar'))
    doLast {
        ['', 'Client'].each { variant ->
            def log = fixtureBuildDirectory.file("reports/just-dire-lava-repair/${neoforge_version}/production${variant}-process.log").get().asFile
            runBoundedGradleTask(":RuntimeTests:NeoForge:runJustDireLavaRepair${variant}", log, variant ? 300 : 240)
            def directory = justDireSmithingMarkers.get().asFile
            def prefix = variant ? 'just-dire-lava-repair-client' : 'just-dire-lava-repair'
            def failure = new File(directory, "${prefix}-failure.txt")
            def report = new File(directory, "${prefix}-report.txt")
            def success = new File(directory, "${prefix}-success.txt")
            if (failure.isFile() || !success.isFile() || success.text != 'neoforge\n' || !report.isFile()) {
                throw new GradleException("Production Lava Repair ${variant} failed: ${failure.isFile() ? failure.text : log}")
            }
            new File(log.parentFile, "production${variant}-report.txt").text = report.text
            if (variant == 'Client') {
                def trajectory = new File(directory, 'just-dire-lava-repair-trajectory.csv')
                if (trajectory.isFile()) {
                    new File(log.parentFile, 'productionClient-trajectory.csv').text = trajectory.text
                }
            }
            logger.lifecycle(report.text)
        }
    }
}

tasks.register('verifyJustDireLavaRepairGuards') {
    group = 'verification'
    description = 'Verifies isolated Lava API/query/particle failure and quiet JDT absence.'
    dependsOn(':NeoForge:jar', tasks.named('jar'))
    doLast {
        ['ApiMissing', 'ParticlesMissing', 'EmissionFailure', 'QueryFailure', 'Absent'].each { variant ->
            def log = fixtureBuildDirectory.file("reports/just-dire-lava-repair/${neoforge_version}/${variant}-process.log").get().asFile
            runBoundedGradleTask(":RuntimeTests:NeoForge:runJustDireLavaRepair${variant}", log, 240)
            def directory = justDireSmithingMarkers.get().asFile
            def failure = new File(directory, 'just-dire-lava-repair-failure.txt')
            def report = new File(directory, 'just-dire-lava-repair-report.txt')
            def success = new File(directory, 'just-dire-lava-repair-success.txt')
            def warnings = log.readLines().count { it.contains('/WARN]') && it.contains('Just Dire Things Lava Repair') }
            if (failure.isFile() || !success.isFile() || success.text != 'neoforge\n' || !report.isFile()
                    || warnings != (variant == 'Absent' ? 0 : 1)) {
                throw new GradleException("Lava Repair ${variant} failed: ${failure.isFile() ? failure.text : log}; warnings=${warnings}")
            }
            new File(log.parentFile, "${variant}-report.txt").text = report.text
            logger.lifecycle(report.text)
        }
    }
}

['Lava', 'LavaSettingsFailure'].each { variant ->
    tasks.named("runJustDireGroundStompClient${variant}") { dependsOn 'prepareJustDireGroundStompClient' }
}

tasks.register('verifyJustDireLavaRepairSettings') {
    group = 'verification'
    description = 'Verifies intrinsic Lava native widgets/transport, equipped keyboard/mouse and isolated metadata failure.'
    dependsOn(':NeoForge:jar', tasks.named('jar'))
    doLast {
        ['Lava', 'LavaSettingsFailure', 'ApiMissing'].each { variant ->
            def label = variant == 'ApiMissing' ? 'CommonSettingsMissing' : variant
            def log = fixtureBuildDirectory.file("reports/just-dire-lava-repair/${neoforge_version}/${label}-process.log").get().asFile
            runBoundedGradleTask(":RuntimeTests:NeoForge:runJustDireGroundStompClient${variant}", log, 300)
            def directory = justDireSmithingMarkers.get().asFile
            def failure = new File(directory, 'just-dire-ground-stomp-client-failure.txt')
            def report = new File(directory, 'just-dire-ground-stomp-client-report.txt')
            def success = new File(directory, 'just-dire-ground-stomp-client-success.txt')
            def warnings = log.readLines().count { it.contains('/WARN]') && it.contains('Just Dire Things Lava Repair') }
            def commonWarnings = log.readLines().count { it.contains('Could not bind Just Dire Things mixed settings API; new settings/input routes disabled') }
            if (failure.isFile() || !success.isFile() || success.text != variant.uncapitalize() + '\n' || !report.isFile()
                    || warnings != (variant == 'LavaSettingsFailure' ? 1 : 0) || commonWarnings != (variant == 'ApiMissing' ? 1 : 0)
                    || log.text.contains('/ERROR]')) {
                throw new GradleException("Lava settings ${variant} failed: ${failure.isFile() ? failure.text : log}; warnings=${warnings}")
            }
            new File(log.parentFile, "${label}-report.txt").text = report.text
            logger.lifecycle(report.text)
        }
    }
}
