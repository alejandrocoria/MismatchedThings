// Disposable state stays in this fixture project's build directory, never the owner's indev client.
def fixtureFiles = objects.newInstance(FixtureFileOperations).files
def productionJar = project(':NeoForge').tasks.named('jar').flatMap { it.archiveFile }
def fixtureJar = tasks.named('jar').flatMap { it.archiveFile }
def runBounded = rootProject.ext.runBoundedGradleTask
def loaderVersion = neoforge_version.toString()
def reports = layout.buildDirectory.dir("reports/neo-vitae-composition/${loaderVersion}")
def runs = layout.buildDirectory.dir("run/neoVitaeComposition/${loaderVersion}")
def nativeArtifacts = [
        'neovitae-26.1.2-1.1.31.jar': '55f35364764a438a45e68e1e74de3164e69f4487932c66af5fb5a6e303951e92',
        'modonomicon-26.1.2-neoforge-2.16.0.jar': '658d75ac71ef2e49eaeaa944f7ee82f407424df09f42adf459dd20cc98a57710',
        'geckolib-neoforge-26.1.2-5.5.2.jar': 'e335e5392274016c0e50d52f867b8975c6ee9d21035b45e4baf853a4d2d9dd2d'
].collectEntries { name, hash -> [(rootProject.file("NeoForge/runs/client/mods/${name}")): hash] }

['Live', 'Absent'].each { variant ->
    def directory = runs.map { it.dir(variant.toLowerCase(Locale.ROOT)) }
    def markers = reports.map { it.dir(variant.toLowerCase(Locale.ROOT)) }
    neoForge.runs.create("neoVitaeComposition${variant}") {
        server()
        disableIdeRun()
        gameDirectory = directory.get().asFile
        programArgument('--nogui')
        systemProperty('mismatchedboots.runtimetest.markers', markers.get().asFile.absolutePath)
        systemProperty('mismatchedboots.runtimetest.neoVitaeCompositionTest', 'true')
        systemProperty('mismatchedboots.runtimetest.neoVitaeAbsent', (variant == 'Absent').toString())
        jvmArgument('-Xmx1G')
    }
    def prepare = tasks.register("prepareNeoVitaeComposition${variant}") {
        dependsOn(':NeoForge:jar', tasks.named('jar'))
        doLast {
            if (variant == 'Live') {
                if (loaderVersion.tokenize('.').last().toInteger() < 109) {
                    throw new GradleException('Pinned Modonomicon requires NeoForge 26.1.2.109+; use .114 for the native gate')
                }
                nativeArtifacts.each { artifact, hash ->
                    if (!artifact.isFile() || java.security.MessageDigest.getInstance('SHA-256')
                            .digest(artifact.bytes).encodeHex().toString() != hash) {
                        throw new GradleException("Missing/unexpected pinned Neo Vitae fixture: ${artifact}")
                    }
                }
            }
            fixtureFiles.delete { delete directory, markers }
            fixtureFiles.copy {
                from(productionJar, fixtureJar)
                if (variant == 'Live') { from(nativeArtifacts.keySet()) }
                into(new File(directory.get().asFile, 'mods'))
            }
            new File(directory.get().asFile, 'eula.txt').text = 'eula=true\n'
            new File(directory.get().asFile, 'server.properties').text = '''online-mode=false
server-ip=127.0.0.1
server-port=0
view-distance=2
simulation-distance=2
max-tick-time=-1
level-type=minecraft:flat
generator-settings={"biome":"minecraft:plains","layers":[{"height":1,"block":"minecraft:bedrock"}],"structure_overrides":[]}
'''
        }
    }
    tasks.named("runNeoVitaeComposition${variant}") { dependsOn prepare }
    tasks.register("verifyNeoVitaeComposition${variant == 'Live' ? '' : variant}") {
        group = 'verification'
        description = "Production Neo Vitae creation/recomposition (${variant.toLowerCase(Locale.ROOT)}); not lifecycle acceptance"
        doLast {
            def processLog = new File(reports.get().asFile, "${variant.toLowerCase(Locale.ROOT)}-process.log")
            runBounded(":RuntimeTests:NeoForge:runNeoVitaeComposition${variant}", processLog, 240)
            def result = markers.get().asFile
            def failure = new File(result, 'neo-vitae-composition-failure.txt')
            if (failure.isFile()) { throw new GradleException(failure.text) }
            def report = new File(result, 'neo-vitae-composition-report.txt')
            if (!new File(result, 'neo-vitae-composition-success.txt').isFile() || !report.isFile()) {
                throw new GradleException("Missing Neo Vitae composition result; see ${processLog}")
            }
            logger.lifecycle(report.text)
        }
    }
}
