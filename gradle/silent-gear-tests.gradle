                || !new File(clientRun.get().asFile, 'saves/silentgear/level.dat').isFile()) {
            throw new GradleException('SG Rejoin requires the completed connected-client world')
        }
        // Reuse the actual player/world save. Do not rerun Client preparation or copy the server barrel world.
        fixtureFiles.delete { delete(['success', 'failure', 'report'].collect { new File(lifecycleReports.get().asFile, "silent-gear-rejoin-${it}.txt") }) }
        fixtureFiles.delete { delete new File(lifecycleReports.get().asFile, 'silent-gear-defense-rejoin-report.txt') }
    }
}
tasks.named('runSilentGearRejoin') { dependsOn('prepareSilentGearRejoin') }
tasks.register('verifySilentGearLifecycle') {
    group = 'verification'
    description = 'Real SG restart/rejoin, wearer/state, magnets and native defensive landing/sound/health'
    doLast {
        ['Save', 'Restart', 'Client', 'Rejoin'].each { phase ->
            def name = phase.toLowerCase(Locale.ROOT)
            def log = layout.buildDirectory.file("reports/silent-gear-lifecycle-${neoforge_version}-${name}-process.log").get().asFile
            runBounded(":RuntimeTests:NeoForge:runSilentGear${phase}", log, phase in ['Client', 'Rejoin'] ? 300 : 240)
            def result = lifecycleReports.get().asFile
            def failure = new File(result, "silent-gear-${name}-failure.txt")
            if (failure.isFile()) { throw new GradleException(failure.text) }
            if (!new File(result, "silent-gear-${name}-success.txt").isFile()
                    || !new File(result, "silent-gear-${name}-report.txt").isFile()
                    || log.text.contains('Silent Gear mixed ') || log.text.contains('Could not bind Silent Gear')
                    || log.text.contains('Could not read Silent Gear')) {
                throw new GradleException("Missing/refused SG ${phase} evidence; see ${log}")
            }
            logger.lifecycle(new File(result, "silent-gear-${name}-report.txt").text)
            if (phase in ['Client', 'Rejoin']) {
                def magnet = new File(result, "silent-gear-magnet-${name}-report.txt")
                if (!magnet.isFile() || magnet.readLines().size() != (phase == 'Client' ? 7 : 1)) {
                    throw new GradleException("Incomplete SG magnet ${phase} evidence: ${magnet}")
                }
                logger.lifecycle(magnet.text)
                def defense = new File(result, "silent-gear-defense-${name}-report.txt")
                if (!defense.isFile() || defense.readLines().size() != (phase == 'Client' ? 4 : 1)) {
                    throw new GradleException("Incomplete SG defensive ${phase} evidence: ${defense}")
                }
                logger.lifecycle(defense.text)
                if (phase == 'Client') {
                    def health = new File(result, 'silent-gear-defense-health-report.txt')
                    if (!health.isFile() || health.readLines().size() != 4
                            || !new File(result, 'silent-gear-defense-player.json').isFile()) {
                        throw new GradleException("Incomplete SG defensive health/player evidence: ${health}")
                    }
                    logger.lifecycle(health.text)
                }
            }
        }
    }
}
