tasks.named('runSilentGearStats') { dependsOn('prepareSilentGearStats') }

tasks.register('verifySilentGear') {
    group = 'verification'
    description = 'Verifies Silent Gear production attributes/state and opt-in recognition/wearer scopes'
    doLast {
        // Keep the child log outside the markers directory cleared by prepare.
        def suffix = effectVariant ? "-${effectVariant}" : ''
        def log = layout.buildDirectory.file("reports/silent-gear-stats-${neoforge_version}${suffix}-process.log").get().asFile
        runBounded(':RuntimeTests:NeoForge:runSilentGearStats', log, 240)
        def markers = reports.get().asFile
        def failure = new File(markers, 'silent-gear-stats-failure.txt')
        if (failure.isFile()) { throw new GradleException(failure.text) }
        def report = new File(markers, 'silent-gear-stats-report.txt')
        if (!new File(markers, 'silent-gear-stats-success.txt').isFile() || !report.isFile()) {
            throw new GradleException("Missing Silent Gear results; see ${log}")
        }
        int warnings = (log.text =~ /Silent Gear mixed (repair|wear) disabled:/).count
        int expected = effectVariant in ['repair', 'wear'] ? 1 : 0
        if (warnings != expected) { throw new GradleException("Unexpected SG effect warnings ${warnings} vs ${expected}: ${log}") }
        int stateWarnings = (log.text =~ /Silent Gear mixed state disabled:/).count
        if (stateWarnings != (effectVariant == 'state' ? 1 : 0)) { throw new GradleException("Unexpected SG live-state warnings: ${stateWarnings}: ${log}") }
        int recognitionWarnings = (log.text =~ /Silent Gear mixed (brilliant|moonwalker) disabled:/).count
        int expectedRecognition = effectVariant in ['recognition-brilliant', 'recognition-moonwalker'] ? 1 : 0
        if (recognitionWarnings != expectedRecognition) { throw new GradleException("Unexpected SG recognition warnings ${recognitionWarnings} vs ${expectedRecognition}: ${log}") }
        int wielderWarnings = (log.text =~ /Silent Gear mixed wielder disabled:/).count
        int expectedWielder = effectVariant in ['wearer-type', 'wearer-trait', 'wearer-effect', 'wearer-definition', 'wearer-throw'] ? 1 : 0
        if (wielderWarnings != expectedWielder) { throw new GradleException("Unexpected SG Wielder warnings ${wielderWarnings} vs ${expectedWielder}: ${log}") }
        int magnetWarnings = (log.text =~ /Silent Gear mixed magnet disabled:/).count
        if (magnetWarnings != (effectVariant in ['magnet-effect', 'magnet-queue', 'magnet-definition', 'magnet-throw', 'magnet-reload'] ? 1 : 0)) {
            throw new GradleException("Unexpected SG magnet warnings ${magnetWarnings}: ${log}")
        }
        int defenseWarnings = (log.text =~ /Silent Gear mixed safe fall disabled:/).count
        if (defenseWarnings != (effectVariant == 'defense-fall' ? 1 : 0)) { throw new GradleException("Unexpected safe fall warnings: ${defenseWarnings}: ${log}") }
        int incomingWarnings = (log.text =~ /Silent Gear mixed incoming disabled:/).count
        if (incomingWarnings != (effectVariant in ['defense-incoming', 'defense-negate', 'defense-throw'] ? 1 : 0)) { throw new GradleException("Unexpected incoming warnings: ${incomingWarnings}: ${log}") }
        int traitWarnings = (log.text =~ /Silent Gear mixed incoming trait disabled:/).count
        if (traitWarnings != (effectVariant == 'defense-data' ? 1 : 0)) { throw new GradleException("Unexpected incoming trait warnings: ${traitWarnings}: ${log}") }
        int bounceWarnings = (log.text =~ /Silent Gear mixed (bounce recognition|retaliation) disabled:/).count
        if (bounceWarnings != (effectVariant in ['defense-bounce-query', 'defense-retaliation'] ? 1 : 0)) { throw new GradleException("Unexpected Bounce query warnings: ${bounceWarnings}: ${log}") }
        if (log.text.contains('Could not bind Silent Gear') || log.text.contains('Could not read Silent Gear')) {
            throw new GradleException("Unexpected SG binding/read refusal: ${log}")
        }
        logger.lifecycle(report.text)
    }
}

