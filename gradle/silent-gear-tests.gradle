tasks.register('prepareSilentGearStats') {
    dependsOn(':NeoForge:jar', tasks.named('jar'))
    doLast {
        def jars = artifacts.collect { filename, hash ->
            def jar = rootProject.file("NeoForge/runs/client/mods/${filename}")
            if (!jar.isFile() || java.security.MessageDigest.getInstance('SHA-256')
                    .digest(jar.bytes).encodeHex().toString() != hash) {
                throw new GradleException("Missing/unexpected pinned Silent Gear fixture: ${jar}")
