                       'wearer-effect', 'wearer-definition', 'wearer-throw', 'recognition', 'recognition-compatible', 'recognition-brilliant', 'recognition-moonwalker'])) { throw new GradleException('Unknown SG effect test variant') }
def reports = layout.buildDirectory.dir(effectVariant ? "reports/silent-gear-effects/${neoforge_version}/${effectVariant}"
