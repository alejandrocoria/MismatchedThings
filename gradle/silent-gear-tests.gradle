tasks.register('verifySilentGearRemainingSpike') {
    group = 'verification'
    description = 'Production Void Ward and remaining Snow Walker/cure research connected controls'
    doLast {
        ['Seed', 'Spike'].each { phase ->
            def log = layout.buildDirectory.file("reports/silent-gear-remaining-${neoforge_version}${voidLog}-${phase.toLowerCase(Locale.ROOT)}-process.log").get().asFile
            runBounded(":RuntimeTests:NeoForge:runSilentGearRemaining${phase}", log, 300)
            def result = remainingReports.get().asFile
            def failure = new File(result, 'silent-gear-remaining-failure.txt')
            if (failure.isFile()) { throw new GradleException(failure.text) }
            if (!new File(result, "silent-gear-remaining-${phase == 'Seed' ? 'seed-success' : 'success'}.txt").isFile()) {
                throw new GradleException("Missing remaining ${phase} evidence: ${log}")
            }
            int warnings = (log.text =~ /Silent Gear mixed void ward disabled:/).count
            int expected = phase == 'Spike' && voidVariant == 'refused' ? 1 : 0
            if (warnings != expected || (log.text =~ /Silent Gear mixed .*disabled:/).count != expected
                    || log.text.contains('Could not bind Silent Gear') || log.text.contains('Could not read Silent Gear')) {
                throw new GradleException("Unexpected Void Ward/dependent warning count: ${log}")
            }
        }
        def report = new File(remainingReports.get().asFile, 'silent-gear-remaining-report.txt')
        if (!report.isFile() || report.readLines().size() != (voidVariant == 'refused' ? 3 : voidVariant == 'compatible' ? 5 : 19)) { throw new GradleException("Incomplete remaining-effects evidence: ${report}") }
        logger.lifecycle(report.text)
    }
}
