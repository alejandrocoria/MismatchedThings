// Opt-in research only. The owner's client installation is read, never changed.
def fixtureFiles = objects.newInstance(FixtureFileOperations).files
def productionJar = project(':NeoForge').tasks.named('jar').flatMap { it.archiveFile }
def fixtureJar = tasks.named('jar').flatMap { it.archiveFile }
def runBounded = rootProject.ext.runBoundedGradleTask
def reports = layout.buildDirectory.dir("reports/aether-ii-spike/${neoforge_version}")
def directory = layout.buildDirectory.dir("run/aetherIISpike/${neoforge_version}")
def artifact = rootProject.file('NeoForge/runs/client/mods/aether_ii-26.1.2-alpha.4.1-neoforge.jar')

neoForge.runs.create('aetherIISpike') {
    server()
    disableIdeRun()
    gameDirectory = directory.get().asFile
    programArgument('--nogui')
    systemProperty('mismatchedboots.runtimetest.markers', reports.get().asFile.absolutePath)
    systemProperty('mismatchedboots.runtimetest.aetherIISpike', 'true')
    jvmArgument('-Xmx1G')
}
def prepare = tasks.register('prepareAetherIISpike') {
    dependsOn(':NeoForge:jar', tasks.named('jar'))
    doLast {
        if (!artifact.isFile() || java.security.MessageDigest.getInstance('SHA-256')
                .digest(artifact.bytes).encodeHex().toString() !=
                '97760dd75e2dcdf4ecde83a0006d5b3682090e104a3c7bd6d7e4681e33b3f0e6') {
            throw new GradleException('Missing/unexpected pinned Aether II spike artifact')
        }
        fixtureFiles.delete { delete directory }
        fixtureFiles.delete {
            delete new File(reports.get().asFile, 'aether-ii-spike-success.txt'),
                    new File(reports.get().asFile, 'aether-ii-spike-failure.txt'),
                    new File(reports.get().asFile, 'aether-ii-spike-report.txt')
        }
        fixtureFiles.copy {
            from(productionJar, fixtureJar, artifact)
            into(new File(directory.get().asFile, 'mods'))
        }
        new File(directory.get().asFile, 'eula.txt').text = 'eula=true\n'
        new File(directory.get().asFile, 'server.properties').text = '''online-mode=false
server-ip=127.0.0.1
server-port=0
view-distance=2
simulation-distance=2
max-tick-time=-1
level-type=minecraft:flat
generator-settings={"biome":"minecraft:plains","layers":[{"height":1,"block":"minecraft:bedrock"}],"structure_overrides":[]}
'''
    }
}
tasks.named('runAetherIISpike') { dependsOn prepare }
tasks.register('verifyAetherIISpike') {
    group = 'verification'
    description = 'Measures native Aether II sets, charm ownership and a test-only local recognition candidate'
    doLast {
        def processLog = new File(reports.get().asFile, 'process.log')
        runBounded(':RuntimeTests:NeoForge:runAetherIISpike', processLog, 240)
        def failure = new File(reports.get().asFile, 'aether-ii-spike-failure.txt')
        def report = new File(reports.get().asFile, 'aether-ii-spike-report.txt')
        def success = new File(reports.get().asFile, 'aether-ii-spike-success.txt')
        if (failure.isFile()) { throw new GradleException(failure.text) }
        if (!success.isFile() || success.text != 'neoforge\n' || !report.isFile()
                || !report.text.contains('sets=passed; charms=passed; sentry=passed')) {
            throw new GradleException("Incomplete Aether II spike; see ${processLog}")
        }
        logger.lifecycle(report.text)
    }
}
