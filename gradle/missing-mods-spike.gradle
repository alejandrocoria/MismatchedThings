// Packaged production capture; fixtures supply scenarios, peers and an explicit native-loss control only.
def testMods = rootProject.ext.testModArtifacts
def fabric = project.name == 'Fabric'
def loader = fabric ? 'Fabric' : 'NeoForge'
def baseline = fabric ? minecraft_version : neoforge_version
def sources = fabric ? sourceSets.networkTest : sourceSets.main
sources.java.srcDir rootProject.file('RuntimeTests/MissingMods/src/main/java')
sources.resources.srcDir rootProject.file('RuntimeTests/MissingMods/src/main/resources')
def fixtureFiles = objects.newInstance(FixtureFileOperations).files
def productionJar = project(":${loader}").tasks.named('jar').flatMap { it.archiveFile }
def fixtureTask = fabric ? tasks.register('missingModsTestJar', Jar) {
    archiveClassifier = 'missing-mods-tests'
    from sources.output
} : tasks.named('jar')
def fixtureJar = fixtureTask.flatMap { it.archiveFile }
def runBounded = rootProject.ext.runBoundedGradleTask
def artifacts = (fabric ? [
        'MysticalAgriculture-Fabric-26.1.2-9.0.10.3.jar': '58965751df1f1f772158c9ecf39cd801dd06eb6d81dc75bfd50ac4ed1c4ea278',
        'Cucumber-Fabric-26.1.2-9.0.6.2.jar'            : '7cc2243c7f9f76f75f48d8728f1a668020955a4c3bf1adedccf0d5f19e7782a2'
] : [
        'MysticalAgriculture-26.1.2-9.0.11.jar': 'f611751c26ace5903a94354e1597403c0c0821f37d674e28c9101b9ff9800498',
        'Cucumber-26.1.2-9.0.7.jar'            : '8333d53cfd13338f3c60bf02a6b0afa9a937ea9dc06305732026a203c4569821',
        'justdirethings-1.6.11.jar'            : '27d26abcba9607b0c069de316541c781aebbbb167b1553aea6ca6934d3219436'
]).collectEntries { name, hash -> [(testMods.path(loader, name)): hash] }
def artifactsForStage = { String stage ->
    artifacts.findAll { artifact, hash ->
        !(stage in ['absent', 'absentagain', 'clientabsent']) && !(stage == 'partial' && artifact.name.startsWith('justdirethings-'))
    }
}

['Control', 'Candidate', 'Refused', 'Bypassed'].each { variant ->
    def mode = variant.toLowerCase(Locale.ROOT)
    def refusal = mode in ['refused', 'bypassed']
    def directory = layout.buildDirectory.dir("run/missing-mods/${baseline}/${mode}")
    def reports = layout.buildDirectory.dir("reports/missing-mods/${baseline}/${mode}")
    (refusal ? ['Write'] : ['Write', 'Absent', 'Absentagain', 'Partial', 'Sources', 'Restore', 'Reloaded']).each { phase ->
        def stage = phase.toLowerCase(Locale.ROOT)
        def markers = reports.map { it.dir(stage) }
        def properties = [
                'mismatchedboots.runtimetest.markers'     : markers.get().asFile.absolutePath,
                'mismatchedboots.runtimetest.loader'      : loader.toLowerCase(Locale.ROOT),
                'mismatchedboots.test.missingModsCase'    : refusal ? 'candidate' : mode,
                'mismatchedboots.test.missingModsRefuse'  : (mode == 'refused').toString(),
                'mismatchedboots.test.missingModsBypass'  : (mode == 'bypassed').toString(),
                'mismatchedboots.test.missingModsStage'   : stage,
                'mismatchedboots.test.missingModsBaseline': new File(reports.get().asFile, 'baseline.nbt').absolutePath
        ]
        if (fabric) {
            loom.runs.create("missingMods${variant}${phase}") {
                inherit loom.runs.server
                source('networkTest'); ideConfigGenerated(false)
                runDir("build/run/missing-mods/${baseline}/${mode}")
                properties.each { key, value -> property(key, value) }
                programArgs('--nogui'); vmArg('-Xmx1G')
            }
        } else {
            neoForge.runs.create("missingMods${variant}${phase}") {
                server(); disableIdeRun(); programArgument('--nogui')
                gameDirectory = directory.get().asFile
                properties.each { key, value -> systemProperty(key, value) }
                jvmArgument('-Xmx1G')
            }
        }
        def prepare = tasks.register("prepareMissingMods${variant}${phase}") {
            dependsOn(":${loader}:jar", fixtureTask)
            doLast {
                def selectedArtifacts = artifactsForStage(stage)
                if (!selectedArtifacts.isEmpty()) {
                    selectedArtifacts.each { artifact, hash ->
                        testMods.resolve(loader, artifact.name)
                        if (!artifact.isFile() || java.security.MessageDigest.getInstance('SHA-256').digest(artifact.bytes).encodeHex().toString() != hash) {
                            throw new GradleException("Missing/unexpected pinned missing-mod fixture: ${artifact}")
                        }
                    }
                }
                def safeDelete = { File target ->
                    if (!target.canonicalFile.toPath().startsWith(layout.buildDirectory.get().asFile.canonicalFile.toPath())) {
                        throw new GradleException("Refusing fixture cleanup outside build: ${target}")
                    }
                    fixtureFiles.delete { delete target }
                }
                if (stage == 'write') {
                    safeDelete(directory.get().asFile)
                    // Do not delete process.log: the bounded parent already opened it.
                    safeDelete(new File(reports.get().asFile, 'baseline.nbt'))
                } else if (!new File(directory.get().asFile, 'world/level.dat').isFile()) {
                    throw new GradleException('Missing previous missing-mod world; run write, absent and restore in order')
                }
                safeDelete(new File(directory.get().asFile, 'mods'))
                fixtureFiles.delete { delete fileTree(markers) { include 'missing-mods-*.txt' } }
                markers.get().asFile.mkdirs()
                fixtureFiles.copy {
                    from(productionJar, fixtureJar)
                    from selectedArtifacts.keySet()
                    into(new File(directory.get().asFile, 'mods'))
                }
                new File(directory.get().asFile, 'eula.txt').text = 'eula=true\n'
                new File(directory.get().asFile, 'server.properties').text = '''online-mode=false
server-ip=127.0.0.1
server-port=0
view-distance=2
simulation-distance=2
max-tick-time=-1
level-type=minecraft:flat
generator-settings={"biome":"minecraft:plains","layers":[{"height":1,"block":"minecraft:bedrock"}],"structure_overrides":[]}
'''
            }
        }
        tasks.named("runMissingMods${variant}${phase}") { dependsOn prepare }
    }
}

tasks.register('verifyMissingModsRecovery') {
    group = 'verification'
    description = 'Verifies packaged missing-mod recovery and its explicit native-loss/refusal controls'
    doLast {
        def selectedCases = providers.gradleProperty('missingModsCases').getOrElse('control,candidate,refused,bypassed').split(',')
        selectedCases.each { mode ->
            if (!(mode in ['control', 'candidate', 'refused', 'bypassed'])) {
                throw new GradleException("Unknown case ${mode}")
            }
            def refusal = mode in ['refused', 'bypassed']
            def selectedStages = providers.gradleProperty('missingModsStages')
                    .getOrElse(mode == 'candidate' ? 'write,absent,absentagain,partial,sources,restore,reloaded' : 'write,absent,restore').split(',')
            (refusal ? ['write'] : selectedStages).each { stage ->
                if (!(stage in ['write', 'absent', 'absentagain', 'partial', 'sources', 'restore', 'reloaded'])) {
                    throw new GradleException("Unknown stage ${stage}")
                }
                def markers = layout.buildDirectory.dir("reports/missing-mods/${baseline}/${mode}/${stage}").get().asFile
                def log = new File(markers, 'process.log')
                boolean failed = false
                try {
                    runBounded(":RuntimeTests:${loader}:runMissingMods${mode.capitalize()}${stage.capitalize()}", log, 240)
                } catch (GradleException failure) {
                    if (!refusal) {
                        throw failure
                    }
                    failed = true
                }
                if (refusal) {
                    // Loom's launcher can report exit 0 after a bootstrap exception; verify the actual refusal/world boundary.
                    def reason = mode == 'refused' ? 'native item fields unavailable' : 'required wrapper was bypassed'
                    if ((!failed && !fabric) || !log.text.contains("Cannot safely install mixed-boots capture: ${reason}")
                            || new File(markers, 'missing-mods-success.txt').exists()
                            || new File(layout.buildDirectory.get().asFile, "run/missing-mods/${baseline}/${mode}/world/level.dat").exists()) {
                        throw new GradleException("Unsafe or unexpected capture refusal; see ${log}")
                    }
                    logger.lifecycle("Required capture refusal passed before world open: ${log}")
                    return
                }
                def failure = new File(markers, 'missing-mods-failure.txt')
                if (failure.isFile()) {
                    throw new GradleException(failure.text)
                }
                def report = new File(markers, 'missing-mods-report.txt')
                if (!new File(markers, 'missing-mods-success.txt').isFile() || !report.isFile()) {
                    throw new GradleException("Missing spike result; see ${log}")
                }
                if (log.readLines().any { it.contains('/ERROR]') || mode == 'candidate' && it.contains('Failed to decode value') }) {
                    throw new GradleException("Unexpected spike decoding/runtime diagnostic; see ${log}")
                }
                logger.lifecycle("${mode}/${stage}: ${report.text.trim()}; report: ${report}")
            }
        }
    }
}

// Retained command alias only; no obsolete candidate implementation remains.
tasks.register('verifyMissingModsSpike') { dependsOn 'verifyMissingModsRecovery' }

// Separate clients reuse the final candidate server world, never an indev save.
def clientDirectory = layout.buildDirectory.dir("run/missing-mods/${baseline}/client")
def candidateReports = layout.buildDirectory.dir("reports/missing-mods/${baseline}/candidate")
['Clientwrite', 'Clientabsent', 'Clientrestore'].each { phase ->
    def stage = phase.toLowerCase(Locale.ROOT)
    def markers = layout.buildDirectory.dir("reports/missing-mods/${baseline}/clients/${stage}")
    def properties = [
            'mismatchedboots.runtimetest.markers'        : markers.get().asFile.absolutePath,
            'mismatchedboots.runtimetest.loader'         : loader.toLowerCase(Locale.ROOT),
            'mismatchedboots.test.missingModsCase'       : 'candidate',
            'mismatchedboots.test.missingModsStage'      : stage,
            'mismatchedboots.test.missingModsBaseline'   : new File(candidateReports.get().asFile, 'baseline.nbt').absolutePath,
            'mismatchedboots.test.missingModsPlayer'     : new File(candidateReports.get().asFile, 'clients-player.nbt').absolutePath,
            'mismatchedboots.test.hideClientWindow'      : 'true',
            'mismatchedboots.runtimetest.dismissWarnings': 'true'
    ]
    if (fabric) {
        loom.runs.create("missingMods${phase}") {
            inherit loom.runs.client; source('networkTest'); ideConfigGenerated(false)
            runDir("build/run/missing-mods/${baseline}/client")
            properties.each { key, value -> property(key, value) }
            programArgs('--quickPlaySingleplayer', 'recovery', '--username', 'RecoveryFixture')
            vmArg('-Xmx1G')
        }
    } else {
        neoForge.runs.create("missingMods${phase}") {
            client(); disableIdeRun(); gameDirectory = clientDirectory.get().asFile
            properties.each { key, value -> systemProperty(key, value) }
            ['--quickPlaySingleplayer', 'recovery', '--username', 'RecoveryFixture'].each { programArgument(it) }
            jvmArgument('-Xmx1G')
        }
    }
    def prepare = tasks.register("prepareMissingMods${phase}") {
        dependsOn(":${loader}:jar", fixtureTask)
        doLast {
            def target = clientDirectory.get().asFile
            if (!target.canonicalFile.toPath().startsWith(layout.buildDirectory.get().asFile.canonicalFile.toPath())) {
                throw new GradleException('Refusing client fixture cleanup outside build')
            }
            if (stage == 'clientwrite') {
                if (!new File(candidateReports.get().asFile, 'reloaded/missing-mods-success.txt').isFile()) {
                    throw new GradleException('Connected recovery requires the completed candidate server matrix')
                }
                fixtureFiles.delete { delete target }
                fixtureFiles.copy {
                    from layout.buildDirectory.dir("run/missing-mods/${baseline}/candidate/world")
                    into new File(target, 'saves/recovery')
                }
            } else if (!new File(target, 'saves/recovery/level.dat').isFile()) {
                throw new GradleException('Run the connected recovery phases in order')
            }
            fixtureFiles.delete { delete new File(target, 'mods') }
            fixtureFiles.copy {
                from productionJar, fixtureJar
                from artifactsForStage(stage).collect { artifact, hash ->
                    testMods.resolve(loader, artifact.name)
                    if (!artifact.isFile() || java.security.MessageDigest.getInstance('SHA-256').digest(artifact.bytes).encodeHex().toString() != hash) {
                        throw new GradleException("Missing/unexpected pinned connected fixture: ${artifact}")
                    }
                    artifact
                }
                into new File(target, 'mods')
            }
            markers.get().asFile.mkdirs()
            fixtureFiles.delete { delete fileTree(markers) { include 'missing-mods-*.txt' } }
            new File(target, 'options.txt').text = 'soundCategory_master:0.0\nnarrator:0\n'
            def config = new File(target, 'config'); config.mkdirs()
            def fmlConfig = new File(config, 'fml.toml')
            if (!fmlConfig.exists()) {
                fmlConfig.text = 'earlyWindowControl = false\n'
            }
        }
    }
    tasks.named("runMissingMods${phase}") { dependsOn prepare }
}

tasks.register('verifyMissingModsClients') {
    group = 'verification'
    description = 'Real worn-player packets, death/drop/pickup and different-JVM recovery reconnect'
    doLast {
        def phases = providers.gradleProperty('missingModsClientStages').getOrElse('Clientwrite,Clientabsent,Clientrestore').split(',')
        phases.each { phase ->
            if (!(phase in ['Clientwrite', 'Clientabsent', 'Clientrestore'])) {
                throw new GradleException("Unknown connected phase ${phase}")
            }
            def markers = layout.buildDirectory.dir("reports/missing-mods/${baseline}/clients/${phase.toLowerCase(Locale.ROOT)}").get().asFile
            def log = new File(markers, 'process.log')
            runBounded(":RuntimeTests:${loader}:runMissingMods${phase}", log, 360)
            def failure = new File(markers, 'missing-mods-failure.txt')
            if (failure.isFile()) {
                throw new GradleException(failure.text)
            }
            def report = new File(markers, 'missing-mods-report.txt')
            if (!new File(markers, 'missing-mods-success.txt').isFile() || !report.isFile()
                    || log.readLines().any { it.contains('/ERROR]') || it.contains('Failed to decode value') }) {
                throw new GradleException("Incomplete connected recovery or unexpected diagnostic: ${log}")
            }
            logger.lifecycle(report.text.trim())
        }
    }
}
