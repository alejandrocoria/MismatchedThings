import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'multiloader-loader'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[7.0.11,8.0)'
    id 'net.minecraftforge.jarjar' version '0.2.3'
    id 'net.darkhax.curseforgegradle' version '1.1.28'
    id "com.modrinth.minotaur" version "2.9.0"
}

base.archivesName = "${project.mod_name}-${project.minecraft_version}-forge"

jarJar.register() {
    archiveClassifier = null
}

repositories {
    maven minecraft.mavenizer
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0-beta.10'
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-api:${rei_version}"
    compileOnly "dev.architectury:architectury:${architectury_version}"
    compileOnly 'me.shedaniel.cloth:basic-math:0.6.1'
    compileOnly "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation("mysticdrew:common-networking-forge:${common_networking_version}") {
        transitive = false
    }
    jarJar("mysticdrew:common-networking-forge:${common_networking_version}") {
        transitive = false
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('jarJar')
}

minecraft {
    accessTransformers = files(
            project(':Common').file('src/main/resources/META-INF/accesstransformer.cfg'),
            file('src/main/resources/META-INF/accesstransformer.cfg')
    )

    runs {
        configureEach {
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty "mixin.debug.export", "true"
        }

        register('client') {
            workingDir.convention layout.projectDirectory.dir("runs/client")
        }

        register('server') {
            workingDir.convention layout.projectDirectory.dir("runs/server")
            args '--nogui'
        }
    }
}

idea {
    module {
        excludeDirs += file('runs')
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

registerProcessDocsTask(
        "Forge",
        forge_version,
        ""
)

tasks.processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.named('test', Test) {
    // Forge currently has a compile-only compatibility fixture, not a runtime test.
    failOnNoDiscoveredTests = false
}

def publishJar = tasks.named('jarJar')

tasks.register('publishCurseForge', TaskPublishCurseForge) {
    apiToken = "${curseForgeApiKey}"
    def mainFile = upload(curseforge_project_id, publishJar)
    mainFile.displayName = "${minecraft_version}-${version}-forge"
    mainFile.releaseType = release_type
    mainFile.addModLoader("Forge")
    mainFile.addJavaVersion("Java 25")
    mainFile.addGameVersion("${minecraft_version}")
    mainFile.addEnvironment("Server", "Client")
    mainFile.changelogType = "markdown"
    mainFile.changelog = file("$project.buildDir/doc/changelog.md")
}

modrinth {
//    debugMode.set(true)
    token = "${modrinthApiKey}"
    projectId = modrinth_project_id
    versionNumber = "${minecraft_version}-${version}-forge"
    versionName = "${mod_name}-${minecraft_version}-${version}-forge"
    versionType = release_type
    uploadFile = publishJar
    gameVersions = ["${minecraft_version}"]
    loaders = ["forge"]
    changelog.set(providers.provider {
        file("$project.buildDir/doc/changelog.md").text
    })
}
