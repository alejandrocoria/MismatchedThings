plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge { neoFormVersion = neo_form_version }
neoForge.addModdingDependenciesTo(sourceSets.test)

dependencies {
    compileOnly 'org.spongepowered:mixin:0.8.5'
    // Both loaders supply MixinExtras; compile only against the established minimal API.
    compileOnly 'io.github.llamalad7:mixinextras-common:0.3.5'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.3.5'
    compileOnly(project(':MismatchedThings:Common')) {
        transitive = false
        capabilities { requireCapability 'games.alejandrocoria.mismatchedthings:mismatchedthings' }
    }
    api "com.electronwill.night-config:core:${nightconfig_version}"
    api "com.electronwill.night-config:toml:${nightconfig_version}"
    testImplementation(project(':MismatchedThings:Common')) {
        transitive = false
        capabilities { requireCapability 'games.alejandrocoria.mismatchedthings:mismatchedthings' }
    }
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    workingDir layout.buildDirectory.dir('test-work')
    doFirst { workingDir.mkdirs() }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
