plugins {
    id 'java-library'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

apply from: '../spike.gradle'

loom {
    mixin { useLegacyMixinAp = false }
    mods { leggings_spike { sourceSet sourceSets.main } }
    runs {
        spikeClient {
            client()
            ideConfigGenerated(false)
            runDir(project.relativePath(spikeRunDirectory.asFile))
            property('leggings.spike.report', spikeReportDirectory.asFile.absolutePath)
            programArgs('--width', '1280', '--height', '720')
            vmArg('-Xmx1G')
        }
    }
}

tasks.named('runSpikeClient') { dependsOn 'prepareSpikeClient' }
