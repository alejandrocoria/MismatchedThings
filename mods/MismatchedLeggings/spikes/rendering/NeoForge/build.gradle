plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

repositories { mavenCentral() }
neoForge { version = neoforge_version }

apply from: '../spike.gradle'

neoForge {
    mods { leggings_spike { sourceSet sourceSets.main } }
    runs {
        spikeClient {
            client()
            disableIdeRun()
            gameDirectory = spikeRunDirectory.asFile
            systemProperty('leggings.spike.report', spikeReportDirectory.asFile.absolutePath)
            programArgument('--width')
            programArgument('1280')
            programArgument('--height')
            programArgument('720')
            jvmArgument('-Xmx1G')
        }
    }
}

tasks.named('runSpikeClient') { dependsOn 'prepareSpikeClient' }
