java.toolchain.languageVersion = JavaLanguageVersion.of(java_version)
version = '0.0.0-spike'

sourceSets.main.java.srcDir '../Common/src/main/java'
sourceSets.main.resources.srcDir '../Common/src/main/resources'

def withBoots = providers.gradleProperty('leggingsSpikeBoots').map { it.toBoolean() }.getOrElse(false)
def withIceAndFire = project.name == 'NeoForge' && providers.gradleProperty('leggingsSpikeIceAndFire')
        .map { it.toBoolean() }.getOrElse(false)
def baseline = project.name == 'Fabric' ? fabric_loader_version : neoforge_version
def scenario = (withBoots ? 'with-boots' : 'standalone') + (withIceAndFire ? '-ice-and-fire' : '')
ext.spikeRunDirectory = layout.buildDirectory.dir("run/${baseline}/${scenario}").get()
ext.spikeReportDirectory = layout.buildDirectory.dir("reports/${baseline}/${scenario}").get()

def bootsJar = null
if (withIceAndFire) { evaluationDependsOn(':MismatchedBoots') }
if (withBoots) {
    def boots = project(":MismatchedBoots:${project.name}")
    evaluationDependsOn(boots.path)
    bootsJar = boots.tasks.named('jar').flatMap { it.archiveFile }
}

tasks.register('prepareSpikeClient') {
    if (withBoots) { dependsOn bootsJar }
    doLast {
        def run = spikeRunDirectory.asFile
        def reports = spikeReportDirectory.asFile
        def mods = new File(run, 'mods')
        // Only generated files under this fixture's build directory are touched.
        mods.mkdirs()
        reports.mkdirs()
        if (mods.listFiles().any { it.isFile() && !it.name.toLowerCase(Locale.ROOT).startsWith('mismatchedboots-')
                && !(it.name in ['iceandfire-2.2-beta.3.jar', 'uranus-3.0-alpha.1.jar',
                                'jupiter-2.4.3-26.1.2-universal.jar']) }) {
            throw new GradleException('Unexpected fixture mod; use a fresh spike build directory')
        }
        if (withBoots) {
            copy { from bootsJar; into mods }
        }
        if (withIceAndFire) {
            def artifacts = project(':MismatchedBoots').testModArtifacts
            ['iceandfire-2.2-beta.3.jar', 'uranus-3.0-alpha.1.jar',
             'jupiter-2.4.3-26.1.2-universal.jar'].each { name ->
                copy { from artifacts.resolve('NeoForge', name); into mods }
            }
        }
        new File(reports, 'client.ok').delete()
        new File(reports, 'failure.txt').delete()
        new File(run, 'config').mkdirs()
        new File(run, 'config/fml.toml').text = 'earlyWindowControl = false\n'
        new File(run, 'options.txt').text = 'soundCategory_master:0.0\nnarrator:0\npauseOnLostFocus:false\nguiScale:2\n'
    }
}

tasks.register('verifySpike') {
    group = 'verification'
    description = 'Runs the hidden rendering proof and requires current success evidence.'
    dependsOn 'runSpikeClient'
    doLast {
        def reports = spikeReportDirectory.asFile
        def marker = new File(reports, 'client.ok')
        if (!marker.isFile() || new File(reports, 'failure.txt').exists()) {
            throw new GradleException("Leggings spike failed: ${reports}")
        }
        if (!marker.text.contains("boots.present=${withBoots}\n")) {
            throw new GradleException('Spike used the wrong Boots profile')
        }
    }
}
