// Bounded production Lava acceptance; no research source set or candidate hooks.
def withBoots = providers.gradleProperty('leggingsJdtBoots').map { it.toBoolean() }.getOrElse(false)
def absent = providers.gradleProperty('leggingsJdtAbsent').map { it.toBoolean() }.getOrElse(false)
def fault = providers.gradleProperty('leggingsLavaFault').getOrElse('')
if (!(fault in ['', 'api', 'particles', 'settings']) || absent && !fault.isEmpty()) {
    throw new GradleException('Lava fault must be api|particles|settings with JDT present')
}
def label = 'jdt-lava' + (withBoots ? '-boots' : '') + (absent ? '-absent' : '') + (fault ? "-${fault}" : '')
def directory = layout.buildDirectory.dir("run/${neoforge_version}/${label}").get().asFile
def reports = layout.buildDirectory.dir("reports/${neoforge_version}/${label}").get().asFile
def nativeJar = providers.provider { project(':MismatchedThings').testModArtifacts.resolve('NeoForge', 'justdirethings') }

['server', 'client'].each { endpoint ->
    tasks.register("prepareJustDireLava${endpoint.capitalize()}") {
        dependsOn tasks.named('classes'), project(':MismatchedLeggings:NeoForge').tasks.named('assemble')
        if (withBoots) { dependsOn project(':MismatchedBoots:NeoForge').tasks.named('assemble') }
        doLast {
            if (endpoint == 'client' && (absent || !fault.isEmpty())) {
                throw new GradleException('The Lava visual profile requires healthy native bindings')
            }
            def run = new File(directory, endpoint)
            def artifacts = [project(':MismatchedLeggings:NeoForge').tasks.named('jar').get().archiveFile.get().asFile]
            if (!absent) { artifacts.add(nativeJar.get()) }
            if (withBoots) { artifacts.add(project(':MismatchedBoots:NeoForge').tasks.named('jar').get().archiveFile.get().asFile) }
            def mods = new File(run, 'mods')
            mods.mkdirs()
            if (mods.listFiles().any { file -> !artifacts.any { it.name == file.name } }) {
                throw new GradleException("Unexpected artifact in ${mods}")
            }
            copy { from artifacts; into mods }
            reports.mkdirs()
            ["${endpoint}.ok", "${endpoint}.failure.txt", "${endpoint}.txt"].each { new File(reports, it).delete() }
            new File(reports, endpoint == 'server' ? 'lifecycle.nbt' : 'lifecycle.txt').delete()
            new File(run, 'config').mkdirs()
            new File(run, 'config/fml.toml').text = 'earlyWindowControl = false\n'
            if (endpoint == 'server') {
                new File(run, 'eula.txt').text = 'eula=true\n'
                new File(run, 'server.properties').text = 'online-mode=false\nserver-ip=127.0.0.1\nserver-port=0\nlevel-name=lava\nview-distance=2\nsimulation-distance=2\nmax-tick-time=-1\npause-when-empty-seconds=0\nlevel-type=minecraft:flat\ngenerator-settings={"biome":"minecraft:plains","layers":[{"height":1,"block":"minecraft:bedrock"}],"structure_overrides":[]}\n'
            } else {
                def saved = new File(directory, 'server/lava')
                if (!new File(saved, 'level.dat').isFile() || !new File(reports, 'server.ok').isFile()) {
                    throw new GradleException('Run the production Lava server before its hidden client')
                }
                copy { from saved; into new File(run, 'saves/lava') }
                new File(run, 'options.txt').text = 'soundCategory_master:0.0\nnarrator:0\npauseOnLostFocus:false\n'
            }
        }
    }
    neoForge.runs.create("justDireLava${endpoint.capitalize()}") {
        if (endpoint == 'server') {
            server()
            programArgument('--nogui')
        } else {
            client()
            programArguments.addAll('--quickPlaySingleplayer', 'lava')
        }
        disableIdeRun()
        gameDirectory = new File(directory, endpoint)
        systemProperty('leggings.test.jdtLava', 'true')
        systemProperty('leggings.test.jdtBoots', withBoots.toString())
        systemProperty('leggings.test.jdtAbsent', absent.toString())
        systemProperty('leggings.test.lavaFault', fault)
        systemProperty('leggings.test.report', reports.absolutePath)
        jvmArgument('-Xmx1G')
    }
    tasks.named("runJustDireLava${endpoint.capitalize()}") {
        dependsOn "prepareJustDireLava${endpoint.capitalize()}"
        doLast {
            if (!new File(reports, "${endpoint}.ok").isFile() || !new File(reports, "${endpoint}.txt").isFile()
                    || endpoint == 'client' && !new File(reports, 'lifecycle.txt').isFile()
                    || endpoint == 'server' && !absent && fault.isEmpty() && !new File(reports, 'lifecycle.nbt').isFile()
                    || new File(reports, "${endpoint}.failure.txt").exists()) {
                throw new GradleException("Production Lava ${endpoint} failed: ${reports}")
            }
            def log = new File(directory, "${endpoint}/logs/latest.log").readLines()
            def warnings = log.findAll { it.contains('WARN') && it.contains('[mismatchedleggings/') && it.contains('Lava Repair') }
            if (warnings.size() != (fault.isEmpty() ? 0 : 1) || log.any { it.contains('/ERROR]') || it.contains('/FATAL]') }) {
                throw new GradleException('Unexpected production Lava diagnostic or missing bounded refusal')
            }
        }
    }
}
