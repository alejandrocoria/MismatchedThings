plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

repositories { mavenCentral() }
neoForge { version = neoforge_version }

apply from: '../runtime-tests.gradle'

neoForge {
    mods { leggings_skeleton_test { sourceSet sourceSets.main } }
    runs {
        skeletonServer {
            server()
            disableIdeRun()
            gameDirectory = skeletonRunDirectory.dir('server').asFile
            systemProperty('leggings.test.report', skeletonReportDirectory.asFile.absolutePath)
            programArgument('--nogui')
            jvmArgument('-Xmx1G')
        }
        skeletonClient {
            client()
            disableIdeRun()
            gameDirectory = skeletonRunDirectory.dir('client').asFile
            systemProperty('leggings.test.report', skeletonReportDirectory.asFile.absolutePath)
            programArgument('--quickPlaySingleplayer')
            programArgument('skeleton')
            jvmArgument('-Xmx1G')
        }
    }
}

tasks.named('runSkeletonServer') { dependsOn 'prepareSkeletonServer' }
tasks.named('runSkeletonClient') { dependsOn 'prepareSkeletonClient' }

apply from: '../viewer-fixtures.gradle'
apply from: '../advanced-netherite-fixtures.gradle'
apply from: '../client-profiles.gradle'
apply from: '../recovery.gradle'

if (providers.gradleProperty('leggingsForbiddenModifiersSpike').map { it.toBoolean() }.getOrElse(false)) {
    sourceSets.main.java.srcDir '../../spikes/forbidden-modifiers/src/main/java'
    dependencies.add('compileOnly', files(providers.provider {
        def resolver = project(':MismatchedBoots').testModArtifacts
        ['forbidden_arcanus-26.1.2-2.7.2.jar', 'valhelsia_core-neoforge-26.1.2-1.1.6.jar']
                .collect { resolver.resolve('NeoForge', it) }
    }))
}

// Child Gradle launches share production outputs: aggregate acceptance must run loader suites sequentially.
tasks.named('verifySkeleton') { mustRunAfter ':MismatchedLeggings:RuntimeTests:Fabric:verifySkeleton' }
