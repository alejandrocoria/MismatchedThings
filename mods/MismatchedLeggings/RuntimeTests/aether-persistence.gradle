import java.util.concurrent.TimeUnit

// No native API imports in this driver: old saved data is read only by production ItemStack.CODEC.
def stage = providers.gradleProperty('aetherPersistenceStage').getOrElse('active')
if (!(stage in ['absent', 'absentagain', 'active', 'restore', 'reopened'])) {
    throw new GradleException("Unknown Aether persistence stage ${stage}")
}
def nativeJar = providers.provider { project(':MismatchedThings').testModArtifacts.resolve('NeoForge', 'aether_ii') }
def absent = stage.startsWith('absent')
def reports = layout.buildDirectory.dir("reports/${neoforge_version}/aetherPersistence").get().asFile
def directory = layout.buildDirectory.dir("run/${neoforge_version}/aetherPersistence/${stage}").get().asFile
def product = project(':MismatchedLeggings:NeoForge')
def boots = project(':MismatchedBoots:NeoForge')
evaluationDependsOn(boots.path)

tasks.register('prepareAetherPersistenceServer') {
    dependsOn tasks.named('classes'), product.tasks.named('assemble'), boots.tasks.named('assemble')
    if (!absent) { inputs.file(nativeJar).withPropertyName('aetherNativeRuntime') }
    doLast {
        def artifacts = [product.tasks.named('jar').get().archiveFile.get().asFile,
                         boots.tasks.named('jar').get().archiveFile.get().asFile]
        if (!absent) { artifacts.add(nativeJar.get()) }
        def mods = new File(directory, 'mods')
        mods.mkdirs()
        if (mods.listFiles().any { candidate -> !artifacts.any { it.name == candidate.name } }) {
            throw new GradleException("Unexpected artifact in disposable ${mods}")
        }
        copy { from artifacts; into mods }
        reports.mkdirs()
        new File(reports, "${stage}.ok").delete()
        new File(reports, "${stage}.failure.txt").delete()
        new File(directory, 'config').mkdirs()
        new File(directory, 'config/fml.toml').text = 'earlyWindowControl = false\n'
        new File(directory, 'eula.txt').text = 'eula=true\n'
        new File(directory, 'server.properties').text = '''online-mode=false
server-ip=127.0.0.1
server-port=0
level-name=world
view-distance=2
simulation-distance=2
max-tick-time=-1
level-type=minecraft:flat
generator-settings={"biome":"minecraft:plains","layers":[{"height":1,"block":"minecraft:bedrock"}],"structure_overrides":[]}
'''
    }
}
neoForge.runs.create('aetherPersistenceServer') {
    server()
    disableIdeRun()
    gameDirectory = directory
    programArgument('--nogui')
    systemProperty('leggings.test.aetherPersistence', stage)
    systemProperty('leggings.test.report', reports.absolutePath)
    jvmArgument('-Xmx1G')
}
tasks.named('runAetherPersistenceServer') { dependsOn 'prepareAetherPersistenceServer' }

tasks.register('verifyAetherPersistence') {
    group = 'verification'
    description = 'Verifies complete old Aether mixed data through production capture/restoration in separate JVMs.'
    doLast {
        def logs = layout.buildDirectory.dir("verification/${neoforge_version}/aetherPersistence").get().asFile
        logs.mkdirs()
        new File(logs, 'matrix.ok').delete()
        ['absent', 'absentagain', 'active', 'restore', 'reopened'].each { phase ->
            def log = new File(logs, "${phase}.log")
            def arguments = [rootProject.file('gradlew.bat').absolutePath, '--no-daemon', '--console=plain',
                             '-Dorg.gradle.jvmargs=-Xmx768m', "${project.path}:runAetherPersistenceServer",
                             "-PaetherPersistenceStage=${phase}", "-Pneoforge_version=${neoforge_version}"]
            if (gradle.startParameter.offline) { arguments.add('--offline') }
            logger.lifecycle("Production Aether persistence ${neoforge_version}/${phase}")
            def process = new ProcessBuilder(['cmd.exe', '/d', '/c'] + arguments.collect { it.toString() })
                    .directory(rootProject.projectDir).redirectErrorStream(true).redirectOutput(log).start()
            try {
                if (!process.waitFor(300, TimeUnit.SECONDS) || process.exitValue() != 0
                        || !new File(reports, "${phase}.ok").isFile() || new File(reports, "${phase}.failure.txt").exists()) {
                    throw new GradleException("Aether persistence failed: ${log}")
                }
                def errors = log.readLines().findAll { it.contains('/ERROR]') }
                def toast = errors.findAll { it.contains('NeoForgeDevDistCleaner/DISTXFORM')
                        && it.endsWith('Attempted to load class net.minecraft.client.gui.components.toasts.Toast which is not present on the dedicated server') }
                if (toast.size() != (phase.startsWith('absent') ? 0 : 2) || !(errors - toast).isEmpty()) {
                    throw new GradleException("Unexpected Aether persistence diagnostics: ${log}")
                }
            } finally {
                if (process.isAlive()) {
                    process.toHandle().descendants().forEach { it.destroyForcibly() }
                    process.destroyForcibly()
                }
            }
        }
        new File(logs, 'matrix.ok').text = 'production old-data migration and recovery; no prototype preprocessor/hooks\n'
    }
}
