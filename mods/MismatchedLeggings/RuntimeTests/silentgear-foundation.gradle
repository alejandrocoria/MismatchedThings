import java.util.concurrent.TimeUnit

// Maintained production gate; defensive feasibility candidates have been retired.
def nativeNames = ['silent-gear-26.1.2-neoforge-4.2.3.jar', 'silent-lib-26.1.2-neoforge-11.2.0.jar']
dependencies.add('compileOnly', files(providers.provider {
    nativeNames.collect { project(':MismatchedThings').testModArtifacts.resolve('NeoForge', it) }
}))
def graph = providers.gradleProperty('sgFoundationGraph').getOrElse('alone')
def absent = providers.gradleProperty('sgFoundationAbsent').map { it.toBoolean() }.getOrElse(false)
def variant = providers.gradleProperty('sgEffectsVariant').getOrElse('')
def order = providers.gradleProperty('sgEffectsOrder').getOrElse('default')
def liveVariant = providers.gradleProperty('sgLiveVariant').getOrElse('')
def liveInfusion = providers.gradleProperty('sgLiveInfusion').map { it.toBoolean() }.getOrElse(false)
def brilliantVariant = providers.gradleProperty('sgBrilliantVariant').getOrElse('')
def wielderVariant = providers.gradleProperty('sgWielderVariant').getOrElse('')
def magnetVariant = providers.gradleProperty('sgMagnetVariant').getOrElse('')
def defenseVariant = providers.gradleProperty('sgDefenseVariant').getOrElse('')
if (!(defenseVariant in ['', 'normal', 'compatible', 'routing', 'fall-query', 'retaliation-query', 'heat-definition', 'callback', 'safety'])) {
    throw new GradleException('Unknown SG defensive production variant')
}
if (defenseVariant == 'safety' && graph != 'boots') {
    throw new GradleException('The defensive safety control requires current Boots')
}
if (defenseVariant && (variant || liveVariant || liveInfusion || brilliantVariant || wielderVariant || magnetVariant)) {
    throw new GradleException('Defensive production controls are isolated from other feature mutations')
}
if (!(magnetVariant in ['', 'normal', 'compatible', 'callback', 'proof', 'definition', 'late'])) { throw new GradleException('Unknown SG magnet variant') }
if (magnetVariant == 'callback' && graph == 'boots') { throw new GradleException('Native magnet mutation also violates Boots contract; use the local proof variant with Boots') }
if (!(wielderVariant in ['', 'normal', 'compatible', 'type', 'trait', 'callback', 'potion', 'definition', 'actor'])) { throw new GradleException('Unknown Wielder variant') }
if (wielderVariant in ['callback', 'potion'] && graph == 'boots') { throw new GradleException('Native callback/potion mutation also violates Boots contract; use local type/trait variants with Boots') }
if (!(brilliantVariant in ['', 'normal', 'compatible', 'callback', 'proof'])) { throw new GradleException('Unknown Brilliant variant') }
if (brilliantVariant == 'callback' && graph == 'boots') { throw new GradleException('Callback mutation also violates Boots native contract; use the local proof variant with Boots') }
if (!(liveVariant in ['', 'definition', 'boundary'])) { throw new GradleException('Unknown SG live variant') }
if (!(variant in ['', 'repair', 'wear', 'wear-delta', 'compatible']) || !(order in ['default', 'before', 'after'])) {
    throw new GradleException('Unknown SG effects variant/order')
}
if (!(graph in ['alone', 'boots'])) { throw new GradleException('Unknown SG foundation graph') }
def label = "sg-foundation-${graph}" + (absent ? '-absent' : '') + (variant ? "-${variant}" : '') + (order == 'default' ? '' : "-${order}") + (liveVariant ? "-live-${liveVariant}" : '') + (liveInfusion ? '-infusion' : '') + (brilliantVariant ? "-brilliant-${brilliantVariant}" : '') + (wielderVariant ? "-wielder-${wielderVariant}" : '') + (magnetVariant ? "-magnet-${magnetVariant}" : '')
if (defenseVariant) { label += "-defense-contract-${defenseVariant}" }
def reports = layout.buildDirectory.dir("reports/${neoforge_version}/${label}").get().asFile
def directory = layout.buildDirectory.dir("run/${neoforge_version}/${label}/server").get().asFile
def product = project(':MismatchedLeggings:NeoForge')
def boots = project(':MismatchedBoots:NeoForge')

tasks.register('prepareSgFoundation') {
    dependsOn tasks.named('classes'), product.tasks.named('assemble')
    if (graph == 'boots') { dependsOn boots.tasks.named('assemble') }
    doLast {
        def artifacts = [product.tasks.named('jar').get().archiveFile.get().asFile]
        new java.util.zip.ZipFile(artifacts.first()).withCloseable { zip ->
            def names = zip.entries().findAll { !it.directory }.collect { it.name }
            if (names.any { it.startsWith('net/silentchaos512/') || it.contains('/spike/') || it.contains('/test/') }
                    || !names.contains('games/alejandrocoria/mismatchedleggings/compatibility/silentgear/SilentGearState.class')
                    || !names.contains('META-INF/services/games.alejandrocoria.mismatchedleggings.compatibility.silentgear.SilentGearComposition')) {
                throw new GradleException('Incorrect SG foundation product packaging')
            }
        }
        if (graph == 'boots') { artifacts.add(boots.tasks.named('jar').get().archiveFile.get().asFile) }
        if (order != 'default') {
            // Exercise both actual application orders by changing only config priority in a disposable product copy.
            def original = artifacts.first()
            def staged = layout.buildDirectory.file("sg-order/${label}/${original.name}").get().asFile
            staged.parentFile.mkdirs()
            new java.util.zip.ZipFile(original).withCloseable { zip ->
                new java.util.zip.ZipOutputStream(new FileOutputStream(staged)).withCloseable { output ->
                    zip.entries().each { entry ->
                        output.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                        if (entry.name == 'mismatchedleggings.silentgear-effects.mixins.json') {
                            def config = new groovy.json.JsonSlurper().parse(zip.getInputStream(entry))
                            config.mixinPriority = order == 'before' ? 900 : 1100
                            output.write(groovy.json.JsonOutput.toJson(config).getBytes('UTF-8'))
                        } else { zip.getInputStream(entry).withCloseable { output.write(it.bytes) } }
                        output.closeEntry()
                    }
                }
            }
            artifacts[0] = staged
        }
        if (!absent) {
            nativeNames.each { artifacts.add(project(':MismatchedThings').testModArtifacts.resolve('NeoForge', it)) }
        }
        if (brilliantVariant) {
            ['allthemodium-26.1.2-4.1.1.jar', 'alltheores-4.0.4.jar', 'geckolib-neoforge-26.1.2-5.5.2.jar'].each {
                artifacts.add(project(':MismatchedThings').testModArtifacts.resolve('NeoForge', it))
            }
        }
        if (liveInfusion) { artifacts.add(project(':MismatchedThings').testModArtifacts.resolve('NeoForge', 'The_Undergarden-26.1.2-0.9.8.jar')) }
        def mods = new File(directory, 'mods')
        mods.mkdirs()
        if (mods.listFiles().any { file -> !artifacts.any { it.name == file.name } }) {
            throw new GradleException("Unexpected artifact in disposable ${mods}")
        }
        copy { from artifacts; into mods }
        reports.mkdirs()
        ['server.ok', 'server.failure.txt', 'foundation.txt', 'wearer-manual.txt'].each { new File(reports, it).delete() }
        new File(directory, 'config').mkdirs()
        new File(directory, 'config/fml.toml').text = 'earlyWindowControl = false\n'
        new File(directory, 'eula.txt').text = 'eula=true\n'
        new File(directory, 'server.properties').text = 'online-mode=false\nserver-ip=127.0.0.1\nserver-port=0\nlevel-name=foundation\nview-distance=2\nsimulation-distance=2\nmax-tick-time=-1\nlevel-type=minecraft:flat\ngenerator-settings={"biome":"minecraft:plains","layers":[{"height":1,"block":"minecraft:bedrock"}],"structure_overrides":[]}\n'
    }
}
neoForge.runs.create('sgFoundation') {
    server()
    disableIdeRun()
    gameDirectory = directory
    programArgument('--nogui')
    systemProperty('leggings.test.sgFoundation', 'true')
    systemProperty('leggings.test.sgFoundationAbsent', absent.toString())
    systemProperty('leggings.test.sgEffectsVariant', variant)
    systemProperty('leggings.test.sgEffectsOrder', order)
    systemProperty('leggings.test.sgLiveVariant', liveVariant)
    systemProperty('leggings.test.sgLiveInfusion', liveInfusion.toString())
    systemProperty('leggings.test.sgBrilliantVariant', brilliantVariant)
    systemProperty('leggings.test.sgWielderVariant', wielderVariant)
    systemProperty('leggings.test.sgMagnetVariant', magnetVariant)
    systemProperty('leggings.test.sgDefenseVariant', defenseVariant)
    systemProperty('leggings.test.boots', (graph == 'boots').toString())
    systemProperty('leggings.test.report', reports.absolutePath)
    jvmArgument('-Xmx1G')
}
tasks.named('runSgFoundation') { dependsOn 'prepareSgFoundation' }
tasks.register('verifySgFoundation') {
    group = 'verification'
    doLast {
        def evidence = layout.buildDirectory.dir("verification/${neoforge_version}/${label}").get().asFile
        evidence.mkdirs()
        new File(evidence, 'matrix.ok').delete()
        def log = new File(evidence, 'server.log')
        def args = [rootProject.file('gradlew.bat').absolutePath, '--no-daemon', '--console=plain', '-Dorg.gradle.jvmargs=-Xmx768m',
                    "${project.path}:runSgFoundation", "-Pneoforge_version=${neoforge_version}",
                    "-PsgFoundationGraph=${graph}", "-PsgFoundationAbsent=${absent}",
                    "-PsgEffectsVariant=${variant}", "-PsgEffectsOrder=${order}", "-PsgLiveVariant=${liveVariant}", "-PsgLiveInfusion=${liveInfusion}",
                    "-PsgBrilliantVariant=${brilliantVariant}", "-PsgWielderVariant=${wielderVariant}", "-PsgMagnetVariant=${magnetVariant}", "-PsgDefenseVariant=${defenseVariant}"]
        if (gradle.startParameter.offline) { args.add('--offline') }
        def process = new ProcessBuilder(['cmd.exe', '/d', '/c'] + args.collect { it.toString() })
                .directory(rootProject.projectDir).redirectErrorStream(true).redirectOutput(log).start()
        try {
            if (!process.waitFor(300, TimeUnit.SECONDS) || process.exitValue() != 0
                    || !new File(reports, 'server.ok').isFile() || !new File(reports, 'foundation.txt').isFile()
                    || new File(reports, 'server.failure.txt').exists()) {
                throw new GradleException("Silent Gear foundation failed: ${log}")
            }
            if (wielderVariant && !absent && !new File(reports, 'wearer-manual.txt').isFile()) { throw new GradleException('Missing verified native wearer commands') }
            if (defenseVariant && !absent && (!new File(reports, 'foundation.txt').text.contains('Production Bounce C:')
                    || !new File(reports, 'foundation.txt').text.contains('actual next server-pre-tick additive push'))) {
                throw new GradleException('Missing maintained Bounce event/real scheduler evidence')
            }
            def errors = log.text.readLines().findAll { it.contains('/ERROR]') }
            if (absent ? !errors.isEmpty() : errors.size() != 1
                    || !errors.first().contains("Couldn't parse data file 'silentgear:sapling/netherwood'")
                    || !errors.first().contains('bonsaitrees2:sapling')) {
                throw new GradleException("Unexpected SG foundation errors: ${log}")
            }
            def warnings = log.text.readLines().findAll { it.contains('WARN') && it.contains('Silent Gear') }
            def defenseRefusal = ['routing': 'incoming', 'fall-query': 'bounce recognition', 'retaliation-query': 'retaliation',
                                  'heat-definition': 'incoming trait', 'callback': 'incoming'][defenseVariant]
            if (defenseVariant == 'safety' && !absent) {
                if (warnings.size() != 1 || !warnings.first().contains('Silent Gear mixed safe fall disabled')) {
                    throw new GradleException("Unexpected Boots safe-FEET refusal: ${log}")
                }
                warnings = []
            } else if (defenseRefusal && !absent) {
                if (warnings.size() != 1 || !warnings.first().contains("Silent Gear mixed leggings ${defenseRefusal} disabled")) {
                    throw new GradleException("Unexpected SG defensive refusal: ${log}")
                }
                warnings = [] // The selected refusal was checked exactly; no unrelated warning was accepted.
            }
            def refused = variant == 'wear-delta' ? 'wear' : variant
            if (magnetVariant in ['callback', 'proof', 'definition', 'late'] && !absent ? warnings.size() != 1 || !warnings.first().contains('Silent Gear mixed leggings magnet disabled') : wielderVariant in ['type', 'trait', 'callback', 'potion', 'definition', 'actor'] ? warnings.size() != 1 || !warnings.first().contains('Silent Gear mixed leggings wielder disabled') : brilliantVariant in ['callback', 'proof'] ? warnings.size() != 1 || !warnings.first().contains('Silent Gear mixed leggings brilliant disabled') : liveVariant ? warnings.size() != 1 || !warnings.first().contains('Silent Gear mixed leggings live state disabled') : refused in ['repair', 'wear'] ? warnings.size() != 1
                    || !warnings.first().contains("Silent Gear mixed leggings ${refused} disabled") : !warnings.isEmpty()) {
                throw new GradleException("Unexpected SG foundation refusal: ${log}")
            }
            new File(evidence, 'matrix.ok').text = 'packaged SG A/B/C production checks passed\n'
        } finally {
            if (process.isAlive()) { process.toHandle().descendants().forEach { it.destroyForcibly() }; process.destroyForcibly() }
        }
    }
}
