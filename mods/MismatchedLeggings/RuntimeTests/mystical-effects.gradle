import java.util.concurrent.TimeUnit

def fabric = project.name == 'Fabric'
def loader = project.name
def baseline = fabric ? fabric_loader_version : neoforge_version
def graph = providers.gradleProperty('leggingsMaGraph').getOrElse('alone')
def absent = providers.gradleProperty('leggingsMaAbsent').getOrElse('false').toBoolean()
def focus = providers.gradleProperty('leggingsMaFocus').getOrElse('full')
def variant = providers.gradleProperty('leggingsMaVariant').getOrElse('normal')
if (!(graph in ['alone', 'current']) || !(focus in ['full', 'lifecycle']) || !(variant in ['normal', 'compatible', 'armor', 'equipment', 'health'])) {
    throw new GradleException('Unknown Mystical effects graph/focus/variant')
}
def label = "mystical-effects-${graph}-${variant}" + (absent ? '-absent' : '') + (focus == 'lifecycle' ? '-lifecycle' : '')

def reports = layout.buildDirectory.dir("reports/${baseline}/${label}").get().asFile
def directory = layout.buildDirectory.dir("run/${baseline}/${label}").get().asFile
def product = project(":MismatchedLeggings:${loader}")
def boots = project(":MismatchedBoots:${loader}")
def fileOperations = objects.newInstance(FixtureFileOperations).files

['Server', 'Client'].each { phase ->
    tasks.register("prepareMysticalEffects${phase}") {
        dependsOn tasks.named('classes'), product.tasks.named('assemble')
        if (graph == 'current') { dependsOn boots.tasks.named('assemble') }
        doLast {
            def target = new File(directory, phase.toLowerCase(Locale.ROOT))
            def artifacts = [product.tasks.named('jar').get().archiveFile.get().asFile]
            if (!absent) {
                def names = fabric ? ['MysticalAgriculture-Fabric-26.1.2-9.0.10.3.jar', 'Cucumber-Fabric-26.1.2-9.0.6.2.jar']
                        : ['MysticalAgriculture-26.1.2-9.0.11.jar', 'Cucumber-26.1.2-9.0.7.jar']
                names.each { artifacts.add(project(':MismatchedThings').testModArtifacts.resolve(loader, it)) }
            }
            if (graph == 'current') { artifacts.add(boots.tasks.named('jar').get().archiveFile.get().asFile) }
            def mods = new File(target, 'mods')
            mods.mkdirs()
            if (mods.listFiles().any { file -> !artifacts.any { it.name == file.name } }) { throw new GradleException("Unexpected ${mods}") }
            copy { from artifacts; into mods }
            reports.mkdirs()
            ["${phase.toLowerCase()}.ok", "${phase.toLowerCase()}.failure.txt"].each { new File(reports, it).delete() }
            new File(target, 'config').mkdirs()
            new File(target, 'config/fml.toml').text = 'earlyWindowControl = false\n'
            if (phase == 'Server') {
                new File(target, 'eula.txt').text = 'eula=true\n'
                new File(target, 'server.properties').text = 'online-mode=false\nserver-ip=127.0.0.1\nserver-port=0\nlevel-name=spike\nview-distance=2\nsimulation-distance=2\nmax-tick-time=-1\nlevel-type=minecraft:flat\ngenerator-settings={"biome":"minecraft:plains","layers":[{"height":1,"block":"minecraft:bedrock"}],"structure_overrides":[]}\n'
            } else {
                if (!new File(reports, 'server.ok').isFile()) { throw new GradleException('Seed server must pass first') }
                def world = new File(target, 'saves/spike')
                if (!world.canonicalFile.toPath().startsWith(layout.buildDirectory.get().asFile.canonicalFile.toPath())) {
                    throw new GradleException('Disposable effects world escaped fixture build directory')
                }
                fileOperations.delete { delete world }
                copy { from new File(directory, 'server/spike'); into world }
                new File(target, 'options.txt').text = 'soundCategory_master:0.0\nnarrator:0\npauseOnLostFocus:false\n'
            }
        }
    }
    def properties = ['leggings.test.mysticalEffects': 'true', 'leggings.test.maGraph': graph,
                      'leggings.test.maVariant': variant, 'leggings.test.maLoader': loader,
                      'leggings.test.maFocus': focus,
                      'leggings.test.maAbsent': absent.toString(), 'leggings.test.report': reports.absolutePath,
                      'mixin.debug.export': 'true', 'mixin.debug.export.filter': 'com.blakebr0.mysticalagriculture.**']
    if (fabric) {
        loom.runs.create("mysticalEffects${phase}") {
            if (phase == 'Server') { server() } else { client() }
            ideConfigGenerated(false)
            runDir(project.relativePath(new File(directory, phase.toLowerCase(Locale.ROOT))))
            properties.each { key, value -> property(key, value) }
            if (phase == 'Server') { programArg('--nogui') } else { programArgs('--quickPlaySingleplayer', 'spike') }
            vmArg('-Xmx1G')
        }
    } else {
        neoForge.runs.create("mysticalEffects${phase}") {
            if (phase == 'Server') { server() } else { client() }
            disableIdeRun()
            gameDirectory = new File(directory, phase.toLowerCase(Locale.ROOT))
            properties.each { key, value -> systemProperty(key, value) }
            if (phase == 'Server') { programArgument('--nogui') } else {
                programArgument('--quickPlaySingleplayer'); programArgument('spike')
            }
            jvmArgument('-Xmx1G')
        }
    }
    tasks.named("runMysticalEffects${phase}") { dependsOn "prepareMysticalEffects${phase}" }
}

tasks.register('verifyMysticalEffects') {
    group = 'verification'
    doLast {
        def logs = layout.buildDirectory.dir("verification/${baseline}/${label}").get().asFile
        logs.mkdirs()
        new File(logs, 'matrix.ok').delete()
        ['Server', 'Client'].each { phase ->
            def log = new File(logs, "${phase.toLowerCase()}.log")
            def args = [rootProject.file('gradlew.bat').absolutePath, '--no-daemon', '--console=plain', '-Dorg.gradle.jvmargs=-Xmx768m',
                        "${project.path}:runMysticalEffects${phase}", "-PleggingsMaGraph=${graph}", "-PleggingsMaVariant=${variant}",
                        "-PleggingsMaAbsent=${absent}", "-PleggingsMaFocus=${focus}", "-Pneoforge_version=${neoforge_version}"]
            if (gradle.startParameter.offline) { args.add('--offline') }
            def process = new ProcessBuilder(['cmd.exe', '/d', '/c'] + args.collect { it.toString() })
                    .directory(rootProject.projectDir).redirectErrorStream(true).redirectOutput(log).start()
            try {
                if (!process.waitFor(300, TimeUnit.SECONDS) || process.exitValue() != 0
                        || !new File(reports, "${phase.toLowerCase()}.ok").isFile()
                        || new File(reports, "${phase.toLowerCase()}.failure.txt").exists()) {
                    throw new GradleException("Mystical effects ${phase} failed: ${log}")
                }
                def warnings = (log.text =~ /Mystical Agriculture mixed augment disabled:/).count
                def expected = phase == 'Server' || absent || variant in ['normal', 'compatible'] ? 0 : variant == 'equipment' ? 3 : 1
                if (warnings != expected || log.text.contains('mixed augment API unavailable') || log.text.contains('refund flow incompatible')) {
                    throw new GradleException("Unexpected MA readiness/refund refusal count ${warnings}, expected ${expected}: ${log}")
                }
                if (log.text.contains('/ERROR]')) { throw new GradleException("Unexpected runtime ERROR: ${log}") }
            } finally {
                if (process.isAlive()) { process.toHandle().descendants().forEach { it.destroyForcibly() }; process.destroyForcibly() }
            }
        }
        new File(logs, 'matrix.ok').text = 'production inherited effects only\n'
        logger.lifecycle(new File(reports, 'movement.txt').text)
    }
}
