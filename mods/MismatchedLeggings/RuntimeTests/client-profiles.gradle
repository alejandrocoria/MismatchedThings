import java.util.concurrent.TimeUnit

// Concrete packaged-product profiles share staging and bounded process launching.
def profiles = ['Workbench', 'Equipped', 'Items', 'Presentation', 'Repair', 'Grindstone', 'Smithing', 'Viewers', 'AdvancedNetherite']
if (project.name == 'Fabric') { profiles.add('BetterNether') }
profiles.each { profile ->
    def advancedNetherite = profile == 'AdvancedNetherite'
    def betterNether = profile == 'BetterNether'
    def viewers = profile == 'Viewers'
    def bootsOnly = viewers && providers.gradleProperty('leggingsViewerBootsOnly').map { it.toBoolean() }.getOrElse(false)
    def viewer = providers.gradleProperty('leggingsViewer').getOrElse('none')
    if (viewers && !(viewer in ['none', 'jei', 'rei'])) { throw new GradleException("Unknown leggings viewer: ${viewer}") }
    def equipped = profile == 'Equipped'
    def items = profile == 'Items'
    def emptyItems = items && providers.gradleProperty('leggingsEmptyItems').map { it.toBoolean() }.getOrElse(false)
    def presentation = profile == 'Presentation'
    def repair = profile == 'Repair'
    def grindstone = profile == 'Grindstone'
    def smithing = profile == 'Smithing'
    def smithingReload = smithing && providers.gradleProperty('leggingsSmithingReload').map { it.toBoolean() }.getOrElse(false)
    def iceAndFire = equipped && project.name == 'NeoForge' && providers.gradleProperty('leggingsIceAndFire')
            .map { it.toBoolean() }.getOrElse(false)
    def coexistence = bootsOnly || providers.gradleProperty('leggingsBoots').map { it.toBoolean() }.getOrElse(false)
    def previousBoots = providers.gradleProperty('leggingsBootsJar').map { rootProject.file(it) }.orNull
    def previousHash = previousBoots == null ? null : java.security.MessageDigest.getInstance('SHA-256')
            .digest(previousBoots.bytes).encodeHex().toString()
    def baseline = project.name == 'Fabric' ? fabric_loader_version : neoforge_version
    def variant = profile.uncapitalize() + (viewers ? "-${viewer}" : '') + (bootsOnly ? '-boots-only' : coexistence ? (previousBoots == null ? '-boots' : '-previous-boots') : '') + (iceAndFire ? '-ice-and-fire' : '')
    if (smithingReload) { variant += '-reload' }
    if (emptyItems) { variant += '-empty-model' }
    def directory = layout.buildDirectory.dir("run/${baseline}/${variant}").get().asFile
    def reports = layout.buildDirectory.dir("reports/${baseline}/${variant}").get().asFile
    def product = project(":MismatchedLeggings:${project.name}")
    def leggingsJar = product.tasks.named('jar').flatMap { it.archiveFile }
    def boots = project(":MismatchedBoots:${project.name}")
    evaluationDependsOn(boots.path)
    def bootsJar = boots.tasks.named('jar').flatMap { it.archiveFile }

    ['server', 'client'].each { phase ->
        tasks.register("prepare${profile}${phase.capitalize()}") {
            dependsOn ':MismatchedLeggings:verifyPackaging', tasks.named('classes')
            if (coexistence && previousBoots == null) { dependsOn boots.tasks.named('assemble') }
            doLast {
                def run = new File(directory, phase)
                def mods = new File(run, 'mods')
                mods.mkdirs()
                def artifacts = bootsOnly ? [] : [leggingsJar.get().asFile]
                if (viewers) { artifacts.addAll(project.leggingsViewerArtifacts(viewer)) }
                if (advancedNetherite) { artifacts.addAll(project.leggingsAdvancedNetheriteArtifacts()) }
                if (betterNether) { artifacts.addAll(project.leggingsBetterNetherArtifacts()) }
                if (coexistence) { artifacts.add(previousBoots == null ? bootsJar.get().asFile : previousBoots) }
                if (coexistence && previousBoots != null) {
                    // Prefer the candidate core over an equally numbered, older unpublished nested build.
                    artifacts.add(project(":MismatchedThings:${project.name}").tasks.named('jar').get().archiveFile.get().asFile)
                }
                if (iceAndFire) {
                    def resolver = project(':MismatchedBoots').testModArtifacts
                    ['iceandfire-2.2-beta.3.jar', 'uranus-3.0-alpha.1.jar',
                     'jupiter-2.4.3-26.1.2-universal.jar'].each { name ->
                        artifacts.add(resolver.resolve('NeoForge', name))
                    }
                }
                if (mods.listFiles().any { candidate -> !artifacts.any { it.name == candidate.name } }) {
                    throw new GradleException("Unexpected artifact in disposable ${mods}")
                }
                copy { from artifacts; into mods }
                reports.mkdirs()
                new File(reports, "${phase}.ok").delete()
                new File(reports, "${phase}.failure.txt").delete()
                new File(run, 'config').mkdirs()
                new File(run, 'config/fml.toml').text = 'earlyWindowControl = false\n'
                // Both start with the same rules. The client fixture edits the files during play,
                // then verifies the changes take effect only after a real disconnect/world reopen.
                new File(run, 'config/mismatchedleggings-components.toml').text =
                        "[durability]\npolicy = 'separate'\n[repair_cost]\npolicy = 'maximum'\n[components]\n"
                new File(run, 'config/mismatchedleggings-attributes.toml').text =
                        "[attributes]\nfallback = 'maximum'\n[attributes.\"minecraft:armor\"]\npolicy = 'maximum'\n"
                if (betterNether && phase == 'client') {
                    // The native first-launch welcome blocks quick play before any world is opened.
                    new File(run, 'config/wover').mkdirs()
                    new File(run, 'config/wover/client.json').text = '''{
  "create_version": "26.101.4",
  "modify_version": "26.101.4",
  "internal": { "did_present_welcome_screen": true },
  "general": { "check_for_new_versions": false }
}
'''
                }
                if (phase == 'server') {
                    new File(run, 'eula.txt').text = 'eula=true\n'
                    new File(run, 'server.properties').text = '''online-mode=false
server-ip=127.0.0.1
server-port=0
level-name=skeleton
view-distance=2
simulation-distance=2
max-tick-time=-1
level-type=minecraft:flat
generator-settings={"biome":"minecraft:plains","layers":[{"height":1,"block":"minecraft:bedrock"}],"structure_overrides":[]}
'''
                } else {
                    def world = new File(directory, 'server/skeleton')
                    if (!new File(world, 'level.dat').isFile()) { throw new GradleException('Run the workbench server first') }
                    if (repair || grindstone || smithing || viewers) {
                        def savedCopy = new File(run, 'saves/skeleton').canonicalFile
                        if (!savedCopy.path.startsWith(layout.buildDirectory.get().asFile.canonicalPath + File.separator)) {
                            throw new GradleException('Workstation world reset escaped the disposable build directory')
                        }
                        delete savedCopy
                    }
                    copy { from world; into new File(run, 'saves/skeleton') }
                    new File(run, 'options.txt').text = 'soundCategory_master:0.0\nnarrator:0\npauseOnLostFocus:false\nguiScale:2\n'
                }
            }
        }
        if (project.name == 'Fabric') {
            loom.runs.create("${profile.uncapitalize()}${phase.capitalize()}") {
                if (phase == 'server') { server(); programArg('--nogui') } else {
                    client(); programArgs('--quickPlaySingleplayer', 'skeleton')
                }
                ideConfigGenerated(false)
                if ((equipped || items || presentation) && phase == 'client') { programArgs('--width', '1280', '--height', '720') }
                runDir(project.relativePath(new File(directory, phase)))
                property('leggings.test.equipped', equipped.toString())
                property('leggings.test.advancedNetherite', advancedNetherite.toString())
                property('leggings.test.betterNether', betterNether.toString())
                property('leggings.test.items', items.toString())
                property('leggings.test.emptyItems', emptyItems.toString())
                property('leggings.test.presentation', presentation.toString())
                property('leggings.test.repair', repair.toString())
                property('leggings.test.grindstone', grindstone.toString())
                property('leggings.test.smithing', smithing.toString())
                property('leggings.test.smithingReload', smithingReload.toString())
                property('leggings.test.viewers', viewers.toString())
                property('leggings.test.viewerBootsOnly', bootsOnly.toString())
                property('leggings.test.viewer', viewer)
                property('leggings.test.previousBoots', (previousBoots != null).toString())
                property('leggings.test.workbench', 'true')
                property('leggings.test.boots', coexistence.toString())
                property('leggings.test.report', reports.absolutePath)
                vmArg('-Xmx1G')
            }
        } else {
            neoForge.runs.create("${profile.uncapitalize()}${phase.capitalize()}") {
                if (phase == 'server') { server(); programArgument('--nogui') } else {
                    client(); programArgument('--quickPlaySingleplayer'); programArgument('skeleton')
                }
                disableIdeRun()
                if ((equipped || items || presentation) && phase == 'client') {
                    programArgument('--width'); programArgument('1280'); programArgument('--height'); programArgument('720')
                }
                gameDirectory = new File(directory, phase)
                systemProperty('leggings.test.equipped', equipped.toString())
                systemProperty('leggings.test.advancedNetherite', advancedNetherite.toString())
                systemProperty('leggings.test.items', items.toString())
                systemProperty('leggings.test.emptyItems', emptyItems.toString())
                systemProperty('leggings.test.presentation', presentation.toString())
                systemProperty('leggings.test.repair', repair.toString())
                systemProperty('leggings.test.grindstone', grindstone.toString())
                systemProperty('leggings.test.smithing', smithing.toString())
                systemProperty('leggings.test.smithingReload', smithingReload.toString())
                systemProperty('leggings.test.viewers', viewers.toString())
                systemProperty('leggings.test.viewerBootsOnly', bootsOnly.toString())
                systemProperty('leggings.test.viewer', viewer)
                systemProperty('leggings.test.previousBoots', (previousBoots != null).toString())
                if (viewers && viewer == 'rei') {
                    // Native dev-only warning screen blocks quick play for this pinned third-party JAR.
                    // Keep the @OnlyIn diagnostics in logs; do not disable actual loading errors or other warnings.
                    systemProperty('neoforge.warnings.onlyin.hide', 'true')
                }
                systemProperty('leggings.test.workbench', 'true')
                systemProperty('leggings.test.boots', coexistence.toString())
                systemProperty('leggings.test.report', reports.absolutePath)
                jvmArgument('-Xmx1G')
            }
        }
        tasks.named("run${profile}${phase.capitalize()}") { dependsOn "prepare${profile}${phase.capitalize()}" }
    }

    def ownerPath = project.path
    def rootDirectory = rootProject.projectDir
    def launcher = rootProject.file('gradlew.bat')
    def offline = gradle.startParameter.offline
    def neoForgeLoader = project.name == 'NeoForge'
    tasks.register("verify${profile}") {
        group = 'verification'
        description = viewers ? 'Checks actual optional JEI/REI examples, reload, repeated opening and session rules.'
                : advancedNetherite ? 'Checks pinned Advanced Netherite pacification, live tags, smithing and native tooltips.'
                : betterNether ? 'Checks pinned Better Nether piglin recognition, live configuration and optional Boots coexistence.'
                : smithing ? 'Checks source-wise smithing, live-state recomposition, recipe reload/payment and coexistence.'
                : grindstone ? 'Checks native grindstone repair, disenchantment, bounded XP and product coexistence.'
                : repair ? 'Checks native anvil transactions, crafting/Crafter donor repair and product coexistence.'
                : presentation ? 'Checks tooltips, native armor semantics, enchantment admission and audited behavior tags.'
                : items ? 'Checks production item geometry, GUI, display contexts, fallbacks and reload.'
                : equipped ? 'Checks production equipped rendering, geometry cache, fallbacks and optional decorated models.'
                : 'Checks Leggings workbench transactions, rule synchronization and optional Boots coexistence.'
        dependsOn ':MismatchedLeggings:verifyPackaging', tasks.named('classes')
        doLast {
            def logs = layout.buildDirectory.dir("verification/${baseline}/${variant}").get().asFile
            logs.mkdirs()
            new File(logs, 'matrix.ok').delete()
            ['server', 'client'].each { phase ->
                def log = new File(logs, "${phase}.log")
                def arguments = [launcher.absolutePath, '--no-daemon', '--console=plain', '-Dorg.gradle.jvmargs=-Xmx768m',
                                 "${ownerPath}:run${profile}${phase.capitalize()}", "-PleggingsBoots=${coexistence}"]
                if (iceAndFire) { arguments.add('-PleggingsIceAndFire=true') }
                if (smithingReload) { arguments.add('-PleggingsSmithingReload=true') }
                if (emptyItems) { arguments.add('-PleggingsEmptyItems=true') }
                if (viewers) { arguments.add("-PleggingsViewer=${viewer}") }
                if (bootsOnly) { arguments.add('-PleggingsViewerBootsOnly=true') }
                if (previousBoots != null) { arguments.add("-PleggingsBootsJar=${previousBoots.absolutePath}") }
                if (offline) { arguments.add('--offline') }
                if (neoForgeLoader) { arguments.add("-Pneoforge_version=${baseline}") }
                logger.lifecycle("Leggings ${baseline}/${variant}/${phase}")
                def process = new ProcessBuilder(['cmd.exe', '/d', '/c'] + arguments.collect { it.toString() })
                        .directory(rootDirectory).redirectErrorStream(true).redirectOutput(log).start()
                try {
                    if (!process.waitFor(300, TimeUnit.SECONDS) || process.exitValue() != 0
                            || !new File(reports, "${phase}.ok").isFile()
                            || new File(reports, "${phase}.failure.txt").exists()) {
                        throw new GradleException("${profile} profile failed: ${log}")
                    }
                } finally {
                    if (process.isAlive()) {
                        process.toHandle().descendants().forEach { it.destroyForcibly() }
                        process.destroyForcibly()
                    }
                }
            }
            if (previousBoots != null && previousHash != java.security.MessageDigest.getInstance('SHA-256')
                    .digest(previousBoots.bytes).encodeHex().toString()) {
                throw new GradleException('Previous Boots artifact was modified')
            }
            new File(logs, 'matrix.ok').text = "packaged ${profile} server and hidden client passed\n"
        }
    }
}
