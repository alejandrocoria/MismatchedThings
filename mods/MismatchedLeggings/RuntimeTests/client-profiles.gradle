import java.util.concurrent.TimeUnit

// Concrete packaged-product profiles share staging and bounded process launching.
def profiles = ['Workbench', 'Equipped', 'Items', 'Presentation', 'Repair', 'Grindstone', 'Smithing', 'Viewers', 'AdvancedNetherite']
if (project.name == 'Fabric') { profiles.addAll(['BetterNether', 'BetterEnd', 'CreateFly']) }
if (project.name == 'NeoForge') { profiles.addAll(['AllTheModium', 'Aquaculture', 'ForbiddenArcanus', 'NeoVitae', 'OritechCapture', 'RootsRendering', 'RootsTicks', 'IceAndFire']) }
profiles.each { profile ->
    def rootsRendering = profile == 'RootsRendering'
    def rootsTicks = profile == 'RootsTicks'
    def rootsTickVariant = rootsTicks ? providers.gradleProperty('leggingsRootsTickVariant').getOrElse('normal') : ''
    if (rootsTicks && !(rootsTickVariant in ['normal', 'receiver', 'helper', 'absent', 'staff', 'crystal', 'healing'])) {
        throw new GradleException("Unknown Roots tick variant: ${rootsTickVariant}")
    }
    def oritechCapture = profile == 'OritechCapture'
    def neoVitae = profile == 'NeoVitae'
    def neoVitaeRestart = neoVitae && providers.gradleProperty('leggingsNeoVitaeRestart').map { it.toBoolean() }.getOrElse(false)
    def forbiddenArcanus = profile == 'ForbiddenArcanus'
    def forbiddenBootsOnly = forbiddenArcanus && providers.gradleProperty('leggingsForbiddenBootsOnly')
            .map { it.toBoolean() }.getOrElse(false)
    def forbiddenBoots = forbiddenBootsOnly || forbiddenArcanus && providers.gradleProperty('leggingsForbiddenBoots')
            .map { it.toBoolean() }.getOrElse(false)
    def forbiddenServerOnly = forbiddenArcanus && providers.gradleProperty('leggingsForbiddenServerOnly')
            .map { it.toBoolean() }.getOrElse(false)
    def aquaculture = profile == 'Aquaculture'
    def aquacultureServerOnly = aquaculture && providers.gradleProperty('leggingsAquacultureServerOnly')
            .map { it.toBoolean() }.getOrElse(false)
    def allTheModium = profile == 'AllTheModium'
    def brokenAllTheModium = allTheModium && providers.gradleProperty('leggingsAllTheModiumBroken')
            .map { it.toBoolean() }.getOrElse(false)
    def phases = rootsTicks || neoVitae || brokenAllTheModium || aquacultureServerOnly || forbiddenServerOnly ? ['server'] : ['server', 'client']
    def advancedNetherite = profile == 'AdvancedNetherite'
    def betterNether = profile == 'BetterNether'
    def betterEnd = profile == 'BetterEnd'
    def createFly = profile == 'CreateFly'
    def viewers = profile == 'Viewers'
    def bootsOnly = forbiddenBootsOnly || viewers && providers.gradleProperty('leggingsViewerBootsOnly').map { it.toBoolean() }.getOrElse(false)
    def viewer = providers.gradleProperty('leggingsViewer').getOrElse('none')
    if (viewers && !(viewer in ['none', 'jei', 'rei'])) { throw new GradleException("Unknown leggings viewer: ${viewer}") }
    def equipped = profile == 'Equipped'
    def items = profile == 'Items'
    def emptyItems = items && providers.gradleProperty('leggingsEmptyItems').map { it.toBoolean() }.getOrElse(false)
    def presentation = profile == 'Presentation'
    def repair = profile == 'Repair'
    def grindstone = profile == 'Grindstone'
    def smithing = profile == 'Smithing'
    def smithingReload = smithing && providers.gradleProperty('leggingsSmithingReload').map { it.toBoolean() }.getOrElse(false)
    def iceAndFireLifecycle = profile == 'IceAndFire'
    def iceAndFire = iceAndFireLifecycle || equipped && project.name == 'NeoForge' && providers.gradleProperty('leggingsIceAndFire')
            .map { it.toBoolean() }.getOrElse(false)
    def coexistence = bootsOnly || providers.gradleProperty('leggingsBoots').map { it.toBoolean() }.getOrElse(false)
    def previousBoots = providers.gradleProperty('leggingsBootsJar').map { rootProject.file(it) }.orNull
    if (forbiddenBoots && (!coexistence || previousBoots != null)) {
        throw new GradleException('Forbidden Boots acceptance requires leggingsBoots=true and current packaged Boots')
    }
    def previousHash = previousBoots == null ? null : java.security.MessageDigest.getInstance('SHA-256')
            .digest(previousBoots.bytes).encodeHex().toString()
    def baseline = project.name == 'Fabric' ? fabric_loader_version : neoforge_version
    def variant = profile.uncapitalize() + (viewers ? "-${viewer}" : '') + (bootsOnly ? '-boots-only' : coexistence ? (previousBoots == null ? '-boots' : '-previous-boots') : '') + (iceAndFire && !iceAndFireLifecycle ? '-ice-and-fire' : '')
    if (smithingReload) { variant += '-reload' }
    if (emptyItems) { variant += '-empty-model' }
    if (brokenAllTheModium) { variant += '-broken' }
    if (aquacultureServerOnly) { variant += '-server-only' }
    if (forbiddenServerOnly) { variant += '-server-only' }
    if (forbiddenBoots) { variant += '-modifiers' }
    if (rootsTicks && rootsTickVariant != 'normal') { variant += "-${rootsTickVariant}" }
    def directory = layout.buildDirectory.dir("run/${baseline}/${variant}").get().asFile
    def reports = layout.buildDirectory.dir("reports/${baseline}/${variant}").get().asFile
    def product = project(":MismatchedLeggings:${project.name}")
    def leggingsJar = product.tasks.named('jar').flatMap { it.archiveFile }
    def boots = project(":MismatchedBoots:${project.name}")
    evaluationDependsOn(boots.path)
    def bootsJar = boots.tasks.named('jar').flatMap { it.archiveFile }

    phases.each { phase ->
        tasks.register("prepare${profile}${phase.capitalize()}") {
            dependsOn ':MismatchedLeggings:verifyPackaging', tasks.named('classes')
            if (coexistence && previousBoots == null) { dependsOn boots.tasks.named('assemble') }
            doLast {
                def run = new File(directory, phase)
                def mods = new File(run, 'mods')
                mods.mkdirs()
                def artifacts = bootsOnly ? [] : [leggingsJar.get().asFile]
                if (viewers) { artifacts.addAll(project.leggingsViewerArtifacts(viewer)) }
                if (advancedNetherite) { artifacts.addAll(project.leggingsAdvancedNetheriteArtifacts()) }
                if (betterNether) { artifacts.addAll(project.leggingsBetterNetherArtifacts()) }
                if (betterEnd) { artifacts.addAll(project.leggingsBetterEndArtifacts()) }
                if (createFly) { artifacts.addAll(project.leggingsCreateFlyArtifacts()) }
                if (allTheModium) {
                    def resolver = project(':MismatchedThings').testModArtifacts
                    ['allthemodium-26.1.2-4.1.1.jar', 'alltheores-4.0.4.jar',
                     'geckolib-neoforge-26.1.2-5.5.2.jar'].each { name ->
                        artifacts.add(resolver.resolve('NeoForge', name))
                    }
                }
                if (aquaculture) {
                    artifacts.add(project(':MismatchedThings').testModArtifacts.resolve('NeoForge', 'Aquaculture-26.1.1-2.9.2.jar'))
                }
                if (rootsTicks && rootsTickVariant != 'absent' || rootsRendering) {
                    artifacts.add(project(':MismatchedThings').testModArtifacts.resolve('NeoForge', 'RootsClassic-26.1.2-1.6.7.jar'))
                    if (rootsRendering && phase == 'client') {
                        ['roots-rendering.txt', 'roots-pairs.png'].each { new File(reports, it).delete() }
                    }
                }
                if (oritechCapture) {
                    def resolver = project(':MismatchedThings').testModArtifacts
                    ['oritech-2.0.0-exp6.jar', 'athena-4.7.3.jar',
                     'geckolib-neoforge-26.1.2-5.5.2.jar'].each { name -> artifacts.add(resolver.resolve('NeoForge', name)) }
                    if (phase == 'client') {
                        ['oritech-capture.txt', 'oritech-pairs.png'].each { new File(reports, it).delete() }
                    } else {
                        new File(reports, 'oritech-gameplay.txt').delete()
                    }
                }
                if (neoVitae) {
                    if (baseline.toString().tokenize('.').last().toInteger() < 109) {
                        throw new GradleException('Pinned Modonomicon requires NeoForge 26.1.2.109+; use .114 for Neo Vitae')
                    }
                    def resolver = project(':MismatchedThings').testModArtifacts
                    ['neovitae-26.1.2-1.1.31.jar', 'modonomicon-26.1.2-neoforge-2.16.0.jar',
                     'geckolib-neoforge-26.1.2-5.5.2.jar'].each { name ->
                        artifacts.add(resolver.resolve('NeoForge', name))
                    }
                }
                if (forbiddenArcanus) {
                    def resolver = project(':MismatchedThings').testModArtifacts
                    ['forbidden_arcanus-26.1.2-2.7.2.jar', 'valhelsia_core-neoforge-26.1.2-1.1.6.jar'].each { name ->
                        artifacts.add(resolver.resolve('NeoForge', name))
                    }
                    // FA 2.7.2's unguarded ClientRecipeSync subscriber links JEI even when absent.
                    // Keep that upstream error out of this attribute fixture, not out of its log gate.
                    if (phase == 'client') { artifacts.addAll(project.leggingsViewerArtifacts('jei')) }
                }
                if (forbiddenBoots) {
                    artifacts.add(project(':MismatchedThings').testModArtifacts.resolve('NeoForge', 'justdirethings-1.6.11.jar'))
                }
                if (coexistence) { artifacts.add(previousBoots == null ? bootsJar.get().asFile : previousBoots) }
                if (coexistence && previousBoots != null) {
                    // Prefer the candidate core over an equally numbered, older unpublished nested build.
                    artifacts.add(project(":MismatchedThings:${project.name}").tasks.named('jar').get().archiveFile.get().asFile)
                }
                if (iceAndFire) {
                    ['config/jupiter.json', 'config/iceandfire/iaf-common.json', 'config/iceandfire/iaf-client.json'].each { name ->
                        def config = new File(run, name)
                        if (!config.exists()) { config.parentFile.mkdirs(); config.text = '{}\n' }
                    }
                    def resolver = project(':MismatchedThings').testModArtifacts
                    ['iceandfire-2.2-beta.3.jar', 'uranus-3.0-alpha.1.jar',
                     'jupiter-2.4.3-26.1.2-universal.jar'].each { name ->
                        artifacts.add(resolver.resolve('NeoForge', name))
                    }
                }
                if (mods.listFiles().any { candidate -> !artifacts.any { it.name == candidate.name } }) {
                    throw new GradleException("Unexpected artifact in disposable ${mods}")
                }
                copy { from artifacts; into mods }
                reports.mkdirs()
                if (iceAndFire && phase == 'server') {
                    ['ice-and-fire-render.txt', 'ice-and-fire-tooltip.txt', 'ice-and-fire-session.txt',
                     'ice-and-fire-saved.json', 'ice-and-fire-lifecycle.txt'].each { new File(reports, it).delete() }
                }
                new File(reports, "${phase}.ok").delete()
                new File(reports, "${phase}.failure.txt").delete()
                if (neoVitaeRestart) {
                    new File(reports, 'neovitae-restart-server.txt').delete()
                    if (!new File(run, 'skeleton/level.dat').isFile() || !new File(reports, 'neovitae-saved.json').isFile()) {
                        throw new GradleException('Run the Neo Vitae server seed before reopening its saved world')
                    }
                    // Reuse the same staged world/configuration; do not recreate the seed during the second JVM.
                    return
                }
                if (forbiddenArcanus) { new File(reports, "forbidden-${phase}.txt").delete() }
                if (rootsTicks) { new File(reports, 'roots-ticks.txt').delete() }
                if (forbiddenBoots) { new File(reports, "forbidden-boots-${phase}.txt").delete() }
                if (forbiddenArcanus && phase == 'server') {
                    new File(reports, 'forbidden-modifiers-server.txt').delete()
                    new File(reports, 'forbidden-modifiers-smithing.txt').delete()
                }
                if (forbiddenArcanus && phase == 'server') { new File(reports, 'forbidden-native-save.txt').delete() }
                if (forbiddenArcanus && phase == 'client') {
                    ['forbidden-modifiers-tooltip.txt', 'forbidden-modifiers-tooltip.png'].each { new File(reports, it).delete() }
                }
                if (forbiddenBoots && phase == 'client') { new File(reports, 'forbidden-boots-tooltip.txt').delete() }
                if (forbiddenBoots) {
                    new File(reports, "forbidden-boots-storage-${phase}.txt").delete()
                    if (phase == 'server') { new File(reports, 'forbidden-boots-storage.nbt').delete() }
                }
                if (aquaculture) { new File(reports, "aquaculture-${phase}.txt").delete() }
                if (neoVitae) {
                    ['neovitae-server.txt', 'neovitae-composition-server.txt', 'neovitae-lifecycle-server.txt',
                     'neovitae-saved.json', 'neovitae-restart-server.txt'].each { name -> new File(reports, name).delete() }
                }
                if (aquaculture && phase == 'client') {
                    ['aquaculture-tooltip.txt', 'aquaculture-render.txt', 'aquaculture-render-after-reload.txt',
                     'aquaculture-panel.png', 'aquaculture-session.txt'].each { name -> new File(reports, name).delete() }
                }
                if (createFly && phase == 'client') {
                    ['cardboard-render.txt', 'cardboard-render-after-reload.txt',
                     'cardboard-panel.png', 'cardboard-panel-after-reload.png'].each { name ->
                        new File(reports, name).delete()
                    }
                }
                if (betterEnd && phase == 'client') {
                    ['crystalite-capture.txt', 'crystalite-capture-after-reload.txt',
                     'crystalite-panel.png', 'crystalite-panel-after-reload.png'].each { name ->
                        new File(reports, name).delete()
                    }
                }
                if (allTheModium && phase == 'client') {
                    ['allthemodium-render.txt', 'allthemodium-render-after-reload.txt',
                     'allthemodium-panel.png'].each { name -> new File(reports, name).delete() }
                }
                new File(run, 'config').mkdirs()
                new File(run, 'config/fml.toml').text = 'earlyWindowControl = false\n'
                // Both start with the same rules. The client fixture edits the files during play,
                // then verifies the changes take effect only after a real disconnect/world reopen.
                new File(run, 'config/mismatchedleggings-components.toml').text =
                        "[durability]\npolicy = 'separate'\n[repair_cost]\npolicy = 'maximum'\n[components]\n"
                new File(run, 'config/mismatchedleggings-attributes.toml').text =
                        "[attributes]\nfallback = 'maximum'\n[attributes.\"minecraft:armor\"]\npolicy = 'maximum'\n"
                if (forbiddenArcanus || neoVitae) {
                    // Exercise shipped policies, not the workbench profile's nondefault snapshots.
                    new File(run, 'config/mismatchedleggings-attributes.toml').text = "[attributes]\nfallback = 'separate'\n"
                    new File(run, 'config/mismatchedleggings-components.toml').text = "[durability]\npolicy = 'average'\n[components]\n"
                }
                if ((betterNether || betterEnd) && phase == 'client') {
                    // The native first-launch welcome blocks quick play before any world is opened.
                    new File(run, 'config/wover').mkdirs()
                    new File(run, 'config/wover/client.json').text = '''{
  "create_version": "26.101.4",
  "modify_version": "26.101.4",
  "internal": { "did_present_welcome_screen": true },
  "general": { "check_for_new_versions": false }
}
'''
                }
                if (phase == 'server') {
                    new File(run, 'eula.txt').text = 'eula=true\n'
                    new File(run, 'server.properties').text = '''online-mode=false
server-ip=127.0.0.1
server-port=0
level-name=skeleton
view-distance=2
simulation-distance=2
max-tick-time=-1
level-type=minecraft:flat
generator-settings={"biome":"minecraft:plains","layers":[{"height":1,"block":"minecraft:bedrock"}],"structure_overrides":[]}
'''
                } else {
                    def world = new File(directory, 'server/skeleton')
                    if (!new File(world, 'level.dat').isFile()) { throw new GradleException('Run the workbench server first') }
                    if (repair || grindstone || smithing || viewers || forbiddenArcanus) {
                        def savedCopy = new File(run, 'saves/skeleton').canonicalFile
                        if (!savedCopy.path.startsWith(layout.buildDirectory.get().asFile.canonicalPath + File.separator)) {
                            throw new GradleException('Workstation world reset escaped the disposable build directory')
                        }
                        delete savedCopy
                    }
                    copy { from world; into new File(run, 'saves/skeleton') }
                    new File(run, 'options.txt').text = 'soundCategory_master:0.0\nnarrator:0\npauseOnLostFocus:false\nguiScale:2\n'
                    if (aquaculture) { new File(run, 'options.txt').append('tutorialStep:none\n') }
                }
            }
        }
        if (project.name == 'Fabric') {
            loom.runs.create("${profile.uncapitalize()}${phase.capitalize()}") {
                if (phase == 'server') { server(); programArg('--nogui') } else {
                    client(); programArgs('--quickPlaySingleplayer', 'skeleton')
                }
                ideConfigGenerated(false)
                if ((equipped || items || presentation) && phase == 'client') { programArgs('--width', '1280', '--height', '720') }
                if ((betterEnd || createFly) && phase == 'client') { programArgs('--width', '1600', '--height', '1000') }
                runDir(project.relativePath(new File(directory, phase)))
                property('leggings.test.equipped', equipped.toString())
                property('leggings.test.advancedNetherite', advancedNetherite.toString())
                property('leggings.test.betterNether', betterNether.toString())
                property('leggings.test.betterEnd', betterEnd.toString())
                property('leggings.test.createFly', createFly.toString())
                property('leggings.test.items', items.toString())
                property('leggings.test.emptyItems', emptyItems.toString())
                property('leggings.test.presentation', presentation.toString())
                property('leggings.test.repair', repair.toString())
                property('leggings.test.grindstone', grindstone.toString())
                property('leggings.test.smithing', smithing.toString())
                property('leggings.test.smithingReload', smithingReload.toString())
                property('leggings.test.viewers', viewers.toString())
                property('leggings.test.viewerBootsOnly', bootsOnly.toString())
                property('leggings.test.viewer', viewer)
                property('leggings.test.previousBoots', (previousBoots != null).toString())
                property('leggings.test.workbench', 'true')
                property('leggings.test.boots', coexistence.toString())
                property('leggings.test.report', reports.absolutePath)
                vmArg('-Xmx1G')
            }
        } else {
            neoForge.runs.create("${profile.uncapitalize()}${phase.capitalize()}") {
                if (phase == 'server') { server(); programArgument('--nogui') } else {
                    client(); programArgument('--quickPlaySingleplayer'); programArgument('skeleton')
                }
                disableIdeRun()
                if ((equipped || items || presentation) && phase == 'client') {
                    programArgument('--width'); programArgument('1280'); programArgument('--height'); programArgument('720')
                }
                if ((allTheModium || aquaculture || oritechCapture || rootsRendering) && phase == 'client') {
                    programArgument('--width'); programArgument('1600'); programArgument('--height'); programArgument('1000')
                }
                gameDirectory = new File(directory, phase)
                systemProperty('leggings.test.equipped', equipped.toString())
                systemProperty('leggings.test.rootsRendering', rootsRendering.toString())
                systemProperty('leggings.test.rootsTicks', rootsTickVariant)
                systemProperty('leggings.test.oritechCapture', oritechCapture.toString())
                systemProperty('leggings.test.advancedNetherite', advancedNetherite.toString())
                systemProperty('leggings.test.allTheModium', allTheModium.toString())
                systemProperty('leggings.test.aquaculture', aquaculture.toString())
                systemProperty('leggings.test.iceAndFire', iceAndFireLifecycle.toString())
                systemProperty('leggings.test.neoVitae', neoVitae.toString())
                systemProperty('leggings.test.neoVitaeRestart', neoVitaeRestart.toString())
                systemProperty('leggings.test.forbiddenArcanus', forbiddenArcanus.toString())
                systemProperty('leggings.test.forbiddenBoots', forbiddenBoots.toString())
                systemProperty('leggings.test.forbiddenBootsOnly', forbiddenBootsOnly.toString())
                systemProperty('leggings.test.allTheModiumBroken', brokenAllTheModium.toString())
                systemProperty('leggings.test.items', items.toString())
                systemProperty('leggings.test.emptyItems', emptyItems.toString())
                systemProperty('leggings.test.presentation', presentation.toString())
                systemProperty('leggings.test.repair', repair.toString())
                systemProperty('leggings.test.grindstone', grindstone.toString())
                systemProperty('leggings.test.smithing', smithing.toString())
                systemProperty('leggings.test.smithingReload', smithingReload.toString())
                systemProperty('leggings.test.viewers', viewers.toString())
                systemProperty('leggings.test.viewerBootsOnly', (viewers && bootsOnly).toString())
                systemProperty('leggings.test.viewer', viewer)
                systemProperty('leggings.test.previousBoots', (previousBoots != null).toString())
                if (viewers && viewer == 'rei') {
                    // Native dev-only warning screen blocks quick play for this pinned third-party JAR.
                    // Keep the @OnlyIn diagnostics in logs; do not disable actual loading errors or other warnings.
                    systemProperty('neoforge.warnings.onlyin.hide', 'true')
                }
                systemProperty('leggings.test.workbench', 'true')
                systemProperty('leggings.test.boots', coexistence.toString())
                systemProperty('leggings.test.report', reports.absolutePath)
                jvmArgument('-Xmx1G')
            }
        }
        tasks.named("run${profile}${phase.capitalize()}") { dependsOn "prepare${profile}${phase.capitalize()}" }
    }

    def ownerPath = project.path
    def rootDirectory = rootProject.projectDir
    def launcher = rootProject.file('gradlew.bat')
    def offline = gradle.startParameter.offline
    def neoForgeLoader = project.name == 'NeoForge'
    tasks.register("verify${profile}") {
        group = 'verification'
        description = viewers ? 'Checks actual optional JEI/REI examples, reload, repeated opening and session rules.'
                : advancedNetherite ? 'Checks pinned Advanced Netherite pacification, live tags, smithing and native tooltips.'
                : betterNether ? 'Checks pinned Better Nether piglin recognition, live configuration and optional Boots coexistence.'
                : betterEnd ? 'Checks pinned Crystalite set recognition, live tags, health, smithing and native tooltips.'
                : createFly ? 'Checks pinned Create Fly Cardboard recognition, native consumers and optional Boots coexistence.'
                : allTheModium ? 'Checks pinned AllTheModium leggings native wearer ticks, piglins and independent Boots coexistence.'
                : aquaculture ? 'Checks pinned Aquaculture buoyancy, lifecycle and hidden-client movement with packaged leggings.'
                : forbiddenArcanus ? 'Checks native Aureal regeneration, canonical holders, client synchronization and saved-world reopening.'
                : neoVitae ? 'Checks native Sentient tags, infusion composition, paid workstations and separate-process world reopen.'
                : oritechCapture ? 'Checks native Exo capture, production pair dispatch, atomic fallbacks, independent poses and reload.'
                : rootsRendering ? 'Checks production Roots layer selection, native leg geometry, resource priority, fallbacks and reload.'
                : rootsTicks ? 'Checks native Roots repair/Terra callbacks, real inventory dispatch, guards and independent Boots readiness.'
                : smithing ? 'Checks source-wise smithing, live-state recomposition, recipe reload/payment and coexistence.'
                : grindstone ? 'Checks native grindstone repair, disenchantment, bounded XP and product coexistence.'
                : repair ? 'Checks native anvil transactions, crafting/Crafter donor repair and product coexistence.'
                : presentation ? 'Checks tooltips, native armor semantics, enchantment admission and audited behavior tags.'
                : items ? 'Checks production item geometry, GUI, display contexts, fallbacks and reload.'
                : iceAndFireLifecycle ? 'Checks saved Ice and Fire roots, paid composition/repair/trim, native consumers and connected Tide lifecycle.'
                : equipped ? 'Checks production equipped rendering, geometry cache, fallbacks and optional decorated models.'
                : 'Checks Leggings workbench transactions, rule synchronization and optional Boots coexistence.'
        dependsOn ':MismatchedLeggings:verifyPackaging', tasks.named('classes')
        doLast {
            if (previousBoots != null) {
                throw new GradleException('Old-Boots positive coexistence is retired; omit leggingsBootsJar for current Boots, or run verifyLegacyBootsRefusal')
            }
            def logs = layout.buildDirectory.dir("verification/${baseline}/${variant}").get().asFile
            logs.mkdirs()
            new File(logs, 'matrix.ok').delete()
            (neoVitae ? ['server', 'restart'] : phases).each { execution ->
                def phase = execution == 'restart' ? 'server' : execution
                def log = new File(logs, "${execution}.log")
                def arguments = [launcher.absolutePath, '--no-daemon', '--console=plain', '-Dorg.gradle.jvmargs=-Xmx768m',
                                 "${ownerPath}:run${profile}${phase.capitalize()}", "-PleggingsBoots=${coexistence}"]
                if (execution == 'restart') { arguments.add('-PleggingsNeoVitaeRestart=true') }
                if (rootsTicks) { arguments.add("-PleggingsRootsTickVariant=${rootsTickVariant}") }
                if (iceAndFire) { arguments.add('-PleggingsIceAndFire=true') }
                if (smithingReload) { arguments.add('-PleggingsSmithingReload=true') }
                if (emptyItems) { arguments.add('-PleggingsEmptyItems=true') }
                if (brokenAllTheModium) { arguments.add('-PleggingsAllTheModiumBroken=true') }
                if (aquacultureServerOnly) { arguments.add('-PleggingsAquacultureServerOnly=true') }
                if (forbiddenServerOnly) { arguments.add('-PleggingsForbiddenServerOnly=true') }
                if (forbiddenBootsOnly) { arguments.add('-PleggingsForbiddenBootsOnly=true') }
                if (forbiddenBoots) { arguments.add('-PleggingsForbiddenBoots=true') }
                if (viewers) { arguments.add("-PleggingsViewer=${viewer}") }
                if (viewers && bootsOnly) { arguments.add('-PleggingsViewerBootsOnly=true') }
                if (previousBoots != null) { arguments.add("-PleggingsBootsJar=${previousBoots.absolutePath}") }
                if (offline) { arguments.add('--offline') }
                if (neoForgeLoader) { arguments.add("-Pneoforge_version=${baseline}") }
                logger.lifecycle("Leggings ${baseline}/${variant}/${execution}")
                def process = new ProcessBuilder(['cmd.exe', '/d', '/c'] + arguments.collect { it.toString() })
                        .directory(rootDirectory).redirectErrorStream(true).redirectOutput(log).start()
                try {
                    if (!process.waitFor(300, TimeUnit.SECONDS) || process.exitValue() != 0
                            || !new File(reports, "${phase}.ok").isFile()
                            || new File(reports, "${phase}.failure.txt").exists()) {
                        throw new GradleException("${profile} profile failed: ${log}")
                    }
                } finally {
                    if (process.isAlive()) {
                        process.toHandle().descendants().forEach { it.destroyForcibly() }
                        process.destroyForcibly()
                    }
                }
                if (iceAndFire) {
                    if (log.text.contains('/ERROR]') || log.text.contains('Tide adapter disabled')
                            || log.text.contains('mixed leggings recognition disabled') || log.text.contains('boot compatibility disabled')) {
                        throw new GradleException("Unexpected Ice and Fire diagnostics: ${log}")
                    }
                    def evidence = phase == 'client' ? (iceAndFireLifecycle ? ['ice-and-fire-session.txt']
                            : ['ice-and-fire-render.txt', 'ice-and-fire-tooltip.txt'])
                            : (iceAndFireLifecycle ? ['ice-and-fire-saved.json', 'ice-and-fire-lifecycle.txt'] : [])
                    evidence.each { if (!new File(reports, it).isFile()) { throw new GradleException("Missing Ice and Fire evidence: ${it}") } }
                }
                if (allTheModium || aquaculture || oritechCapture || rootsRendering || rootsTicks) {
                    def text = log.text
                    def refusals = text.readLines().count { it.contains('AllTheModium mixed leggings tick disabled:') }
                    def errors = text.readLines().findAll { it.contains('/ERROR]') }
                    if (oritechCapture) {
                        // Pinned upstream resource defect, already recorded by the Boots audit; keep it visible.
                        errors = errors.findAll { !it.endsWith("[ne.ne.ne.re.DataMapLoader/]: Object with ID oritech:fluxite specified in data map for registry minecraft:block doesn't exist") }
                    }
                    if (refusals != (brokenAllTheModium ? 1 : 0) || !errors.isEmpty()) {
                        throw new GradleException("Unexpected ${profile} diagnostics: ${log}")
                    }
                    if (oritechCapture && text.readLines().count { it.contains('Cannot capture Oritech Exo leggings;') } != (phase == 'client' ? 1 : 0)) {
                        throw new GradleException("Unexpected Oritech controlled-refusal count: ${log}")
                    }
                    if (rootsRendering && text.readLines().count { it.contains('Cannot select Roots Classic leggings alternate layer:') } != (phase == 'client' ? 1 : 0)) {
                        throw new GradleException("Unexpected Roots controlled-refusal count: ${log}")
                    }
                    if (rootsTicks) {
                        def expected = rootsTickVariant == 'helper' ? 2 : rootsTickVariant == 'receiver' ? 1 : 0
                        def warnings = text.readLines().count { it.contains('Roots Classic mixed leggings ') && it.contains(' tick disabled:') }
                        if (warnings != expected || !new File(reports, 'roots-ticks.txt').isFile()) {
                            throw new GradleException("Unexpected Roots tick diagnostics or missing native evidence: ${log}")
                        }
                        def setWarnings = text.readLines().count { it.contains('Roots Classic mixed leggings set consumer disabled:') }
                        if (setWarnings != (rootsTickVariant in ['staff', 'crystal', 'healing'] ? 1 : 0)) {
                            throw new GradleException("Unexpected Roots local-set refusal count: ${log}")
                        }
                    }
                    if (aquaculture) {
                        def failures = text.readLines().count { it.contains('Aquaculture leggings source tooltips disabled:') }
                        if (failures != (phase == 'client' ? 1 : 0)) {
                            throw new GradleException("Unexpected Aquaculture tooltip failure count: ${log}")
                        }
                    }
                }
                if (forbiddenArcanus && (log.text.contains('/ERROR]')
                        || !new File(reports, "forbidden-${phase}.txt").isFile())) {
                    throw new GradleException("Missing Aureal evidence or unexpected diagnostics: ${log}")
                }
                if (neoVitae && (log.text.contains('/ERROR]')
                        || ['neovitae-server.txt', 'neovitae-composition-server.txt', 'neovitae-lifecycle-server.txt',
                            'neovitae-saved.json'].any { !new File(reports, it).isFile() }
                        || execution == 'restart' && !new File(reports, 'neovitae-restart-server.txt').isFile())) {
                    throw new GradleException("Missing Neo Vitae evidence or unexpected diagnostics: ${log}")
                }
                if (forbiddenArcanus && phase == 'client'
                        && ['forbidden-modifiers-tooltip.txt', 'forbidden-modifiers-tooltip.png'].any { !new File(reports, it).isFile() }) {
                    throw new GradleException("Missing Forbidden Arcanus modifier presentation evidence: ${log}")
                }
                if (forbiddenArcanus && !forbiddenBootsOnly && phase == 'server'
                        && (!new File(reports, 'forbidden-modifiers-server.txt').isFile()
                        || !new File(reports, 'forbidden-modifiers-smithing.txt').isFile())) {
                    throw new GradleException("Missing Forbidden Arcanus modifier state/effect/smithing evidence: ${log}")
                }
                if (forbiddenBoots && !new File(reports, "forbidden-boots-${phase}.txt").isFile()) {
                    throw new GradleException("Missing maintained Boots modifier acceptance: ${phase}")
                }
                if (forbiddenBoots && phase == 'client' && !new File(reports, 'forbidden-boots-tooltip.txt').isFile()) {
                    throw new GradleException("Missing Boots native modifier presentation evidence: ${log}")
                }
                if (forbiddenBoots && !new File(reports, "forbidden-boots-storage-${phase}.txt").isFile()) {
                    throw new GradleException("Missing native Boots container load/reopen evidence: ${log}")
                }
            }
            if (betterEnd && ['crystalite-capture.txt', 'crystalite-capture-after-reload.txt',
                              'crystalite-panel.png', 'crystalite-panel-after-reload.png'].any {
                def proof = new File(reports, it)
                !proof.isFile() || proof.length() == 0
            }) { throw new GradleException('Crystalite capture checks did not produce fresh before/after-reload evidence and panels') }
            if (previousBoots != null && previousHash != java.security.MessageDigest.getInstance('SHA-256')
                    .digest(previousBoots.bytes).encodeHex().toString()) {
                throw new GradleException('Previous Boots artifact was modified')
            }
            if (createFly && ['cardboard-render.txt', 'cardboard-render-after-reload.txt',
                              'cardboard-panel.png', 'cardboard-panel-after-reload.png'].any {
                def proof = new File(reports, it)
                !proof.isFile() || proof.length() == 0
            }) { throw new GradleException('Create Fly checks did not produce fresh before/after-reload evidence and panels') }
            if (allTheModium && !brokenAllTheModium && ['allthemodium-render.txt', 'allthemodium-render-after-reload.txt',
                                                       'allthemodium-panel.png'].any {
                def proof = new File(reports, it)
                !proof.isFile() || proof.length() == 0
            }) { throw new GradleException('AllTheModium presentation/reload evidence is missing') }
            if (aquaculture && phases.collect { "aquaculture-${it}.txt" }.any {
                def proof = new File(reports, it)
                !proof.isFile() || proof.length() == 0
            }) { throw new GradleException('Aquaculture gameplay/client evidence is missing') }
            if (aquaculture && !aquacultureServerOnly) {
                if (['aquaculture-tooltip.txt', 'aquaculture-render.txt', 'aquaculture-render-after-reload.txt',
                     'aquaculture-panel.png', 'aquaculture-session.txt'].any { name ->
                    def proof = new File(reports, name)
                    !proof.isFile() || proof.length() == 0
                }) { throw new GradleException('Aquaculture tooltip/presentation/session evidence is missing') }
            }
            if (rootsRendering && ['roots-rendering.txt', 'roots-pairs.png'].any {
                !new File(reports, it).isFile() || new File(reports, it).length() == 0
            }) { throw new GradleException('Roots production rendering evidence missing') }
            if (oritechCapture && ['oritech-capture.txt', 'oritech-gameplay.txt', 'oritech-pairs.png'].any {
                !new File(reports, it).isFile() || new File(reports, it).length() == 0
            }) {
                throw new GradleException('Oritech production-capture evidence missing')
            }
            new File(logs, 'matrix.ok').text = brokenAllTheModium
                    ? 'packaged AllTheModium incompatible-tick control passed\n'
                    : aquacultureServerOnly ? 'packaged Aquaculture dedicated-server gameplay passed; no client coverage\n'
                    : forbiddenServerOnly ? 'packaged Forbidden Arcanus dedicated-server checks passed; no client coverage\n'
                    : neoVitae ? 'packaged Neo Vitae recognition, infusion composition, paid workstations and independent world reopen passed; no client coverage\n'
                    : "packaged ${profile} server and hidden client passed\n"
        }
    }
}
