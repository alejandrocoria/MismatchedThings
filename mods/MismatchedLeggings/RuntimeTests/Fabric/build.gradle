plugins {
    id 'java-library'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

apply from: '../runtime-tests.gradle'

loom {
    mixin { useLegacyMixinAp = false }
    mods { leggings_skeleton_test { sourceSet sourceSets.main } }
    runs {
        configureEach { ideConfigGenerated(false) }
        skeletonServer {
            server()
            runDir(project.relativePath(skeletonRunDirectory.dir('server').asFile))
            property('leggings.test.report', skeletonReportDirectory.asFile.absolutePath)
            programArg('--nogui')
            vmArg('-Xmx1G')
        }
        skeletonClient {
            client()
            runDir(project.relativePath(skeletonRunDirectory.dir('client').asFile))
            property('leggings.test.report', skeletonReportDirectory.asFile.absolutePath)
            programArgs('--quickPlaySingleplayer', 'skeleton')
            vmArg('-Xmx1G')
        }
    }
}

tasks.named('runSkeletonServer') { dependsOn 'prepareSkeletonServer' }
tasks.named('runSkeletonClient') { dependsOn 'prepareSkeletonClient' }

apply from: '../viewer-fixtures.gradle'
apply from: '../advanced-netherite-fixtures.gradle'
apply from: '../better-nether-fixtures.gradle'
apply from: '../better-end-fixtures.gradle'
apply from: '../create-fly-fixtures.gradle'
apply from: '../client-profiles.gradle'
apply from: '../recovery.gradle'
apply from: rootProject.file('spikes/leggings-mystical/spike.gradle')

dependencies {
    testImplementation files(project(':MismatchedLeggings:Fabric').tasks.named('jar').flatMap { it.archiveFile })
    testImplementation files(project(':MismatchedThings:Fabric').tasks.named('jar').flatMap { it.archiveFile })
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    workingDir layout.buildDirectory.dir('test-work')
    doFirst { workingDir.mkdirs() }
}
