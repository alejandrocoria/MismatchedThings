repositories {
    maven { url = 'https://maven.fabricmc.net' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.shedaniel.me' }
}
dependencies {
    compileOnly "net.fabricmc:fabric-loader:${fabric_loader_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-${project.name.toLowerCase(Locale.ROOT)}-api:${jei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-${project.name.toLowerCase(Locale.ROOT)}:${rei_version}"
    compileOnly "dev.architectury:architectury-${project.name.toLowerCase(Locale.ROOT)}:${architectury_version}"
    compileOnly 'me.shedaniel.cloth:basic-math:0.6.1'
}

ext.leggingsViewerArtifacts = { String viewer ->
    if (viewer == 'none') { return [] }
    def resolver = project(':MismatchedThings').testModArtifacts
    def names
    if (project.name == 'Fabric') {
        names = viewer == 'jei' ? ['jei-26.1.2-fabric-29.43.0.106.jar']
                : ['RoughlyEnoughItems-26.1.819 (Fabric).jar', 'architectury-fabric-20.1.16.jar', 'cloth-config-26.1.154 (Fabric).jar']
    } else {
        names = viewer == 'jei' ? ['jei-26.1.2-neoforge-29.43.0.106.jar']
                : ['RoughlyEnoughItems-26.1.819.jar', 'architectury-neoforge-20.1.16.jar', 'cloth-config-26.1.154.jar']
    }
    return names.collect { resolver.resolve(project.name, it) }
}

tasks.register('prepareViewerArtifacts') {
    group = 'verification'
    description = 'Downloads and verifies pinned optional JEI/REI runtime fixtures, independently of indev.'
    doLast {
        ['jei', 'rei'].each { viewer -> project.leggingsViewerArtifacts(viewer) }
    }
}
