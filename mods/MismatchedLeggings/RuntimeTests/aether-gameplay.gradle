import java.util.concurrent.TimeUnit

// Maintained production-only server profile. Prototype flags/sources are never enabled here.
def resolver = project(':MismatchedThings').testModArtifacts
def aetherJar = providers.provider { resolver.resolve('NeoForge', 'aether_ii-26.1.2-alpha.4.1-neoforge.jar') }
dependencies.add('compileOnly', files(aetherJar))
def variant = providers.gradleProperty('leggingsAetherVariant').getOrElse('normal')
if (!(variant in ['normal', 'sets', 'fluid', 'armor', 'absent'])) {
    throw new GradleException("Unknown Aether gameplay variant: ${variant}")
}
def coexist = providers.gradleProperty('leggingsBoots').map { it.toBoolean() }.getOrElse(false)
if (coexist && !(variant in ['normal', 'absent'])) {
    throw new GradleException('Unknown native operand fault controls run standalone; sibling composition is verified separately')
}
def label = 'aetherGameplay' + (coexist ? '-boots' : '') + (variant == 'normal' ? '' : "-${variant}")
def reports = layout.buildDirectory.dir("reports/${neoforge_version}/${label}").get().asFile
def directory = layout.buildDirectory.dir("run/${neoforge_version}/${label}/server").get().asFile
def product = project(':MismatchedLeggings:NeoForge')
def boots = project(':MismatchedBoots:NeoForge')
tasks.register('prepareAetherGameplayServer') {
    dependsOn ':MismatchedLeggings:verifyPackaging', tasks.named('classes')
    if (coexist) { dependsOn boots.tasks.named('assemble') }
    doLast {
        def artifacts = [product.tasks.named('jar').get().archiveFile.get().asFile]
        if (variant != 'absent') { artifacts.add(aetherJar.get()) }
        if (coexist) { artifacts.add(boots.tasks.named('jar').get().archiveFile.get().asFile) }
        def mods = new File(directory, 'mods')
        mods.mkdirs()
        if (mods.listFiles().any { candidate -> !artifacts.any { it.name == candidate.name } }) {
            throw new GradleException("Unexpected artifact in disposable ${mods}")
        }
        copy { from artifacts; into mods }
        reports.mkdirs()
        ['server.ok', 'server.failure.txt', 'aether-server.txt'].each { new File(reports, it).delete() }
        new File(directory, 'config').mkdirs()
        new File(directory, 'config/fml.toml').text = 'earlyWindowControl = false\n'
        new File(directory, 'eula.txt').text = 'eula=true\n'
        new File(directory, 'server.properties').text = '''online-mode=false
server-ip=127.0.0.1
server-port=0
level-name=skeleton
view-distance=2
simulation-distance=2
max-tick-time=-1
level-type=minecraft:flat
generator-settings={"biome":"minecraft:plains","layers":[{"height":1,"block":"minecraft:bedrock"}],"structure_overrides":[]}
'''
    }
}
neoForge.runs.create('aetherGameplayServer') {
    server()
    disableIdeRun()
    gameDirectory = directory
    programArgument('--nogui')
    systemProperty('leggings.test.aetherGameplay', variant)
    systemProperty('leggings.test.boots', coexist.toString())
    systemProperty('leggings.test.report', reports.absolutePath)
    jvmArgument('-Xmx1G')
}
tasks.named('runAetherGameplayServer') { dependsOn 'prepareAetherGameplayServer' }

tasks.register('verifyAetherGameplay') {
    group = 'verification'
    description = 'Verifies packaged Aether leggings composition, native set/tier consumers and isolated guard refusal.'
    doLast {
        def logs = layout.buildDirectory.dir("verification/${neoforge_version}/${label}").get().asFile
        logs.mkdirs()
        new File(logs, 'matrix.ok').delete()
        def log = new File(logs, 'server.log')
        def arguments = [rootProject.file('gradlew.bat').absolutePath, '--no-daemon', '--console=plain',
                         '-Dorg.gradle.jvmargs=-Xmx768m', "${project.path}:runAetherGameplayServer",
                         "-Pneoforge_version=${neoforge_version}", "-PleggingsAetherVariant=${variant}", "-PleggingsBoots=${coexist}"]
        if (gradle.startParameter.offline) { arguments.add('--offline') }
        logger.lifecycle("Production Aether gameplay ${neoforge_version}/${label}")
        def process = new ProcessBuilder(['cmd.exe', '/d', '/c'] + arguments.collect { it.toString() })
                .directory(rootProject.projectDir).redirectErrorStream(true).redirectOutput(log).start()
        try {
            if (!process.waitFor(300, TimeUnit.SECONDS) || process.exitValue() != 0
                    || !new File(reports, 'server.ok').isFile() || new File(reports, 'server.failure.txt').exists()
                    || variant != 'absent' && !new File(reports, 'aether-server.txt').isFile()) {
                throw new GradleException("Production Aether gameplay failed: ${log}")
            }
            def lines = log.text.readLines()
            def errors = lines.findAll { it.contains('/ERROR]') }
            def toast = errors.findAll { it.contains('NeoForgeDevDistCleaner/DISTXFORM')
                    && it.endsWith('Attempted to load class net.minecraft.client.gui.components.toasts.Toast which is not present on the dedicated server') }
            def refusals = lines.count { it.contains('Aether II mixed leggings ') && it.contains(' disabled:') }
            if (toast.size() != (variant == 'absent' ? 0 : 2) || !(errors - toast).isEmpty()
                    || refusals != (variant in ['sets', 'fluid', 'armor'] ? 1 : 0)
                    || variant == 'absent' && lines.any { it.contains('Error loading class: com/aetherteam/aetherii/') }) {
                throw new GradleException("Unexpected Aether diagnostics: ${log}")
            }
            new File(logs, 'matrix.ok').text = "production server; variant=${variant}; Boots=${coexist}\n"
        } finally {
            if (process.isAlive()) {
                process.toHandle().descendants().forEach { it.destroyForcibly() }
                process.destroyForcibly()
            }
        }
    }
}
