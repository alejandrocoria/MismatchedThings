import java.util.concurrent.TimeUnit
import java.util.zip.ZipFile

// Packaged product state/Infuser behavior: no spike flags, source directories or candidate mixins.
def nativeJar = providers.provider {
    project(':MismatchedThings').testModArtifacts.resolve('NeoForge', 'The_Undergarden-26.1.2-0.9.8.jar')
}
dependencies.add('compileOnly', files(nativeJar))
def boots = project(':MismatchedBoots:NeoForge')
def leggings = project(':MismatchedLeggings:NeoForge')
def graph = providers.gradleProperty('leggingsUndergardenGraph').getOrElse('both')
def absent = providers.gradleProperty('leggingsUndergardenAbsent').map { it.toBoolean() }.getOrElse(false)
def variant = providers.gradleProperty('leggingsUndergardenVariant').getOrElse('normal')
if (!(variant in ['normal', 'compatible', 'recipe', 'menu']) || absent && variant != 'normal') {
    throw new GradleException("Unknown or absent-native Undergarden variant ${variant}")
}
if (!(graph in ['boots', 'leggings', 'both'])) { throw new GradleException("Unknown Undergarden graph ${graph}") }
def label = "rogdorium-state-${graph}" + (absent ? '-absent' : '') + (variant == 'normal' ? '' : "-${variant}")
def reports = layout.buildDirectory.dir("reports/${neoforge_version}/${label}").get().asFile
def directory = layout.buildDirectory.dir("run/${neoforge_version}/${label}/server").get().asFile

tasks.register('prepareRogdoriumStateServer') {
    dependsOn tasks.named('classes')
    if (graph != 'leggings') { dependsOn boots.tasks.named('assemble') }
    if (graph != 'boots') { dependsOn leggings.tasks.named('assemble') }
    doLast {
        def artifacts = []
        if (!absent) { artifacts.add(nativeJar.get()) }
        if (graph != 'leggings') { artifacts.add(boots.tasks.named('jar').get().archiveFile.get().asFile) }
        if (graph != 'boots') { artifacts.add(leggings.tasks.named('jar').get().archiveFile.get().asFile) }
        def mods = new File(directory, 'mods')
        mods.mkdirs()
        if (mods.listFiles().any { file -> !artifacts.any { it.name == file.name } }) {
            throw new GradleException("Unexpected artifact in disposable ${mods}")
        }
        copy { from artifacts; into mods }
        reports.mkdirs()
        ['server.ok', 'server.failure.txt', 'state.txt'].each { new File(reports, it).delete() }
        new File(directory, 'config').mkdirs()
        new File(directory, 'config/fml.toml').text = 'earlyWindowControl = false\n'
        new File(directory, 'eula.txt').text = 'eula=true\n'
        new File(directory, 'server.properties').text = '''online-mode=false
server-ip=127.0.0.1
server-port=0
level-name=state
view-distance=2
simulation-distance=2
max-tick-time=-1
level-type=minecraft:flat
generator-settings={"biome":"minecraft:plains","layers":[{"height":1,"block":"minecraft:bedrock"}],"structure_overrides":[]}
'''
    }
}
neoForge.runs.create('rogdoriumStateServer') {
    server()
    disableIdeRun()
    gameDirectory = directory
    programArgument('--nogui')
    systemProperty('leggings.test.rogdoriumState', 'true')
    systemProperty('leggings.test.rogdoriumGraph', graph)
    systemProperty('leggings.test.rogdoriumAbsent', absent.toString())
    systemProperty('leggings.test.rogdoriumVariant', variant)
    systemProperty('leggings.test.report', reports.absolutePath)
    jvmArgument('-Xmx1G')
}
tasks.named('runRogdoriumStateServer') { dependsOn 'prepareRogdoriumStateServer' }

def clientDirectory = new File(directory.parentFile, 'client')
tasks.register('prepareRogdoriumPresentationClient') {
    dependsOn tasks.named('classes')
    doLast {
        def world = new File(directory, 'state')
        if (!new File(reports, 'server.ok').isFile() || !new File(world, 'level.dat').isFile()) {
            throw new GradleException('Run the corresponding production state server before the presentation client')
        }
        def artifacts = new File(directory, 'mods').listFiles().toList()
        def mods = new File(clientDirectory, 'mods')
        mods.mkdirs()
        if (mods.listFiles().any { file -> !artifacts.any { it.name == file.name } }) {
            throw new GradleException("Unexpected artifact in disposable ${mods}")
        }
        copy { from artifacts; into mods }
        copy { from world; into new File(clientDirectory, 'saves/state') }
        ['client.ok', 'client.failure.txt', 'presentation.txt'].each { new File(reports, it).delete() }
        new File(clientDirectory, 'config').mkdirs()
        new File(clientDirectory, 'config/fml.toml').text = 'earlyWindowControl = false\n'
        new File(clientDirectory, 'options.txt').text = 'soundCategory_master:0.0\nnarrator:0\npauseOnLostFocus:false\nguiScale:2\n'
    }
}
neoForge.runs.create('rogdoriumPresentationClient') {
    client()
    disableIdeRun()
    gameDirectory = clientDirectory
    programArgument('--quickPlaySingleplayer'); programArgument('state')
    programArgument('--width'); programArgument('1280')
    programArgument('--height'); programArgument('900')
    systemProperty('leggings.test.rogdoriumPresentation', 'true')
    systemProperty('leggings.test.rogdoriumGraph', graph)
    systemProperty('leggings.test.rogdoriumAbsent', absent.toString())
    systemProperty('leggings.test.report', reports.absolutePath)
    jvmArgument('-Xmx1G')
}
tasks.named('runRogdoriumPresentationClient') { dependsOn 'prepareRogdoriumPresentationClient' }

tasks.register('verifyRogdoriumState') {
    group = 'verification'
    description = 'Verifies production Rogdorium state, native Infuser admission/payment, local guards and optional absence.'
    doLast {
        def logs = layout.buildDirectory.dir("verification/${neoforge_version}/${label}").get().asFile
        logs.mkdirs()
        new File(logs, 'matrix.ok').delete()
        def log = new File(logs, 'server.log')
        def args = [rootProject.file('gradlew.bat').absolutePath, '--no-daemon', '--console=plain',
                    '-Dorg.gradle.jvmargs=-Xmx768m', "${project.path}:runRogdoriumStateServer",
                    "-Pneoforge_version=${neoforge_version}", "-PleggingsUndergardenGraph=${graph}", "-PleggingsUndergardenAbsent=${absent}",
                    "-PleggingsUndergardenVariant=${variant}"]
        if (gradle.startParameter.offline) { args.add('--offline') }
        logger.lifecycle("Production Rogdorium state ${neoforge_version}/${label}")
        def process = new ProcessBuilder(['cmd.exe', '/d', '/c'] + args.collect { it.toString() })
                .directory(rootProject.projectDir).redirectErrorStream(true).redirectOutput(log).start()
        try {
            if (!process.waitFor(300, TimeUnit.SECONDS) || process.exitValue() != 0
                    || !new File(reports, 'server.ok').isFile() || new File(reports, 'server.failure.txt').exists()
                    || !new File(reports, 'state.txt').isFile()) {
                throw new GradleException("Production Rogdorium state failed: ${log}")
            }
            def lines = log.text.readLines()
            def refusals = lines.count { it.contains('Mixed Rogdorium infusion creation refused:') }
            def guardRefusals = lines.count { it.contains('Undergarden mixed ') && it.contains(' disabled: incompatible local operands') }
            int expectedGuards = variant in ['recipe', 'menu'] ? (graph == 'both' ? 2 : 1) : 0
            if (lines.any { it.contains('/ERROR]') } || refusals != (absent || expectedGuards > 0 ? 0 : 1)
                    || guardRefusals != expectedGuards
                    || absent && lines.any { it.contains('Error loading class: quek/undergarden/') }) {
                throw new GradleException("Unexpected Rogdorium diagnostics: ${log}")
            }
            new File(logs, 'matrix.ok').text = "production state; graph=${graph}; absent=${absent}\n"
        } finally {
            if (process.isAlive()) {
                process.toHandle().descendants().forEach { it.destroyForcibly() }
                process.destroyForcibly()
            }
        }
    }
}

tasks.register('verifyRogdoriumPresentation') {
    group = 'verification'
    description = 'Verifies native live-only source/root tooltips and registered bars with a hidden/muted packaged client.'
    dependsOn tasks.named('verifyRogdoriumState')
    doLast {
        if (variant != 'normal') { throw new GradleException('Presentation requires the normal production variant') }
        def logs = layout.buildDirectory.dir("verification/${neoforge_version}/${label}").get().asFile
        new File(logs, 'presentation.ok').delete()
        def log = new File(logs, 'client.log')
        def args = [rootProject.file('gradlew.bat').absolutePath, '--no-daemon', '--console=plain',
                    '-Dorg.gradle.jvmargs=-Xmx768m', "${project.path}:runRogdoriumPresentationClient",
                    "-Pneoforge_version=${neoforge_version}", "-PleggingsUndergardenGraph=${graph}", "-PleggingsUndergardenAbsent=${absent}"]
        if (gradle.startParameter.offline) { args.add('--offline') }
        logger.lifecycle("Production Rogdorium presentation ${neoforge_version}/${label}")
        def process = new ProcessBuilder(['cmd.exe', '/d', '/c'] + args.collect { it.toString() })
                .directory(rootProject.projectDir).redirectErrorStream(true).redirectOutput(log).start()
        try {
            if (!process.waitFor(300, TimeUnit.SECONDS) || process.exitValue() != 0
                    || !new File(reports, 'client.ok').isFile() || new File(reports, 'client.failure.txt').exists()
                    || !new File(reports, 'presentation.txt').isFile()) {
                throw new GradleException("Production Rogdorium presentation failed: ${log}")
            }
            if (log.text.readLines().any { it.contains('/ERROR]') || it.contains('Mixed Rogdorium infusion creation refused:')
                    || it.contains('Undergarden mixed ') && it.contains(' disabled:')
                    || absent && it.contains('Error loading class: quek/undergarden/') }) {
                throw new GradleException("Unexpected Rogdorium presentation diagnostics: ${log}")
            }
            new File(logs, 'presentation.ok').text = "packaged hidden/muted client; graph=${graph}; absent=${absent}\n"
        } finally {
            if (process.isAlive()) {
                process.toHandle().descendants().forEach { it.destroyForcibly() }
                process.destroyForcibly()
            }
        }
    }
}

tasks.register('verifyRogdoriumArtifacts') {
    group = 'verification'
    description = 'Checks additive native-state service packaging, optional boundaries and exact nested core identity.'
    ['Fabric', 'NeoForge'].each { loader ->
        ['Boots', 'Leggings', 'Things'].each { name ->
            dependsOn project(":Mismatched${name}:${loader}").tasks.named('assemble')
        }
    }
    doLast {
        ['Fabric', 'NeoForge'].each { loader ->
            def shared = project(":MismatchedThings:${loader}").tasks.named('jar').get().archiveFile.get().asFile
            ['Boots', 'Leggings', 'Things'].each { name ->
                def jar = project(":Mismatched${name}:${loader}").tasks.named('jar').get().archiveFile.get().asFile
                new ZipFile(jar).withCloseable { zip ->
                    def entries = zip.entries().findAll { !it.directory }
                    if (entries.any { it.name.startsWith('quek/') || it.name.contains('/test/') || it.name.contains('/spike/') }) {
                        throw new GradleException("Foreign or test classes leaked into ${jar}")
                    }
                    if (loader == 'Fabric' && entries.findAll { it.name.endsWith('.class') }.any {
                        new String(zip.getInputStream(it).bytes, java.nio.charset.StandardCharsets.ISO_8859_1).contains('quek/undergarden/')
                    }) {
                        throw new GradleException("Fabric foreign native reference in ${jar}")
                    }
                    String service = 'META-INF/services/games.alejandrocoria.mismatchedthings.api.compatibility.undergarden.RogdoriumInfusionService'
                    if (name == 'Things') {
                        if (!zip.getEntry('games/alejandrocoria/mismatchedthings/api/compatibility/undergarden/RogdoriumInfusionService.class')
                                || (zip.getEntry(service) != null) != (loader == 'NeoForge')) {
                            throw new GradleException("Wrong optional service packaging in ${jar}")
                        }
                    } else {
                        def cores = entries.findAll { it.name.contains('mismatchedthings') && it.name.endsWith('.jar') }
                        if (cores.size() != 1 || !java.util.Arrays.equals(zip.getInputStream(cores.first()).bytes, shared.bytes)) {
                            throw new GradleException("Product does not include exactly the current core: ${jar}")
                        }
                    }
                }
            }
        }
        logger.lifecycle('Six production artifacts: clean optional boundaries and exact nested cores')
    }
}
