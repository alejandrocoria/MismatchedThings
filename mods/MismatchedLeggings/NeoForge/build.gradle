plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'idea'
}

base.archivesName = "${mod_name}-${minecraft_version}-neoforge"

evaluationDependsOn(':MismatchedThings')
def optionalGeckoApi = files(providers.provider {
    project(':MismatchedThings').testModArtifacts.resolve('NeoForge', 'geckolib-neoforge-26.1.2-5.5.2.jar')
})

dependencies {
    compileOnly optionalGeckoApi
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.ow2.asm:asm-tree:9.9.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Optional viewer APIs carry Fabric environment annotations even on their common surface.
    compileOnly "net.fabricmc:fabric-loader:${fabric_loader_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}"
    compileOnly "dev.architectury:architectury-neoforge:${architectury_version}"
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"
    implementation(project(path: ':MismatchedThings:NeoForge', configuration: 'workbenchElements')) { transitive = false }
    jarJar(project(path: ':MismatchedThings:NeoForge', configuration: 'workbenchElements')) { transitive = false }
}

neoForge {
    version = neoforge_version
    mods { mismatchedleggings { sourceSet sourceSets.main } }
    runs {
        configureEach { ideName = "${mod_name} — NeoForge ${it.name.capitalize()}" }
        client {
            client()
            gameDirectory = project.file('runs/client')
        }
        server {
            server()
            gameDirectory = project.file('runs/server')
            programArgument('--nogui')
        }
    }
}

idea.module.excludeDirs += file('runs')
tasks.named('assemble') { dependsOn tasks.named('jarJar') }
jar { from(rootProject.file('LICENSE')) }

tasks.named('test', Test) {
    useJUnitPlatform()
    def artifacts = project(':MismatchedThings').testModArtifacts
    def roots = 'RootsClassic-26.1.2-1.6.7.jar'
    inputs.file(providers.provider { artifacts.resolve('NeoForge', roots) })
            .withPropertyName('rootsGuardArtifact').withPathSensitivity(PathSensitivity.NONE)
    systemProperty 'mismatchedleggings.test.rootsGuardJar', artifacts.path('NeoForge', roots).absolutePath
}
