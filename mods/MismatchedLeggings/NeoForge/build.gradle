plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'idea'
}

base.archivesName = "${mod_name}-${minecraft_version}-neoforge"

evaluationDependsOn(':MismatchedThings')
def optionalGeckoApi = files(providers.provider {
    project(':MismatchedThings').testModArtifacts.resolve('NeoForge', 'geckolib-neoforge-26.1.2-5.5.2.jar')
})

def bootsWitnessJar = project(':MismatchedBoots:NeoForge').tasks.named('jar').flatMap { it.archiveFile }

dependencies {
    compileOnly files(providers.provider {
        project(':MismatchedThings').testModArtifacts.resolve('NeoForge', 'The_Undergarden-26.1.2-0.9.8.jar')
    })
    compileOnly optionalGeckoApi
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.ow2.asm:asm-tree:9.9.1'
    testImplementation 'org.ow2.asm:asm-analysis:9.9.1'
    testImplementation 'net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7'
    // Actual sibling bytecode is a test witness, never a production dependency.
    testRuntimeOnly files(bootsWitnessJar)
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Optional viewer APIs carry Fabric environment annotations even on their common surface.
    compileOnly "net.fabricmc:fabric-loader:${fabric_loader_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}"
    compileOnly "dev.architectury:architectury-neoforge:${architectury_version}"
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"
    implementation(project(path: ':MismatchedThings:NeoForge', configuration: 'workbenchElements')) { transitive = false }
    jarJar(project(path: ':MismatchedThings:NeoForge', configuration: 'workbenchElements')) { transitive = false }
}

neoForge {
    version = neoforge_version
    mods { mismatchedleggings { sourceSet sourceSets.main } }
    unitTest {
        enable()
        testedMod = mods.mismatchedleggings
    }
    runs {
        configureEach { ideName = "${mod_name} — NeoForge ${it.name.capitalize()}" }
        client {
            client()
            gameDirectory = project.file('runs/client')
        }
        server {
            server()
            gameDirectory = project.file('runs/server')
            programArgument('--nogui')
        }
    }
}

idea.module.excludeDirs += file('runs')
tasks.named('assemble') { dependsOn tasks.named('jarJar') }
jar { from(rootProject.file('LICENSE')) }

def artifactBindings = project(':MismatchedThings').testModArtifactBindings
def guardFixtures = [
        jdtJar: 'justdirethings',
        sgLiveJar: 'silentgear',
        rootsGuardJar: 'rootsclassic',
        aetherGuardJar: 'aether_ii',
        undergardenGuardJar: 'undergarden',
        iceAndFireGuardJar: 'iceandfire'
]

tasks.named('test', Test) { test ->
    useJUnitPlatform()
    // The modded JUnit loader hides Mixin resources; ASM reads this witness directly from the packaged sibling.
    inputs.file(bootsWitnessJar).withPropertyName('bootsWitnessArtifact').withPathSensitivity(PathSensitivity.NONE)
    systemProperty 'mismatchedleggings.test.bootsWitnessJar', bootsWitnessJar.get().asFile.absolutePath
    artifactBindings.bind(test, 'NeoForge', 'mismatchedleggings.test.', guardFixtures)
    [leggingsJdtHudClass: 'jdtHudClass', leggingsJdtSettingsClass: 'justDireSettingsTransformedClass'].each { option, property ->
        def supplied = providers.gradleProperty(option).map { file(it) }
        if (supplied.isPresent()) {
            test.inputs.file(supplied).withPropertyName(property).withPathSensitivity(PathSensitivity.NONE)
            test.systemProperty "mismatchedleggings.test.${property}", supplied.get().absolutePath
        }
    }
}
