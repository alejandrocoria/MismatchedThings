import groovy.json.JsonSlurper

import java.util.zip.ZipFile

def verification = tasks.register('verifyPackaging') {
    group = 'verification'
    description = 'Checks real Leggings artifacts, nested core identity and independent development classpaths.'
}

gradle.projectsEvaluated {
    ['Fabric', 'NeoForge'].each { name ->
        def product = project(name)
        def core = project(":MismatchedThings:${name}")
        def productJar = product.tasks.named('jar').flatMap { it.archiveFile }
        def coreJar = core.tasks.named('jar').flatMap { it.archiveFile }
        verification.configure {
            dependsOn product.tasks.named('assemble'), core.tasks.named('jar')
            inputs.files(productJar, coreJar)
            doLast {
                new ZipFile(productJar.get().asFile).withCloseable { zip ->
                    def names = zip.entries().findAll { !it.directory }.collect { it.name }
                    if ('data/minecraft/tags/item/leg_armor.json' in names) {
                        throw new GradleException('Broad armor classification would advertise invalid mixed smithing examples')
                    }
                    if (names.any { it.startsWith('com/blakebr0/mysticalagriculture/') || it.startsWith('com/blakebr0/cucumber/')
                            || it.startsWith('com/autovw/advancednetherite/')
                            || it.startsWith('com/zurrtum/create/')
                            || it.contains('mismatchedboots') || it.contains('/test/') || it.contains('/spike/')
                            || it.contains('leggingsspike') || it.contains('leggings-spike') || it.contains('leggings_test')
                            || it.startsWith('games/alejandrocoria/mismatchedthings/')
                            || it.startsWith('assets/mismatchedthings/') || it.startsWith('data/mismatchedthings/') }) {
                        throw new GradleException('Boots, fixture or loose core content leaked into Leggings')
                    }
                    ['games/alejandrocoria/mismatchedleggings/content/MixedLeggingsItem.class',
                     'games/alejandrocoria/mismatchedleggings/composition/MixedLeggingsFactory.class',
                     'games/alejandrocoria/mismatchedleggings/recipe/MixedLeggingsWorkbenchRecipe.class',
                     'games/alejandrocoria/mismatchedleggings/recipe/MixedLeggingsRepairRecipe.class',
                     'games/alejandrocoria/mismatchedleggings/recipe/MixedLeggingsSmithingBaseRecipe.class',
                     'games/alejandrocoria/mismatchedleggings/composition/MixedLeggingsRecomposer.class',
                     'games/alejandrocoria/mismatchedleggings/data/SuspendedLeggingsData.class',
                     'games/alejandrocoria/mismatchedleggings/data/SuspendedLeggingsItemCodec.class',
                     'games/alejandrocoria/mismatchedleggings/mixin/recovery/ItemStackRecoveryMixin.class',
                     'games/alejandrocoria/mismatchedleggings/mixin/GrindstoneMenuMixin.class',
                     'games/alejandrocoria/mismatchedleggings/mixin/GrindstoneResultSlotXpMixin.class',
                     'games/alejandrocoria/mismatchedleggings/network/CompositionRulesPayload.class',
                     'games/alejandrocoria/mismatchedleggings/client/render/MixedLeggingsEquipmentRenderer.class',
                     'games/alejandrocoria/mismatchedleggings/client/render/MixedLeggingsItemRenderer.class',
                     'games/alejandrocoria/mismatchedleggings/tooltip/MixedLeggingsTooltipFormatter.class',
                     'games/alejandrocoria/mismatchedleggings/compatibility/jei/MismatchedLeggingsJeiPlugin.class',
                     'games/alejandrocoria/mismatchedleggings/compatibility/rei/MismatchedLeggingsReiClientPlugin.class',
                     'data/minecraft/tags/item/enchantable/leg_armor.json',
                     'data/minecraft/tags/item/enchantable/durability.json',
                     'data/minecraft/tags/item/enchantable/equippable.json',
                     'META-INF/services/games.alejandrocoria.mismatchedleggings.client.render.EquipmentSources',
                     'assets/mismatchedleggings/equipment/neutral.json',
                     'data/mismatchedleggings/recipe/mixed_leggings_workbench.json',
                     'data/mismatchedleggings/recipe/mixed_leggings_repair.json',
                     'data/mismatchedleggings/recipe/mixed_leggings_smithing_base.json',
                     'META-INF/services/games.alejandrocoria.mismatchedleggings.composition.CompositionAttributes',
                     'data/minecraft/tags/item/enchantable/armor.json',
                     'assets/mismatchedleggings/items/mixed_leggings.json',
                     'assets/mismatchedleggings/models/item/mixed_leggings.json',
                     'assets/mismatchedleggings/lang/en_us.json',
                     'assets/mismatchedleggings/lang/es_es.json',
                     'mismatchedleggings.mixins.json',
                     'mismatchedleggings.recovery.mixins.json',
                     'mismatchedleggings.advancednetherite.mixins.json',
                     'mismatchedleggings.mysticalagriculture.mixins.json',
                     'games/alejandrocoria/mismatchedleggings/compatibility/mysticalagriculture/MysticalAugments.class',
                     'games/alejandrocoria/mismatchedleggings/compatibility/mysticalagriculture/MysticalAugmentsCompatibility.class',
                     'games/alejandrocoria/mismatchedleggings/compatibility/mysticalagriculture/MysticalAugmentsShape.class',
                     'games/alejandrocoria/mismatchedleggings/compatibility/mysticalagriculture/MysticalRefundShape.class',
                     'games/alejandrocoria/mismatchedleggings/compatibility/mysticalagriculture/MysticalRefundCompatibility.class',
                     'games/alejandrocoria/mismatchedleggings/mixin/compatibility/mysticalagriculture/MysticalRefundMixin.class',
                     'games/alejandrocoria/mismatchedleggings/compatibility/mysticalagriculture/MysticalAugmentsMixinPlugin.class',
                     'games/alejandrocoria/mismatchedleggings/mixin/compatibility/mysticalagriculture/MysticalEquipmentMixin.class',
                     'games/alejandrocoria/mismatchedleggings/mixin/compatibility/mysticalagriculture/MysticalArmorTickProofMixin.class',
                     'games/alejandrocoria/mismatchedleggings/mixin/compatibility/mysticalagriculture/MysticalHealthCleanupMixin.class',
                     'games/alejandrocoria/mismatchedleggings/compatibility/advancednetherite/AdvancedNetheriteMixinPlugin.class',
                     'games/alejandrocoria/mismatchedleggings/mixin/compatibility/advancednetherite/AdvancedNetheriteHooksMixin.class'].each { path ->
                        if (!(path in names)) { throw new GradleException("Missing product entry: ${path}") }
                    }
                    def mystical = new JsonSlurper().parse(zip.getInputStream(zip.getEntry('mismatchedleggings.mysticalagriculture.mixins.json')))
                    if (mystical.plugin != 'games.alejandrocoria.mismatchedleggings.compatibility.mysticalagriculture.MysticalAugmentsMixinPlugin'
                            || mystical.package != 'games.alejandrocoria.mismatchedleggings.mixin.compatibility.mysticalagriculture'
                            || mystical.mixins != []) {
                        throw new GradleException('Wrong optional Mystical Agriculture mixin ownership')
                    }
                    String nestedPath
                    def optionalMixin = new JsonSlurper().parse(zip.getInputStream(zip.getEntry('mismatchedleggings.advancednetherite.mixins.json')))
                    if (optionalMixin.plugin != 'games.alejandrocoria.mismatchedleggings.compatibility.advancednetherite.AdvancedNetheriteMixinPlugin'
                            || optionalMixin.package != 'games.alejandrocoria.mismatchedleggings.mixin.compatibility.advancednetherite'
                            || optionalMixin.mixins != ['AdvancedNetheriteHooksMixin']) {
                        throw new GradleException('Wrong optional Advanced Netherite mixin ownership')
                    }
                    if (name == 'Fabric') {
                        def descriptor = new JsonSlurper().parse(zip.getInputStream(zip.getEntry('fabric.mod.json')))
                        if (descriptor.id != 'mismatchedleggings' || descriptor.version != project.version.toString()
                                || descriptor.depends.mismatchedthings != '>=1.1.0 <2.0.0'
                                || descriptor.depends.containsKey('mismatchedboots')
                                || descriptor.depends.containsKey('mysticalagriculture') || descriptor.depends.containsKey('cucumber')
                                || descriptor.depends.containsKey('advancednetherite')
                                || descriptor.depends.containsKey('betternether')
                                || descriptor.depends.containsKey('create')
                                || descriptor.depends.containsKey('jei') || descriptor.depends.containsKey('roughlyenoughitems')
                                || descriptor.entrypoints.jei_mod_plugin != ['games.alejandrocoria.mismatchedleggings.compatibility.jei.MismatchedLeggingsJeiPlugin']
                                || descriptor.entrypoints.rei_client != ['games.alejandrocoria.mismatchedleggings.compatibility.rei.MismatchedLeggingsReiClientPlugin']
                                || descriptor.mixins != ['mismatchedleggings.mixins.json', 'mismatchedleggings.mysticalagriculture.mixins.json', 'mismatchedleggings.recovery.mixins.json', 'mismatchedleggings.advancednetherite.mixins.json', 'mismatchedleggings.betternether.mixins.json', 'mismatchedleggings.createfly.mixins.json', 'mismatchedleggings.fabric.mixins.json']) {
                            throw new GradleException('Wrong standalone Fabric identity, bounds or skeleton hooks')
                        }
                        ['mismatchedleggings.betternether.mixins.json',
                         'games/alejandrocoria/mismatchedleggings/compatibility/betternether/BetterNetherMixinPlugin.class',
                         'games/alejandrocoria/mismatchedleggings/compatibility/betternether/BetterNetherPiglinArmorAdapter.class',
                         'games/alejandrocoria/mismatchedleggings/mixin/compatibility/betternether/BetterNetherPiglinArmorMixin.class'].each { path ->
                            if (!(path in names)) { throw new GradleException("Missing Fabric Better Nether entry: ${path}") }
                        }
                        def betterNether = new JsonSlurper().parse(zip.getInputStream(zip.getEntry('mismatchedleggings.betternether.mixins.json')))
                        if (betterNether.plugin != 'games.alejandrocoria.mismatchedleggings.compatibility.betternether.BetterNetherMixinPlugin'
                                || betterNether.package != 'games.alejandrocoria.mismatchedleggings.mixin.compatibility.betternether'
                                || betterNether.mixins != ['BetterNetherPiglinArmorMixin']) {
                            throw new GradleException('Wrong optional Better Nether mixin ownership')
                        }
                        def nested = descriptor.jars.findAll { it.file.tokenize('/').last().startsWith('mismatchedthings-') }
                        ['mismatchedleggings.createfly.mixins.json',
                         'games/alejandrocoria/mismatchedleggings/compatibility/createfly/CreateFlyMixinPlugin.class',
                         'games/alejandrocoria/mismatchedleggings/mixin/compatibility/createfly/CreateFlyCardboardArmorHandlerMixin.class',
                         'games/alejandrocoria/mismatchedleggings/mixin/compatibility/createfly/CreateFlyMixedLeggingsTooltipFormatterMixin.class'].each { path ->
                            if (!(path in names)) { throw new GradleException("Missing Fabric Create Fly entry: ${path}") }
                        }
                        def createFly = new JsonSlurper().parse(zip.getInputStream(zip.getEntry('mismatchedleggings.createfly.mixins.json')))
                        if (createFly.plugin != 'games.alejandrocoria.mismatchedleggings.compatibility.createfly.CreateFlyMixinPlugin'
                                || createFly.package != 'games.alejandrocoria.mismatchedleggings.mixin.compatibility.createfly'
                                || createFly.mixins != ['CreateFlyCardboardArmorHandlerMixin']
                                || createFly.client != ['CreateFlyMixedLeggingsTooltipFormatterMixin']) {
                            throw new GradleException('Wrong optional Create Fly mixin ownership')
                        }
                        if (nested.size() != 1 || descriptor.jars.size() != 1) {
                            throw new GradleException('Expected only one native nested core')
                        }
                        nestedPath = nested.first().file
                    } else {
                        if (names.any { it.contains('/compatibility/createfly/') || it == 'mismatchedleggings.createfly.mixins.json' }) {
                            throw new GradleException('Fabric-only Create Fly integration leaked into NeoForge')
                        }
                        if (names.any { it.contains('/compatibility/betternether/') || it == 'mismatchedleggings.betternether.mixins.json' }) {
                            throw new GradleException('Fabric-only Better Nether integration leaked into NeoForge')
                        }
                        def text = zip.getInputStream(zip.getEntry('META-INF/neoforge.mods.toml')).getText('UTF-8')
                        if (text.count('config="mismatchedleggings.advancednetherite.mixins.json"') != 1
                                || text.contains('modId="advancednetherite"')) {
                            throw new GradleException('Optional Advanced Netherite integration is missing, duplicated or required')
                        }
                        if (text.count('config="mismatchedleggings.mysticalagriculture.mixins.json"') != 1
                                || text.contains('modId="mysticalagriculture"') || text.contains('modId="cucumber"')) {
                            throw new GradleException('Optional Mystical Agriculture integration is missing, duplicated or required')
                        }
                        def dependency = text.split(/\[\[dependencies\.[^\]]+\]\]/).find { it.contains('modId="mismatchedthings"') }
                        if (!text.contains('modId="mismatchedleggings"') || text.contains('modId="mismatchedboots"')
                                || text.contains('modId="jei"') || text.contains('modId="roughlyenoughitems"')
                                || dependency == null || !dependency.contains('versionRange="[1.1.0,2.0.0)"')
                                || !dependency.contains('type="required"') || !text.contains('config="mismatchedleggings.mixins.json"')
                                || !text.contains('config="mismatchedleggings.recovery.mixins.json"')) {
                            throw new GradleException('Wrong standalone NeoForge identity, bounds or skeleton hooks')
                        }
                        if (!names.contains('games/alejandrocoria/mismatchedleggings/compatibility/rei/MismatchedLeggingsReiNeoForgePlugin.class')) {
                            throw new GradleException('Missing optional NeoForge REI discovery adapter')
                        }
                        def metadata = new JsonSlurper().parse(zip.getInputStream(zip.getEntry('META-INF/jarjar/metadata.json')))
                        def nested = metadata.jars.findAll { it.identifier.group == 'games.alejandrocoria.mismatchedthings'
                                && it.identifier.artifact == 'mismatchedthings-neoforge' }
                        if (nested.size() != 1 || metadata.jars.size() != 1
                                || nested.first().version.artifactVersion != core.version.toString()
                                || nested.first().isObfuscated) {
                            throw new GradleException('Wrong native nested core identity/version')
                        }
                        nestedPath = nested.first().path
                    }
                    def nested = zip.getEntry(nestedPath)
                    if (nested == null || !Arrays.equals(zip.getInputStream(nested).withCloseable { it.readAllBytes() },
                            coreJar.get().asFile.bytes)) {
                        throw new GradleException('Nested core differs from its real loader artifact')
                    }
                }
                new ZipFile(coreJar.get().asFile).withCloseable { zip ->
                    def entries = zip.entries().findAll { !it.directory }.collect { it.name }
                    ['api/compatibility/neovitae/NeoVitaeInfusionService.class',
                     'internal/compatibility/neovitae/NeoVitaeInfusionRules.class',
                     'api/client/viewer/WorkbenchExample.class',
                     'api/client/viewer/jei/WorkbenchJeiRecipes.class',
                     'api/client/viewer/rei/WorkbenchReiDisplay.class',
                     'internal/client/viewer/jei/WorkbenchJeiPlugin.class',
                     'internal/client/viewer/rei/WorkbenchReiPlugin.class'].each { entry ->
                        if (!entries.contains("games/alejandrocoria/mismatchedthings/${entry}".toString())) {
                            throw new GradleException("Missing shared viewer entry: ${entry}")
                        }
                    }
                    if (entries.any { it.contains('mismatchedboots') || it.contains('mismatchedleggings')
                            || it.contains('/test/') || it.contains('/spike/') }) {
                        throw new GradleException('Product or fixture content leaked into the shared viewer core')
                    }
                    def infusionService = 'META-INF/services/games.alejandrocoria.mismatchedthings.api.compatibility.neovitae.NeoVitaeInfusionService'
                    def infusionProvider = 'games.alejandrocoria.mismatchedthings.internal.compatibility.neovitae.NeoForgeNeoVitaeInfusionService'
                    if (name == 'NeoForge') {
                        if (!entries.contains(infusionProvider.replace('.', '/') + '.class')
                                || !entries.contains(infusionService)
                                || zip.getInputStream(zip.getEntry(infusionService)).getText('UTF-8').trim() != infusionProvider) {
                            throw new GradleException('Missing shared NeoForge infusion provider')
                        }
                    } else if (entries.contains(infusionService) || entries.contains(infusionProvider.replace('.', '/') + '.class')) {
                        throw new GradleException('NeoForge infusion provider leaked into Fabric')
                    }
                    if (name == 'Fabric') {
                        def descriptor = new JsonSlurper().parse(zip.getInputStream(zip.getEntry('fabric.mod.json')))
                        if (descriptor.depends.containsKey('jei') || descriptor.depends.containsKey('roughlyenoughitems')
                                || descriptor.entrypoints.jei_mod_plugin != ['games.alejandrocoria.mismatchedthings.internal.client.viewer.jei.WorkbenchJeiPlugin']
                                || descriptor.entrypoints.rei_client != ['games.alejandrocoria.mismatchedthings.internal.client.viewer.rei.WorkbenchReiPlugin']) {
                            throw new GradleException('Wrong optional core viewer discovery/dependencies')
                        }
                    } else if (!entries.contains('games/alejandrocoria/mismatchedthings/internal/client/viewer/rei/WorkbenchReiNeoForgePlugin.class')) {
                        throw new GradleException('Missing core NeoForge REI discovery adapter')
                    }
                }
                def runtime = product.sourceSets.main.runtimeClasspath.files
                if (!runtime.contains(coreJar.get().asFile) || runtime.any { it.path.contains('MismatchedBoots') }) {
                    throw new GradleException("Wrong independent ${name} development classpath")
                }
                logger.lifecycle("Verified ${name} standalone Leggings artifact and native core ${core.version}")
            }
        }
    }
}
