def metadata = new Properties()
file('mod.properties').withInputStream { stream -> metadata.load(stream) }

def owningMod = project
allprojects { child ->
    child.version = metadata.getProperty('version')
    child.group = metadata.getProperty('group')
    child.ext.mismatchedModProject = owningMod
    metadata.each { key, value ->
        if (!(key in ['version', 'group'])) {
            child.extensions.extraProperties.set(key.toString(), value)
        }
    }
}

apply from: 'gradle/packaging.gradle'
apply from: 'gradle/product-verification.gradle'

// The shared optional API has identical bytecode in the pinned loader artifacts.
['Common', 'Fabric', 'NeoForge'].each { name ->
    project(name).pluginManager.withPlugin('java-library') {
        project(name).dependencies {
            compileOnly('maven.modrinth:CFX9ftUJ:vudH2Rjv') { transitive = false }
        }
    }
}

tasks.register('verifySkeleton') {
    group = 'verification'
    description = 'Checks standalone packaged Leggings startup on both loaders.'
    dependsOn 'verifyPackaging', ':MismatchedLeggings:RuntimeTests:Fabric:verifySkeleton',
            ':MismatchedLeggings:RuntimeTests:NeoForge:verifySkeleton'
}
