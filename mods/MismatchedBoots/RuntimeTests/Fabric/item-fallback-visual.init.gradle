// Opt-in visual probe: narrow client entrypoints, then restore generated metadata.
def modPath = ':MismatchedBoots'

gradle.projectsEvaluated {
    def fixture = gradle.rootProject.findProject("${modPath}:RuntimeTests:Fabric")
    if (fixture == null) {
        return
    }

    def metadata = new File(fixture.sourceSets.gametest.output.resourcesDir, 'fabric.mod.json')
    byte[] original
    def restore = fixture.tasks.register('restoreFallbackSpikeMetadata') {
        doLast {
            if (original != null) {
                metadata.bytes = original
            }
        }
    }
    fixture.tasks.named('runClientGameTest') {
        systemProperty 'mismatchedboots.test.fallbackVisualOnly', 'true'
        doFirst {
            original = metadata.bytes
            def document = new groovy.json.JsonSlurper().parse(metadata)
            document.entrypoints['fabric-client-gametest'] = [
                    'games.alejandrocoria.mismatchedboots.gametest.HybridItemRenderingClientGameTest',
                    'games.alejandrocoria.mismatchedboots.gametest.HybridItemRenderingRuntimeClientGameTest'
            ]
            metadata.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(document))
        }
        finalizedBy restore
    }
}
