// Fabric's reporter has no skip API. Keep full-suite discovery, but describe
// context-only no-ops honestly in JUnit XML rather than counting them as passes.
// Keep these IDs aligned with the requireOrSkip guards; missing IDs fail loudly.
def contextOnlyTests = [
        'attribute_rules_game_tests_isolated_server_config_controls_new_composition_and_rejects_configured_attributes',
        'persistence_game_tests_restart_round_trip_uses_the_dedicated_two_process_harness',
        'component_rules_config_game_tests_configured_composition_works',
        'damage_tag_reload_game_tests_existing_stack_tracks_tag_reload',
        'behavior_tag_reload_game_tests_existing_stack_tracks_piglin_safe_armor_reload',
        'mismatched_workbench_content_game_tests_recipe_pack_removal_disables_only_data_driven_transformations'
].collect { "mismatchedboots-test:${it}".toString() }
['runGameTest': 'results.xml', 'runAttributeRules': 'attribute-rules.xml'].each { taskName, reportName ->
    def report = fixtureBuildDirectory.file("reports/gametest/${reportName}")
    def omitted = taskName == 'runAttributeRules' ? contextOnlyTests.drop(1) : contextOnlyTests
    tasks.named(taskName) {
        doFirst { fixtureFileOperations.delete { delete report } }
        doLast {
            def parser = javax.xml.parsers.DocumentBuilderFactory.newInstance()
            parser.setFeature('http://apache.org/xml/features/disallow-doctype-decl', true)
            def document = parser.newDocumentBuilder().parse(report.get().asFile)
            def cases = document.getElementsByTagName('testcase')
            omitted.each { id ->
                def matches = (0..<cases.length).collect { cases.item(it) }
                        .findAll { it.getAttribute('name') == id }
                if (matches.size() != 1 || matches[0].hasChildNodes()) {
                    throw new GradleException("Expected one successful context-only no-op for ${id}")
                }
                def skipped = document.createElement('skipped')
                skipped.setAttribute('message', 'Requires its dedicated fixture; not exercised by this run')
                matches[0].appendChild(skipped)
            }
            def suites = document.getElementsByTagName('testsuite')
            (0..<suites.length).each { index ->
                def suite = suites.item(index)
                suite.setAttribute('tests', suite.getElementsByTagName('testcase').length.toString())
                suite.setAttribute('skipped', suite.getElementsByTagName('skipped').length.toString())
            }
            def transformer = javax.xml.transform.TransformerFactory.newInstance().newTransformer()
            transformer.transform(new javax.xml.transform.dom.DOMSource(document),
                    new javax.xml.transform.stream.StreamResult(report.get().asFile))
            logger.lifecycle("${taskName}: ${cases.length - omitted.size()} exercised (including vanilla control), "
                    + "${omitted.size()} context-only skipped; ${report.get().asFile}")
        }
    }
}

