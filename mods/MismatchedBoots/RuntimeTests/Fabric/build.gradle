def fixtureBuildDirectory = layout.buildDirectory
def productionArchive = project(':Fabric').tasks.named('jar').flatMap { it.archiveFile }
def runBoundedGradleTask = rootProject.ext.runBoundedGradleTask

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    compileOnly files(project(':Fabric').sourceSets.main.output)
    compileOnly files(project(':Fabric').sourceSets.main.compileClasspath)
    testImplementation files(productionArchive)
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

