modLoader="javafml"
loaderVersion="${neoforge_loader_version_range}"
license="${mod_license}"
issueTrackerURL="${mod_issues}"

[[dependencies.${mod_id}]]
    modId="mismatchedthings"
    type="required"
    versionRange="[1.0.0,2.0.0)"
    ordering="AFTER"
    side="BOTH"

[[mods]]
    modId="${mod_id}"
    version="${version}"
    displayName="${mod_name}"
    displayURL="${mod_homepage}"
    iconFile="${mod_logo}"
    credits="${mod_credits}"
    authors="${mod_author}"
    description="${mod_description}"

