import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'idea'
    id 'net.darkhax.curseforgegradle' version '1.1.28'
    id "com.modrinth.minotaur" version "2.9.0"
}

apply from: file('../gradle/mixin-binary-compatibility.gradle')

def modPath = mismatchedModProject.path

base.archivesName = "${project.mod_name}-${project.minecraft_version}-neoforge"

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project("${modPath}:Common").file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            ideName = "${mod_name} — NeoForge ${it.name.capitalize()}"
        }
        client {
            client()
            gameDirectory = project.file('runs/client')
        }
        server {
            server()
            gameDirectory = project.file('runs/server')
            programArgument('--nogui')
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }

    dependencies {
        implementation "mysticdrew:common-networking-neoforge:${common_networking_version}"
        implementation "com.electronwill.night-config:core:${nightconfig_version}"
        implementation "com.electronwill.night-config:toml:${nightconfig_version}"
        jarJar "mysticdrew:common-networking-neoforge:[${common_networking_version}]"
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('jarJar')
}

dependencies {
    compileOnly files(providers.provider {
        project(':MismatchedThings').testModArtifacts.resolve('NeoForge', 'The_Undergarden-26.1.2-0.9.8.jar')
    })
    implementation(project(path: ':MismatchedThings:NeoForge', configuration: 'workbenchElements')) { transitive = false }
    jarJar(project(path: ':MismatchedThings:NeoForge', configuration: 'workbenchElements')) { transitive = false }
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}"
    compileOnly "dev.architectury:architectury-neoforge:${architectury_version}"
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"
    compileOnly "net.fabricmc:fabric-loader:${fabric_loader_version}"
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def artifactBindings = project(':MismatchedThings').testModArtifactBindings

def guardFixtures = [
        justDireGuardJar: 'justdirethings',
        iceAndFireGuardJar: 'iceandfire',
        aetherGuardJar: 'aether_ii',
        oritechGuardJar: 'oritech',
        rootsGuardJar: 'rootsclassic',
        undergardenGuardJar: 'undergarden',
        allthemodiumGuardJar: 'allthemodium'
]
def guardOverrides = guardFixtures.collectEntries { property, id ->
    [(property): layout.file(providers.gradleProperty(property).map { rootProject.file(it) })]
}

tasks.named('test', Test).configure { test ->
    useJUnitPlatform()
    artifactBindings.bind(test, 'NeoForge', 'mismatchedboots.test.', guardFixtures, guardOverrides)
    ['justDireTransformedClass', 'justDireSettingsTransformedClass', 'justDireCooldownHudTransformedClass'].each { property ->
        def supplied = providers.gradleProperty(property).map { rootProject.file(it) }
        if (supplied.isPresent()) {
            test.inputs.file(supplied).withPropertyName(property).withPathSensitivity(PathSensitivity.NONE)
            test.systemProperty "mismatchedboots.test.${property}", supplied.get().absolutePath
        }
    }
}

idea {
    module {
        excludeDirs += file('runs')
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

registerProcessDocsTask(
        "NeoForge",
        neoforge_version,
        ""
)

tasks.register('publishCurseForge', TaskPublishCurseForge) {
    apiToken = "${curseForgeApiKey}"
    def mainFile = upload(curseforge_project_id, jar)
    mainFile.displayName = "${minecraft_version}-${version}-neoforge"
    mainFile.releaseType = release_type
    mainFile.addModLoader("NeoForge")
    mainFile.addJavaVersion("Java 25")
    mainFile.addGameVersion("${minecraft_version}")
    mainFile.addEnvironment("Server", "Client")
    mainFile.changelogType = "markdown"
    mainFile.changelog = file("$project.buildDir/doc/changelog.md")
}

modrinth {
//    debugMode.set(true)
    token = "${modrinthApiKey}"
    projectId = modrinth_project_id
    versionNumber = "${minecraft_version}-${version}-neoforge"
    versionName = "${mod_name}-${minecraft_version}-${version}-neoforge"
    versionType = release_type
    uploadFile = jar
    gameVersions = ["${minecraft_version}"]
    loaders = ["neoforge"]
    changelog.set(providers.provider {
        file("$project.buildDir/doc/changelog.md").text
    })
}
