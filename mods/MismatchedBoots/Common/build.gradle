plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

tasks.processResources {
    from(rootProject.file('LICENSE'))
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

neoForge.addModdingDependenciesTo(sourceSets["test"])

tasks.named('test', Test).configure {
    def testWorkDirectory = layout.buildDirectory.dir('test-work')
    useJUnitPlatform()
    workingDir testWorkDirectory
    doFirst {
        testWorkDirectory.get().asFile.mkdirs()
    }
}

dependencies {
    compileOnly 'org.spongepowered:mixin:0.8.5'
    compileOnly 'org.ow2.asm:asm-analysis:9.9.1'
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly 'io.github.llamalad7:mixinextras-common:0.3.5'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.3.5'

    compileOnly("mysticdrew:common-networking-common:${common_networking_version}") {
        transitive = false
    }
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-api:${rei_version}"
    compileOnly "dev.architectury:architectury:${architectury_version}"
    compileOnly 'me.shedaniel.cloth:basic-math:0.6.1'
    compileOnly "net.fabricmc:fabric-loader:${fabric_loader_version}"
    api "com.electronwill.night-config:core:${nightconfig_version}"
    api "com.electronwill.night-config:toml:${nightconfig_version}"

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.spongepowered:mixin:0.8.5'
    testImplementation 'org.ow2.asm:asm-tree:9.9.1'
    testImplementation 'org.ow2.asm:asm-analysis:9.9.1'
    testImplementation("mysticdrew:common-networking-common:${common_networking_version}") {
        transitive = false
    }
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
