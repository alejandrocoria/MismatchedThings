import com.modrinth.minotaur.dependencies.ModDependency
import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
    id 'idea'
    id 'net.darkhax.curseforgegradle' version '1.1.28'
    id "com.modrinth.minotaur" version "2.9.0"
}

def modPath = mismatchedModProject.path

base.archivesName = "${project.mod_name}-${project.minecraft_version}-fabric"

dependencies {
    implementation(project(path: ':MismatchedThings:Fabric', configuration: 'workbenchElements')) { transitive = false }
    include(project(path: ':MismatchedThings:Fabric', configuration: 'workbenchElements')) { transitive = false }
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation 'com.google.code.findbugs:jsr305:3.0.1'
    // BetterEnd; exact target also used by RuntimeTests: https://modrinth.com/mod/gc8OEnCC/version/tBdZGZeX
    compileOnly('maven.modrinth:gc8OEnCC:tBdZGZeX') {
        transitive = false
    }
    // Create Fly 6.0.9-4; https://modrinth.com/mod/dKvj0eNn/version/wV5IQLKg
    compileOnly('maven.modrinth:dKvj0eNn:wV5IQLKg') {
        transitive = false
    }
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_version}"
    compileOnly "dev.architectury:architectury-fabric:${architectury_version}"
    compileOnly "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
    api(include("mysticdrew:common-networking-fabric:${common_networking_version}")) {
        transitive = false
    }
    include(implementation("com.electronwill.night-config:core:${nightconfig_version}"))
    include(implementation("com.electronwill.night-config:toml:${nightconfig_version}"))
}

loom {
    def aw = project("${modPath}:Common").file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        useLegacyMixinAp = false
    }
    runs {
        configureEach {
            appendProjectPathToConfigName.set(false)
        }
        client {
            client()
            setConfigName("${mod_name} — Fabric Client")
            property("mixin.debug.export", "true")
            ideConfigGenerated(true)
            runDir("runs/client")
        }
        server {
            server()
            setConfigName("${mod_name} — Fabric Server")
            property("mixin.debug.export", "true")
            ideConfigGenerated(true)
            runDir("runs/server")
        }
    }
}

apply from: mismatchedModProject.file('gradle/fabric-media.gradle')

// Keep the established validation commands while runtime infrastructure lives separately.
['verifyGameplay', 'verifyClient', 'verifyQuiltSmoke', 'verifyGameTestContextGuard',
 'verifyPersistenceRestart', 'verifyComponentRulesConfig',
 'runGameTest', 'runClientGameTest', 'runPersistenceWrite', 'runPersistenceRead',
 'runAttributeRules', 'runComponentRules', 'compileGametestJava', 'processGametestResources', 'gametestClasses'].each { name ->
    tasks.register(name) {
        group = 'verification'
        description = "Delegates to the isolated Fabric runtime test project."
        dependsOn("${modPath}:RuntimeTests:Fabric:${name}")
    }
}

tasks.named('check') {
    dependsOn("${modPath}:RuntimeTests:Fabric:verifyGameplay", "${modPath}:RuntimeTests:Fabric:test")
}

idea {
    module {
        excludeDirs += file('runs')
    }
}

registerProcessDocsTask(
        "Fabric API",
        fabric_api_version,
        ""
)

tasks.register('publishCurseForge', TaskPublishCurseForge) {
    apiToken = "${curseForgeApiKey}"
    def mainFile = upload(curseforge_project_id, jar)
    mainFile.displayName = "${minecraft_version}-${version}-fabric"
    mainFile.releaseType = release_type
    mainFile.addModLoader("Fabric", "Quilt")
    mainFile.addJavaVersion("Java 25")
    mainFile.addGameVersion("${minecraft_version}")
    mainFile.addEnvironment("Server", "Client")
    mainFile.changelogType = "markdown"
    mainFile.changelog = file("$project.buildDir/doc/changelog.md")
}

modrinth {
//    debugMode.set(true)
    token = "${modrinthApiKey}"
    projectId = modrinth_project_id
    versionNumber = "${minecraft_version}-${version}-fabric"
    versionName = "${mod_name}-${minecraft_version}-${version}-fabric"
    versionType = release_type
    uploadFile = jar
    gameVersions = ["${minecraft_version}"]
    loaders = ["fabric", "quilt"]
    dependencies = [
            new ModDependency("fabric-api", "required")
    ]
    changelog.set(providers.provider {
        file("$project.buildDir/doc/changelog.md").text
    })
}
