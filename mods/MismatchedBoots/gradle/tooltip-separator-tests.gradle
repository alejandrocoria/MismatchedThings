// Isolated production presentation checks. No test-owned separator producer, factory or renderer.
def modPath = mismatchedModProject.path

def testMods = project(':MismatchedThings').testModArtifacts
def fabric = project.name == 'Fabric'
def loader = fabric ? 'Fabric' : 'NeoForge'
def fixtureSources = fabric ? sourceSets.networkTest : sourceSets.main
fixtureSources.java.srcDir project("${modPath}:RuntimeTests").file('TooltipSeparator/src/main/java')
fixtureSources.resources.srcDir project("${modPath}:RuntimeTests").file('TooltipSeparator/src/main/resources')
def filesService = objects.newInstance(FixtureFileOperations).files
def production = project("${modPath}:${loader}").tasks.named('jar').flatMap { it.archiveFile }
def fixture = fabric ? tasks.register('tooltipSeparatorTestJar', Jar) {
    archiveClassifier = 'tooltip-separator-tests'
    from fixtureSources.output
} : tasks.named('jar')
def baseline = fabric ? minecraft_version : neoforge_version
def reports = layout.buildDirectory.dir("reports/tooltip-separators/${baseline}")
def runs = layout.buildDirectory.dir("run/tooltipSeparators/${baseline}")
def plainOnly = providers.gradleProperty('tooltipSeparatorPlainOnly').map { it.toBoolean() }.getOrElse(false)
def bounded = mismatchedModProject.ext.runBoundedGradleTask
def artifacts = ['legendarytooltips', 'iceberg', 'prism']
['Seed', 'Plain', 'Legendary'].each { phase ->
    def directory = runs.map { it.dir(phase.toLowerCase(Locale.ROOT)) }
    def markers = reports.map { it.dir(phase.toLowerCase(Locale.ROOT)) }
    def properties = [
            'mismatchedboots.test.separatorTest'     : 'true',
            'mismatchedboots.test.separatorSeed'     : (phase == 'Seed').toString(),
            'mismatchedboots.test.separatorLoader'   : loader,
            'mismatchedboots.test.separatorDecorated': (phase == 'Legendary').toString(),
            'mismatchedboots.test.separatorCapture'  : (!plainOnly).toString(),
            'mismatchedboots.test.hideClientWindow'  : 'true',
            'mismatchedboots.runtimetest.markers'    : markers.get().asFile.absolutePath
    ]
    if (fabric) {
        loom.runs.create("tooltipSeparator${phase}") {
            inherit phase == 'Seed' ? loom.runs.server : loom.runs.client
            source('networkTest')
            ideConfigGenerated(false)
            runDir("build/run/tooltipSeparators/${baseline}/${phase.toLowerCase(Locale.ROOT)}")
            properties.each { key, value -> property(key, value) }
            if (phase == 'Seed') {
                programArgs('--nogui')
            } else {
                programArgs('--quickPlaySingleplayer', 'tooltip', '--username', 'SeparatorTest', '--width', '1920', '--height', '1080')
            }
            vmArg('-Xmx1G')
        }
    } else {
        neoForge.runs.create("tooltipSeparator${phase}") {
            disableIdeRun()
            gameDirectory = directory.get().asFile
            properties.each { key, value -> systemProperty(key, value) }
            if (phase == 'Seed') {
                server()
                programArgument('--nogui')
            } else {
                client()
                ['--quickPlaySingleplayer', 'tooltip', '--username', 'SeparatorTest', '--width', '1920', '--height', '1080'].each { programArgument(it) }
            }
            jvmArgument('-Xmx1G')
        }
    }

    def prepare = tasks.register("prepareTooltipSeparator${phase}") {
        dependsOn production, fixture
        doLast {
            def target = directory.get().asFile
            def buildRoot = layout.buildDirectory.get().asFile.canonicalFile.toPath()
            if (!target.canonicalFile.toPath().startsWith(buildRoot)
                    || !markers.get().asFile.canonicalFile.toPath().startsWith(buildRoot)) {
                throw new GradleException('Separator fixture paths must remain inside this runtime build directory')
            }
            filesService.delete { delete target, markers.get().asFile }
            def mods = phase == 'Legendary' ? testMods.resolveAll(loader, artifacts) : []
            filesService.copy {
                from production, fixture.flatMap { it.archiveFile }, mods
                into new File(target, 'mods')
            }
            markers.get().asFile.mkdirs()
            if (phase == 'Seed') {
                new File(target, 'eula.txt').text = 'eula=true\n'
                new File(target, 'server.properties').text = '''online-mode=false
server-ip=127.0.0.1
server-port=0
view-distance=2
simulation-distance=2
max-tick-time=-1
level-type=minecraft:flat
generator-settings={"biome":"minecraft:plains","layers":[{"height":1,"block":"minecraft:bedrock"}],"structure_overrides":[]}
'''
            } else {
                def world = runs.get().file('seed/world/level.dat').asFile
                if (!world.isFile()) {
                    throw new GradleException('Run the disposable separator seed first')
                }
                filesService.copy {
                    from world.parentFile
                    into new File(target, 'saves/tooltip')
                }
                new File(target, 'options.txt').text = 'soundCategory_master:0.0\nnarrator:0\nguiScale:2\n'
                def config = new File(target, 'config')
                config.mkdirs()
                new File(config, 'fml.toml').text = 'earlyWindowControl = false\n'
            }
        }
    }
    tasks.named("runTooltipSeparator${phase}") { dependsOn prepare }
}
tasks.register('verifyTooltipSeparators') {
    group = 'verification'
    description = 'Observes production tooltip separators with and without Legendary Tooltips'
    doLast {
        (plainOnly ? ['Seed', 'Plain'] : ['Seed', 'Plain', 'Legendary']).each { phase ->
            def log = reports.get().file("${phase.toLowerCase(Locale.ROOT)}.log").asFile
            bounded("${modPath}:RuntimeTests:${loader}:runTooltipSeparator${phase}", log, 240)
            def markerDirectory = reports.get().dir(phase.toLowerCase(Locale.ROOT)).asFile
            def failure = new File(markerDirectory, 'separator-failure.txt')
            if (failure.isFile()) {
                throw new GradleException(failure.text)
            }
            if (phase == 'Seed' && !new File(markerDirectory, 'separator-server-success.txt').isFile()) {
                throw new GradleException("Incomplete dedicated-server separator collection: ${log}")
            }
            if (phase != 'Seed' && !new File(markerDirectory, 'separator-success.txt').isFile()) {
                throw new GradleException("Incomplete production separator checks: ${log}")
            }

            def errors = log.readLines().findAll { it.contains('/ERROR]') }
            if (!errors.isEmpty()) {
                throw new GradleException("Unexpected separator errors: ${errors}")
            }
            if (phase != 'Seed') {
                logger.lifecycle("${loader} ${phase}:\n" + new File(markerDirectory, 'separator-report.txt').text)
            }
        }
    }
}
