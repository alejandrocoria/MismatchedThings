tasks.named('runJustDireGroundStompLifecycleRestart') {
    dependsOn("${modPath}:NeoForge:jar", tasks.named('jar'))
    doFirst {
        // No world-copy/reset preparation here: this JVM must open the preceding saved world.
        if (!new File(justDireJumpClientDirectory.get().asFile, 'saves/jump/level.dat').isFile()
                || !new File(justDireSmithingMarkers.get().asFile, 'just-dire-ground-stomp-lifecycle-save-success.txt').isFile()) {
            throw new GradleException('Run the Ground Stomp lifecycle save process before restart')
        }
    }
}

tasks.register('verifyJustDireGroundStompLifecycle') {
    group = 'verification'
    description = 'Verifies production JDT controls, FE/wear, HUD and sounds across actual world restart, native tier smithing and reconnect.'
    dependsOn("${modPath}:NeoForge:jar", tasks.named('jar'))
    doLast {
        ['Save', 'Restart'].each { mode ->
            def log = fixtureBuildDirectory.file("reports/just-dire-ground-stomp-lifecycle/${neoforge_version}/${mode.uncapitalize()}-process.log").get().asFile
            runBoundedGradleTask("${modPath}:RuntimeTests:NeoForge:runJustDireGroundStompLifecycle${mode}", log, 300)
            def directory = justDireSmithingMarkers.get().asFile
            def prefix = "just-dire-ground-stomp-lifecycle-${mode.uncapitalize()}"
            def failure = new File(directory, "${prefix}-failure.txt")
            def success = new File(directory, "${prefix}-success.txt")
            def report = new File(directory, "${prefix}-report.txt")
            if (failure.isFile() || !success.isFile() || success.text != 'neoforge\n' || !report.isFile()
                    || log.text.contains('/ERROR]') || log.text.contains('mixed screen bridge disabled')
                    || log.text.contains('mixed settings API; new settings/input routes disabled')
                    || log.text.contains('Just Dire Things cooldown HUD')
                    || log.readLines().any { it.contains('/WARN]') && it.contains('Just Dire Things Lava Repair') }) {
                throw new GradleException("Ground Stomp lifecycle ${mode} failed: ${failure.isFile() ? failure.text : log}")
            }
            new File(log.parentFile, "${mode.uncapitalize()}-report.txt").text = report.text
            logger.lifecycle(report.text)
        }
    }
}
