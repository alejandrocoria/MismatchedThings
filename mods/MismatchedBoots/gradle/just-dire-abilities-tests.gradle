tasks.register('verifyJustDireGroundStompClient') {
    group = 'verification'
    description = 'Verifies native JDT mixed widgets/capture and production location-aware keyboard/mouse batch transport.'
    dependsOn("${modPath}:NeoForge:jar", tasks.named('jar'))
    doLast {
        ['Live', 'High', 'Low', 'HooksMissing', 'ApiMissing', 'EarthquakeMissing', 'EarthquakeSettingsFailure', 'Absent'].each { variant ->
            def log = fixtureBuildDirectory.file("reports/just-dire-ground-stomp-client/${neoforge_version}/${variant.uncapitalize()}-process.log").get().asFile
            runBoundedGradleTask("${modPath}:RuntimeTests:NeoForge:runJustDireGroundStompClient${variant}", log, 300)
            def directory = justDireSmithingMarkers.get().asFile
            def failure = new File(directory, 'just-dire-ground-stomp-client-failure.txt')
            def success = new File(directory, 'just-dire-ground-stomp-client-success.txt')
            def report = new File(directory, 'just-dire-ground-stomp-client-report.txt')
            def warnings = log.readLines().findAll { it.contains('mixed screen bridge disabled') || it.contains('mixed settings API; new settings/input routes disabled') }
            def earthquakeWarnings = log.readLines().count {
                it.contains('Could not bind Just Dire Things Earthquake API; Earthquake compatibility disabled')
                        || it.contains('Just Dire Things Earthquake mixed settings unavailable; Earthquake metadata/input disabled')
            }
            def lavaWarnings = log.readLines().count { it.contains('/WARN]') && it.contains('Just Dire Things Lava Repair') }
            if (failure.isFile() || !success.isFile() || success.text != "${variant.uncapitalize()}\n" || !report.isFile()
                    || warnings.size() != (variant in ['HooksMissing', 'ApiMissing'] ? 1 : 0)
                    || earthquakeWarnings != (variant in ['EarthquakeMissing', 'EarthquakeSettingsFailure'] ? 1 : 0) || lavaWarnings != 0) {
                throw new GradleException("Production JDT active native client failed: ${failure.isFile() ? failure.text : log}")
            }
            if (variant == 'Absent' && log.text.contains('Error loading class: com/direwolf20/justdirethings')) {
                throw new GradleException("Absent JDT emitted a class loading warning: ${log}")
            }
            if (log.text.contains('/ERROR]')) {
                throw new GradleException("JDT active native client emitted an error: ${log}")
            }
            new File(log.parentFile, "${variant.uncapitalize()}-report.txt").text = report.text
            if (variant == 'Live') {
                fixtureFileOperations.copy {
                    from(new File(justDireJumpClientDirectory.get().asFile,
                            '.mixin.out/class/com/direwolf20/justdirethings/client/screens/ToolSettingScreen.class'))
                    into(log.parentFile)
                }
            }
            logger.lifecycle(report.text)
        }
    }
}

