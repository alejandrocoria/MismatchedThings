// JDT Ground Stomp, Earthquake, native screen/input and connected lifecycle.
def modPath = mismatchedModProject.path

def runBoundedGradleTask = mismatchedModProject.ext.runBoundedGradleTask

def testMods = mismatchedModProject.ext.testModArtifacts

def fixtureFileOperations = objects.newInstance(FixtureFileOperations).files

def fixtureBuildDirectory = layout.buildDirectory

def justDireSmithingMarkers = fixtureBuildDirectory.dir('just-dire-smithing-markers')

def justDireSmithingRunDirectory = fixtureBuildDirectory.dir('run/justDireSmithing')

def justDireJumpClientDirectory = fixtureBuildDirectory.dir('run/justDireJumpClient')

def justDireSmithingArtifact = providers.gradleProperty('justDireThingsTestJar')
        .map { rootProject.file(it) }.getOrElse(testMods.path('NeoForge', 'justdirethings-1.6.11.jar'))

neoForge.runs {
    justDireGroundStompTransport {
        client()
        disableIdeRun()
        gameDirectory = justDireJumpClientDirectory.get().asFile
        programArgument('--quickPlaySingleplayer')
        programArgument('jump')
        systemProperty('mismatchedboots.runtimetest.markers', justDireSmithingMarkers.get().asFile.absolutePath)
        systemProperty('mismatchedboots.runtimetest.justDireGroundStompTransportTest', 'true')
        systemProperty('mismatchedboots.test.hideClientWindow', 'true')
        systemProperty('mismatchedboots.runtimetest.dismissWarnings', 'true')
        jvmArgument('-Xmx1G')
    }

    ['Live', 'High', 'Low', 'HooksMissing', 'ApiMissing', 'EarthquakeMissing', 'EarthquakeSettingsFailure', 'Absent', 'Lava', 'LavaSettingsFailure'].each { variant ->
        register("justDireGroundStompClient${variant}") {
            client()
            disableIdeRun()
            gameDirectory = justDireJumpClientDirectory.get().asFile
            programArgument('--quickPlaySingleplayer')
            programArgument('jump')
            systemProperty('mismatchedboots.runtimetest.markers', justDireSmithingMarkers.get().asFile.absolutePath)
            systemProperty('mismatchedboots.runtimetest.justDireGroundStompClientTest', 'true')
            systemProperty('mismatchedboots.runtimetest.justDireGroundStompClientVariant', variant.uncapitalize())
            systemProperty('mixin.debug.export', 'true')
            if (variant == 'ApiMissing') {
                systemProperty('mismatchedboots.runtimetest.justDireGroundStompServerVariant', 'settingsMissing')
            }
            if (variant == 'EarthquakeMissing') {
                systemProperty('mismatchedboots.runtimetest.justDireEarthquakeStateVariant', 'apiMissing')
            }
            if (variant == 'EarthquakeSettingsFailure') {
                systemProperty('mismatchedboots.runtimetest.justDireEarthquakeStateVariant', 'settingsFailure')
            }
            if (variant == 'LavaSettingsFailure') {
                systemProperty('mismatchedboots.runtimetest.justDireLavaRepairSettingsFailure', 'true')
            }
            systemProperty('mismatchedboots.test.hideClientWindow', 'true')
            systemProperty('mismatchedboots.runtimetest.dismissWarnings', 'true')
            jvmArgument('-Xmx1G')
        }
    }

    ['Save', 'Restart'].each { mode ->
        register("justDireGroundStompLifecycle${mode}") {
            client()
            disableIdeRun()
            gameDirectory = justDireJumpClientDirectory.get().asFile
            programArgument('--quickPlaySingleplayer')
            programArgument('jump')
            systemProperty('mismatchedboots.runtimetest.markers', justDireSmithingMarkers.get().asFile.absolutePath)
            systemProperty('mismatchedboots.runtimetest.justDireGroundStompClientTest', 'true')
            systemProperty('mismatchedboots.runtimetest.justDireGroundStompClientVariant', mode.uncapitalize())
            systemProperty('mismatchedboots.runtimetest.justDireGroundStompLifecycle', mode.uncapitalize())
            systemProperty('mismatchedboots.test.hideClientWindow', 'true')
            systemProperty('mismatchedboots.runtimetest.dismissWarnings', 'true')
            jvmArgument('-Xmx1G')
        }
    }

    ['', 'ApiMissing', 'QueryFailure', 'Absent'].each { variant ->
        register("justDireEarthquakeState${variant}") {
            server()
            disableIdeRun()
            gameDirectory = justDireSmithingRunDirectory.get().asFile
            programArgument('--nogui')
            systemProperty('mismatchedboots.runtimetest.markers', justDireSmithingMarkers.get().asFile.absolutePath)
            systemProperty('mismatchedboots.runtimetest.justDireEarthquakeStateTest', 'true')
            systemProperty('mismatchedboots.runtimetest.justDireEarthquakeStateVariant', variant ? variant.uncapitalize() : 'live')
            jvmArgument('-Xmx1G')
        }
    }

    ['', 'ApiMissing', 'QueryFailure', 'Absent'].each { variant ->
        register("justDireEarthquakeServer${variant}") {
            server()
            disableIdeRun()
            gameDirectory = justDireSmithingRunDirectory.get().asFile
            programArgument('--nogui')
            systemProperty('mismatchedboots.runtimetest.markers', justDireSmithingMarkers.get().asFile.absolutePath)
            systemProperty('mismatchedboots.runtimetest.justDireEarthquakeServerTest', 'true')
            systemProperty('mismatchedboots.runtimetest.justDireEarthquakeStateVariant', variant ? variant.uncapitalize() : 'live')
            jvmArgument('-Xmx1G')
        }
    }

    ['', 'ApiMissing', 'QueryFailure', 'Absent'].each { variant ->
        register("justDireGroundStompState${variant}") {
            server()
            disableIdeRun()
            gameDirectory = justDireSmithingRunDirectory.get().asFile
            programArgument('--nogui')
            systemProperty('mismatchedboots.runtimetest.markers', justDireSmithingMarkers.get().asFile.absolutePath)
            systemProperty('mismatchedboots.runtimetest.justDireGroundStompStateTest', 'true')
            systemProperty('mismatchedboots.runtimetest.justDireGroundStompStateVariant', variant ? variant.uncapitalize() : 'live')
            jvmArgument('-Xmx1G')
        }
    }

    ['', 'ApiMissing', 'QueryFailure', 'SettingsMissing', 'Absent'].each { variant ->
        register("justDireGroundStompServer${variant}") {
            server()
            disableIdeRun()
            gameDirectory = justDireSmithingRunDirectory.get().asFile
            programArgument('--nogui')
            systemProperty('mismatchedboots.runtimetest.markers', justDireSmithingMarkers.get().asFile.absolutePath)
            systemProperty('mismatchedboots.runtimetest.justDireGroundStompServerTest', 'true')
            systemProperty('mismatchedboots.runtimetest.justDireGroundStompServerVariant', variant ? variant.uncapitalize() : 'live')
            systemProperty('mismatchedboots.runtimetest.justDireGroundStompStateVariant', variant ? variant.uncapitalize() : 'live')
            jvmArgument('-Xmx1G')
        }
    }
}

['', 'ApiMissing', 'QueryFailure'].each { variant ->
    tasks.named("runJustDireGroundStompState${variant}") { dependsOn tasks.named('prepareJustDireSmithing') }
}

