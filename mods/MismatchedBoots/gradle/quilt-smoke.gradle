// Minimal Quilt acceptance of the packaged Fabric artifact, not a third production module.
// Launcher libraries pinned from https://meta.quiltmc.org/v3/versions/loader/26.1.2/0.31.0-beta.4
def modPath = mismatchedModProject.path

def fixtureFileOperations = objects.newInstance(FixtureFileOperations).files
def testBuildDirectory = layout.buildDirectory
def productionArchive = project("${modPath}:Fabric").tasks.named('jar').flatMap { it.archiveFile }
def gameTestOutput = sourceSets.gametest.output
def gameRuntime = sourceSets.gametest.runtimeClasspath
def runBoundedGradleTask = rootProject.ext.runBoundedGradleTask
def quiltRunDirectory = testBuildDirectory.dir('run/quiltSmoke')
def report = testBuildDirectory.file('reports/gametest/quilt-smoke.xml')
def quiltVersion = '0.31.0-beta.4'

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Quilt'
                url = 'https://maven.quiltmc.org/repository/release/'
            }
        }
        filter { includeGroup('org.quiltmc') }
    }
}
configurations {
    quiltSmokeLoader {
        canBeConsumed = false
        canBeResolved = true
    }
}
dependencies {
    quiltSmokeLoader("org.quiltmc:quilt-loader:${quiltVersion}@jar") { transitive = false }
    quiltSmokeLoader 'org.quiltmc:quilt-json5:1.0.4+final'
    quiltSmokeLoader 'org.quiltmc:quilt-config:1.3.3'
    quiltSmokeLoader 'net.fabricmc:sponge-mixin:0.17.4+mixin.0.8.7'
    ['asm', 'asm-analysis', 'asm-commons', 'asm-tree', 'asm-util'].each {
        quiltSmokeLoader "org.ow2.asm:${it}:9.10.1"
    }
}
def quiltLibraries = configurations.quiltSmokeLoader
def fixtureJar = tasks.register('quiltSmokeFixtureJar', Jar) {
    archiveClassifier = 'quilt-smoke-fixture'
    from gameTestOutput
}
def prepare = tasks.register('prepareQuiltSmoke', Delete) {
    dependsOn "${modPath}:Fabric:jar", fixtureJar
    delete quiltRunDirectory, report
    doLast {
        def directory = quiltRunDirectory.get().asFile
        directory.mkdirs()
        fixtureFileOperations.copy {
            from productionArchive, fixtureJar.flatMap { it.archiveFile }
            into new File(directory, 'mods')
        }
        new File(directory, 'eula.txt').text = 'eula=true\n'
        new File(directory, 'server.properties').text = 'online-mode=false\nmax-tick-time=-1\n'
    }
}
tasks.register('runQuiltSmoke', JavaExec) {
    dependsOn prepare
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    mainClass = 'org.quiltmc.loader.impl.launch.knot.KnotServer'
    workingDir quiltRunDirectory
    // Never put Fabric Loader or its ASM/Mixin versions beside Quilt's launcher.
    classpath = files((gameRuntime - gameTestOutput).filter { file ->
        file != productionArchive.get().asFile
                && !(file.name ==~ /^(fabric-loader|sponge-mixin|asm(?:-analysis|-commons|-tree|-util)?)-.*\.jar$/)
    }, quiltLibraries)
    systemProperty 'loader.development', 'true'
    systemProperty 'loader.noGui', 'true'
    systemProperty 'fabric-api.gametest', 'true'
    systemProperty 'fabric-api.gametest.filter', 'mismatchedboots-test:mismatched_workbench_game_tests_*'
    systemProperty 'fabric-api.gametest.report-file', report.get().asFile.absolutePath
    jvmArgs '-Xmx1G'
    args '--nogui'
}
tasks.register('verifyQuiltSmoke') {
    group = 'verification'
    description = 'Runs the packaged Fabric mod on real Quilt Loader: startup and Workbench transactions.'
    dependsOn "${modPath}:Fabric:jar", fixtureJar
    doLast {
        def processLog = testBuildDirectory.file('reports/quilt-smoke/process.log').get().asFile
        runBoundedGradleTask("${modPath}:RuntimeTests:Fabric:runQuiltSmoke", processLog, 240)
        def parser = javax.xml.parsers.DocumentBuilderFactory.newInstance()
        parser.setFeature('http://apache.org/xml/features/disallow-doctype-decl', true)
        def document = parser.newDocumentBuilder().parse(report.get().asFile)
        def cases = document.getElementsByTagName('testcase')
        if (cases.length == 0 || document.getElementsByTagName('failure').length != 0
                || document.getElementsByTagName('error').length != 0
                || document.getElementsByTagName('skipped').length != 0) {
            throw new GradleException("Quilt smoke did not exercise successful gameplay: ${report.get().asFile}")
        }
        (0..<cases.length).each { index ->
            if (!cases.item(index).getAttribute('name').startsWith(
                    'mismatchedboots-test:mismatched_workbench_game_tests_')) {
                throw new GradleException('Quilt smoke executed an unexpected fixture')
            }
        }
        if (!processLog.text.contains("with Quilt Loader ${quiltVersion}")) {
            throw new GradleException("The smoke must run real Quilt Loader ${quiltVersion}; see ${processLog}")
        }
        logger.lifecycle("Quilt ${quiltVersion}: ${cases.length} Workbench gameplay cases passed")
    }
}
