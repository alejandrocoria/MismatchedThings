plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    accessTransformers.from(file('src/main/resources/META-INF/accesstransformer.cfg'))
}
neoForge.addModdingDependenciesTo(sourceSets.test)

dependencies {
    // Optional viewer APIs are never bundled or required for ordinary play.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-api:${rei_version}"
    compileOnly "dev.architectury:architectury:${architectury_version}"
    compileOnly 'me.shedaniel.cloth:basic-math:0.6.1'
    compileOnly "net.fabricmc:fabric-loader:${fabric_loader_version}"
    api "com.electronwill.night-config:core:${nightconfig_version}"
    api "com.electronwill.night-config:toml:${nightconfig_version}"
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    workingDir layout.buildDirectory.dir('test-work')
    doFirst { workingDir.mkdirs() }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
