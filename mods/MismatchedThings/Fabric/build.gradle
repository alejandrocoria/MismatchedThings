plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

base.archivesName = "mismatchedthings-${minecraft_version}-fabric"

// Loom inspects project dependencies' source resources before processResources runs.
sourceSets.main.resources.srcDir project(':MismatchedThings:Common').file('src/main/resources')

configurations.create('workbenchElements') {
    canBeConsumed = true
    canBeResolved = false
    outgoing.capability("${group}:mismatchedthings-fabric:${version}")
    outgoing.artifact(tasks.named('jar'))
}

dependencies {
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_version}"
    compileOnly "dev.architectury:architectury-fabric:${architectury_version}"
    compileOnly "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    include(implementation("com.electronwill.night-config:core:${nightconfig_version}"))
    include(implementation("com.electronwill.night-config:toml:${nightconfig_version}"))
}

loom {
    accessWidenerPath.set(project(':MismatchedThings:Common').file('src/main/resources/mismatchedthings.accesswidener'))
    mixin { useLegacyMixinAp = false }
    runs.configureEach { ideConfigGenerated(false) }
}

jar {
    from(rootProject.file('LICENSE'))
    manifest.attributes('Automatic-Module-Name': 'games.alejandrocoria.mismatchedthings.fabric')
}
