plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

base.archivesName = "mismatchedthings-${minecraft_version}-neoforge"

dependencies {
    // REI's common API includes Fabric environment annotations, even on NeoForge.
    compileOnly "net.fabricmc:fabric-loader:${fabric_loader_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}"
    compileOnly "dev.architectury:architectury-neoforge:${architectury_version}"
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    def wearExport = providers.gradleProperty('justDireArmorWearTransformedClass')
    if (wearExport.isPresent()) {
        def exported = rootProject.file(wearExport.get())
        inputs.files(exported, new File(exported.parentFile, 'WrapperBefore-CommonHooks.class'),
                new File(exported.parentFile, 'WrapperAfter-CommonHooks.class'))
        systemProperty 'mismatchedthings.test.justDireArmorWearTransformedClass', exported.absolutePath
    }
}

configurations.create('workbenchElements') {
    canBeConsumed = true
    canBeResolved = false
    outgoing.capability("${group}:mismatchedthings-neoforge:${version}")
    outgoing.artifact(tasks.named('jar'))
}

neoForge {
    version = neoforge_version
    dependencies {
        implementation "com.electronwill.night-config:core:${nightconfig_version}"
        implementation "com.electronwill.night-config:toml:${nightconfig_version}"
        jarJar "com.electronwill.night-config:core:[${nightconfig_version}]"
        jarJar "com.electronwill.night-config:toml:[${nightconfig_version}]"
    }
    accessTransformers.from(project(':MismatchedThings:Common').file('src/main/resources/META-INF/accesstransformer.cfg'))
    mods {
        mismatchedthings { sourceSet sourceSets.main }
    }
    unitTest {
        enable()
        testedMod = mods.mismatchedthings
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('jarJar')
}

jar {
    from(rootProject.file('LICENSE'))
    manifest.attributes('Automatic-Module-Name': 'games.alejandrocoria.mismatchedthings.neoforge')
}
