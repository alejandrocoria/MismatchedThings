plugins {
    // see https://fabricmc.net/develop/ for new versions
    id 'net.fabricmc.fabric-loom' version '1.16.3' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.141' apply false
}

// Explicit family verification conveniences; publication belongs to each mod.
['prepareTestModArtifacts', 'verifyTestModArtifacts', 'verifyPackagedDependencies',
 'verifyPackagedDependencyChecks', 'verifyLoaderServerStartup', 'verifyLoaderNetworking'].each { name ->
    tasks.register(name) {
        group = 'verification'
        description = "Runs MismatchedBoots' ${name} verification."
        dependsOn(":MismatchedBoots:${name}")
    }
}
