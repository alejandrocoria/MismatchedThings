def betterXCompatibilityCases = [
        [suffix: 'Enabled', enabled: true],
        [suffix: 'Disabled', enabled: false]
]
def createFlyServerRunDirectory =
        layout.buildDirectory.dir('run/createFlyCharacterizationServer')
def createFlyClientRunDirectory =
        layout.buildDirectory.dir('run/createFlyCharacterizationClient')
def createFlyCharacterizationReport =
        layout.buildDirectory.file('reports/gametest/create-fly-characterization.xml')

def advancedNetheriteTestJar = tasks.register('advancedNetheriteTestJar', Jar) {
    archiveClassifier = 'advanced-netherite-test'
