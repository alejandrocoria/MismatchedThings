plugins {
    id 'multiloader-common'
    id 'net.fabricmc.fabric-loom'
}

base.archivesName = "mismatchedboots-runtime-test-fabric"

evaluationDependsOn(':Fabric')

// Resolve project-owned services/providers during configuration, not from Task.project in actions.
def fixtureFileOperations = objects.newInstance(FixtureFileOperations).files
def fixtureBuildDirectory = layout.buildDirectory
def productionArchive = project(':Fabric').tasks.named('jar').flatMap { it.archiveFile }
def runBoundedGradleTask = rootProject.ext.runBoundedGradleTask

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    compileOnly files(project(':Fabric').sourceSets.main.output)
    compileOnly files(project(':Fabric').sourceSets.main.compileClasspath)
    testImplementation files(productionArchive)
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Loader-local reflection regressions use fake optional APIs, not a running game.
tasks.named('test', Test) {
    useJUnitPlatform()
}

configurations {
    advancedNetheriteFabric {
        canBeConsumed = false
        canBeResolved = true
    }
    betterEndFabric {
        canBeConsumed = false
        canBeResolved = true
    }
    betterXFabric {
        extendsFrom betterEndFabric
        canBeConsumed = false
        canBeResolved = true
    }
    createFlyFabric {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    // Advanced Netherite 2.4.1 Fabric; https://modrinth.com/mod/CFX9ftUJ/version/vudH2Rjv
    advancedNetheriteFabric('maven.modrinth:CFX9ftUJ:vudH2Rjv') {
        transitive = false
    }
    // Better End 26.101.2; https://modrinth.com/mod/gc8OEnCC/version/tBdZGZeX
    betterEndFabric('maven.modrinth:gc8OEnCC:tBdZGZeX') {
        transitive = false
    }
    // Better Nether; https://modrinth.com/mod/MpzVLzy5/version/gDLNJy17
    betterXFabric('maven.modrinth:MpzVLzy5:gDLNJy17') {
        transitive = false
    }
    // BCLib 26.101.2; https://modrinth.com/mod/BgNRHReB/version/vBV7w4o0
    betterEndFabric('maven.modrinth:BgNRHReB:vBV7w4o0') {
        transitive = false
    }
    // WorldWeaver (Wover) 26.101.2; https://modrinth.com/mod/RiN8rDVs/version/MSzkHfJp
    betterEndFabric('maven.modrinth:RiN8rDVs:MSzkHfJp') {
        transitive = false
    }
    // Create Fly 6.0.9-4; https://modrinth.com/mod/dKvj0eNn/version/wV5IQLKg
    createFlyFabric('maven.modrinth:dKvj0eNn:wV5IQLKg') {
        transitive = false
    }
}

sourceSets {
    networkTest {
        java.srcDir rootProject.file('RuntimeTests/Common/src/main/java')
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath - sourceSets.main.output
    }
    advancedNetheriteTest {
        java.srcDir rootProject.file('RuntimeTests/AdvancedNetherite/src/main/java')
        compileClasspath += sourceSets.main.compileClasspath
        compileClasspath += files(project(':Fabric').sourceSets.main.output)
        compileClasspath += configurations.advancedNetheriteFabric
        runtimeClasspath += output + compileClasspath
    }
    betterXCompatibilityTest {
        compileClasspath += sourceSets.main.compileClasspath
        compileClasspath += files(project(':Fabric').sourceSets.main.output)
        runtimeClasspath += output + compileClasspath
    }
    createFlyCompatibilityTest {
        compileClasspath += sourceSets.main.compileClasspath
        compileClasspath += files(project(':Fabric').sourceSets.main.output)
        compileClasspath += configurations.createFlyFabric
        runtimeClasspath += output + compileClasspath
    }
}

loom {
    def aw = project(':Common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        useLegacyMixinAp = false
    }
    runs {
        client {
            client()
            ideConfigGenerated(false)
        }
        server {
            server()
            ideConfigGenerated(false)
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "${mod_id}-test"
        enableGameTests = true
        enableClientGameTests = true
        // Loom otherwise wires client EULA preparation into every launch,
        // including network runs, and deletes the client GameTest directory.
        eula = false
        clearRunDirectory = true
        username = "MBTest"
    }
}

// This project's main source set is intentionally empty; only test mods run here.
sourceSets.gametest.runtimeClasspath -= sourceSets.main.output

// Optional real-viewer regressions are separate from the clean core client suite.
sourceSets {
