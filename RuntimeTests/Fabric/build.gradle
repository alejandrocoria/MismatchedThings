dependencies {
    gametestRuntimeOnly files(project(':Fabric').tasks.named('jar').flatMap { it.archiveFile })
}

def networkTestPort = providers.gradleProperty('networkTestPort').getOrElse('25575')
def networkTestMarkers = providers.gradleProperty('networkTestMarkers')
        .getOrElse(layout.buildDirectory.dir('markers').get().asFile.absolutePath)

loom {
    mods {
        mismatchedboots_runtime_test {
            sourceSet sourceSets.networkTest
        }
    }
    runs {
        networkTestServer {
            server()
            source('networkTest')
            setConfigName('Fabric Network Acceptance Server')
            ideConfigGenerated(false)
            runDir('build/run/server')
            property('mismatchedboots.runtimetest.markers', networkTestMarkers)
            property('mismatchedboots.runtimetest.loader', 'fabric')
            property('mismatchedboots.runtimetest.stopAfterReady',
                    providers.gradleProperty('networkTestStopAfterReady').getOrElse('false'))
            vmArg('-Xmx1G')
        }
        networkTestClient {
            client()
            source('networkTest')
            setConfigName('Fabric Network Acceptance Client')
            ideConfigGenerated(false)
            runDir('build/run/client')
            property('mismatchedboots.runtimetest.markers', networkTestMarkers)
            property('mismatchedboots.runtimetest.loader', 'fabric')
            property('mismatchedboots.test.hideClientWindow', 'true')
            programArgs('--quickPlayMultiplayer', "127.0.0.1:${networkTestPort}")
            vmArg('-Xmx1G')
        }
    }
}
