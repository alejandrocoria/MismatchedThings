tasks.register('verifyBetterEndAdapterSpike') {
    group = 'verification'
    description = 'Proves the guarded Better End 26.201.2 MobEffectApplier adapter without shipping it.'
    dependsOn(':Fabric:jar', betterEndSpikeTestJar)
    doLast {
        def presentLog = layout.buildDirectory.file(
                'reports/betterend-spike/fabric-present-process.log').get().asFile
        rootProject.ext.runBoundedGradleTask(
                ':RuntimeTests:Fabric:runBetterEndAdapterPresent', presentLog, 300)
        if (!betterEndPresentReport.get().asFile.isFile()) {
            throw new GradleException("Better End present GameTest report is missing; see ${presentLog}")
        }

        def absentLog = layout.buildDirectory.file(
                'reports/betterend-spike/fabric-absent-process.log').get().asFile
        rootProject.ext.runBoundedGradleTask(
                ':RuntimeTests:Fabric:runBetterEndAdapterAbsent', absentLog, 180)
        if (!betterEndAbsentReport.get().asFile.isFile()) {
            throw new GradleException("Better End absent GameTest report is missing; see ${absentLog}")
        }

        def productionJar = project(':Fabric').tasks.named('jar').get().archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(productionJar)
        try {
            def embeddedBetterEnd = zip.entries().findAll { entry ->
                def name = entry.name.toLowerCase(Locale.ROOT)
                name.startsWith('org/betterx/')
                        || name.contains('better-end')
                        || name.contains('betterend')
                        || name.contains('bclib')
                        || name.contains('worldweaver')
            }
            if (!embeddedBetterEnd.isEmpty()) {
                throw new GradleException("Production Fabric JAR embeds Better End artifacts: ${embeddedBetterEnd}")
            }
            def descriptor = zip.getInputStream(zip.getEntry('fabric.mod.json')).getText('UTF-8')
            if (descriptor.contains('betterend') || descriptor.contains('bclib') || descriptor.contains('wover')) {
                throw new GradleException('Production Fabric metadata unexpectedly requires Better End')
            }
        } finally {
            zip.close()
        }
    }
}

