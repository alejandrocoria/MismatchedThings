plugins {
    id 'multiloader-common'
    id 'net.fabricmc.fabric-loom'
}

base.archivesName = "mismatchedboots-runtime-test-fabric"

evaluationDependsOn(':Fabric')

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    compileOnly files(project(':Fabric').sourceSets.main.output)
    compileOnly files(project(':Fabric').sourceSets.main.compileClasspath)
}

configurations {
    advancedNetheriteFabric {
        canBeConsumed = false
        canBeResolved = true
    }
    betterEndFabric {
        canBeConsumed = false
        canBeResolved = true
    }
    betterXFabric {
        extendsFrom betterEndFabric
        canBeConsumed = false
        canBeResolved = true
    }
    createFlyFabric {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    advancedNetheriteFabric('maven.modrinth:CFX9ftUJ:5lXHbz4w') {
        transitive = false
    }
    betterEndFabric('maven.modrinth:gc8OEnCC:VD4qwVUF') {
        transitive = false
    }
    betterXFabric('maven.modrinth:MpzVLzy5:iBR9QMPF') {
        transitive = false
    }
    betterEndFabric('maven.modrinth:BgNRHReB:7BfGRji6') {
        transitive = false
    }
    betterEndFabric('maven.modrinth:RiN8rDVs:GHdiOIsp') {
        transitive = false
    }
    createFlyFabric('maven.modrinth:dKvj0eNn:phlsMPgT') {
        transitive = false
    }
}

sourceSets {
    networkTest {
        java.srcDir rootProject.file('RuntimeTests/Common/src/main/java')
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath - sourceSets.main.output
    }
    advancedNetheriteTest {
        java.srcDir rootProject.file('RuntimeTests/AdvancedNetherite/src/main/java')
        compileClasspath += sourceSets.main.compileClasspath
        compileClasspath += files(project(':Fabric').sourceSets.main.output)
        compileClasspath += configurations.advancedNetheriteFabric
        runtimeClasspath += output + compileClasspath
    }
    betterXCompatibilityTest {
        compileClasspath += sourceSets.main.compileClasspath
        compileClasspath += files(project(':Fabric').sourceSets.main.output)
        runtimeClasspath += output + compileClasspath
    }
    createFlyCharacterizationTest {
        compileClasspath += sourceSets.main.compileClasspath
        compileClasspath += files(project(':Fabric').sourceSets.main.output)
        compileClasspath += configurations.createFlyFabric
        runtimeClasspath += output + compileClasspath
    }
}

loom {
    def aw = project(':Common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        useLegacyMixinAp = false
    }
    runs {
        client {
            client()
            ideConfigGenerated(false)
        }
        server {
            server()
            ideConfigGenerated(false)
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "${mod_id}-test"
        enableGameTests = true
        enableClientGameTests = true
        // Loom otherwise wires client EULA preparation into every launch,
        // including network runs, and deletes the client GameTest directory.
        eula = false
        clearRunDirectory = true
        username = "MBTest"
    }
}

// This project's main source set is intentionally empty; only test mods run here.
sourceSets.gametest.runtimeClasspath -= sourceSets.main.output

tasks.register('acceptGameTestEula') {
    dependsOn tasks.named('deleteGameTestRunDir')
    doLast {
        def runDirectory = layout.buildDirectory.dir('run/clientGameTest').get().asFile
        runDirectory.mkdirs()
        new File(runDirectory, 'eula.txt').text = 'eula=true\n'
    }
}

tasks.named('runClientGameTest') {
    dependsOn tasks.named('acceptGameTestEula')
}

def persistenceRestartToken = UUID.randomUUID().toString()

loom {
    runs {
        persistenceWrite {
            inherit server
            property("fabric-api.gametest")
            property("fabric-api.gametest.filter",
                    "mismatchedboots-test:persistence_game_tests_restart_round_trip_uses_the_dedicated_two_process_harness")
            property(
                    "fabric-api.gametest.report-file",
                    layout.buildDirectory.file('reports/gametest/persistence-write.xml').get().asFile.absolutePath)
            property("mismatchedboots.test.persistence.restartMode", "write")
            property("mismatchedboots.test.persistence.restartToken", persistenceRestartToken)
            runDir("build/run/persistenceGameTest")
            source("gametest")
        }
        persistenceRead {
            inherit server
            property("fabric-api.gametest")
            property("fabric-api.gametest.filter",
                    "mismatchedboots-test:persistence_game_tests_restart_round_trip_uses_the_dedicated_two_process_harness")
            property(
                    "fabric-api.gametest.report-file",
                    layout.buildDirectory.file('reports/gametest/persistence-read.xml').get().asFile.absolutePath)
            property("mismatchedboots.test.persistence.restartMode", "read")
            property("mismatchedboots.test.persistence.restartToken", persistenceRestartToken)
            runDir("build/run/persistenceGameTest")
            source("gametest")
        }
        attributeRules {
            inherit server
            property("fabric-api.gametest")
            property(
                    "fabric-api.gametest.report-file",
                    layout.buildDirectory.file('reports/gametest/attribute-rules.xml').get().asFile.absolutePath)
            property("mismatchedboots.test.attributeRules", "true")
            runDir("build/run/attributeRulesGameTest")
            source("gametest")
        }
        componentRules {
