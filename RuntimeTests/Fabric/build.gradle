}

def betterXCompatibilityTestJar = tasks.register('betterXCompatibilityTestJar', Jar) {
    archiveClassifier = 'betterx-compatibility-test'
    from sourceSets.betterXCompatibilityTest.output
}

def createFlyCharacterizationTestJar = tasks.register('createFlyCharacterizationTestJar', Jar) {
    archiveClassifier = 'create-fly-characterization-test'
    from sourceSets.createFlyCharacterizationTest.output
}

