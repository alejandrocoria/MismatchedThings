tasks.register('prepareAdvancedNetheriteCompatibility', Delete) {
    dependsOn(':Fabric:jar', advancedNetheriteTestJar)
    delete advancedNetheriteRunDirectory, advancedNetheriteReport
    doLast {
        def runDirectory = advancedNetheriteRunDirectory.get().asFile
        def modsDirectory = new File(runDirectory, 'mods')
        modsDirectory.mkdirs()
        layout.buildDirectory.dir('classes/java/main').get().asFile.mkdirs()
        layout.buildDirectory.dir('resources/main').get().asFile.mkdirs()
        copy {
            from(project(':Fabric').tasks.named('jar').flatMap { it.archiveFile })
            from(advancedNetheriteTestJar.flatMap { it.archiveFile })
            from(configurations.advancedNetheriteFabric)
            into(modsDirectory)
        }
        new File(runDirectory, 'eula.txt').text = 'eula=true\n'
        new File(runDirectory, 'server.properties').text = '''online-mode=false
max-tick-time=-1
'''
    }
}

tasks.named('runAdvancedNetheriteCompatibility') {
    dependsOn tasks.named('prepareAdvancedNetheriteCompatibility')
}

tasks.register('verifyAdvancedNetheriteCompatibility') {
    group = 'verification'
    description = 'Runs bounded Fabric acceptance against Advanced Netherite 2.4.2.'
    dependsOn(':Fabric:jar', advancedNetheriteTestJar)
    doLast {
        def processLog = layout.buildDirectory.file(
                'reports/advanced-netherite/fabric-process.log').get().asFile
        rootProject.ext.runBoundedGradleTask(
                ':RuntimeTests:Fabric:runAdvancedNetheriteCompatibility', processLog, 240)
        if (!advancedNetheriteReport.get().asFile.isFile()) {
            throw new GradleException("Fabric Advanced Netherite GameTest report is missing; see ${processLog}")
        }
    }
}

def registerBetterXPreparation = { String taskName, def runDirectory, def report, boolean piglinIgnore ->
    tasks.register(taskName, Delete) {
        dependsOn(':Fabric:jar', betterXTestJar)
        delete runDirectory, report
        doLast {
            def targetDirectory = runDirectory.get().asFile
            def modsDirectory = new File(targetDirectory, 'mods')
            modsDirectory.mkdirs()
            layout.buildDirectory.dir('classes/java/main').get().asFile.mkdirs()
            layout.buildDirectory.dir('resources/main').get().asFile.mkdirs()
            copy {
                from(project(':Fabric').tasks.named('jar').flatMap { it.archiveFile })
                from(betterXTestJar.flatMap { it.archiveFile })
                from(configurations.betterXFabric)
                into(modsDirectory)
            }
            new File(targetDirectory, 'eula.txt').text = 'eula=true\n'
            new File(targetDirectory, 'server.properties').text = '''online-mode=false
max-tick-time=-1
'''
            def configFile = new File(targetDirectory, 'config/betternether/default_game_rules.json')
            configFile.parentFile.mkdirs()
            configFile.text = """{
  \"create_version\": \"26.201.2\",
  \"egg_plant\": {
    \"mob_damage\": true,
    \"player_damage\": true
  },
  \"piglin\": {
    \"ignore_nether_armor\": ${piglinIgnore},
    \"wear_nether_armor\": true
  },
  \"modify_version\": \"26.201.2\"
}
"""
        }
    }
}

