    dependsOn(':Fabric:jar', createFlyCharacterizationTestJar)
    delete createFlyServerRunDirectory, createFlyCharacterizationReport
    doLast {
        def runDirectory = createFlyServerRunDirectory.get().asFile
        def modsDirectory = new File(runDirectory, 'mods')
