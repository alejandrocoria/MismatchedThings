tasks.register('verifyBetterEndTagProjectionSpike') {
    group = 'verification'
    description = 'Audits and proves exact any-source projection for Better End 26.201.2 Crystalite armor.'
    dependsOn(':Fabric:jar', betterEndTagSpikeTestJar)
    doLast {
        def betterEndArtifact = configurations.betterEndFabric.resolvedConfiguration.resolvedArtifacts.find {
            it.moduleVersion.id.group == 'maven.modrinth' &&
                    it.moduleVersion.id.name == 'gc8OEnCC' &&
                    it.moduleVersion.id.version == 'VD4qwVUF'
        }
        def betterEndJar = betterEndArtifact?.file
        if (betterEndJar == null) {
            throw new GradleException('Exact Better End artifact is missing from the tag-consumer audit')
        }

        def owner = 'org/betterx/betterend/registry/EndTags'
        def field = 'CRYSTALITE_SET'
        def references = []
        def zip = new java.util.zip.ZipFile(betterEndJar)
        try {
            zip.entries().each { entry ->
                if (entry.name.endsWith('.class')) {
                    byte[] bytes = zip.getInputStream(entry).readAllBytes()
                    def constants = new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                    if (constants.contains(owner) && constants.contains(field)) {
                        references.add(entry.name)
                    }
                }
            }
        } finally {
            zip.close()
        }
        def expectedReferences = [
                'org/betterx/betterend/client/BetterEndClient.class',
                'org/betterx/betterend/item/CrystaliteArmor.class',
                'org/betterx/betterend/registry/EndTags.class',
                'org/betterx/betterend/registry/item/EndEquipmentItems.class'
        ]
        if (references.sort() != expectedReferences.sort()) {
            throw new GradleException("Unexpected Crystalite tag consumers: ${references}")
        }

        def processLog = layout.buildDirectory.file(
                'reports/betterend-tag-spike/fabric-process.log').get().asFile
        rootProject.ext.runBoundedGradleTask(
                ':RuntimeTests:Fabric:runBetterEndTagProjection', processLog, 300)
        if (!betterEndTagReport.get().asFile.isFile()) {
            throw new GradleException("Better End tag-projection GameTest report is missing; see ${processLog}")
        }
    }
}

def betterNetherSpikePreparations = [:]
betterNetherSpikeCases.each { spec ->
    def reportStem = spec.suffix.replaceAll(/([a-z])([A-Z])/, '$1-$2').toLowerCase(Locale.ROOT)
    def runDirectory = layout.buildDirectory.dir("run/betterNetherAdapter${spec.suffix}")
    def report = layout.buildDirectory.file(
            "reports/gametest/betternether-adapter-${reportStem}.xml")
    def preparation = tasks.register("prepareBetterNetherAdapter${spec.suffix}", Delete) {
        dependsOn(':Fabric:jar', betterNetherSpikeTestJar)
        delete runDirectory, report
        doLast {
            def targetDirectory = runDirectory.get().asFile
            def modsDirectory = new File(targetDirectory, 'mods')
            modsDirectory.mkdirs()
            layout.buildDirectory.dir('classes/java/main').get().asFile.mkdirs()
            layout.buildDirectory.dir('resources/main').get().asFile.mkdirs()
            copy {
                from(project(':Fabric').tasks.named('jar').flatMap { it.archiveFile })
                from(betterNetherSpikeTestJar.flatMap { it.archiveFile })
                if (spec.present) {
                    from(configurations.betterXFabric)
                }
                into(modsDirectory)
            }
            new File(targetDirectory, 'eula.txt').text = 'eula=true\n'
            new File(targetDirectory, 'server.properties').text = '''online-mode=false
max-tick-time=-1
'''
            if (spec.present) {
                def configFile = new File(
                        targetDirectory, 'config/betternether/default_game_rules.json')
                configFile.parentFile.mkdirs()
                configFile.text = """{
  \"create_version\": \"26.201.2\",
  \"egg_plant\": {
    \"mob_damage\": true,
    \"player_damage\": true
  },
  \"piglin\": {
    \"ignore_nether_armor\": ${spec.enabled},
    \"wear_nether_armor\": true
  },
  \"modify_version\": \"26.201.2\"
}
"""
            }
        }
    }
    betterNetherSpikePreparations[spec.suffix] = [
            preparation: preparation,
            report: report,
            reportStem: reportStem
    ]
    tasks.named("runBetterNetherAdapter${spec.suffix}") {
        dependsOn preparation
    }
}

tasks.register('verifyBetterNetherAdapterSpike') {
    group = 'verification'
    description = 'Proves the config-faithful Better Nether 26.201.2 piglin adapter in both mixin orders.'
    dependsOn(':Fabric:jar', betterNetherSpikeTestJar)
    doLast {
        def betterNetherArtifact = configurations.betterXFabric.resolvedConfiguration.resolvedArtifacts.find {
            it.moduleVersion.id.group == 'maven.modrinth' &&
                    it.moduleVersion.id.name == 'MpzVLzy5' &&
                    it.moduleVersion.id.version == 'iBR9QMPF'
        }
        if (betterNetherArtifact == null) {
            throw new GradleException('Exact Better Nether artifact is missing from the piglin adapter audit')
        }

        betterNetherSpikeCases.each { spec ->
            def details = betterNetherSpikePreparations[spec.suffix]
            def processLog = layout.buildDirectory.file(
                    "reports/betternether-spike/fabric-${details.reportStem}-process.log").get().asFile
            rootProject.ext.runBoundedGradleTask(
                    ":RuntimeTests:Fabric:runBetterNetherAdapter${spec.suffix}",
                    processLog,
                    spec.present ? 300 : 180)
            if (!details.report.get().asFile.isFile()) {
                throw new GradleException(
                        "Better Nether ${spec.suffix} GameTest report is missing; see ${processLog}")
            }
        }

        def productionJar = project(':Fabric').tasks.named('jar').get().archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(productionJar)
        try {
            def embeddedBetterNether = zip.entries().findAll { entry ->
                def name = entry.name.toLowerCase(Locale.ROOT)
                name.startsWith('org/betterx/betternether/')
                        || name.contains('betternether')
            }
            if (!embeddedBetterNether.isEmpty()) {
                throw new GradleException(
                        "Production Fabric JAR embeds Better Nether artifacts: ${embeddedBetterNether}")
            }
            def descriptor = zip.getInputStream(zip.getEntry('fabric.mod.json')).getText('UTF-8')
            if (descriptor.contains('betternether')) {
                throw new GradleException(
                        'Production Fabric metadata unexpectedly requires Better Nether')
            }
        } finally {
            zip.close()
        }
    }
}

