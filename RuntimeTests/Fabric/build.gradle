tasks.named('runCreateFlyCharacterizationServer') {
    dependsOn tasks.named('prepareCreateFlyCharacterizationServer')
}

tasks.named('runCreateFlyCharacterizationClient') {
    dependsOn tasks.named('prepareCreateFlyCharacterizationClient')
}

tasks.register('verifyCreateFlyCharacterization') {
    group = 'verification'
    description = 'Verifies compatibility with the exact Create Fly 6.0.9-1 artifact.'
    dependsOn(':Fabric:jar', createFlyCharacterizationTestJar)
    doLast {
        def artifact = configurations.createFlyFabric.resolvedConfiguration.resolvedArtifacts.find {
            it.moduleVersion.id.group == 'maven.modrinth' &&
                    it.moduleVersion.id.name == 'dKvj0eNn' &&
                    it.moduleVersion.id.version == 'phlsMPgT'
        }
        def createFlyJar = artifact?.file
        if (createFlyJar == null) {
            throw new GradleException('Exact Create Fly artifact is missing')
        }

        def digest = java.security.MessageDigest.getInstance('SHA-256')
        def actualHash = createFlyJar.withInputStream { input ->
            byte[] buffer = new byte[8192]
            int count
            while ((count = input.read(buffer)) >= 0) {
                digest.update(buffer, 0, count)
            }
            digest.digest().encodeHex().toString().toUpperCase(Locale.ROOT)
        }
        def expectedHash = 'D9C6CB6116D5CAA1174A289ECD7D3CDD463CCEF6E8DB1249AB0BCFCD8C935870'
        if (actualHash != expectedHash) {
            throw new GradleException("Unexpected Create Fly artifact hash: ${actualHash}")
        }

        def classReferences = { java.util.zip.ZipFile zip, String owner ->
            def references = []
            zip.entries().each { entry ->
                if (entry.name.endsWith('.class')) {
                    byte[] bytes = zip.getInputStream(entry).readAllBytes()
                    def constants = new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                    if (constants.contains(owner)) {
                        references.add(entry.name)
                    }
                }
            }
            references.sort()
        }
        def zip = new java.util.zip.ZipFile(createFlyJar)
        try {
            def cardboardReferences = classReferences(
                    zip, 'com/zurrtum/create/content/equipment/armor/CardboardArmorHandler')
            def expectedCardboardReferences = [
                    'com/zurrtum/create/client/content/equipment/armor/CardboardArmorHandlerClient.class',
                    'com/zurrtum/create/client/content/equipment/armor/CardboardArmorStealthOverlay.class',
                    'com/zurrtum/create/client/mixin/ClientLevelMixin.class',
                    'com/zurrtum/create/content/equipment/armor/CardboardArmorHandler.class',
                    'com/zurrtum/create/content/kinetics/belt/transport/BeltMovementHandler.class',
                    'com/zurrtum/create/mixin/EntityMixin.class',
                    'com/zurrtum/create/mixin/LivingEntityMixin.class',
                    'com/zurrtum/create/mixin/ServerLevelMixin.class'
            ].sort()
            if (cardboardReferences != expectedCardboardReferences) {
                throw new GradleException(
                        "Unexpected Cardboard helper consumers: ${cardboardReferences}")
            }

            def divingReferences = classReferences(
                    zip, 'com/zurrtum/create/content/equipment/armor/DivingBootsItem')
            def expectedDivingReferences = [
                    'com/zurrtum/create/AllCreativeModeTabs.class',
                    'com/zurrtum/create/AllItems.class',
                    'com/zurrtum/create/client/AllItemTooltips.class',
                    'com/zurrtum/create/client/mixin/ClientLevelMixin.class',
                    'com/zurrtum/create/content/equipment/armor/DivingBootsItem.class',
                    'com/zurrtum/create/content/kinetics/belt/BeltBlock.class',
                    'com/zurrtum/create/mixin/EntityMixin.class',
                    'com/zurrtum/create/mixin/LivingEntityMixin.class',
                    'com/zurrtum/create/mixin/ServerLevelMixin.class'
            ].sort()
            if (divingReferences != expectedDivingReferences) {
                throw new GradleException(
                        "Unexpected Diving Boots consumers: ${divingReferences}")
            }

            def beltEntry = zip.getEntry('com/zurrtum/create/content/kinetics/belt/BeltBlock.class')
            def beltConstants = new String(
                    zip.getInputStream(beltEntry).readAllBytes(),
                    java.nio.charset.StandardCharsets.ISO_8859_1)
            for (def required : [
                    'com/zurrtum/create/AllItems',
                    'CARDBOARD_BOOTS',
                    'com/zurrtum/create/content/equipment/armor/DivingBootsItem',
                    'isWornBy']) {
                if (!beltConstants.contains(required)) {
                    throw new GradleException("Create Fly BeltBlock lost ${required}")
                }
            }

            def tooltipEntry = zip.getEntry('com/zurrtum/create/client/mixin/ItemStackMixin.class')
            def tooltipConstants = new String(
                    zip.getInputStream(tooltipEntry).readAllBytes(),
                    java.nio.charset.StandardCharsets.ISO_8859_1)
            for (def required : [
                    'com/zurrtum/create/client/foundation/item/TooltipModifier',
                    'REGISTRY',
                    'modify']) {
                if (!tooltipConstants.contains(required)) {
                    throw new GradleException("Create Fly tooltip hook lost ${required}")
                }
            }
        } finally {
            zip.close()
        }

        def fabricJar = project(':Fabric').tasks.named('jar').get().archiveFile.get().asFile
        def fabricZip = new java.util.zip.ZipFile(fabricJar)
        try {
            def entries = fabricZip.entries().collect { it.name }
            for (def required : [
                    'mismatchedboots.createfly.mixins.json',
                    'games/alejandrocoria/mismatchedboots/compatibility/createfly/'
                            + 'CreateFlyMixinPlugin.class',
                    'games/alejandrocoria/mismatchedboots/mixin/compatibility/createfly/'
                            + 'CreateFlyCardboardArmorHandlerMixin.class',
                    'games/alejandrocoria/mismatchedboots/mixin/compatibility/createfly/'
                            + 'CreateFlyBeltBlockMixin.class',
                    'games/alejandrocoria/mismatchedboots/mixin/compatibility/createfly/'
                            + 'CreateFlyDivingBootsItemMixin.class']) {
                if (!entries.contains(required)) {
                    throw new GradleException("Fabric output is missing ${required}")
                }
            }
            if (entries.any { it.startsWith('com/zurrtum/create/') }) {
                throw new GradleException('Fabric output accidentally includes Create Fly classes')
            }
            if (entries.any {
                def lower = it.toLowerCase(Locale.ROOT)
                lower.endsWith('.jar')
                        && (lower.contains('create-fly') || lower.contains('dkvj0enn'))
            }) {
                throw new GradleException('Fabric output accidentally nests the Create Fly artifact')
            }
            if (entries.any {
                it.startsWith('games/alejandrocoria/mismatchedboots/runtimetest/createfly/')
            }) {
                throw new GradleException('Fabric output accidentally includes Create Fly test classes')
            }

            def metadataEntry = fabricZip.getEntry('fabric.mod.json')
            def metadata = new groovy.json.JsonSlurper().parse(
                    fabricZip.getInputStream(metadataEntry))
            for (def dependencyGroup : ['depends', 'recommends', 'suggests']) {
                if (metadata[dependencyGroup] instanceof Map
                        && metadata[dependencyGroup].containsKey('create')) {
                    throw new GradleException(
                            "Fabric metadata accidentally declares Create Fly in ${dependencyGroup}")
                }
            }
        } finally {
            fabricZip.close()
        }

        def serverLog = layout.buildDirectory.file(
                'reports/create-fly-characterization/fabric-server-process.log').get().asFile
        rootProject.ext.runBoundedGradleTask(
                ':RuntimeTests:Fabric:runCreateFlyCharacterizationServer', serverLog, 240)
        if (!createFlyCharacterizationReport.get().asFile.isFile()) {
            throw new GradleException(
                    "Create Fly characterization report is missing; see ${serverLog}")
        }

        def clientLog = layout.buildDirectory.file(
                'reports/create-fly-characterization/fabric-client-process.log').get().asFile
        rootProject.ext.runBoundedGradleTask(
                ':RuntimeTests:Fabric:runCreateFlyCharacterizationClient', clientLog, 300)
        def clientMarker = layout.buildDirectory.file(
                'run/createFlyCharacterizationClient/client-characterization.ok').get().asFile
        if (!clientMarker.isFile()
                || clientMarker.getText('UTF-8') != 'create-fly-characterization-passed\n') {
            throw new GradleException(
                    "Create Fly client characterization marker is missing; see ${clientLog}")
        }
    }
}

