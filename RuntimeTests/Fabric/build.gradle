tasks.register('verifyGameTestContextGuard') {
    group = 'verification'
    description = 'Proves a focused GameTest without its required fixture fails instead of passing a no-op.'
    dependsOn ':Fabric:jar', tasks.named('gametestClasses')
    doLast {
        // The child might fail before its preparation task; never accept an old negative report.
        fixtureFileOperations.delete { delete contextGuardReport }
        def log = fixtureBuildDirectory.file('context-guard/process.log').get().asFile
        boolean failed = false
        try {
            runBoundedGradleTask(':RuntimeTests:Fabric:runMissingGameTestContext', log, 120)
        } catch (GradleException expected) {
            failed = expected.message.contains('exited with 1;')
        }
        if (!failed || !contextGuardReport.get().asFile.isFile()) {
            throw new GradleException("Missing-context negative control did not fail as intended; see ${log}")
        }
        def parser = javax.xml.parsers.DocumentBuilderFactory.newInstance()
        parser.setFeature('http://apache.org/xml/features/disallow-doctype-decl', true)
        def document = parser.newDocumentBuilder().parse(contextGuardReport.get().asFile)
        def failures = document.getElementsByTagName('failure')
        if (document.getElementsByTagName('testcase').length != 1 || failures.length != 1
                || !failures.item(0).getAttribute('message').contains(
                        'Focused GameTest is missing its required context: mismatchedboots.test.componentRules')) {
            throw new GradleException("Missing-context run failed for an unexpected reason; see ${log}")
        }
        logger.lifecycle('Focused GameTest missing-context guard rejected the invalid run')
    }
}

