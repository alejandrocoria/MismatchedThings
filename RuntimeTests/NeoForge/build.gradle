    }
}

sourceSets {
    iceAndFireTideHead {
        // Only its own NeoForge modding dependencies, not main or FEET/production output.
        runtimeClasspath += output + compileClasspath
    }
    iceAndFireTideTest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        // Common is an IDE/compile dependency; gameplay still uses the packaged production mod.
        runtimeClasspath += output + (compileClasspath - project(':Common').sourceSets.main.output)
    }
    advancedNetheriteTest {
        java.srcDir rootProject.file('RuntimeTests/AdvancedNetherite/src/main/java')
        compileClasspath += sourceSets.main.compileClasspath
        compileClasspath += files(project(':NeoForge').sourceSets.main.output)
        compileClasspath += configurations.advancedNetheriteNeoForge
        runtimeClasspath += output + (compileClasspath - project(':Common').sourceSets.main.output)
    }
}

