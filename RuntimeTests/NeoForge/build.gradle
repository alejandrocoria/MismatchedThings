plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

base.archivesName = "mismatchedboots-runtime-test-neoforge"

evaluationDependsOn(':NeoForge')

dependencies {
    compileOnly files(project(':NeoForge').sourceSets.main.output)
}

configurations {
    advancedNetheriteNeoForge {
        canBeConsumed = false
        canBeResolved = true
    }
    journeyMapNeoForge {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    advancedNetheriteNeoForge('maven.modrinth:CFX9ftUJ:yvbzX6CA') {
        transitive = false
    }
    journeyMapNeoForge('maven.modrinth:lfHFW1mp:MYF1fYGU') {
        transitive = false
    }
}

sourceSets {
    advancedNetheriteTest {
        java.srcDir rootProject.file('RuntimeTests/AdvancedNetherite/src/main/java')
        compileClasspath += sourceSets.main.compileClasspath
        compileClasspath += files(project(':NeoForge').sourceSets.main.output)
        compileClasspath += configurations.advancedNetheriteNeoForge
        runtimeClasspath += output + compileClasspath
    }
}

sourceSets.main.java.srcDir rootProject.file('RuntimeTests/Common/src/main/java')

def networkTestPort = providers.gradleProperty('networkTestPort').getOrElse('25575')
def networkTestMarkers = providers.gradleProperty('networkTestMarkers')
        .getOrElse(layout.buildDirectory.dir('markers').get().asFile.absolutePath)
def geometryMarkers = layout.buildDirectory.dir('geometry-markers')
def geometryRunDirectory = layout.buildDirectory.dir('run/geometryClient')
def tooltipMarkers = layout.buildDirectory.dir('tooltip-markers')
def tooltipRunDirectory = layout.buildDirectory.dir('run/tooltipClient')
def advancedNetheriteMarkers = layout.buildDirectory.dir('advanced-netherite-markers')
def advancedNetheriteRunDirectory = layout.buildDirectory.dir('run/advancedNetheriteCompatibility')

neoForge {
    version = neoforge_version

    runs {
        networkTestServer {
            server()
            disableIdeRun()
            gameDirectory = project.file('build/run/server')
            programArgument('--nogui')
            systemProperty('mismatchedboots.runtimetest.markers', networkTestMarkers)
            systemProperty('mismatchedboots.runtimetest.loader', 'neoforge')
            systemProperty('mismatchedboots.runtimetest.stopAfterReady',
                    providers.gradleProperty('networkTestStopAfterReady').getOrElse('false'))
            jvmArgument('-Xmx1G')
        }
        networkTestClient {
            client()
            disableIdeRun()
            gameDirectory = project.file('build/run/client')
            systemProperty('mismatchedboots.runtimetest.markers', networkTestMarkers)
            systemProperty('mismatchedboots.runtimetest.loader', 'neoforge')
            systemProperty('mismatchedboots.test.hideClientWindow', 'true')
            systemProperty('mismatchedboots.runtimetest.dismissWarnings', 'true')
            programArgument('--quickPlayMultiplayer')
            programArgument("127.0.0.1:${networkTestPort}")
            jvmArgument('-Xmx1G')
        }
        geometryClient {
            client()
            disableIdeRun()
            gameDirectory = geometryRunDirectory.get().asFile
            systemProperty('mismatchedboots.runtimetest.markers', geometryMarkers.get().asFile.absolutePath)
            systemProperty('mismatchedboots.runtimetest.geometryTest', 'true')
            systemProperty('mismatchedboots.test.hideClientWindow', 'true')
            systemProperty('mismatchedboots.runtimetest.dismissWarnings', 'true')
            jvmArgument('-Xmx1G')
        }
        tooltipClient {
            client()
            disableIdeRun()
            gameDirectory = tooltipRunDirectory.get().asFile
            systemProperty('mismatchedboots.runtimetest.markers', tooltipMarkers.get().asFile.absolutePath)
            systemProperty('mismatchedboots.runtimetest.tooltipTest', 'true')
            systemProperty('mismatchedboots.test.hideClientWindow', 'true')
            systemProperty('mismatchedboots.runtimetest.dismissWarnings', 'true')
            jvmArgument('-Xmx1G')
        }
        advancedNetheriteCompatibility {
            server()
            disableIdeRun()
            gameDirectory = advancedNetheriteRunDirectory.get().asFile
            programArgument('--nogui')
            systemProperty('mismatchedboots.runtimetest.markers',
                    advancedNetheriteMarkers.get().asFile.absolutePath)
            systemProperty('mismatchedboots.runtimetest.advancedNetheriteTest', 'true')
            jvmArgument('-Xmx1G')
        }
    }

    mods {
        mismatchedboots_runtime_test {
            sourceSet sourceSets.main
        }
    }
}

neoForge.addModdingDependenciesTo(sourceSets.advancedNetheriteTest)

def advancedNetheriteTestJar = tasks.register('advancedNetheriteTestJar', Jar) {
    archiveClassifier = 'advanced-netherite-test'
    from sourceSets.advancedNetheriteTest.output
}

tasks.register('prepareAdvancedNetheriteCompatibility', Delete) {
    dependsOn(':NeoForge:jar', advancedNetheriteTestJar)
    delete advancedNetheriteMarkers, advancedNetheriteRunDirectory
    doLast {
        def runDirectory = advancedNetheriteRunDirectory.get().asFile
        def modsDirectory = new File(runDirectory, 'mods')
        modsDirectory.mkdirs()
        copy {
            from(project(':NeoForge').tasks.named('jar').flatMap { it.archiveFile })
            from(advancedNetheriteTestJar.flatMap { it.archiveFile })
            from(configurations.advancedNetheriteNeoForge)
            into(modsDirectory)
        }
        new File(runDirectory, 'eula.txt').text = 'eula=true\n'
        new File(runDirectory, 'server.properties').text = '''online-mode=false
max-tick-time=-1
'''
    }
}

tasks.named('runAdvancedNetheriteCompatibility') {
    dependsOn tasks.named('prepareAdvancedNetheriteCompatibility')
}

tasks.register('verifyAdvancedNetheriteCompatibility') {
    group = 'verification'
    description = 'Runs bounded NeoForge acceptance against Advanced Netherite 2.4.1.'
    dependsOn(':NeoForge:jar', advancedNetheriteTestJar)
    doLast {
        def processLog = layout.buildDirectory.file(
                'reports/advanced-netherite/neoforge-process.log').get().asFile
        rootProject.ext.runBoundedGradleTask(
                ':RuntimeTests:NeoForge:runAdvancedNetheriteCompatibility', processLog, 240)
        def markerDirectory = advancedNetheriteMarkers.get().asFile
        def failure = new File(markerDirectory, 'advanced-netherite-failure.txt')
        if (failure.isFile()) {
            throw new GradleException("NeoForge Advanced Netherite acceptance failed:\n${failure.text}")
        }
        def success = new File(markerDirectory, 'advanced-netherite-success.txt')
        if (!success.isFile() || success.text != 'neoforge\n') {
            throw new GradleException(
                    "NeoForge Advanced Netherite acceptance did not produce its success marker; see ${processLog}")
        }
    }
}

tasks.register('prepareGeometryClient') {
    dependsOn(':NeoForge:jar')
    doLast {
        delete(geometryMarkers)
        delete(geometryRunDirectory)

        def runDirectory = geometryRunDirectory.get().asFile
        def modsDirectory = new File(runDirectory, 'mods')
        modsDirectory.mkdirs()
        copy {
            from(project(':NeoForge').tasks.named('jar').flatMap { it.archiveFile })
            into(modsDirectory)
        }
        new File(runDirectory, 'options.txt').text = 'soundCategory_master:0.0\n'
        def configDirectory = new File(runDirectory, 'config')
        configDirectory.mkdirs()
        new File(configDirectory, 'fml.toml').text = 'earlyWindowControl = false\n'
    }
}

tasks.named('runGeometryClient') {
    dependsOn('prepareGeometryClient')
}

tasks.register('verifyGeometryCharacterization') {
    group = 'verification'
    description = 'Characterizes rotated item-model topology in a hidden and muted NeoForge client.'
    dependsOn('runGeometryClient')
    doLast {
        def markerDirectory = geometryMarkers.get().asFile
        def failure = new File(markerDirectory, 'geometry-client-failure.txt')
        if (failure.exists()) {
            throw new GradleException("NeoForge geometry characterization failed:\n${failure.text}")
        }
        def success = new File(markerDirectory, 'geometry-success.txt')
        def report = new File(markerDirectory, 'geometry-report.txt')
        if (!success.exists() || !report.exists()) {
            throw new GradleException('NeoForge geometry characterization did not produce its result markers')
        }
        logger.lifecycle("NeoForge geometry characterization:\n${report.text}")
    }
}

tasks.register('prepareTooltipClient') {
    dependsOn(':NeoForge:jar')
    doLast {
        delete(tooltipMarkers)
        delete(tooltipRunDirectory)

        def runDirectory = tooltipRunDirectory.get().asFile
        def modsDirectory = new File(runDirectory, 'mods')
        modsDirectory.mkdirs()
        copy {
            from(project(':NeoForge').tasks.named('jar').flatMap { it.archiveFile })
            into(modsDirectory)
        }
        new File(runDirectory, 'options.txt').text = 'soundCategory_master:0.0\n'
        def configDirectory = new File(runDirectory, 'config')
        configDirectory.mkdirs()
        new File(configDirectory, 'fml.toml').text = 'earlyWindowControl = false\n'
    }
}

tasks.named('runTooltipClient') {
    dependsOn('prepareTooltipClient')
}

tasks.register('verifyTooltipCharacterization') {
    group = 'verification'
    description = 'Characterizes NeoForge tooltip hooks in a hidden and muted client.'
    dependsOn('runTooltipClient')
    doLast {
        def markerDirectory = tooltipMarkers.get().asFile
        def failure = new File(markerDirectory, 'tooltip-client-failure.txt')
        if (failure.exists()) {
            throw new GradleException("NeoForge tooltip characterization failed:\n${failure.text}")
        }
        def success = new File(markerDirectory, 'tooltip-success.txt')
        def report = new File(markerDirectory, 'tooltip-report.txt')
        if (!success.exists() || !report.exists()) {
            throw new GradleException('NeoForge tooltip characterization did not produce its result markers')
        }
        logger.lifecycle("NeoForge tooltip characterization:\n${report.text}")
    }
}
