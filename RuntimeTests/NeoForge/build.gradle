dependencies {
    // Expose Common's source module to IDEs; NeoForge also compiles these classes into its own output.
    compileOnly(project(':Common')) {
        transitive = false
        capabilities {
            requireCapability "$group:$mod_id"
        }
    }
    compileOnly files(project(':NeoForge').sourceSets.main.output)
    compileOnly "mysticdrew:common-networking-neoforge:${common_networking_version}"
}

