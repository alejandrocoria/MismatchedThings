tasks.register('verifyJustDireRefunds') {
    group = 'verification'
    description = 'Verifies production conserved credits, guarded actual-break refunds and bounded foreign transformations.'
    dependsOn(':NeoForge:jar', tasks.named('jar'))
    doLast {
        def supported = justDireRefundVariants
        def variants = providers.gradleProperty('refundVariants').getOrElse(supported.join(',')).split(',')
        if (!variants.every { it in supported }) {
            throw new GradleException('Unknown production refund variant')
        }
        variants.each { variant ->
            def log = fixtureBuildDirectory.file("reports/just-dire-refunds-production/${neoforge_version}/${variant}-process.log").get().asFile
            runBoundedGradleTask(":RuntimeTests:NeoForge:runJustDireRefunds${variant}", log, 240)
            def directory = justDireSmithingMarkers.get().asFile
            def failure = new File(directory, 'just-dire-refunds-failure.txt')
            def success = new File(directory, 'just-dire-refunds-success.txt')
            def report = new File(directory, 'just-dire-refunds-report.txt')
            def warnings = log.readLines().count { it.contains('Could not bind Just Dire Things refund items') }
            def flowWarnings = log.readLines().count { it.contains('Just Dire Things refund flow incompatible') }
            def refused = ['Missing', 'Extra', 'Count', 'Entity', 'Operation', 'Publication', 'Router'].contains(variant)
            if (failure.isFile() || !success.isFile() || success.text != 'neoforge\n' || !report.isFile()
                    || log.text.contains('/ERROR]') || warnings != (variant in ['ItemsMissing', 'MetadataMissing'] ? 1 : 0) || flowWarnings != (refused ? 1 : 0)
                    || variant == 'Absent' && log.text.contains('Error loading class: com/direwolf20/justdirethings')) {
                throw new GradleException("Production JDT credits ${variant} failed: ${failure.isFile() ? failure.text : log}")
            }
            new File(log.parentFile, "${variant}-report.txt").text = report.text
            def exported = new File(justDireSmithingRunDirectory.get().asFile, '.mixin.out/class/net/minecraft/world/item/ItemStack.class')
            if (variant != 'Absent') {
                if (!exported.isFile()) {
                    throw new GradleException('Missing final ItemStack export')
                }
                fixtureFileOperations.copy {
                    from exported
                    into log.parentFile
                    rename { "${variant}-ItemStack.class" }
                }
            }
            logger.lifecycle(report.text)
        }
    }
}

