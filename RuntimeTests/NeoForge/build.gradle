plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

base.archivesName = "mismatchedboots-runtime-test-neoforge"

evaluationDependsOn(':NeoForge')

// Resolve project-owned services/providers during configuration, not from Task.project in actions.
def fixtureFileOperations = objects.newInstance(FixtureFileOperations).files
def fixtureBuildDirectory = layout.buildDirectory
def productionArchive = project(':NeoForge').tasks.named('jar').flatMap { it.archiveFile }
def runBoundedGradleTask = rootProject.ext.runBoundedGradleTask

dependencies {
    compileOnly files(project(':NeoForge').sourceSets.main.output)
}

configurations {
    advancedNetheriteNeoForge {
        canBeConsumed = false
        canBeResolved = true
    }
    journeyMapNeoForge {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    // Advanced Netherite 2.4.1 NeoForge; https://modrinth.com/mod/CFX9ftUJ/version/yvbzX6CA
    advancedNetheriteNeoForge('maven.modrinth:CFX9ftUJ:yvbzX6CA') {
        transitive = false
    }
    // JourneyMap 26.1.2-6.0.4 NeoForge; https://modrinth.com/mod/lfHFW1mp/version/MYF1fYGU
    journeyMapNeoForge('maven.modrinth:lfHFW1mp:MYF1fYGU') {
        transitive = false
    }
}

sourceSets {
    iceAndFireTideHead {
        // Only its own NeoForge modding dependencies, not main or FEET/production output.
        runtimeClasspath += output + compileClasspath
    }
    iceAndFireTideTest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
    advancedNetheriteTest {
        java.srcDir rootProject.file('RuntimeTests/AdvancedNetherite/src/main/java')
        compileClasspath += sourceSets.main.compileClasspath
        compileClasspath += files(project(':NeoForge').sourceSets.main.output)
        compileClasspath += configurations.advancedNetheriteNeoForge
        runtimeClasspath += output + compileClasspath
    }
}

sourceSets.main.java.srcDir rootProject.file('RuntimeTests/Common/src/main/java')

def networkTestPort = providers.gradleProperty('networkTestPort').getOrElse('25575')
def networkTestMarkers = providers.gradleProperty('networkTestMarkers')
        .getOrElse(fixtureBuildDirectory.dir('markers').get().asFile.absolutePath)
def geometryMarkers = fixtureBuildDirectory.dir('geometry-markers')
def geometryRunDirectory = fixtureBuildDirectory.dir('run/geometryClient')
def iceAndFireTest = providers.gradleProperty('iceAndFireTest').map { it.toBoolean() }.getOrElse(false)
def iceAndFireModsDirectory = providers.gradleProperty('iceAndFireTestModsDirectory')
        .map { rootProject.file(it) }.getOrElse(rootProject.file('NeoForge/runs/client/mods'))
def iceAndFireArtifacts = [
        'iceandfire-2.2-beta.3.jar': 'ee971bd2d048d9115877c022622d6f9c3e072127ad65108e83807b42effd56b2',
        'uranus-3.0-alpha.1.jar': 'ce0ab47d27783a872f5486208884a2946b1c4e39d94bce2c80b1142defde3000',
        'jupiter-2.4.3-26.1.2-universal.jar': 'fc2f273c02788c5ff6736439de8cef9a7eb2662f768e8ee1ac23c57323ee740c'
]
def verifiedIceAndFireArtifacts = {
    iceAndFireArtifacts.collect { filename, expectedHash ->
        def artifact = new File(iceAndFireModsDirectory, filename)
        if (!artifact.isFile()) {
            throw new GradleException("Missing optional Ice and Fire fixture: ${artifact}")
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        artifact.withInputStream { stream ->
            byte[] buffer = new byte[8192]
            int count
            while ((count = stream.read(buffer)) != -1) {
                digest.update(buffer, 0, count)
            }
        }
        if (digest.digest().encodeHex().toString() != expectedHash) {
            throw new GradleException("Unexpected optional Ice and Fire artifact: ${artifact}")
        }
        artifact
    }
}
def iceAndFireDamageMarkers = fixtureBuildDirectory.dir('ice-and-fire-damage-markers')
def iceAndFireDamageRunDirectory = fixtureBuildDirectory.dir('run/iceAndFireDamageCompatibility')
def tideMarkers = fixtureBuildDirectory.dir('tide-production-markers')
def tideRunDirectory = fixtureBuildDirectory.dir('run/iceAndFireTideTest')
def tideOptionalVariants = ['ApiAbsent', 'ApiField', 'HeadReceiverReplaced', 'FeetReceiverReplaced', 'HeadReceiverLinkage', 'FeetReceiverLinkage']
def tideProductionVariants = ['Feet', 'Both', 'MissingHead', 'ChainHigh', 'ChainLow', 'Late', 'BaseRead', 'BaseMutate', 'ExtraWork', 'PredicateChanged', 'PredicateReplaced', 'PredicateAmbiguous', 'PublicationChanged'] + tideOptionalVariants
def tooltipMarkers = fixtureBuildDirectory.dir('tooltip-markers')
def tooltipRunDirectory = fixtureBuildDirectory.dir('run/tooltipClient')
def advancedNetheriteMarkers = fixtureBuildDirectory.dir('advanced-netherite-markers')
def advancedNetheriteRunDirectory = fixtureBuildDirectory.dir('run/advancedNetheriteCompatibility')
def justDireSmithingMarkers = fixtureBuildDirectory.dir('just-dire-smithing-markers')
def justDireSmithingRunDirectory = fixtureBuildDirectory.dir('run/justDireSmithing')
def justDireJumpClientDirectory = fixtureBuildDirectory.dir('run/justDireJumpClient')
def justDireSmithingFixtureArchive = tasks.named('jar').flatMap { it.archiveFile }
def justDireSmithingArtifact = providers.gradleProperty('justDireThingsTestJar')
        .map { rootProject.file(it) }.getOrElse(rootProject.file('NeoForge/runs/client/mods/justdirethings-1.6.11.jar'))

neoForge {
    version = neoforge_version

    runs {
        ['Compatible', 'MissingFall', 'Absent'].each { variant ->
            register("justDireJump${variant}") {
                server()
                disableIdeRun()
                gameDirectory = justDireSmithingRunDirectory.get().asFile
                programArgument('--nogui')
                systemProperty('mismatchedboots.runtimetest.markers', justDireSmithingMarkers.get().asFile.absolutePath)
                systemProperty('mismatchedboots.runtimetest.justDireJumpTest', 'true')
                systemProperty('mismatchedboots.runtimetest.justDireJumpGuard', variant.uncapitalize())
                systemProperty('mixin.debug.export', 'true')
                jvmArgument('-Xmx1G')
            }
        }
        justDireJump {
            server()
            disableIdeRun()
            gameDirectory = justDireSmithingRunDirectory.get().asFile
            programArgument('--nogui')
            systemProperty('mismatchedboots.runtimetest.markers', justDireSmithingMarkers.get().asFile.absolutePath)
            systemProperty('mismatchedboots.runtimetest.justDireJumpTest', 'true')
            systemProperty('mixin.debug.export', 'true')
            jvmArgument('-Xmx1G')
        }
        justDireJumpClient {
            client()
            disableIdeRun()
            gameDirectory = justDireJumpClientDirectory.get().asFile
            programArgument('--quickPlaySingleplayer')
            programArgument('jump')
            systemProperty('mismatchedboots.runtimetest.markers', justDireSmithingMarkers.get().asFile.absolutePath)
            systemProperty('mismatchedboots.runtimetest.justDireJumpClientTest', 'true')
            systemProperty('mismatchedboots.test.hideClientWindow', 'true')
            systemProperty('mismatchedboots.runtimetest.dismissWarnings', 'true')
            jvmArgument('-Xmx1G')
        }
        justDireSmithing {
            server()
            disableIdeRun()
            gameDirectory = justDireSmithingRunDirectory.get().asFile
            programArgument('--nogui')
            systemProperty('mismatchedboots.runtimetest.markers', justDireSmithingMarkers.get().asFile.absolutePath)
            systemProperty('mismatchedboots.runtimetest.justDireSmithingTest', 'true')
            jvmArgument('-Xmx1G')
        }
        tideProductionVariants.each { variant ->
            register("iceAndFireTideProduction${variant}") {
                server()
                disableIdeRun()
                gameDirectory = tideRunDirectory.get().asFile
                programArgument('--nogui')
                systemProperty('mismatchedboots.runtimetest.markers', tideMarkers.get().asFile.absolutePath)
                systemProperty('mismatchedboots.runtimetest.tideOwners', variant.uncapitalize())
                systemProperty('mismatchedboots.runtimetest.tideDamageCoexistence', (variant != 'ApiAbsent').toString())
                systemProperty('mismatchedboots.runtimetest.tideDamageSmoke', (variant != 'Both').toString())
                if (variant.contains('Receiver')) {
                    systemProperty("mismatchedboots.runtimetest.tide${variant.startsWith('Head') ? 'Head' : 'Feet'}Receiver",
                            variant.endsWith('Linkage') ? 'linkage' : 'replaced')
                }
                systemProperty('mixin.debug.countInjections', 'true')
                jvmArgument('-Xmx1G')
            }
        }
        networkTestServer {
            server()
            disableIdeRun()
            gameDirectory = project.file('build/run/server')
            programArgument('--nogui')
            systemProperty('mismatchedboots.runtimetest.markers', networkTestMarkers)
            systemProperty('mismatchedboots.runtimetest.loader', 'neoforge')
            systemProperty('mismatchedboots.runtimetest.stopAfterReady',
                    providers.gradleProperty('networkTestStopAfterReady').getOrElse('false'))
            jvmArgument('-Xmx1G')
        }
        networkTestClient {
            client()
            disableIdeRun()
            gameDirectory = project.file('build/run/client')
            systemProperty('mismatchedboots.runtimetest.markers', networkTestMarkers)
            systemProperty('mismatchedboots.runtimetest.loader', 'neoforge')
            systemProperty('mismatchedboots.test.hideClientWindow', 'true')
            systemProperty('mismatchedboots.runtimetest.dismissWarnings', 'true')
            programArgument('--quickPlayMultiplayer')
            programArgument("127.0.0.1:${networkTestPort}")
            jvmArgument('-Xmx1G')
        }
        geometryClient {
            client()
            disableIdeRun()
            gameDirectory = geometryRunDirectory.get().asFile
            systemProperty('mismatchedboots.runtimetest.markers', geometryMarkers.get().asFile.absolutePath)
            systemProperty('mismatchedboots.runtimetest.geometryTest', 'true')
            systemProperty('mismatchedboots.runtimetest.iceAndFireTest', iceAndFireTest.toString())
            systemProperty('mismatchedboots.test.hideClientWindow', 'true')
            systemProperty('mismatchedboots.runtimetest.dismissWarnings', 'true')
            jvmArgument('-Xmx1G')
        }
        tooltipClient {
            client()
            disableIdeRun()
            gameDirectory = tooltipRunDirectory.get().asFile
            systemProperty('mismatchedboots.runtimetest.markers', tooltipMarkers.get().asFile.absolutePath)
            systemProperty('mismatchedboots.runtimetest.tooltipTest', 'true')
            systemProperty('mismatchedboots.test.hideClientWindow', 'true')
            systemProperty('mismatchedboots.runtimetest.dismissWarnings', 'true')
            jvmArgument('-Xmx1G')
        }
        advancedNetheriteCompatibility {
            server()
            disableIdeRun()
            gameDirectory = advancedNetheriteRunDirectory.get().asFile
            programArgument('--nogui')
            systemProperty('mismatchedboots.runtimetest.markers',
                    advancedNetheriteMarkers.get().asFile.absolutePath)
            systemProperty('mismatchedboots.runtimetest.advancedNetheriteTest', 'true')
            jvmArgument('-Xmx1G')
        }
        iceAndFireDamageCompatibility {
            server()
            disableIdeRun()
            gameDirectory = iceAndFireDamageRunDirectory.get().asFile
            programArgument('--nogui')
            systemProperty('mismatchedboots.runtimetest.markers',
                    iceAndFireDamageMarkers.get().asFile.absolutePath)
            systemProperty('mismatchedboots.runtimetest.iceAndFireDamageTest', 'true')
            jvmArgument('-Xmx1G')
        }
        ['High', 'Low', 'Incompatible'].each { variant ->
            register("iceAndFireCoexistence${variant}") {
                server()
                disableIdeRun()
                gameDirectory = iceAndFireDamageRunDirectory.get().asFile
                programArgument('--nogui')
                systemProperty('mismatchedboots.runtimetest.markers',
                        iceAndFireDamageMarkers.get().asFile.absolutePath)
                systemProperty('mismatchedboots.runtimetest.iceAndFireDamageTest', 'true')
                systemProperty('mismatchedboots.runtimetest.iceAndFireCoexistence', variant.toLowerCase(Locale.ROOT))
                systemProperty('mixin.debug.countInjections', 'true')
                jvmArgument('-Xmx1G')
            }
        }
    }

    mods {
        mismatchedboots_runtime_test {
            sourceSet sourceSets.main
        }
    }
}

neoForge.addModdingDependenciesTo(sourceSets.advancedNetheriteTest)
neoForge.addModdingDependenciesTo(sourceSets.iceAndFireTideTest)
neoForge.addModdingDependenciesTo(sourceSets.iceAndFireTideHead)

tasks.register('prepareJustDireSmithing') {
    dependsOn(':NeoForge:jar', tasks.named('jar'))
    doLast {
        if (!justDireSmithingArtifact.isFile()) {
            throw new GradleException("Missing optional Just Dire Things fixture: ${justDireSmithingArtifact}")
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        justDireSmithingArtifact.withInputStream { stream ->
            byte[] buffer = new byte[8192]
            int count
            while ((count = stream.read(buffer)) != -1) {
                digest.update(buffer, 0, count)
            }
        }
        if (digest.digest().encodeHex().toString() != '27d26abcba9607b0c069de316541c781aebbbb167b1553aea6ca6934d3219436') {
            throw new GradleException("Unexpected Just Dire Things fixture: ${justDireSmithingArtifact}")
        }
        fixtureFileOperations.delete { delete justDireSmithingMarkers, justDireSmithingRunDirectory }
        def directory = justDireSmithingRunDirectory.get().asFile
        fixtureFileOperations.copy {
            from(productionArchive, justDireSmithingFixtureArchive, justDireSmithingArtifact)
            into(new File(directory, 'mods'))
        }
        new File(directory, 'eula.txt').text = 'eula=true\n'
        new File(directory, 'server.properties').text = '''online-mode=false
max-tick-time=-1
level-type=minecraft:flat
generator-settings={"biome":"minecraft:plains","layers":[{"height":1,"block":"minecraft:bedrock"},{"height":2,"block":"minecraft:dirt"},{"height":1,"block":"minecraft:grass_block"}],"structure_overrides":[]}
server-ip=127.0.0.1
server-port=0
spawn-protection=0
'''
    }
}

tasks.named('runJustDireSmithing') {
    dependsOn tasks.named('prepareJustDireSmithing')
}

tasks.named('runJustDireJump') { dependsOn tasks.named('prepareJustDireSmithing') }

tasks.register('prepareJustDireJumpClient') {
    dependsOn(':NeoForge:jar', tasks.named('jar'))
    doLast {
        def world = new File(justDireSmithingRunDirectory.get().asFile, 'world')
        if (!new File(world, 'level.dat').isFile()) {
            throw new GradleException('Run the passive-jump server gate first to prepare its disposable world')
        }
        fixtureFileOperations.delete { delete justDireJumpClientDirectory }
        def directory = justDireJumpClientDirectory.get().asFile
        fixtureFileOperations.copy { from(world); into(new File(directory, 'saves/jump')) }
        fixtureFileOperations.copy {
            from(productionArchive, justDireSmithingFixtureArchive, justDireSmithingArtifact)
            into(new File(directory, 'mods'))
        }
        new File(directory, 'options.txt').text = 'soundCategory_master:0.0\nnarrator:0\n'
        def config = new File(directory, 'config'); config.mkdirs()
        new File(config, 'fml.toml').text = 'earlyWindowControl = false\n'
    }
}

tasks.named('runJustDireJumpClient') { dependsOn tasks.named('prepareJustDireJumpClient') }

['Compatible', 'MissingFall', 'Absent'].each { variant ->
    def prepare = tasks.register("prepareJustDireJump${variant}") {
        dependsOn('prepareJustDireSmithing')
        doLast {
            if (variant == 'Absent') {
                fixtureFileOperations.delete {
                    delete new File(justDireSmithingRunDirectory.get().asFile, "mods/${justDireSmithingArtifact.name}")
                }
            }
        }
    }
    tasks.named("runJustDireJump${variant}") { dependsOn prepare }
}

tasks.register('verifyJustDireJumpGuards') {
    group = 'verification'
    description = 'Runs real compatible wrapper, missing fall companion and quiet optional absence.'
    dependsOn(':NeoForge:jar', tasks.named('jar'))
    doLast {
        ['Compatible', 'MissingFall', 'Absent'].each { variant ->
            def log = fixtureBuildDirectory.file("reports/just-dire-jump/${neoforge_version}/${variant}-process.log").get().asFile
            runBoundedGradleTask(":RuntimeTests:NeoForge:runJustDireJump${variant}", log, 240)
            def directory = justDireSmithingMarkers.get().asFile
            def failure = new File(directory, 'just-dire-jump-failure.txt')
            def success = new File(directory, 'just-dire-jump-success.txt')
            def warnings = log.readLines().findAll { it.contains('Just Dire Things passive Jump') && it.contains('compatibility disabled') }
            if (failure.isFile() || !success.isFile() || success.text != 'neoforge\n'
                    || warnings.size() != (variant == 'MissingFall' ? 1 : 0)) {
                throw new GradleException("Just Dire Things ${variant} guard failed: ${failure.isFile() ? failure.text : log}; warnings=${warnings}")
            }
            if (variant == 'Absent' && log.text.contains('Error loading class: com/direwolf20/justdirethings')) {
                throw new GradleException("Absent optional target emitted a loading warning: ${log}")
            }
            def report = new File(directory, 'just-dire-jump-report.txt')
            new File(log.parentFile, "${variant}-report.txt").text = report.text
            logger.lifecycle(report.text)
        }
    }
}

tasks.register('verifyJustDireJump') {
    group = 'verification'
    description = 'Runs bounded real Just Dire Things passive jump/fall acceptance.'
    dependsOn(':NeoForge:jar', tasks.named('jar'))
    doLast {
        def log = fixtureBuildDirectory.file("reports/just-dire-jump/${neoforge_version}/neoforge-process.log").get().asFile
        runBoundedGradleTask(':RuntimeTests:NeoForge:runJustDireJump', log, 240)
        def directory = justDireSmithingMarkers.get().asFile
        def failure = new File(directory, 'just-dire-jump-failure.txt')
        def report = new File(directory, 'just-dire-jump-report.txt')
        def success = new File(directory, 'just-dire-jump-success.txt')
        if (failure.isFile() || !success.isFile() || success.text != 'neoforge\n' || !report.isFile()) {
            throw new GradleException("Just Dire Things jump failed: ${failure.isFile() ? failure.text : log}")
        }
        new File(log.parentFile, 'server-report.txt').text = report.text
        logger.lifecycle(report.text)
        def clientLog = fixtureBuildDirectory.file("reports/just-dire-jump/${neoforge_version}/client-process.log").get().asFile
        runBoundedGradleTask(':RuntimeTests:NeoForge:runJustDireJumpClient', clientLog, 240)
        def clientFailure = new File(directory, 'just-dire-jump-client-failure.txt')
        def clientSuccess = new File(directory, 'just-dire-jump-client-success.txt')
        if (clientFailure.isFile() || !clientSuccess.isFile() || clientSuccess.text != 'neoforge\n') {
            throw new GradleException("Just Dire Things client jump failed: ${clientFailure.isFile() ? clientFailure.text : clientLog}")
        }
        def clientReport = new File(directory, 'just-dire-jump-client-report.txt')
        if (!clientReport.isFile()) { throw new GradleException("Missing client gameplay report: ${clientLog}") }
        new File(log.parentFile, 'client-report.txt').text = clientReport.text
        logger.lifecycle(clientReport.text)
    }
}

tasks.register('verifyJustDireSmithing') {
    group = 'verification'
    description = 'Runs bounded real Just Dire Things 1.6.11 template-free smithing acceptance.'
    dependsOn(':NeoForge:jar', tasks.named('jar'))
    doLast {
        def processLog = fixtureBuildDirectory.file('reports/just-dire-smithing/neoforge-process.log').get().asFile
        runBoundedGradleTask(':RuntimeTests:NeoForge:runJustDireSmithing', processLog, 240)
        def directory = justDireSmithingMarkers.get().asFile
        def failure = new File(directory, 'just-dire-smithing-failure.txt')
        def success = new File(directory, 'just-dire-smithing-success.txt')
        def report = new File(directory, 'just-dire-smithing-report.txt')
        if (failure.isFile() || !success.isFile() || success.text != 'neoforge\n' || !report.isFile()
                || !report.text.contains('14 real installation recipes') || !report.text.contains('28 ordinary/shift-click takes')) {
            throw new GradleException("Just Dire Things smithing failed: ${failure.isFile() ? failure.text : processLog}")
        }
        logger.lifecycle(report.text)
    }
}

def tideHeadJar = tasks.register('iceAndFireTideHeadJar', Jar) {
