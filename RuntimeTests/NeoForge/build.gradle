plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

base.archivesName = "mismatchedboots-runtime-test-neoforge"

evaluationDependsOn(':NeoForge')

// Resolve project-owned services/providers during configuration, not from Task.project in actions.
def testMods = rootProject.ext.testModArtifacts

def fixtureFileOperations = objects.newInstance(FixtureFileOperations).files
def fixtureBuildDirectory = layout.buildDirectory
def productionArchive = project(':NeoForge').tasks.named('jar').flatMap { it.archiveFile }
def runBoundedGradleTask = rootProject.ext.runBoundedGradleTask

dependencies {
    // Expose Common's source module to IDEs; NeoForge also compiles these classes into its own output.
    compileOnly(project(':Common')) {
        transitive = false
        capabilities {
            requireCapability "$group:$mod_id"
        }
    }
    compileOnly files(project(':NeoForge').sourceSets.main.output)
    compileOnly "mysticdrew:common-networking-neoforge:${common_networking_version}"
}

configurations {
    advancedNetheriteNeoForge {
        canBeConsumed = false
        canBeResolved = true
    }
    journeyMapNeoForge {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    // Advanced Netherite 2.4.1 NeoForge; https://modrinth.com/mod/CFX9ftUJ/version/yvbzX6CA
    advancedNetheriteNeoForge('maven.modrinth:CFX9ftUJ:yvbzX6CA') {
        transitive = false
    }
    // JourneyMap 26.1.2-6.0.4 NeoForge; https://modrinth.com/mod/lfHFW1mp/version/MYF1fYGU
    journeyMapNeoForge('maven.modrinth:lfHFW1mp:MYF1fYGU') {
        transitive = false
    }
}

sourceSets {
    iceAndFireTideHead {
        // Only its own NeoForge modding dependencies, not main or FEET/production output.
        runtimeClasspath += output + compileClasspath
    }
    iceAndFireTideTest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        // Common is an IDE/compile dependency; gameplay still uses the packaged production mod.
        runtimeClasspath += output + (compileClasspath - project(':Common').sourceSets.main.output)
    }
    advancedNetheriteTest {
        java.srcDir rootProject.file('RuntimeTests/AdvancedNetherite/src/main/java')
        compileClasspath += sourceSets.main.compileClasspath
        compileClasspath += files(project(':NeoForge').sourceSets.main.output)
        compileClasspath += configurations.advancedNetheriteNeoForge
        runtimeClasspath += output + (compileClasspath - project(':Common').sourceSets.main.output)
    }
}

sourceSets.main.java.srcDir rootProject.file('RuntimeTests/Common/src/main/java')

def networkTestPort = providers.gradleProperty('networkTestPort').getOrElse('25575')
def networkTestMarkers = providers.gradleProperty('networkTestMarkers')
        .getOrElse(fixtureBuildDirectory.dir('markers').get().asFile.absolutePath)
def geometryMarkers = fixtureBuildDirectory.dir('geometry-markers')
def geometryRunDirectory = fixtureBuildDirectory.dir('run/geometryClient')
def iceAndFireTest = providers.gradleProperty('iceAndFireTest').map { it.toBoolean() }.getOrElse(false)
def rootsRenderingTest = providers.gradleProperty('rootsRenderingTest').map { it.toBoolean() }.getOrElse(false)
def rootsRenderingArtifact = testMods.path('NeoForge', 'RootsClassic-26.1.2-1.6.7.jar')
def iceAndFireModsOverride = providers.gradleProperty('iceAndFireTestModsDirectory').isPresent()

def iceAndFireModsDirectory = providers.gradleProperty('iceAndFireTestModsDirectory')
        .map { rootProject.file(it) }.getOrElse(rootProject.layout.buildDirectory.dir('test-mods/NeoForge').get().asFile)
def iceAndFireArtifacts = [
        'iceandfire-2.2-beta.3.jar'         : 'ee971bd2d048d9115877c022622d6f9c3e072127ad65108e83807b42effd56b2',
        'uranus-3.0-alpha.1.jar'            : 'ce0ab47d27783a872f5486208884a2946b1c4e39d94bce2c80b1142defde3000',
        'jupiter-2.4.3-26.1.2-universal.jar': 'fc2f273c02788c5ff6736439de8cef9a7eb2662f768e8ee1ac23c57323ee740c'
]
def verifiedIceAndFireArtifacts = {
    iceAndFireArtifacts.collect { filename, expectedHash ->
        def artifact = new File(iceAndFireModsDirectory, filename)
        if (!iceAndFireModsOverride) {
            testMods.resolve('NeoForge', filename)
        }
        if (!artifact.isFile()) {
            throw new GradleException("Missing optional Ice and Fire fixture: ${artifact}")
        }

        def digest = java.security.MessageDigest.getInstance('SHA-256')
        artifact.withInputStream { stream ->
            byte[] buffer = new byte[8192]
            int count
            while ((count = stream.read(buffer)) != -1) {
                digest.update(buffer, 0, count)
            }
        }
        if (digest.digest().encodeHex().toString() != expectedHash) {
            throw new GradleException("Unexpected optional Ice and Fire artifact: ${artifact}")
        }
        artifact
    }
}
def iceAndFireDamageMarkers = fixtureBuildDirectory.dir('ice-and-fire-damage-markers')
def iceAndFireDamageRunDirectory = fixtureBuildDirectory.dir('run/iceAndFireDamageCompatibility')
def tideMarkers = fixtureBuildDirectory.dir('tide-production-markers')
def tideRunDirectory = fixtureBuildDirectory.dir('run/iceAndFireTideTest')
def tideOptionalVariants = ['ApiAbsent', 'ApiField', 'HeadReceiverReplaced', 'FeetReceiverReplaced', 'HeadReceiverLinkage', 'FeetReceiverLinkage']
def tideProductionVariants = ['Feet', 'Both', 'MissingHead', 'ChainHigh', 'ChainLow', 'Late', 'BaseRead', 'BaseMutate', 'ExtraWork', 'PredicateChanged', 'PredicateReplaced', 'PredicateAmbiguous', 'PublicationChanged'] + tideOptionalVariants
def tooltipMarkers = fixtureBuildDirectory.dir('tooltip-markers')
def tooltipRunDirectory = fixtureBuildDirectory.dir('run/tooltipClient')
def advancedNetheriteMarkers = fixtureBuildDirectory.dir('advanced-netherite-markers')
def advancedNetheriteRunDirectory = fixtureBuildDirectory.dir('run/advancedNetheriteCompatibility')
neoForge {
    version = neoforge_version

    runs {
        tideProductionVariants.each { variant ->
            register("iceAndFireTideProduction${variant}") {
                server()
                disableIdeRun()
                gameDirectory = tideRunDirectory.get().asFile
                programArgument('--nogui')
                systemProperty('mismatchedboots.runtimetest.markers', tideMarkers.get().asFile.absolutePath)
                systemProperty('mismatchedboots.runtimetest.tideOwners', variant.uncapitalize())
                systemProperty('mismatchedboots.runtimetest.tideDamageCoexistence', (variant != 'ApiAbsent').toString())
                systemProperty('mismatchedboots.runtimetest.tideDamageSmoke', (variant != 'Both').toString())
                if (variant.contains('Receiver')) {
                    systemProperty("mismatchedboots.runtimetest.tide${variant.startsWith('Head') ? 'Head' : 'Feet'}Receiver",
                            variant.endsWith('Linkage') ? 'linkage' : 'replaced')
                }
                systemProperty('mixin.debug.countInjections', 'true')
                jvmArgument('-Xmx1G')
            }
        }
        networkTestServer {
            server()
            disableIdeRun()
            gameDirectory = project.file('build/run/server')
            programArgument('--nogui')
            systemProperty('mismatchedboots.runtimetest.markers', networkTestMarkers)
            systemProperty('mismatchedboots.runtimetest.loader', 'neoforge')
            systemProperty('mismatchedboots.runtimetest.stopAfterReady',
                    providers.gradleProperty('networkTestStopAfterReady').getOrElse('false'))
            jvmArgument('-Xmx1G')
        }
        networkTestClient {
            client()
            disableIdeRun()
            gameDirectory = project.file('build/run/client')
            systemProperty('mismatchedboots.runtimetest.markers', networkTestMarkers)
            systemProperty('mismatchedboots.runtimetest.loader', 'neoforge')
            systemProperty('mismatchedboots.test.hideClientWindow', 'true')
            systemProperty('mismatchedboots.runtimetest.dismissWarnings', 'true')
            programArgument('--quickPlayMultiplayer')
            programArgument("127.0.0.1:${networkTestPort}")
            jvmArgument('-Xmx1G')
        }
        geometryClient {
            client()
            disableIdeRun()
            gameDirectory = geometryRunDirectory.get().asFile
            systemProperty('mismatchedboots.runtimetest.markers', geometryMarkers.get().asFile.absolutePath)
            systemProperty('mismatchedboots.runtimetest.geometryTest', 'true')
            systemProperty('mismatchedboots.runtimetest.iceAndFireTest', iceAndFireTest.toString())
            systemProperty('mismatchedboots.runtimetest.rootsRenderingTest', rootsRenderingTest.toString())
            systemProperty('mismatchedboots.test.hideClientWindow', 'true')
            systemProperty('mismatchedboots.runtimetest.dismissWarnings', 'true')
            jvmArgument('-Xmx1G')
        }
        tooltipClient {
            client()
            disableIdeRun()
            gameDirectory = tooltipRunDirectory.get().asFile
            systemProperty('mismatchedboots.runtimetest.markers', tooltipMarkers.get().asFile.absolutePath)
            systemProperty('mismatchedboots.runtimetest.tooltipTest', 'true')
            systemProperty('mismatchedboots.test.hideClientWindow', 'true')
            systemProperty('mismatchedboots.runtimetest.dismissWarnings', 'true')
            jvmArgument('-Xmx1G')
        }
        advancedNetheriteCompatibility {
            server()
            disableIdeRun()
            gameDirectory = advancedNetheriteRunDirectory.get().asFile
            programArgument('--nogui')
            systemProperty('mismatchedboots.runtimetest.markers',
                    advancedNetheriteMarkers.get().asFile.absolutePath)
            systemProperty('mismatchedboots.runtimetest.advancedNetheriteTest', 'true')
            jvmArgument('-Xmx1G')
        }
        iceAndFireDamageCompatibility {
            server()
            disableIdeRun()
            gameDirectory = iceAndFireDamageRunDirectory.get().asFile
            programArgument('--nogui')
            systemProperty('mismatchedboots.runtimetest.markers',
                    iceAndFireDamageMarkers.get().asFile.absolutePath)
            systemProperty('mismatchedboots.runtimetest.iceAndFireDamageTest', 'true')
            jvmArgument('-Xmx1G')
        }
        ['High', 'Low', 'Incompatible'].each { variant ->
            register("iceAndFireCoexistence${variant}") {
                server()
                disableIdeRun()
                gameDirectory = iceAndFireDamageRunDirectory.get().asFile
                programArgument('--nogui')
                systemProperty('mismatchedboots.runtimetest.markers',
                        iceAndFireDamageMarkers.get().asFile.absolutePath)
                systemProperty('mismatchedboots.runtimetest.iceAndFireDamageTest', 'true')
                systemProperty('mismatchedboots.runtimetest.iceAndFireCoexistence', variant.toLowerCase(Locale.ROOT))
                systemProperty('mixin.debug.countInjections', 'true')
                jvmArgument('-Xmx1G')
            }
        }
    }

    mods {
        mismatchedboots_runtime_test {
            sourceSet sourceSets.main
        }
    }
}

neoForge.addModdingDependenciesTo(sourceSets.advancedNetheriteTest)
neoForge.addModdingDependenciesTo(sourceSets.iceAndFireTideTest)
neoForge.addModdingDependenciesTo(sourceSets.iceAndFireTideHead)

// JDT suites share disposable fixture paths; each script keeps its own local providers.
apply from: rootProject.file('gradle/just-dire-items-tests.gradle')
apply from: rootProject.file('gradle/just-dire-resources-tests.gradle')
apply from: rootProject.file('gradle/just-dire-movement-tests.gradle')
apply from: rootProject.file('gradle/just-dire-abilities-tests.gradle')
apply from: rootProject.file('gradle/just-dire-lava-repair-tests.gradle')
apply from: rootProject.file('gradle/just-dire-item-bars-tests.gradle')

def tideHeadJar = tasks.register('iceAndFireTideHeadJar', Jar) {
    archiveClassifier = 'tide-head-owner'
    from sourceSets.iceAndFireTideHead.output
}

def tideTestJar = tasks.register('iceAndFireTideTestJar', Jar) {
    archiveClassifier = 'tide-test'
    from sourceSets.iceAndFireTideTest.output
}

tasks.register('prepareIceAndFireTideProduction') {
    dependsOn(':NeoForge:jar', tideTestJar)
    doLast {
        def artifacts = verifiedIceAndFireArtifacts()
        fixtureFileOperations.delete { delete tideMarkers, tideRunDirectory }
        def directory = tideRunDirectory.get().asFile
        fixtureFileOperations.copy {
            from(productionArchive, tideTestJar.flatMap { it.archiveFile }, artifacts)
            into(new File(directory, 'mods'))
        }
        new File(directory, 'eula.txt').text = 'eula=true\n'
        new File(directory, 'server.properties').text = '''online-mode=false
max-tick-time=-1
level-type=minecraft:flat
generator-settings={"biome":"minecraft:plains","layers":[{"height":1,"block":"minecraft:bedrock"},{"height":2,"block":"minecraft:dirt"},{"height":1,"block":"minecraft:grass_block"}],"structure_overrides":[]}
server-ip=127.0.0.1
server-port=0
spawn-protection=0
'''
    }
}

def mutatedTideJar = fixtureBuildDirectory.file('tide-api-field/iceandfire-2.2-beta.3.jar')
def prepareTideMutationArtifact = tasks.register('prepareTideMutationArtifact') {
    doLast { verifiedIceAndFireArtifacts() }
}

def mutateTideApi = tasks.register('mutateTideApi', JavaExec) {
    dependsOn(tasks.named('iceAndFireTideTestClasses'), prepareTideMutationArtifact)
    classpath = sourceSets.iceAndFireTideTest.runtimeClasspath
    mainClass = 'games.alejandrocoria.mismatchedboots.runtimetest.tide.TideJarMutation'
    inputs.file(new File(iceAndFireModsDirectory, 'iceandfire-2.2-beta.3.jar'))
    outputs.file(mutatedTideJar)
    doFirst {
        verifiedIceAndFireArtifacts()
        setArgs([new File(iceAndFireModsDirectory, 'iceandfire-2.2-beta.3.jar').absolutePath, mutatedTideJar.get().asFile.absolutePath])
    }
}
tideProductionVariants.each { variant ->
    def prepare = tasks.register("prepareIceAndFireTideProduction${variant}") {
        dependsOn('prepareIceAndFireTideProduction', tideHeadJar)
        if (variant == 'ApiField') {
            dependsOn(mutateTideApi)
        }
        doLast {
            def mods = new File(tideRunDirectory.get().asFile, 'mods')
            if (variant != 'Feet') {
                fixtureFileOperations.copy {
                    from(tideHeadJar.flatMap { it.archiveFile })
                    into(mods)
                }
            }
            if (variant == 'ApiAbsent') {
                fixtureFileOperations.delete { delete iceAndFireArtifacts.keySet().collect { new File(mods, it) } }
            } else if (variant == 'ApiField') {
                fixtureFileOperations.copy {
                    from(mutatedTideJar)
                    into(mods)
                }
            }
        }
    }
    tasks.named("runIceAndFireTideProduction${variant}") { dependsOn(prepare) }
}

tasks.register('verifyIceAndFireTideProduction') {
    group = 'verification'
    description = 'Unmodified production FEET adapter: native traces, effects, independent HEAD, real guards and damage regression.'
    dependsOn(':NeoForge:jar', tideHeadJar, tideTestJar)
    doLast {
        def head = new java.util.zip.ZipFile(tideHeadJar.get().archiveFile.get().asFile)
        try {
            head.entries().toList().findAll { it.name.endsWith('.class') }.each { entry ->
                def constants = new String(head.getInputStream(entry).withCloseable { it.readAllBytes() },
                        java.nio.charset.StandardCharsets.ISO_8859_1)
                if (constants.contains('runtimetest/tide/') || constants.contains('runtimetest/neoforge/')
                        || constants.contains('mismatchedboots/compatibility/') || constants.contains('mismatchedboots/composition/')
                        || constants.contains('mismatchedboots/content/')) {
                    throw new GradleException("HEAD fixture links to production or its coordinator: ${entry.name}")
                }
            }
            if (head.getInputStream(head.getEntry('META-INF/neoforge.mods.toml')).withCloseable { it.getText('UTF-8') }
                    .contains('modId="mismatchedboots"')) {
                throw new GradleException('HEAD fixture metadata depends on production')
            }
        } finally {
            head.close()
        }
        tideProductionVariants.each { variant ->
            def log = fixtureBuildDirectory.file("reports/tide-production/${neoforge_version}/${variant}.log").get().asFile
            runBoundedGradleTask(":RuntimeTests:NeoForge:runIceAndFireTideProduction${variant}", log, 240)
            def directory = tideMarkers.get().asFile
            def failure = new File(directory, 'tide-owners-failure.txt')
            def report = new File(directory, 'tide-owners-report.txt')
            def success = new File(directory, 'tide-owners-success.txt')
            def warnings = log.readLines().findAll { it.contains('Tide adapter disabled:') }
            def rejectedBoth = ['Late', 'BaseRead', 'BaseMutate', 'ExtraWork', 'PredicateChanged', 'PredicateReplaced', 'PredicateAmbiguous', 'ApiField'].contains(variant)
            def expectedWarnings = rejectedBoth ? 2 : variant == 'MissingHead' || variant == 'PublicationChanged' || variant.contains('Receiver') ? 1 : 0
            if (failure.isFile() || !success.isFile() || success.text != 'neoforge\n' || !report.isFile()
                    || !report.text.contains('production FEET=true') || warnings.size() != expectedWarnings) {
                throw new GradleException("Production Tide ${variant} failed: ${failure.isFile() ? failure.text : log}; warnings=${warnings}")
            }
            new File(log.parentFile, "${variant}-report.txt").text = report.text
            if (variant != 'ApiAbsent') {
                def damage = new File(directory, 'ice-and-fire-damage-report.txt')
                if (new File(directory, 'ice-and-fire-damage-failure.txt').isFile()
                        || !new File(directory, 'ice-and-fire-damage-success.txt').isFile()
                        || !damage.isFile() || !damage.text.contains("${variant == 'Both' ? 340 : 6} real hurtServer cases")) {
                    throw new GradleException("Production Tide ${variant} missing same-JVM damage regression: ${log}")
                }
                new File(log.parentFile, "${variant}-damage-report.txt").text = damage.text
            } else if (log.text.contains('Error loading class: com/iafenvoy/iceandfire/item/armor/SeaSerpentArmorItem')) {
                throw new GradleException("Absent production Tide target emitted a class-loading warning: ${log}")
            }
            logger.lifecycle(report.text)
        }
    }
}
def advancedNetheriteTestJar = tasks.register('advancedNetheriteTestJar', Jar) {
    archiveClassifier = 'advanced-netherite-test'
    from sourceSets.advancedNetheriteTest.output
}

tasks.register('prepareAdvancedNetheriteCompatibility', Delete) {
    dependsOn(':NeoForge:jar', advancedNetheriteTestJar)
    delete advancedNetheriteMarkers, advancedNetheriteRunDirectory
    doLast {
        def runDirectory = advancedNetheriteRunDirectory.get().asFile
        def modsDirectory = new File(runDirectory, 'mods')
        modsDirectory.mkdirs()
        fixtureFileOperations.copy {
            from(productionArchive)
            from(advancedNetheriteTestJar.flatMap { it.archiveFile })
            from(configurations.advancedNetheriteNeoForge)
            into(modsDirectory)
        }
        new File(runDirectory, 'eula.txt').text = 'eula=true\n'
        new File(runDirectory, 'server.properties').text = '''online-mode=false
max-tick-time=-1
'''
    }
}

tasks.named('runAdvancedNetheriteCompatibility') {
    dependsOn tasks.named('prepareAdvancedNetheriteCompatibility')
}

tasks.register('verifyAdvancedNetheriteCompatibility') {
    group = 'verification'
    description = 'Runs bounded NeoForge acceptance against Advanced Netherite 2.4.1.'
    dependsOn(':NeoForge:jar', advancedNetheriteTestJar)
    doLast {
        def processLog = fixtureBuildDirectory.file(
                'reports/advanced-netherite/neoforge-process.log').get().asFile
        runBoundedGradleTask(
                ':RuntimeTests:NeoForge:runAdvancedNetheriteCompatibility', processLog, 240)
        def markerDirectory = advancedNetheriteMarkers.get().asFile
        def failure = new File(markerDirectory, 'advanced-netherite-failure.txt')
        if (failure.isFile()) {
            throw new GradleException("NeoForge Advanced Netherite acceptance failed:\n${failure.text}")
        }
        def success = new File(markerDirectory, 'advanced-netherite-success.txt')
        if (!success.isFile() || success.text != 'neoforge\n') {
            throw new GradleException(
                    "NeoForge Advanced Netherite acceptance did not produce its success marker; see ${processLog}")
        }
    }
}

tasks.register('prepareGeometryClient') {
    dependsOn(':NeoForge:jar')
    doLast {
        def compatibilityArtifacts = []
        if (iceAndFireTest) {
            compatibilityArtifacts = verifiedIceAndFireArtifacts()
        }
        if (rootsRenderingTest) {
            testMods.resolve('NeoForge', rootsRenderingArtifact.name)
            if (!rootsRenderingArtifact.isFile()
                    || java.security.MessageDigest.getInstance('SHA-256').digest(rootsRenderingArtifact.bytes)
                    .encodeHex().toString() != '1768b172c938de0aa457771e60af9286bcca754e083ebc96f8a229cfe2a95a0d') {
                throw new GradleException('Missing or unexpected Roots Classic 1.6.7 rendering artifact')
            }
            compatibilityArtifacts += rootsRenderingArtifact
        }
        fixtureFileOperations.delete { delete geometryMarkers }
        fixtureFileOperations.delete { delete geometryRunDirectory }

        def runDirectory = geometryRunDirectory.get().asFile
        def modsDirectory = new File(runDirectory, 'mods')
        modsDirectory.mkdirs()
        fixtureFileOperations.copy {
            from(productionArchive)
            from(compatibilityArtifacts)
            into(modsDirectory)
        }
        new File(runDirectory, 'options.txt').text = 'soundCategory_master:0.0\n'
        def configDirectory = new File(runDirectory, 'config')
        configDirectory.mkdirs()
        new File(configDirectory, 'fml.toml').text = 'earlyWindowControl = false\n'
    }
}

tasks.register('prepareIceAndFireDamageCompatibility') {
    dependsOn(':NeoForge:jar')
    doLast {
        def compatibilityArtifacts = verifiedIceAndFireArtifacts()
        fixtureFileOperations.delete { delete iceAndFireDamageMarkers, iceAndFireDamageRunDirectory }
        def runDirectory = iceAndFireDamageRunDirectory.get().asFile
        def modsDirectory = new File(runDirectory, 'mods')
        modsDirectory.mkdirs()
        fixtureFileOperations.copy {
            from(productionArchive)
            from(compatibilityArtifacts)
            into(modsDirectory)
        }
        new File(runDirectory, 'eula.txt').text = 'eula=true\n'
        new File(runDirectory, 'server.properties').text = '''online-mode=false
max-tick-time=-1
level-type=minecraft:flat
generator-settings={"biome":"minecraft:plains","layers":[{"height":1,"block":"minecraft:bedrock"},{"height":2,"block":"minecraft:dirt"},{"height":1,"block":"minecraft:grass_block"}],"structure_overrides":[]}
server-ip=127.0.0.1
server-port=0
spawn-protection=0
'''
    }
}

tasks.named('runIceAndFireDamageCompatibility') {
    dependsOn('prepareIceAndFireDamageCompatibility')
}

['High', 'Low', 'Incompatible'].each { variant ->
    tasks.named("runIceAndFireCoexistence${variant}") {
        dependsOn('prepareIceAndFireDamageCompatibility')
    }
}

tasks.register('verifyIceAndFireMixinCoexistence') {
    group = 'verification'
    description = 'Exercises real competing Ice and Fire mixins above/below production priority and late fail-closed guards.'
    dependsOn(':NeoForge:jar')
    doLast {
        ['High', 'Low', 'Incompatible'].each { variant ->
            def log = fixtureBuildDirectory.file("reports/ice-and-fire-coexistence/${variant}.log").get().asFile
            runBoundedGradleTask(":RuntimeTests:NeoForge:runIceAndFireCoexistence${variant}", log, 240)
            def warnings = log.readLines().findAll { it.contains('Ice and Fire') && it.contains('boot compatibility disabled') }
            if (variant == 'Incompatible' ? warnings.size() != 1 || !warnings.first().contains('projectile/dragon local')
                    : !warnings.isEmpty()) {
                throw new GradleException("Unexpected Ice and Fire guard warnings in ${variant}: ${warnings}")
            }

            def directory = iceAndFireDamageMarkers.get().asFile
            def failure = new File(directory, 'ice-and-fire-damage-failure.txt')
            def success = new File(directory, 'ice-and-fire-damage-success.txt')
            def report = new File(directory, 'ice-and-fire-damage-report.txt')
            if (failure.isFile() || !success.isFile() || success.text != 'neoforge\n' || !report.isFile()
                    || !report.text.contains("coexistence=${variant.toLowerCase(Locale.ROOT)}")) {
                throw new GradleException("Ice and Fire ${variant} coexistence failed; ${failure.isFile() ? failure.text : log}")
            }

            def evidence = fixtureBuildDirectory.file("reports/ice-and-fire-coexistence/${variant}-report.txt").get().asFile
            evidence.text = report.text + "guard warnings=${warnings.size()}\n"
            logger.lifecycle(report.text)
        }
    }
}

tasks.register('verifyIceAndFireDamageCompatibility') {
    group = 'verification'
    description = 'Runs bounded real Ice and Fire CE dragon/projectile damage and Lightning-set acceptance.'
    dependsOn(':NeoForge:jar')
    doLast {
        def processLog = fixtureBuildDirectory.file('reports/ice-and-fire-damage/neoforge-process.log').get().asFile
        runBoundedGradleTask(':RuntimeTests:NeoForge:runIceAndFireDamageCompatibility', processLog, 240)
        def markerDirectory = iceAndFireDamageMarkers.get().asFile
        def failure = new File(markerDirectory, 'ice-and-fire-damage-failure.txt')
        if (failure.isFile()) {
            throw new GradleException("Ice and Fire damage acceptance failed:\n${failure.text}")
        }
        def success = new File(markerDirectory, 'ice-and-fire-damage-success.txt')
        def report = new File(markerDirectory, 'ice-and-fire-damage-report.txt')
        if (!success.isFile() || success.text != 'neoforge\n' || !report.isFile()) {
            throw new GradleException("Ice and Fire acceptance did not produce its result markers; see ${processLog}")
        }
        logger.lifecycle("Ice and Fire damage acceptance:\n${report.text}")
    }
}

tasks.named('runGeometryClient') {
    dependsOn('prepareGeometryClient')
}

tasks.register('verifyGeometryCharacterization') {
    group = 'verification'
    description = 'Characterizes rotated item-model topology in a hidden and muted NeoForge client.'
    dependsOn('runGeometryClient')
    doLast {
        def markerDirectory = geometryMarkers.get().asFile
        def failure = new File(markerDirectory, 'geometry-client-failure.txt')
        if (failure.exists()) {
            throw new GradleException("NeoForge geometry characterization failed:\n${failure.text}")
        }

        def success = new File(markerDirectory, 'geometry-success.txt')
        def report = new File(markerDirectory, 'geometry-report.txt')
        if (!success.exists() || !report.exists()) {
            throw new GradleException('NeoForge geometry characterization did not produce its result markers')
        }
        if (rootsRenderingTest) {
            if (!report.text.contains('equipment.roots.productionOrderedPairs=8\n')
                    || !report.text.contains('equipment.roots.worldDefaultAssets=true\n')
                    || !report.text.contains('equipment.roots.resourceReload=true\n')) {
                throw new GradleException('Roots production equipment checks did not complete')
            }
            fixtureFileOperations.copy {
                from(report, success)
                into(fixtureBuildDirectory.dir("reports/roots-equipment/${neoforge_version}"))
            }
        }
        logger.lifecycle("NeoForge geometry characterization:\n${report.text}")
    }
}

tasks.register('prepareTooltipClient') {
    dependsOn(':NeoForge:jar')
    doLast {
        fixtureFileOperations.delete { delete tooltipMarkers }
        fixtureFileOperations.delete { delete tooltipRunDirectory }

        def runDirectory = tooltipRunDirectory.get().asFile
        def modsDirectory = new File(runDirectory, 'mods')
        modsDirectory.mkdirs()
        fixtureFileOperations.copy {
            from(productionArchive)
            into(modsDirectory)
        }
        new File(runDirectory, 'options.txt').text = 'soundCategory_master:0.0\n'
        def configDirectory = new File(runDirectory, 'config')
        configDirectory.mkdirs()
        new File(configDirectory, 'fml.toml').text = 'earlyWindowControl = false\n'
    }
}

tasks.named('runTooltipClient') {
    dependsOn('prepareTooltipClient')
}

tasks.register('verifyTooltipCharacterization') {
    group = 'verification'
    description = 'Characterizes NeoForge tooltip hooks in a hidden and muted client.'
    dependsOn('runTooltipClient')
    doLast {
        def markerDirectory = tooltipMarkers.get().asFile
        def failure = new File(markerDirectory, 'tooltip-client-failure.txt')
        if (failure.exists()) {
            throw new GradleException("NeoForge tooltip characterization failed:\n${failure.text}")
        }
        def success = new File(markerDirectory, 'tooltip-success.txt')
        def report = new File(markerDirectory, 'tooltip-report.txt')
        if (!success.exists() || !report.exists()) {
            throw new GradleException('NeoForge tooltip characterization did not produce its result markers')
        }
        logger.lifecycle("NeoForge tooltip characterization:\n${report.text}")
    }
}

