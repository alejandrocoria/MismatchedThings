        'uranus-3.0-alpha.1.jar'            : 'ce0ab47d27783a872f5486208884a2946b1c4e39d94bce2c80b1142defde3000',
        'jupiter-2.4.3-26.1.2-universal.jar': 'fc2f273c02788c5ff6736439de8cef9a7eb2662f768e8ee1ac23c57323ee740c'
]
def verifiedIceAndFireArtifacts = {
    iceAndFireArtifacts.collect { filename, expectedHash ->
        def artifact = new File(iceAndFireModsDirectory, filename)
        if (!iceAndFireModsOverride) {
            testMods.resolve('NeoForge', filename)
        }
        if (!artifact.isFile()) {
            throw new GradleException("Missing optional Ice and Fire fixture: ${artifact}")
        }

        def digest = java.security.MessageDigest.getInstance('SHA-256')
        artifact.withInputStream { stream ->
            byte[] buffer = new byte[8192]
            int count
            while ((count = stream.read(buffer)) != -1) {
                digest.update(buffer, 0, count)
            }
        }
        if (digest.digest().encodeHex().toString() != expectedHash) {
            throw new GradleException("Unexpected optional Ice and Fire artifact: ${artifact}")
        }
        artifact
    }
}
