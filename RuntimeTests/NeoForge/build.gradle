    }
}

tasks.register('prepareGeometryClient') {
    dependsOn(':NeoForge:jar')
    doLast {
        def compatibilityArtifacts = []
        if (iceAndFireTest) {
            compatibilityArtifacts = verifiedIceAndFireArtifacts()
        }
        if (rootsRenderingTest) {
            testMods.resolve('NeoForge', rootsRenderingArtifact.name)
            if (!rootsRenderingArtifact.isFile()
                    || java.security.MessageDigest.getInstance('SHA-256').digest(rootsRenderingArtifact.bytes)
                    .encodeHex().toString() != '1768b172c938de0aa457771e60af9286bcca754e083ebc96f8a229cfe2a95a0d') {
                throw new GradleException('Missing or unexpected Roots Classic 1.6.7 rendering artifact')
            }
            compatibilityArtifacts += rootsRenderingArtifact
        }
        fixtureFileOperations.delete { delete geometryMarkers }
        fixtureFileOperations.delete { delete geometryRunDirectory }

        def runDirectory = geometryRunDirectory.get().asFile
        def modsDirectory = new File(runDirectory, 'mods')
        modsDirectory.mkdirs()
        fixtureFileOperations.copy {
            from(productionArchive)
            from(compatibilityArtifacts)
            into(modsDirectory)
        }
        new File(runDirectory, 'options.txt').text = 'soundCategory_master:0.0\n'
        def configDirectory = new File(runDirectory, 'config')
        configDirectory.mkdirs()
        new File(configDirectory, 'fml.toml').text = 'earlyWindowControl = false\n'
    }
}

