tasks.register('verifyJustDireArmorWear') {
    group = 'verification'
    description = 'Verifies packaged production JDT armor-wear conversion and independent ordinary/ability consumers.'
    dependsOn(':NeoForge:jar', tasks.named('jar'))
    doLast {
        def supported = justDireArmorWearVariants
        def variants = providers.gradleProperty('armorWearVariants').getOrElse(supported.join(',')).split(',')
        if (!variants.every { it in supported }) {
            throw new GradleException('Unknown production armor-wear variant')
        }
        variants.each { variant ->
            def log = fixtureBuildDirectory.file("reports/just-dire-armor-wear-production/${neoforge_version}/${variant}-process.log").get().asFile
            runBoundedGradleTask(":RuntimeTests:NeoForge:runJustDireArmorWear${variant}", log, 240)
            def directory = justDireSmithingMarkers.get().asFile
            def prefix = variant == 'Abilities' ? 'just-dire-earthquake-server' : 'just-dire-armor-wear'
            def failure = new File(directory, "${prefix}-failure.txt")
            def success = new File(directory, "${prefix}-success.txt")
            def report = new File(directory, "${prefix}-report.txt")
            def warnings = log.readLines().count { it.contains('Just Dire Things armor wear flow incompatible') }
            def unsafe = ['Missing', 'Amount', 'Entry', 'Slot', 'Entity', 'Cancellation', 'Association', 'Router', 'Publication'].contains(variant)
            def queryWarnings = log.readLines().count { it.contains('Just Dire Things armor wear query failed') }
            def storageWarnings = log.readLines().count { it.contains('Could not bind Just Dire Things storage API') }
            def timerWarnings = log.readLines().count { it.contains('Just Dire Things Earthquake retained an unsupported cooldown') }
            def witnessFailure = new File(directory, 'just-dire-armor-wear-failure.txt')
            if (failure.isFile() || !success.isFile() || success.text != 'neoforge\n' || !report.isFile()
                    || log.text.contains('/ERROR]') || warnings != (unsafe ? 1 : 0)
                    || queryWarnings != (variant == 'QueryFailure' ? 1 : 0) || storageWarnings != (variant == 'StorageMissing' ? 1 : 0)
                    || timerWarnings != (variant == 'Abilities' ? 1 : 0)
                    || witnessFailure.isFile()
                    || variant == 'Abilities' && !new File(directory, 'just-dire-armor-wear-armed.txt').isFile()) {
                throw new GradleException("Production armor wear ${variant} failed: ${failure.isFile() ? failure.text : witnessFailure.isFile() ? witnessFailure.text : log}")
            }
            new File(log.parentFile, "${variant}-report.txt").text = report.text
            if (variant == 'Abilities') {
                new File(log.parentFile, 'Abilities-armed.txt').text = new File(directory, 'just-dire-armor-wear-armed.txt').text
            }

            def exported = new File(justDireSmithingRunDirectory.get().asFile, '.mixin.out/class/net/neoforged/neoforge/common/CommonHooks.class')
            if (variant == 'Live') {
                if (!exported.isFile()) {
                    throw new GradleException('Missing final CommonHooks export')
                }
                fixtureFileOperations.copy {
                    from exported
                    into log.parentFile
                }
            }
            if (variant.startsWith('Wrapper')) {
                fixtureFileOperations.copy {
                    from exported
                    into log.parentFile
                    rename { "${variant}-CommonHooks.class" }
                }
            }
            logger.lifecycle(report.text)
        }
    }
}

