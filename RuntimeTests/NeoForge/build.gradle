plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

base.archivesName = "mismatchedboots-runtime-test-neoforge"

evaluationDependsOn(':NeoForge')

dependencies {
    compileOnly files(project(':NeoForge').sourceSets.main.output)
}

sourceSets.main.java.srcDir rootProject.file('RuntimeTests/Common/src/main/java')

def networkTestPort = providers.gradleProperty('networkTestPort').getOrElse('25575')
def networkTestMarkers = providers.gradleProperty('networkTestMarkers')
        .getOrElse(layout.buildDirectory.dir('markers').get().asFile.absolutePath)
def geometryMarkers = layout.buildDirectory.dir('geometry-markers')
def geometryRunDirectory = layout.buildDirectory.dir('run/geometryClient')

neoForge {
    version = neoforge_version

    runs {
        networkTestServer {
            server()
            disableIdeRun()
            gameDirectory = project.file('build/run/server')
            programArgument('--nogui')
            systemProperty('mismatchedboots.runtimetest.markers', networkTestMarkers)
            systemProperty('mismatchedboots.runtimetest.loader', 'neoforge')
            systemProperty('mismatchedboots.runtimetest.stopAfterReady',
                    providers.gradleProperty('networkTestStopAfterReady').getOrElse('false'))
            jvmArgument('-Xmx1G')
        }
        networkTestClient {
            client()
            disableIdeRun()
            gameDirectory = project.file('build/run/client')
            systemProperty('mismatchedboots.runtimetest.markers', networkTestMarkers)
            systemProperty('mismatchedboots.runtimetest.loader', 'neoforge')
            systemProperty('mismatchedboots.test.hideClientWindow', 'true')
            systemProperty('mismatchedboots.runtimetest.dismissWarnings', 'true')
            programArgument('--quickPlayMultiplayer')
            programArgument("127.0.0.1:${networkTestPort}")
            jvmArgument('-Xmx1G')
        }
        geometryClient {
            client()
            disableIdeRun()
            gameDirectory = geometryRunDirectory.get().asFile
            systemProperty('mismatchedboots.runtimetest.markers', geometryMarkers.get().asFile.absolutePath)
            systemProperty('mismatchedboots.runtimetest.geometryTest', 'true')
            systemProperty('mismatchedboots.test.hideClientWindow', 'true')
            systemProperty('mismatchedboots.runtimetest.dismissWarnings', 'true')
            jvmArgument('-Xmx1G')
        }
    }

    mods {
        mismatchedboots_runtime_test {
            sourceSet sourceSets.main
        }
    }
}

tasks.register('prepareGeometryClient') {
    dependsOn(':NeoForge:jar')
    doLast {
        delete(geometryMarkers)
        delete(geometryRunDirectory)

        def runDirectory = geometryRunDirectory.get().asFile
        def modsDirectory = new File(runDirectory, 'mods')
        modsDirectory.mkdirs()
        copy {
            from(project(':NeoForge').tasks.named('jar').flatMap { it.archiveFile })
            into(modsDirectory)
        }
        new File(runDirectory, 'options.txt').text = 'soundCategory_master:0.0\n'
        def configDirectory = new File(runDirectory, 'config')
        configDirectory.mkdirs()
        new File(configDirectory, 'fml.toml').text = 'earlyWindowControl = false\n'
    }
}

tasks.named('runGeometryClient') {
    dependsOn('prepareGeometryClient')
}

tasks.register('verifyGeometryCharacterization') {
    group = 'verification'
    description = 'Characterizes rotated item-model topology in a hidden and muted NeoForge client.'
    dependsOn('runGeometryClient')
    doLast {
        def markerDirectory = geometryMarkers.get().asFile
        def failure = new File(markerDirectory, 'geometry-client-failure.txt')
        if (failure.exists()) {
            throw new GradleException("NeoForge geometry characterization failed:\n${failure.text}")
        }
        def success = new File(markerDirectory, 'geometry-success.txt')
        def report = new File(markerDirectory, 'geometry-report.txt')
        if (!success.exists() || !report.exists()) {
            throw new GradleException('NeoForge geometry characterization did not produce its result markers')
        }
        logger.lifecycle("NeoForge geometry characterization:\n${report.text}")
    }
}
