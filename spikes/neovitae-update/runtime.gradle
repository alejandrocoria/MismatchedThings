import java.util.concurrent.TimeUnit

// Opt-in research. Only this fixture compiles these observers; production JARs stay unchanged.
def research = rootProject.file('spikes/neovitae-update')
sourceSets.main.java.srcDir(new File(research, 'src'))
def ordinaryEntry = file('src/main/java/games/alejandrocoria/mismatchedleggings/test/SkeletonTestNeoForge.java').canonicalFile
sourceSets.main.java.exclude { it.file.canonicalFile == ordinaryEntry }
sourceSets.main.resources.srcDir(new File(research, 'resources'))
def resolver = project(':MismatchedThings').testModArtifacts
def boots = project(':MismatchedBoots:NeoForge')
def leggings = project(':MismatchedLeggings:NeoForge')
dependencies.add('compileOnly', files(providers.provider { resolver.resolveRuntime('NeoForge', 'server', ['neovitae']) }))
dependencies.add('compileOnly', files(boots.tasks.named('jar').flatMap { it.archiveFile }))
tasks.named('processResources') {
    inputs.property('neoVitaeResearch', true)
    doLast { new File(destinationDir, 'META-INF/neoforge.mods.toml').append('\n[[mixins]]\nconfig="neovitae-update-spike.mixins.json"\n') }
}

def mode = providers.gradleProperty('nvSpikeMode').getOrElse('baseline')
def stage = providers.gradleProperty('nvSpikeStage').getOrElse('write')
if (!(mode in ['baseline', 'share', 'recognize']) || !(stage in ['write', 'reopen', 'client'])) {
    throw new GradleException('Unknown Neo Vitae research mode/stage')
}
def directory = layout.buildDirectory.dir("neovitae-update/${neoforge_version}/${mode}").get().asFile
def reports = new File(directory, "reports/${stage}")
def buildRoot = layout.buildDirectory.get().asFile
def expected = new File(directory, 'expected.json')
def legacy = new File(directory.parentFile, 'baseline/expected.json')

tasks.register('prepareNeoVitaeSpike') {
    dependsOn tasks.named('classes'), boots.tasks.named('assemble'), leggings.tasks.named('assemble')
    doLast {
        def reset = { File target ->
            if (!target.canonicalFile.toPath().startsWith(buildRoot.canonicalFile.toPath())) {
                throw new GradleException('Research reset escaped disposable fixture build directory')
            }
            delete target
        }
        if (stage == 'write') { reset(directory) }
        else if (!expected.isFile() || !new File(directory, 'server/research/level.dat').isFile()) {
            throw new GradleException('Research requires its preceding saved-world write')
        }
        reset(reports)
        reports.mkdirs()
        def endpoint = stage == 'client' ? 'client' : 'server'
        def run = new File(directory, endpoint)
        def selected = resolver.resolveRuntime('NeoForge', endpoint, ['neovitae'])
        selected += [boots.tasks.named('jar').get().archiveFile.get().asFile,
                     leggings.tasks.named('jar').get().archiveFile.get().asFile]
        def mods = new File(run, 'mods')
        mods.mkdirs()
        if (mods.listFiles().any { existing -> !selected.any { it.name == existing.name } }) {
            throw new GradleException("Unexpected artifact in research ${mods}")
        }
        copy { from selected; into mods }
        new File(reports, 'graph.txt').text = selected.collect {
            it.name + ' ' + java.security.MessageDigest.getInstance('SHA-256').digest(it.bytes).encodeHex()
        }.join('\n') + '\n'
        def config = new File(run, 'config')
        config.mkdirs()
        new File(config, 'fml.toml').text = 'earlyWindowControl = false\n'
        if (stage == 'write') {
            ['mismatchedboots', 'mismatchedleggings'].each { product ->
                new File(config, "${product}-components.toml").text = mode != 'baseline'
                        ? '[components."neovitae:hellforged"]\npolicy = "share"\n' : ''
            }
        }
        if (endpoint == 'server') {
            new File(run, 'eula.txt').text = 'eula=true\n'
            new File(run, 'server.properties').text = 'online-mode=false\nserver-ip=127.0.0.1\nserver-port=0\nlevel-name=research\nview-distance=2\nsimulation-distance=2\nmax-tick-time=-1\nlevel-type=minecraft:flat\ngenerator-settings={"biome":"minecraft:plains","layers":[{"height":1,"block":"minecraft:bedrock"}],"structure_overrides":[]}\n'
        } else {
            new File(run, 'options.txt').text = 'soundCategory_master:0.0\nnarrator:0\npauseOnLostFocus:false\nguiScale:2\n'
            reset(new File(run, 'saves/research'))
            copy { from new File(directory, 'server/research'); into new File(run, 'saves/research') }
        }
    }
}
['server', 'client'].each { endpoint ->
    neoForge.runs.create("neoVitaeSpike${endpoint.capitalize()}") {
        if (endpoint == 'server') { server(); programArgument('--nogui') }
        else { client(); programArgument('--quickPlaySingleplayer'); programArgument('research') }
        disableIdeRun()
        gameDirectory = new File(directory, endpoint)
        systemProperty('nv.spike', 'true')
        systemProperty('nv.spike.share', (mode != 'baseline').toString())
        systemProperty('nv.spike.legacyReader', (mode == 'recognize').toString())
        systemProperty('nv.spike.stage', stage)
        systemProperty('nv.spike.expected', expected.absolutePath)
        systemProperty('nv.spike.legacy', legacy.absolutePath)
        systemProperty('leggings.test.report', reports.absolutePath)
        jvmArgument('-Xmx1G')
    }
    tasks.named("runNeoVitaeSpike${endpoint.capitalize()}") { dependsOn 'prepareNeoVitaeSpike' }
}

def rootDirectory = rootProject.projectDir
def launcher = rootProject.file('gradlew.bat')
def init = new File(research, 'init.gradle')
def ownerPath = project.path
def baseline = neoforge_version
def offline = gradle.startParameter.offline
tasks.register('verifyNeoVitaeSpike') {
    group = 'verification'
    description = 'Opt-in Neo Vitae research: actual rituals/upgrades, saved-world reopen and hidden client.'
    doLast {
        directory.mkdirs()
        def marker = new File(directory, 'matrix.ok')
        marker.delete()
        ['write', 'reopen', 'client'].each { current ->
            // write resets its own directory; keep orchestration logs outside that reset target.
            def log = new File(directory.parentFile, "${mode}-${current}.log")
            def endpoint = current == 'client' ? 'client' : 'server'
            def args = [launcher.absolutePath, '--no-daemon', '--console=plain', '-Dorg.gradle.jvmargs=-Xmx768m',
                        '--init-script', init.absolutePath, "${ownerPath}:runNeoVitaeSpike${endpoint.capitalize()}",
                        "-Pneoforge_version=${baseline}", "-PnvSpikeMode=${mode}", "-PnvSpikeStage=${current}"]
            if (offline) { args.add('--offline') }
            def process = new ProcessBuilder(['cmd.exe', '/d', '/c'] + args.collect { it.toString() })
                    .directory(rootDirectory).redirectErrorStream(true).redirectOutput(log).start()
            try {
                def currentReports = new File(directory, "reports/${current}")
                if (!process.waitFor(300, TimeUnit.SECONDS) || process.exitValue() != 0
                        || !new File(currentReports, "${endpoint}.ok").isFile()
                        || new File(currentReports, "${endpoint}.failure.txt").exists()) {
                    throw new GradleException("Neo Vitae research ${current} failed: ${log}")
                }
                def errors = log.readLines().findAll { it.contains('/ERROR]') }
                if (!errors.isEmpty()) { throw new GradleException("Unexpected research errors: ${log}") }
            } finally {
                if (process.isAlive()) {
                    process.toHandle().descendants().forEach { it.destroyForcibly() }
                    process.destroyForcibly()
                }
            }
        }
        marker.text = "Neo Vitae .114 research ${mode}: native server, disk reopen and hidden client passed\n"
    }
}
