import groovy.json.JsonOutput

import java.security.MessageDigest
import java.util.concurrent.TimeUnit

group = 'games.alejandrocoria.mismatchedthings.spike'
version = '1.0.0'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

def loader = project.name.toLowerCase(Locale.ROOT)
def baseline = loader == 'fabric' ? fabric_loader_version : neoforge_version
def owningProject = project
def suiteDirectory = projectDir.parentFile
def boots = project(":MismatchedBoots:${project.name}")
evaluationDependsOn(boots.path)
def productionJar = boots.tasks.named('jar').flatMap { it.archiveFile }
def operations = objects.newInstance(FixtureFileOperations).files
def outputDirectory = layout.buildDirectory
def rootDirectory = rootProject.projectDir
def launcher = rootProject.file('gradlew.bat')
def frozenDirectory = layout.buildDirectory.dir("frozen/${baseline}")
ext.spikeCase = providers.gradleProperty('workbenchCase').getOrElse('both')
if (!(spikeCase in ['core', 'boots', 'addon', 'both', 'incompatible'])) {
    throw new GradleException("Unknown workbench spike case: ${spikeCase}")
}
ext.spikeRunDirectory = layout.buildDirectory.dir("run/${baseline}/${spikeCase}").get()
ext.spikeReportDirectory = layout.buildDirectory.dir("reports/${baseline}/${spikeCase}").get()
def upgrade = providers.gradleProperty('workbenchUpgrade').map { it.toBoolean() }.getOrElse(false)
ext.spikeClientPhase = upgrade ? 'upgrade-client' : 'client'
ext.spikeClientDirectory = spikeRunDirectory.dir(spikeClientPhase)
ext.spikeSeedReport = layout.buildDirectory.dir("reports/${baseline}/${upgrade ? 'boots' : spikeCase}").get()
def runDirectory = spikeRunDirectory
def reportDirectory = spikeReportDirectory
def clientDirectory = spikeClientDirectory
def clientPhase = spikeClientPhase
def selectedCase = spikeCase

sourceSets {
    core {
        java.srcDirs = [new File(suiteDirectory, 'src/core/java'), new File(suiteDirectory, "src/${loader}/core")]
        resources.srcDir new File(suiteDirectory, 'src/core/resources')
        compileClasspath += sourceSets.main.compileClasspath
    }
    v11 {
        java.srcDir new File(suiteDirectory, 'src/v11/java')
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.core.output
    }
    bootsConsumer {
        java.srcDirs = [new File(suiteDirectory, 'src/boots/java'), new File(suiteDirectory, "src/${loader}/boots")]
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.core.output
        compileClasspath += files(productionJar, boots.sourceSets.main.compileClasspath)
    }
    addonConsumer {
        java.srcDirs = [new File(suiteDirectory, 'src/addon/java'), new File(suiteDirectory, "src/${loader}/addon")]
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.core.output + sourceSets.v11.output
    }
    main {
        java.srcDirs = [new File(suiteDirectory, 'src/observer/java'), new File(suiteDirectory, "src/${loader}/observer")]
        // API is compile-only. Runtime must discover it exclusively through nested consumer JARs.
        compileClasspath += sourceSets.core.output
    }
}

// Avoid a core -> main -> core compile cycle: the base dependency configuration has no API output.
sourceSets.core.compileClasspath = configurations.compileClasspath
sourceSets.v11.compileClasspath = configurations.compileClasspath + sourceSets.core.output

tasks.named('compileBootsConsumerJava') { dependsOn boots.tasks.named('jar') }

// Reuse the actual station assets, rebased only in this disposable research artifact.
tasks.named('processCoreResources') {
    from(rootProject.file('mods/MismatchedBoots/Common/src/main/resources')) {
        include 'assets/mismatchedboots/blockstates/mismatched_workbench.json'
        include 'assets/mismatchedboots/items/mismatched_workbench.json'
        include 'assets/mismatchedboots/models/block/mismatched_workbench.json'
        include 'assets/mismatchedboots/textures/block/mismatched_workbench_*.png'
        include 'assets/mismatchedboots/textures/gui/sprites/container/mismatched_workbench/arrows.png'
        include 'data/mismatchedboots/recipe/mismatched_workbench.json'
        include 'data/mismatchedboots/loot_table/blocks/mismatched_workbench.json'
        include 'data/mismatchedboots/advancement/recipes/decorations/mismatched_workbench.json'
        include 'data/minecraft/tags/block/mineable/axe.json'
        eachFile { path = path.replace('/mismatchedboots/', '/mismatchedthings/') }
        filesMatching('**/*.json') {
            filter { line -> line.replace('mismatchedboots:', 'mismatchedthings:') }
        }
    }
}

def metadata = { String id, String modVersion, Map entries, String coreRange, String nested ->
    if (loader == 'fabric') {
        def dependencies = [fabricloader: ">=${fabric_loader_version}", minecraft: minecraft_version, java: '>=25']
        if (coreRange) { dependencies.mismatchedthings = coreRange }
        if (id == 'workbench_boots_consumer') { dependencies.mismatchedboots = '*' }
        def descriptor = [schemaVersion: 1, id: id, version: modVersion, name: "Shared Workbench Spike (${id})",
                          environment: '*', entrypoints: entries, depends: dependencies]
        if (nested) { descriptor.jars = [[file: nested]] }
        return ['fabric.mod.json': JsonOutput.prettyPrint(JsonOutput.toJson(descriptor))]
    }
    def content = """modLoader="javafml"
loaderVersion="[1,)"
license="MIT"
[[mods]]
modId="${id}"
version="${modVersion}"
displayName="Shared Workbench Spike (${id})"
"""
    if (coreRange) {
        content += """[[dependencies.${id}]]
modId="mismatchedthings"
type="required"
versionRange="${coreRange}"
ordering="AFTER"
side="BOTH"
"""
    }
    if (id == 'workbench_boots_consumer') {
        content += """[[dependencies.${id}]]
modId="mismatchedboots"
type="required"
versionRange="[1,)"
ordering="AFTER"
side="BOTH"
"""
    }
    ['META-INF/neoforge.mods.toml': content]
}

def namespace = 'games.alejandrocoria.mismatchedthings.spike'
def generated = { String name, Closure contents ->
    def directory = layout.buildDirectory.dir("generated/${name}")
    def producer = tasks.register("generate${name.capitalize()}") {
        outputs.dir(directory)
        outputs.upToDateWhen { false }
        doLast {
            contents().each { path, text ->
                def target = new File(directory.get().asFile, path)
                target.parentFile.mkdirs()
                target.setText(text.toString(), 'UTF-8')
            }
        }
    }
    [producer: producer, directory: directory]
}

def observerMetadata = generated('observerMetadata') {
    metadata('shared_workbench_observer', '1.0.0',
            [main: ["${namespace}.observer.ObserverFabric"], client: ["${namespace}.observer.ObserverFabricClient"]],
            loader == 'fabric' ? '>=1.0.0 <2.0.0' : '[1.0.0,2.0.0)', null)
}
sourceSets.main.resources.srcDir observerMetadata.directory
tasks.named('processResources') { dependsOn observerMetadata.producer }

def coreJars = [:]
['1.0.0', '1.1.0'].each { coreVersion ->
    def suffix = coreVersion == '1.0.0' ? 'V10' : 'V11'
    def resources = generated("core${suffix}Metadata") {
        metadata('mismatchedthings', coreVersion,
                [main: ["${namespace}.core.CoreFabric"], client: ["${namespace}.core.CoreFabricClient"]], null, null)
    }
    coreJars[coreVersion] = tasks.register("core${suffix}Jar", Jar) {
        archiveFileName = "shared-workbench-${loader}-${coreVersion}.jar"
        from(sourceSets.core.output)
        if (suffix == 'V11') { from(sourceSets.v11.output) }
        from(resources.directory)
        dependsOn resources.producer
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}

def consumerJars = [:]
['boots', 'addon', 'incompatible'].each { kind ->
    def isBoots = kind == 'boots'
    def coreVersion = isBoots ? '1.0.0' : '1.1.0'
    def id = isBoots ? 'workbench_boots_consumer' : 'workbench_addon_consumer'
    def lower = kind == 'incompatible' ? '2.0.0' : coreVersion
    def upper = kind == 'incompatible' ? '3.0.0' : '2.0.0'
    def range = "[${lower},${upper})"
    def nestedPath = "META-INF/${loader == 'fabric' ? 'jars' : 'jarjar'}/shared-workbench-${loader}-${coreVersion}.jar"
    def resources = generated("${kind}Metadata") {
        def result = metadata(id, '1.0.0', [main: ["${namespace}.${isBoots ? 'boots.Boots' : 'addon.Addon'}Fabric"]],
                loader == 'fabric' ? ">=${lower} <${upper}" : range, nestedPath)
        if (loader == 'neoforge') {
            // Research artifacts reproduce the loader's published metadata format, without publishing a Maven fixture.
            result['META-INF/jarjar/metadata.json'] = JsonOutput.prettyPrint(JsonOutput.toJson([jars: [[
                    identifier: [group: 'games.alejandrocoria.mismatchedthings.spike', artifact: 'shared-workbench-neoforge'],
                    version: [range: range, artifactVersion: coreVersion], path: nestedPath, isObfuscated: false]]]))
        }
        result["data/${id}/recipe/compose.json"] = JsonOutput.toJson([type: "${id}:compose"])
        result
    }
    consumerJars[kind] = tasks.register("${kind}ConsumerJar", Jar) {
        archiveFileName = "${id}-${kind}-${loader}-1.0.0.jar"
        from(sourceSets[isBoots ? 'bootsConsumer' : 'addonConsumer'].output)
        from(resources.directory)
        dependsOn resources.producer, coreJars[coreVersion]
        from(coreJars[coreVersion].flatMap { it.archiveFile }) {
            into "META-INF/${loader == 'fabric' ? 'jars' : 'jarjar'}"
        }
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}

def digest = { File file -> MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString() }

def packaging = tasks.register('verifySpikePackaging') {
    dependsOn consumerJars.values(), coreJars.values(), productionJar
    doLast {
        coreJars.each { coreVersion, producer ->
            new java.util.zip.ZipFile(producer.get().archiveFile.get().asFile).withCloseable { zip ->
                def classes = zip.entries().findAll { it.name.endsWith('.class') }.collect { it.name }
                if (classes.any { !it.startsWith('games/alejandrocoria/mismatchedthings/spike/core/') }
                        || classes.contains('games/alejandrocoria/mismatchedthings/spike/core/WorkbenchExtensions.class') != (coreVersion == '1.1.0')) {
                    throw new GradleException("Core API/version isolation failed: ${coreVersion}")
                }
            }
        }
        consumerJars.each { kind, producer ->
            new java.util.zip.ZipFile(producer.get().archiveFile.get().asFile).withCloseable { zip ->
                def classes = zip.entries().findAll { it.name.endsWith('.class') }.collect { it.name }
                def owner = kind == 'boots' ? 'boots' : 'addon'
                if (classes.any { !it.startsWith("games/alejandrocoria/mismatchedthings/spike/${owner}/") }) {
                    throw new GradleException("Consumer contains another owner's API/implementation: ${kind}")
                }
                def version = kind == 'boots' ? '1.0.0' : '1.1.0'
                def nested = zip.entries().findAll { it.name.endsWith('.jar') }
                if (nested.size() != 1 || !Arrays.equals(zip.getInputStream(nested.first()).readAllBytes(), coreJars[version].get().archiveFile.get().asFile.bytes)) {
                    throw new GradleException("Wrong nested core: ${kind}")
                }
            }
        }
        new java.util.zip.ZipFile(productionJar.get().asFile).withCloseable { zip ->
            if (zip.entries().any { it.name.contains('mismatchedthings/spike/') || it.name.startsWith('assets/mismatchedthings/') }) {
                throw new GradleException('Research content leaked into the published Boots artifact')
            }
        }
    }
}

def freeze = tasks.register('freezeConsumers') {
    dependsOn packaging
    inputs.files(productionJar, consumerJars.values().collect { it.flatMap { it.archiveFile } })
    outputs.dir(frozenDirectory)
    doLast {
        operations.copy {
            from productionJar, consumerJars.values().collect { it.flatMap { it.archiveFile } }
            into frozenDirectory
        }
        def files = frozenDirectory.get().asFile.listFiles().findAll { it.name.endsWith('.jar') }
        new File(frozenDirectory.get().asFile, 'hashes.json').text = JsonOutput.toJson(files.collectEntries { [(it.name): digest(it)] })
    }
}

def stage = { File directory ->
    def jars = [core: [], boots: ['boots'], addon: ['addon'], both: ['boots', 'addon'], incompatible: ['boots', 'incompatible']][selectedCase]
    def frozen = frozenDirectory.get().asFile
    def recorded = new groovy.json.JsonSlurper().parse(new File(frozen, 'hashes.json'))
    recorded.each { name, hash ->
        if (digest(new File(frozen, name)) != hash) { throw new GradleException("Frozen consumer changed: ${name}") }
    }
    def mods = new File(directory, 'mods')
    mods.mkdirs()
    jars.each { kind ->
        def name = consumerJars[kind].get().archiveFile.get().asFile.name
        operations.copy { from new File(frozen, name); into mods }
    }
    if (selectedCase in ['boots', 'both', 'incompatible']) {
        operations.copy { from new File(frozen, productionJar.get().asFile.name); into mods }
    }
    if (selectedCase == 'core') { operations.copy { from coreJars['1.0.0'].flatMap { it.archiveFile }; into mods } }
    def config = new File(directory, 'config')
    config.mkdirs()
    new File(config, 'fml.toml').text = 'earlyWindowControl = false\n'
}

tasks.register('prepareSpikeServer') {
    dependsOn freeze, tasks.named('classes')
    doLast {
        def directory = runDirectory.dir('server').asFile
        operations.delete { delete directory, reportDirectory.asFile }
        reportDirectory.asFile.mkdirs()
        stage(directory)
        new File(directory, 'eula.txt').text = 'eula=true\n'
        new File(directory, 'server.properties').text = '''online-mode=false
server-ip=127.0.0.1
server-port=0
spawn-protection=0
view-distance=2
simulation-distance=2
max-tick-time=-1
level-type=minecraft:flat
generator-settings={"biome":"minecraft:plains","layers":[{"height":1,"block":"minecraft:bedrock"},{"height":2,"block":"minecraft:dirt"},{"height":1,"block":"minecraft:grass_block"}],"structure_overrides":[]}
'''
    }
}

tasks.register('prepareSpikeClient') {
    dependsOn freeze, tasks.named('classes')
    doLast {
        def world = upgrade ? outputDirectory.dir("run/${baseline}/boots/server/world").get().asFile : runDirectory.dir('server/world').asFile
        if (!new File(world, 'level.dat').isFile()) { throw new GradleException('Run the server phase first') }
        def directory = clientDirectory.asFile
        operations.delete {
            delete directory, new File(reportDirectory.asFile, "${clientPhase}.ok"), new File(reportDirectory.asFile, 'failure.txt')
        }
        stage(directory)
        operations.copy { from world; into new File(directory, 'saves/spike') }
        new File(directory, 'options.txt').text = 'soundCategory_master:0.0\nnarrator:0\npauseOnLostFocus:false\n'
    }
}

def offline = gradle.startParameter.offline

def runMatrix = { boolean upgradeOnly ->
    def reports = outputDirectory.dir("matrix/${baseline}").get().asFile
    reports.mkdirs()
    def originalHashes = new groovy.json.JsonSlurper().parse(new File(frozenDirectory.get().asFile, 'hashes.json'))
    def launch = { String scenario, String phase, boolean reject ->
        def log = new File(reports, "${scenario}-${phase}.log")
        def arguments = [launcher.absolutePath, '--no-daemon', '--console=plain', '-Dorg.gradle.jvmargs=-Xmx768m',
                         '-PsharedWorkbenchSpike=true', "-PworkbenchCase=${scenario}",
                         "${owningProject.path}:runSpike${phase == 'upgrade-client' ? 'Client' : phase.capitalize()}"]
        if (phase == 'upgrade-client') { arguments.add('-PworkbenchUpgrade=true') }
        if (offline) { arguments.add('--offline') }
        if (loader == 'neoforge') { arguments.add("-Pneoforge_version=${baseline}") }
        def command = ['cmd.exe', '/d', '/c'] + arguments.collect { it.toString() }
        def process = new ProcessBuilder(command).directory(rootDirectory).redirectErrorStream(true).redirectOutput(log).start()
        try {
            if (!process.waitFor(300, TimeUnit.SECONDS)) { throw new GradleException("Timed out: ${scenario}/${phase}; ${log}") }
            def text = log.getText('UTF-8')
            def currentHashes = new groovy.json.JsonSlurper().parse(new File(frozenDirectory.get().asFile, 'hashes.json'))
            if (currentHashes != originalHashes) {
                throw new GradleException("Frozen consumer changed during the matrix: ${scenario}/${phase}")
            }
            if (reject) {
                if (process.exitValue() == 0 || !text.contains('2.0.0')
                        || !(text.contains('mismatchedthings') || text.contains('shared-workbench-neoforge'))
                        || !(text =~ /(?is)(incompatible|incompatib|could not find|failed to select|requires|mandatory dependencies)/)) {
                    throw new GradleException("Missing expected loader refusal: ${log}")
                }
            } else {
                def success = outputDirectory.file("reports/${baseline}/${scenario}/${phase}.ok").get().asFile
                def failure = outputDirectory.file("reports/${baseline}/${scenario}/failure.txt").get().asFile
                if (process.exitValue() != 0 || !success.isFile() || failure.exists()) { throw new GradleException("Spike failed: ${log}") }
            }
        } finally {
            if (process.isAlive()) {
                process.toHandle().descendants().forEach { it.destroyForcibly() }
                process.destroyForcibly()
            }
        }
    }
    if (upgradeOnly) {
        launch('boots', 'server', false)
    } else {
        ['core', 'boots', 'addon', 'both'].each { scenario ->
            launch(scenario, 'server', false)
            if (scenario != 'core') { launch(scenario, 'client', false) }
        }
    }
    launch('both', 'upgrade-client', false)
    if (!upgradeOnly) { launch('incompatible', 'server', true) }
    new File(reports, upgradeOnly ? 'upgrade.ok' : 'matrix.ok').text = upgradeOnly
            ? 'old-core world, frozen Boots and consumer, newer core and sibling passed\n'
            : 'four isolated server cases, three client cases, old-core world upgrade, incompatible loader refusal\n'

}

['verifySharedWorkbenchSpike': false, 'verifySharedWorkbenchUpgrade': true].each { name, upgradeOnly ->
    tasks.register(name) {
        group = 'verification'
        description = upgradeOnly ? 'Checks an old-core world with frozen consumers and a newer shared core.' :
                'Runs opt-in nested-core selection and frozen-consumer workbench acceptance.'
        dependsOn freeze, tasks.named('classes')
        doLast { runMatrix(upgradeOnly) }
    }
}
