import java.util.concurrent.TimeUnit

// Opt-in research sources only. Production artifacts never contain this directory.
sourceSets.main.java.srcDir rootProject.file('spikes/leggings-ice-and-fire/src')
tasks.named('processResources') {
    inputs.property('iafSpikeOrder', providers.gradleProperty('iafOrder').getOrElse('before'))
    from(rootProject.file('spikes/leggings-ice-and-fire/resources')) {
        expand(iafPriority: providers.gradleProperty('iafOrder').getOrElse('before') == 'before' ? 1100 : 900)
    }
}

def graph = providers.gradleProperty('iafGraph').getOrElse('alone')
def order = providers.gradleProperty('iafOrder').getOrElse('before')
def variant = providers.gradleProperty('iafVariant').getOrElse('normal')
if (!(graph in ['alone', 'boots']) || !(order in ['before', 'after']) || !(variant in ['normal', 'damage', 'lightning', 'absent'])) {
    throw new GradleException('Unknown Ice and Fire spike graph/order/variant')
}
def label = "iaf-spike-${graph}-${order}-${variant}"
def reports = layout.buildDirectory.dir("reports/${neoforge_version}/${label}").get().asFile
def directory = layout.buildDirectory.dir("run/${neoforge_version}/${label}/server").get().asFile
def product = project(':MismatchedLeggings:NeoForge')
def boots = project(':MismatchedBoots:NeoForge')

tasks.register('prepareIafSpikeServer') {
    dependsOn tasks.named('classes'), product.tasks.named('assemble')
    if (graph == 'boots') { dependsOn boots.tasks.named('assemble') }
    doLast {
        def artifacts = [product.tasks.named('jar').get().archiveFile.get().asFile]
        if (graph == 'boots') { artifacts.add(boots.tasks.named('jar').get().archiveFile.get().asFile) }
        if (variant != 'absent') {
            ['iceandfire-2.2-beta.3.jar', 'uranus-3.0-alpha.1.jar', 'jupiter-2.4.3-26.1.2-universal.jar'].each {
                artifacts.add(project(':MismatchedThings').testModArtifacts.resolve('NeoForge', it))
            }
        }
        def mods = new File(directory, 'mods')
        mods.mkdirs()
        if (mods.listFiles().any { candidate -> !artifacts.any { it.name == candidate.name } }) {
            throw new GradleException("Unexpected artifact in disposable ${mods}")
        }
        copy { from artifacts; into mods }
        reports.mkdirs()
        ['server.ok', 'server.failure.txt', 'spike.txt'].each { new File(reports, it).delete() }
        new File(directory, 'config').mkdirs()
        new File(directory, 'config/fml.toml').text = 'earlyWindowControl = false\n'
        if (variant != 'absent') {
            // Empty override objects keep native defaults without Jupiter's first-run missing-file ERROR.
            ['config/jupiter.json', 'config/iceandfire/iaf-common.json'].each { name ->
                def config = new File(directory, name)
                if (!config.exists()) { config.parentFile.mkdirs(); config.text = '{}\n' }
            }
        }
        new File(directory, 'eula.txt').text = 'eula=true\n'
        new File(directory, 'server.properties').text = 'online-mode=false\nserver-ip=127.0.0.1\nserver-port=0\nlevel-name=spike\nview-distance=2\nsimulation-distance=2\nmax-tick-time=-1\nlevel-type=minecraft:flat\ngenerator-settings={"biome":"minecraft:plains","layers":[{"height":1,"block":"minecraft:bedrock"}],"structure_overrides":[]}\n'
    }
}
neoForge.runs.create('iafSpikeServer') {
    server()
    disableIdeRun()
    gameDirectory = directory
    programArgument('--nogui')
    systemProperty('leggings.test.iafSpike', 'true')
    systemProperty('leggings.test.iafVariant', variant)
    systemProperty('leggings.test.iafOrder', order)
    systemProperty('leggings.test.boots', (graph == 'boots').toString())
    systemProperty('leggings.test.report', reports.absolutePath)
    systemProperty('mixin.debug.export', 'true')
    systemProperty('mixin.debug.export.filter', 'com.iafenvoy.iceandfire.**')
    jvmArgument('-Xmx1G')
}
tasks.named('runIafSpikeServer') { dependsOn 'prepareIafSpikeServer' }
tasks.register('verifyIafSpike') {
    group = 'verification'
    doLast {
        def logs = layout.buildDirectory.dir("verification/${neoforge_version}/${label}").get().asFile
        logs.mkdirs()
        new File(logs, 'matrix.ok').delete()
        def log = new File(logs, 'server.log')
        def arguments = [rootProject.file('gradlew.bat').absolutePath, '--no-daemon', '--console=plain', '-Dorg.gradle.jvmargs=-Xmx768m',
                         "${project.path}:runIafSpikeServer", "-Pneoforge_version=${neoforge_version}", "-PiafGraph=${graph}",
                         "-PiafOrder=${order}", "-PiafVariant=${variant}"]
        if (gradle.startParameter.offline) { arguments.add('--offline') }
        def process = new ProcessBuilder(['cmd.exe', '/d', '/c'] + arguments.collect { it.toString() })
                .directory(rootProject.projectDir).redirectErrorStream(true).redirectOutput(log).start()
        try {
            if (!process.waitFor(300, TimeUnit.SECONDS) || process.exitValue() != 0 || !new File(reports, 'server.ok').isFile()
                    || new File(reports, 'server.failure.txt').exists() || !new File(reports, 'spike.txt').isFile()) {
                throw new GradleException("Ice and Fire spike failed: ${log}")
            }
            if (log.text.contains('/ERROR]') || log.text.contains('Tide adapter disabled') || log.text.contains('boot compatibility disabled')
                    || variant == 'absent' && log.text.readLines().any { it.contains('WARN') && it.contains('iceandfire') }) {
                throw new GradleException("Unexpected spike diagnostics: ${log}")
            }
            new File(logs, 'matrix.ok').text = 'research only; native damage, per-piece Tide and sibling coexistence\n'
        } finally {
            if (process.isAlive()) { process.toHandle().descendants().forEach { it.destroyForcibly() }; process.destroyForcibly() }
        }
    }
}

// Reuse the maintained native equipped fixture, including its pre-GLFW hidden/muted hook.
if (providers.gradleProperty('leggingsIafRenderSpike').map { it.toBoolean() }.getOrElse(false)) {
    neoForge.runs.named('equippedClient') { systemProperty('leggings.test.iafSpikeRender', 'true') }
    def renderLabel = 'equipped' + (providers.gradleProperty('leggingsBoots').getOrElse('false').toBoolean() ? '-boots' : '') + '-ice-and-fire'
    tasks.named('verifyEquipped') {
        doLast {
            def report = layout.buildDirectory.file("reports/${neoforge_version}/${renderLabel}/ice-and-fire-spike-render.txt").get().asFile
            if (!report.isFile()) { throw new GradleException('Missing extra native render spike evidence') }
        }
    }
    ['Server', 'Client'].each { phase ->
        tasks.named("prepareEquipped${phase}") {
            doLast {
                def run = layout.buildDirectory.dir("run/${neoforge_version}/${renderLabel}/${phase.toLowerCase(Locale.ROOT)}").get().asFile
                ['config/jupiter.json', 'config/iceandfire/iaf-common.json'].each { name ->
                    def config = new File(run, name)
                    if (!config.exists()) { config.parentFile.mkdirs(); config.text = '{}\n' }
                }
                if (phase == 'Server') {
                    new File(layout.buildDirectory.dir("reports/${neoforge_version}/${renderLabel}").get().asFile,
                            'ice-and-fire-spike-render.txt').delete()
                }
            }
        }
    }
}
