import java.util.concurrent.TimeUnit

plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version)
neoForge { version = neoforge_version }

evaluationDependsOn(':MismatchedLeggings:NeoForge')
evaluationDependsOn(':MismatchedThings:NeoForge')
evaluationDependsOn(':MismatchedBoots:NeoForge')
def leggingsJar = project(':MismatchedLeggings:NeoForge').tasks.named('jar').flatMap { it.archiveFile }
def coreJar = project(':MismatchedThings:NeoForge').tasks.named('jar').flatMap { it.archiveFile }
def bootsJar = project(':MismatchedBoots:NeoForge').tasks.named('jar').flatMap { it.archiveFile }
dependencies { compileOnly files(leggingsJar, coreJar) }

def spikeModes = ['native', 'candidate', 'refused', 'absent', 'candidateBoots']
neoForge.mods { leggings_aqua_spike { sourceSet sourceSets.main } }
spikeModes.each { mode ->
    def runDirectory = layout.buildDirectory.dir("run/${neoforge_version}/${mode}")
    def reports = layout.buildDirectory.dir("reports/${neoforge_version}/${mode}")
    neoForge.runs.create(mode) {
        server()
        disableIdeRun()
        programArgument('--nogui')
        gameDirectory = runDirectory.get().asFile
        systemProperty('aqua.spike.mode', mode)
        systemProperty('aqua.spike.report', reports.get().asFile.absolutePath)
        jvmArgument('-Xmx1G')
    }
    tasks.register("prepare${mode.capitalize()}") {
        dependsOn ':MismatchedLeggings:verifyPackaging', tasks.named('classes')
        if (mode == 'candidateBoots') { dependsOn ':MismatchedBoots:NeoForge:assemble' }
        doLast {
            def directory = runDirectory.get().asFile
            def mods = new File(directory, 'mods')
            mods.mkdirs()
            def artifacts = [leggingsJar.get().asFile]
            if (mode != 'absent') {
                artifacts.add(project(':MismatchedBoots').testModArtifacts.resolve('NeoForge', 'Aquaculture-26.1.1-2.9.2.jar'))
            }
            if (mode == 'candidateBoots') { artifacts.add(bootsJar.get().asFile) }
            if (mods.listFiles().any { existing -> !artifacts.any { it.name == existing.name } }) {
                throw new GradleException("Unexpected content in disposable ${mods}")
            }
            copy { from artifacts; into mods }
            reports.get().asFile.mkdirs()
            ['passed.txt', 'failure.txt', 'report.txt'].each { new File(reports.get().asFile, it).delete() }
            new File(directory, 'eula.txt').text = 'eula=true\n'
            new File(directory, 'server.properties').text = '''online-mode=false
server-ip=127.0.0.1
server-port=0
view-distance=2
simulation-distance=2
max-tick-time=-1
level-type=minecraft:flat
generator-settings={"biome":"minecraft:plains","layers":[{"height":1,"block":"minecraft:bedrock"}],"structure_overrides":[]}
'''
        }
    }
    tasks.named("run${mode.capitalize()}") { dependsOn "prepare${mode.capitalize()}" }
}

tasks.register('verifySpike') {
    group = 'verification'
    description = 'Isolated Aquaculture gravity-query feasibility controls; no production adaptation.'
    doLast {
        def selected = providers.gradleProperty('aquaSpikeModes').getOrElse(spikeModes.join(',')).split(',').toList()
        if (selected.any { !(it in spikeModes) }) { throw new GradleException('Unknown Aquaculture spike mode') }
        selected.each { mode ->
            def reports = layout.buildDirectory.dir("reports/${neoforge_version}/${mode}").get().asFile
            reports.mkdirs()
            def log = new File(reports, 'process.log')
            def arguments = [rootProject.file('gradlew.bat').absolutePath, '--no-daemon', '--console=plain',
                             '-Dorg.gradle.jvmargs=-Xmx768m', '-PleggingsAquacultureSpike=true',
                             "-Pneoforge_version=${neoforge_version}", ":LeggingsAquacultureSpike:run${mode.capitalize()}"]
            if (gradle.startParameter.offline) { arguments.add('--offline') }
            def process = new ProcessBuilder(['cmd.exe', '/d', '/c'] + arguments.collect { it.toString() })
                    .directory(rootProject.projectDir).redirectErrorStream(true).redirectOutput(log).start()
            try {
                if (!process.waitFor(240, TimeUnit.SECONDS) || process.exitValue() != 0
                        || !new File(reports, 'passed.txt').isFile() || new File(reports, 'failure.txt').exists()) {
                    throw new GradleException("Aquaculture spike ${mode} failed: ${log}")
                }
                if (log.text.contains('/ERROR]')) { throw new GradleException("Unexpected error diagnostics: ${log}") }
                logger.lifecycle(new File(reports, 'report.txt').text.trim())
            } finally {
                if (process.isAlive()) {
                    process.toHandle().descendants().forEach { it.destroyForcibly() }
                    process.destroyForcibly()
                }
            }
        }
    }
}
