import groovy.json.JsonSlurper

// Opt-in build-tooling experiment. Never applied by the normal settings/build scripts.
class SpikeArtifactSelection {
    private final Map<String, Map> entries = [:]

    SpikeArtifactSelection(List pins, List overlay) {
        pins.each { pin ->
            def metadata = overlay.find { it.loader == pin.loader && it.id == pin.id } ?: [:]
            def entry = pin + metadata
            ([pin.filename] + (pin.id ? [pin.id] : [])).each { selector ->
                entries["${pin.loader}/${selector}".toString()] = entry
            }
        }
    }

    List<String> select(String loader, String side, List<String> roots) {
        if (!(side in ['client', 'server'])) {
            throw new GradleException("Unknown artifact side ${side}")
        }
        def selected = new LinkedHashMap<String, String>()
        def visiting = new LinkedHashSet<String>()
        Closure visit
        visit = { String selector ->
            def entry = entries["${loader}/${selector}"]
            if (entry == null) {
                throw new GradleException("Unknown artifact ${loader}/${selector}")
            }
            // ID and legacy filename aliases refer to the same exact publication.
            String key = "${loader}/${entry.filename}"
            if (visiting.contains(key)) {
                throw new GradleException("Artifact dependency cycle at ${key}")
            }
            if (selected.containsKey(key)) {
                return
            }
            visiting.add(key)
            selected[key] = (entry.id ?: entry.filename).toString()
            def dependencies = (entry.requires ?: []) + (side == 'client' ? entry.clientRequires ?: [] : [])
            dependencies.each { dependency -> visit(dependency.toString()) }
            visiting.remove(key)
        }
        roots.each { visit(it) }
        return selected.values().toList()
    }
}

gradle.projectsEvaluated {
    def root = gradle.rootProject
    if (root.findProject(':MismatchedThings') == null) { return }
    def catalogFile = root.file('mods/MismatchedThings/RuntimeTests/mod-artifacts.json')
    def pins = new JsonSlurper().parse(catalogFile)
    def overlay = new JsonSlurper().parse(root.file('spikes/artifact-wiring/catalog-overlay.json'))
    def selection = new SpikeArtifactSelection(pins, overlay)
    def resolver = root.project(':MismatchedThings').testModArtifacts
    def output = root.layout.buildDirectory.dir('artifact-wiring-spike')
    def resolutions = Collections.synchronizedSet(new LinkedHashSet<String>())
    def resolve = { String loader, String id ->
        resolutions.add("${loader}/${id}".toString())
        resolver.resolve(loader, id)
    }

    // The caller owns property names and optional override switches; the catalog does not.
    def bindGuard = { owner, Test task, String loader, String prefix, Map bindings, Map overrides ->
        bindings.each { suffix, id ->
            def override = overrides[suffix] == null ? null : owner.providers.gradleProperty(overrides[suffix])
            def overridePath = override != null && override.isPresent() ? root.file(override.get()) : null
            def path = overridePath ?: resolver.path(loader, id)
            def input = owner.providers.provider {
                if (overridePath != null) {
                    if (!overridePath.isFile()) {
                        throw new GradleException("Missing explicit guard artifact ${overridePath}")
                    }
                    return overridePath
                }
                // A guard reads this archive, not a running mod's dependency closure.
                return resolve(loader, id)
            }
            task.inputs.file(input).withPropertyName("nativeGuard.${suffix}")
                    .withPathSensitivity(PathSensitivity.NONE)
            task.systemProperty("${prefix}${suffix}", path.absolutePath)
        }
    }

    def guardTasks = ['MismatchedBoots', 'MismatchedLeggings'].collect { product ->
        def owner = root.project(":${product}:NeoForge")
        def prefix = "${product.toLowerCase(Locale.ROOT)}.test."
        def nativeTest = owner.tasks.named('test', Test).get()
        owner.tasks.register('artifactWiringSpikeGuard', Test) {
            description = 'Opt-in Roots guard characterization using the proposed artifact wiring.'
            testClassesDirs = owner.sourceSets.test.output.classesDirs
            classpath = owner.sourceSets.test.runtimeClasspath
            javaLauncher = nativeTest.javaLauncher
            // Preserve ModDev's JUnit bootstrap, not the ordinary guard input/property bindings.
            jvmArgs(nativeTest.jvmArgs)
            jvmArgumentProviders.addAll(nativeTest.jvmArgumentProviders)
            systemProperty('fml.junit.argsfile', nativeTest.systemProperties['fml.junit.argsfile'])
            dependsOn owner.tasks.named('testClasses'), owner.tasks.named('prepareNeoForgeTestFiles')
            useJUnitPlatform()
            filter { includeTestsMatching '*.RootsTickShapeTest' }
            reports.junitXml.outputLocation = output.map { it.dir("${product}/xml") }
            reports.html.outputLocation = output.map { it.dir("${product}/html") }
            binaryResultsDirectory = output.map { it.dir("${product}/binary") }
            workingDir = output.get().asFile
            bindGuard(owner, delegate, 'NeoForge', prefix, [rootsGuardJar: 'rootsclassic'],
                    [rootsGuardJar: 'artifactSpikeGuardJar'])
            doFirst { output.get().asFile.mkdirs() }
        }
    }

    def prepare = root.tasks.register('prepareArtifactWiringSpike') {
        description = 'Stages the exact Ice and Fire runtime closure without starting Minecraft.'
        // Known paths are declared without resolving/downloads during import.
        def ids = selection.select('NeoForge', 'server', ['iceandfire'])
        inputs.files(root.providers.provider { ids.collect { resolve('NeoForge', it) } })
                .withPropertyName('runtimeArtifacts').withPathSensitivity(PathSensitivity.NONE)
        outputs.dir(output.map { it.dir('runtime-mods') })
        doLast {
            def files = ids.collect { resolve('NeoForge', it) }
            root.sync { from files; into output.get().dir('runtime-mods') }
        }
    }

    root.tasks.register('verifyArtifactWiringSpike') {
        description = 'Checks real guard tasks and pinned runtime selection for the isolated spike.'
        dependsOn guardTasks, prepare
        doLast {
            assert selection.select('NeoForge', 'server', ['iceandfire']) == ['iceandfire', 'uranus', 'jupiter']
            assert selection.select('NeoForge', 'server', ['iceandfire', 'uranus', 'iceandfire']) ==
                    ['iceandfire', 'uranus', 'jupiter']
            assert selection.select('NeoForge', 'client', ['oritech']) == ['oritech', 'athena']
            assert selection.select('NeoForge', 'server', ['oritech']) == ['oritech']
            assert selection.select('NeoForge', 'server', []) == []
            def ice = pins.find { it.loader == 'NeoForge' && it.id == 'iceandfire' }
            assert selection.select('NeoForge', 'server', [ice.filename, 'iceandfire']) ==
                    ['iceandfire', 'uranus', 'jupiter']
            def cucumber = pins.find { it.loader == 'Fabric' && it.id == 'cucumber' }
            assert resolver.path('Fabric', 'cucumber') == resolver.path('Fabric', cucumber.filename)

            def expectRejected = { String message, Closure operation ->
                try {
                    operation()
                } catch (GradleException failure) {
                    assert failure.message.startsWith(message)
                    return
                }
                throw new GradleException("Expected rejection: ${message}")
            }
            expectRejected('Unknown artifact ') { selection.select('Fabric', 'server', ['iceandfire']) }
            expectRejected('Unknown artifact side ') { selection.select('NeoForge', 'guard', ['iceandfire']) }
            def broken = new SpikeArtifactSelection(pins, [[loader: 'NeoForge', id: 'iceandfire', requires: ['missing']]])
            expectRejected('Unknown artifact ') { broken.select('NeoForge', 'server', ['iceandfire']) }
            def cyclic = new SpikeArtifactSelection(pins, [
                    [loader: 'NeoForge', id: 'iceandfire', requires: ['uranus']],
                    [loader: 'NeoForge', id: 'uranus', requires: ['iceandfire']]
            ])
            expectRejected('Artifact dependency cycle ') { cyclic.select('NeoForge', 'server', ['iceandfire']) }

            def staged = output.get().dir('runtime-mods').asFile.listFiles().toList()
            assert staged*.name.toSet() == ['iceandfire', 'uranus', 'jupiter'].collect {
                resolver.path('NeoForge', it).name
            }.toSet()
            staged.each { file ->
                def digest = java.security.MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString()
                assert digest == resolver.sha256('NeoForge', file.name)
            }
            ['MismatchedBoots', 'MismatchedLeggings'].each { product ->
                def xmlFiles = output.get().dir("${product}/xml").asFile.listFiles().findAll { it.name.endsWith('.xml') }
                assert xmlFiles.size() == 1
                def report = new groovy.xml.XmlSlurper().parse(xmlFiles.first())
                assert report.@tests.toInteger() > 0
                assert report.@failures.toInteger() == 0 && report.@errors.toInteger() == 0
                assert report.@skipped.toInteger() == 0
            }
            def overrideUsed = root.providers.gradleProperty('artifactSpikeGuardJar').isPresent()
            def expectedResolutions = ['iceandfire', 'uranus', 'jupiter'].collect { "NeoForge/${it}".toString() }.toSet()
            if (!overrideUsed) { expectedResolutions.add('NeoForge/rootsclassic') }
            assert resolutions == expectedResolutions
            logger.lifecycle("Artifact wiring spike passed; resolved only ${resolutions}")
        }
    }
    // With `help` no resolver call or fixture task is executed.
    if (!resolutions.isEmpty()) { throw new GradleException('Spike resolved artifacts during configuration') }
}
