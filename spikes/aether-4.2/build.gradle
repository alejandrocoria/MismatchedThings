plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)
neoForge.version = neoforge_version

def phase = providers.gradleProperty('aetherSpike').getOrElse('candidate')
if (!(phase in ['old', 'absent', 'control', 'candidate', 'restart', 'client'])) {
    throw new GradleException("Unknown spike phase ${phase}")
}
def products = [':MismatchedBoots:NeoForge', ':MismatchedLeggings:NeoForge'].collect { path ->
    evaluationDependsOn(path)
    project(path).tasks.named('jar')
}
dependencies {
    compileOnly files(products.collect { it.flatMap { task -> task.archiveFile } })
}
def reports = layout.buildDirectory.dir('reports').get().asFile
def directory = layout.buildDirectory.dir("run/${phase}").get().asFile
def candidate = rootProject.file('build/compatibility-refresh/NeoForge-aether_ii-26.1.2-alpha.4.2-neoforge.jar')
tasks.register('prepareSpike') {
    dependsOn products, tasks.named('classes')
    doLast {
        def artifacts = products.collect { it.get().archiveFile.get().asFile }
        if (phase == 'old') {
            artifacts.add(project(':MismatchedThings').testModArtifacts.resolve('NeoForge', 'aether_ii'))
        } else if (phase != 'absent') {
            if (!candidate.isFile()) {
                candidate.parentFile.mkdirs()
                new URL('https://cdn.modrinth.com/data/JD2NSu5O/versions/hVPk1MVE/aether_ii-26.1.2-alpha.4.2-neoforge.jar')
                        .withInputStream { input -> candidate.withOutputStream { output -> output << input } }
            }
            def digest = java.security.MessageDigest.getInstance('SHA-256').digest(candidate.bytes).encodeHex().toString()
            if (digest != 'f4156bd72b4c85235aa81c571a54646fab264a015b9a44116fe7ccb427b3a2e4') {
                throw new GradleException('Unexpected alpha.4.2 binary')
            }
            artifacts.add(candidate)
        }
        def mods = new File(directory, 'mods')
        mods.mkdirs()
        if (mods.listFiles().any { file -> !artifacts.any { it.name == file.name } }) {
            throw new GradleException("Unexpected file in disposable ${mods}")
        }
        copy { from artifacts; into mods }
        reports.mkdirs()
        new File(reports, "${phase}.ok").delete()
        new File(reports, "${phase}.failure.txt").delete()
        new File(directory, 'config').mkdirs()
        new File(directory, 'config/fml.toml').text = 'earlyWindowControl = false\n'
        new File(directory, 'eula.txt').text = 'eula=true\n'
        new File(directory, 'server.properties').text = '''online-mode=false
server-ip=127.0.0.1
server-port=0
level-name=spike
view-distance=2
simulation-distance=2
max-tick-time=-1
level-type=minecraft:flat
generator-settings={"biome":"minecraft:plains","layers":[{"height":1,"block":"minecraft:bedrock"}],"structure_overrides":[]}
'''
        new File(directory, 'options.txt').text = 'soundCategory_master:0.0\nshowSubtitles:false\nnarrator:0\n'
        if (phase == 'client') {
            copy {
                from layout.buildDirectory.dir('run/candidate/spike')
                into new File(directory, 'saves/spike')
                exclude 'session.lock'
            }
        }
    }
}
neoForge {
    mods.create('aether42_spike') { sourceSet sourceSets.main }
    runs.create('spike') {
        if (phase == 'client') {
            client()
            programArguments.addAll('--quickPlaySingleplayer', 'spike', '--width', '960', '--height', '540')
        } else {
            server()
            programArgument('--nogui')
        }
        disableIdeRun()
        gameDirectory = directory
        systemProperty('aether.spike.phase', phase)
        systemProperty('aether.spike.report', reports.absolutePath)
        jvmArgument('-Xmx1G')
    }
}
tasks.named('runSpike') {
    dependsOn 'prepareSpike'
    doLast {
        if (!new File(reports, "${phase}.ok").isFile() || new File(reports, "${phase}.failure.txt").exists()) {
            throw new GradleException("Spike failed: ${reports}/${phase}.failure.txt")
        }
    }
}
