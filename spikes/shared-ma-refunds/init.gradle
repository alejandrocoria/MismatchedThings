initscript {
    repositories { mavenCentral() }
    dependencies { classpath 'org.ow2.asm:asm-tree:9.9.1' }
}

import org.objectweb.asm.ClassReader
import org.objectweb.asm.ClassWriter
import org.objectweb.asm.Opcodes
import org.objectweb.asm.tree.ClassNode
import org.objectweb.asm.tree.InsnNode
import org.objectweb.asm.tree.MethodInsnNode
import org.objectweb.asm.tree.VarInsnNode
import java.util.zip.ZipInputStream
import java.util.zip.ZipOutputStream
import java.util.zip.ZipEntry

// Explicit opt-in init script. Production sources/artifacts are never overwritten.
gradle.projectsEvaluated {
    def root = gradle.rootProject
    if (root.findProject(':MismatchedLeggings:RuntimeTests:Fabric') == null) { return }
    def spike = new File(root.projectDir, 'spikes/shared-ma-refunds')
    def prefix = 'games/alejandrocoria/sharedmaspike/'
    def checks = prefix + 'test/SpikeChecks'
    root.tasks.register('inspectSharedMaOrders') {
        doLast {
            def evidence = new StringBuilder()
            [
                    ['NeoForge', '26.1.2.114', 'mystical-refunds-current-before-normal', 1100],
                    ['NeoForge', '26.1.2.114', 'mystical-refunds-current-after-normal', 900],
                    ['Fabric', '0.19.5', 'mystical-refunds-current-before-normal', 1100],
                    ['Fabric', '0.19.5', 'mystical-refunds-current-after-normal', 900],
                    ['NeoForge', '26.1.2.114', 'jdt-refunds-both', 900],
                    ['NeoForge', '26.1.2.99', 'jdt-refunds-both', 1100]
            ].each { sample ->
                def file = root.file("mods/MismatchedLeggings/RuntimeTests/${sample[0]}/build/run/${sample[1]}/${sample[2]}/server/.mixin.out/class/net/minecraft/world/item/ItemStack.class")
                def node = new ClassNode(); new ClassReader(file.bytes).accept(node, 0)
                def ma = []; def jdt = []
                node.methods.each { method ->
                    method.visibleAnnotations?.findAll { it.desc.endsWith('/MixinMerged;') }?.each { annotation ->
                        def owner = annotation.values[annotation.values.indexOf('mixin') + 1].toString()
                        def priority = annotation.values[annotation.values.indexOf('priority') + 1]
                        if (owner.endsWith('.SharedMaMixin') && method.desc.endsWith(')V')) { ma.add(priority) }
                        if (owner.endsWith('.justdirethings.JustDireRefundMixin') && method.desc.endsWith(')V')) { jdt.add(priority) }
                        if (owner.endsWith('.mysticalagriculture.MysticalRefundMixin')) { throw new GradleException('Old product hook in actual export') }
                    }
                }
                if (ma != [sample[3]] * 4 || sample[2].startsWith('jdt-') && jdt != [1000]) {
                    throw new GradleException("Actual merged order mismatch: ${sample}: MA=${ma}; JDT=${jdt}")
                }
                evidence.append("${sample}: actual four MA priorities=${ma}; JDT=${jdt}\n")
            }
            new File(spike, 'build/evidence/actual-orders.txt').text = evidence.toString()
            println evidence
        }
    }
    ['Fabric', 'NeoForge'].each { loader ->
        def project = root.project(":MismatchedLeggings:RuntimeTests:${loader}")
        def fabric = loader == 'Fabric'
        def generated = new File(spike, "build/generated/${loader}")
        def output = new File(spike, "build/classes/${loader}")
        def testOutput = new File(spike, "build/test-classes/${loader}")
        def sourcePath = new File(root.projectDir, 'mods/MismatchedLeggings/Common/src/main/java/games/alejandrocoria/mismatchedleggings/compatibility/mysticalagriculture/MysticalRefundShape.java')
        def generate = project.tasks.register('generateSharedMaSpike') {
            doLast {
                def shape = sourcePath.text
                        .replace('package games.alejandrocoria.mismatchedleggings.compatibility.mysticalagriculture;', 'package games.alejandrocoria.sharedmaspike.core;')
                        .replace('MysticalRefundShape', 'SharedMaShape')
                        .replace('mismatchedleggings$maRefundReady', 'mismatchedthings$maRefundReady')
                        .replace('games/alejandrocoria/mismatchedleggings/compatibility/mysticalagriculture/MysticalRefundCompatibility', prefix + 'core/SharedMaRefunds')
                        .replace('games.alejandrocoria.mismatchedleggings.mixin.compatibility.mysticalagriculture.MysticalRefundMixin', 'games.alejandrocoria.sharedmaspike.core.mixin.SharedMaMixin')
                int start = shape.indexOf('    private boolean boots(MethodNode handler)')
                int end = shape.indexOf('    private boolean consumption(', start)
                if (start < 0 || end < 0) { throw new GradleException('Observer proof source changed') }
                shape = shape.substring(0, start) + '''    private boolean boots(MethodNode handler) {
        return neoForge && NeoForgeItemConsumptionProof.observer(handler);
    }

''' + shape.substring(end)
                def target = new File(generated, prefix + 'core/SharedMaShape.java')
                target.parentFile.mkdirs(); target.text = shape
                def mixin = root.file("mods/MismatchedLeggings/${loader}/src/main/java/games/alejandrocoria/mismatchedleggings/mixin/compatibility/mysticalagriculture/MysticalRefundMixin.java").text
                        .replace('package games.alejandrocoria.mismatchedleggings.mixin.compatibility.mysticalagriculture;', 'package games.alejandrocoria.sharedmaspike.core.mixin;')
                        .replace('import games.alejandrocoria.mismatchedleggings.compatibility.mysticalagriculture.MysticalRefundCompatibility;', 'import games.alejandrocoria.sharedmaspike.core.SharedMaRefunds;')
                        .replace('MysticalRefundMixin', 'SharedMaMixin').replace('MysticalRefundCompatibility', 'SharedMaRefunds')
                        .replace('mismatchedleggings$', 'mismatchedthings$').replace('leggingsMaRefund', 'sharedMaRefund')
                        .replace('priority = 1100', "priority = ${root.findProperty('sharedMaOrder') == 'after' ? 900 : 1100}")
                new File(target.parentFile, 'SharedMaMixin.java').delete()
                def mixinFile = new File(target.parentFile, 'mixin/SharedMaMixin.java')
                mixinFile.parentFile.mkdirs(); mixinFile.text = mixin
                def bootsChecks = root.file('mods/MismatchedLeggings/RuntimeTests/Common/src/main/java/games/alejandrocoria/mismatchedleggings/test/mysticalrefunds/RefundChecks.java').text
                        .replace('package games.alejandrocoria.mismatchedleggings.test.mysticalrefunds;', 'package games.alejandrocoria.sharedmaspike.test;\nimport games.alejandrocoria.mismatchedleggings.test.mysticalrefunds.RefundControl;')
                        .replace('import games.alejandrocoria.mismatchedleggings.compatibility.mysticalagriculture.MysticalAugmentsCompatibility;', 'import games.alejandrocoria.mismatchedboots.compatibility.mysticalagriculture.MysticalAugmentsCompatibility;')
                        .replace('import games.alejandrocoria.mismatchedleggings.composition.MixedLeggingsFactory;', 'import games.alejandrocoria.mismatchedboots.composition.MixedBootsFactory;')
                        .replace('import games.alejandrocoria.mismatchedleggings.content.LeggingsContent;', 'import games.alejandrocoria.mismatchedboots.content.ModContent;')
                        .replace('import games.alejandrocoria.mismatchedleggings.data.LeggingHalf;', 'import games.alejandrocoria.mismatchedboots.data.BootHalf;')
                        .replace('import games.alejandrocoria.mismatchedleggings.data.MixedLeggingsData;', 'import games.alejandrocoria.mismatchedboots.data.MixedBootsData;')
                        .replace('MixedLeggings', 'MixedBoots').replace('LeggingHalf', 'BootHalf').replace('LeggingsContent', 'ModContent')
                        .replace('SPEED_III', 'JUMP_BOOST_III')
                        .replace('mixedLeggingsDataType()', 'mixedBootsDataType().orElseThrow()')
                        .replace('_leggings', '_boots').replace('_LEGGINGS', '_BOOTS').replace('EquipmentSlot.LEGS', 'EquipmentSlot.FEET')
                        .replace('RefundChecks', 'BootsRefundChecks').replace('private static void run(MinecraftServer', 'public static void run(MinecraftServer')
                        .replace('if (!System.getProperty("leggings.test.maGraph", "alone").equals("alone")) { boots(server); }', '')
                start = bootsChecks.indexOf('    private static void verifyTransform(')
                end = bootsChecks.indexOf('    private static ServerPlayer player(', start)
                bootsChecks = bootsChecks.substring(0, start) + '''    private static void verifyTransform(boolean refused) throws Exception {
        SpikeChecks.verifyTransform(refused);
    }
    public static String evidence() { return REPORT.toString(); }

''' + bootsChecks.substring(end)
                def bootsFile = new File(generated, prefix + 'test/BootsRefundChecks.java')
                bootsFile.parentFile.mkdirs(); bootsFile.text = bootsChecks
            }
        }
        def compile = project.tasks.register('compileSharedMaSpike', JavaCompile) {
            dependsOn generate, project.tasks.named('classes'), root.project(":MismatchedBoots:${loader}").tasks.named('jar')
            source project.fileTree(new File(spike, 'src')), project.fileTree(generated)
            classpath = project.sourceSets.main.compileClasspath + project.sourceSets.main.output + root.files(root.project(":MismatchedBoots:${loader}").tasks.named('jar').flatMap { it.archiveFile })
            destinationDirectory = output
            javaCompiler = project.javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
        }
        project.sourceSets.main.output.dir(testOutput)

        def rewriteClass = { byte[] bytes, Closure edit ->
            def node = new ClassNode(); new ClassReader(bytes).accept(node, 0); edit(node)
            def writer = new ClassWriter(ClassWriter.COMPUTE_MAXS); node.accept(writer); writer.toByteArray()
        }
        def stub = { method, List code ->
            method.instructions.clear(); method.tryCatchBlocks.clear(); method.localVariables?.clear()
            method.visibleLocalVariableAnnotations = null; method.invisibleLocalVariableAnnotations = null
            code.each { method.instructions.add(it) }
        }
        Closure rewriteZip
        rewriteZip = { byte[] original, boolean core ->
            def target = new ByteArrayOutputStream()
            def names = new HashSet<String>()
            new ZipInputStream(new ByteArrayInputStream(original)).withCloseable { input ->
                new ZipOutputStream(target).withCloseable { zip ->
                    ZipEntry entry
                    while ((entry = input.nextEntry) != null) {
                        byte[] bytes = input.readAllBytes()
                        def name = entry.name
                        if (name.endsWith('.jar') && name.toLowerCase().contains('mismatchedthings')) { bytes = rewriteZip(bytes, true) }
                        if (core && name == 'fabric.mod.json') {
                            def metadata = new groovy.json.JsonSlurper().parse(bytes)
                            metadata.mixins.add('shared-ma-spike.mixins.json')
                            bytes = groovy.json.JsonOutput.toJson(metadata).bytes
                        }
                        if (core && name == 'META-INF/neoforge.mods.toml') { bytes = (new String(bytes) + '\n[[mixins]]\nconfig="shared-ma-spike.mixins.json"\n').bytes }
                        if (name.endsWith('/MysticalAugmentsMixinPlugin.class')) {
                            bytes = rewriteClass(bytes) { node ->
                                node.methods.findAll { it.name == 'getMixins' }.each { method ->
                                    method.instructions.toArray().findAll { it.opcode == Opcodes.ARETURN }.each { returned ->
                                        method.instructions.insertBefore(returned, new MethodInsnNode(Opcodes.INVOKESTATIC, checks, 'withoutRefund', '(Ljava/util/List;)Ljava/util/List;', false))
                                    }
                                }
                            }
                        }
                        if (name.endsWith('/MysticalRefundShape.class')) {
                            bytes = rewriteClass(bytes) { node ->
                                node.methods.findAll { it.name in ['entry', 'publish'] }.each { method ->
                                    stub(method, [new InsnNode(Opcodes.ICONST_1), new InsnNode(Opcodes.IRETURN)])
                                }
                            }
                        }
                        if (core && name.endsWith('/JustDireRefundShape.class')) {
                            bytes = rewriteClass(bytes) { node ->
                                def method = node.methods.find { it.name == 'observer' }
                                stub(method, [new VarInsnNode(Opcodes.ALOAD, 0), new MethodInsnNode(Opcodes.INVOKESTATIC, node.name, 'router', method.desc, false), new InsnNode(Opcodes.IRETURN)])
                            }
                        }
                        zip.putNextEntry(new ZipEntry(name)); zip.write(bytes); zip.closeEntry(); names.add(name)
                    }
                    if (core) {
                        project.fileTree(new File(output, prefix + 'core')).matching { include '**/*.class' }.files.each { file ->
                            def name = output.toPath().relativize(file.toPath()).toString().replace('\\', '/')
                            if (!names.add(name)) { throw new GradleException("Duplicate candidate ${name}") }
                            zip.putNextEntry(new ZipEntry(name)); zip.write(file.bytes); zip.closeEntry()
                        }
                        zip.putNextEntry(new ZipEntry('shared-ma-spike.mixins.json'))
                        zip.write(groovy.json.JsonOutput.toJson([required: true, minVersion: '0.8', compatibilityLevel: 'JAVA_25',
                                package: 'games.alejandrocoria.sharedmaspike.core.mixin', plugin: 'games.alejandrocoria.sharedmaspike.core.SharedMaPlugin',
                                mixins: ['SharedMaMixin'], injectors: [defaultRequire: 1]]).bytes)
                        zip.closeEntry()
                    }
                }
            }
            target.toByteArray()
        }
        def patchFixture = {
            project.copy { from(output) { include prefix + 'test/**' }; into testOutput }
            def classes = project.sourceSets.main.output.classesDirs.files.find { new File(it, 'games/alejandrocoria/mismatchedleggings/test/mysticalrefunds/RefundChecks.class').isFile() }
            ['mysticalrefunds/RefundChecks', 'JustDireRefundChecks'].each { suffix ->
                def file = new File(classes, "games/alejandrocoria/mismatchedleggings/test/${suffix}.class")
                if (!file.isFile()) { return }
                file.bytes = rewriteClass(file.bytes) { node ->
                    node.methods.findAll { it.name == 'tick' }.each { method ->
                        if (suffix == 'mysticalrefunds/RefundChecks' && root.findProperty('sharedMaGraph') == 'core') {
                            stub(method, [new VarInsnNode(Opcodes.ALOAD, 0), new MethodInsnNode(Opcodes.INVOKESTATIC, prefix + 'test/TimingProbe', 'coreTick', method.desc, false), new InsnNode(Opcodes.RETURN)])
                            return
                        }
                        if (suffix == 'mysticalrefunds/RefundChecks' && root.findProperty('sharedMaTiming') == 'true') {
                            stub(method, [new VarInsnNode(Opcodes.ALOAD, 0), new InsnNode(root.findProperty('sharedMaBaseline') == 'true' ? Opcodes.ICONST_1 : Opcodes.ICONST_0),
                                          new MethodInsnNode(Opcodes.INVOKESTATIC, prefix + 'test/TimingProbe', 'tick', '(Lnet/minecraft/server/MinecraftServer;Z)V', false), new InsnNode(Opcodes.RETURN)])
                            return
                        }
                        method.instructions.insert(new MethodInsnNode(Opcodes.INVOKESTATIC, checks, 'initialize', '()V', false))
                        if (suffix == 'mysticalrefunds/RefundChecks' && root.findProperty('sharedMaGraph') == 'boots') {
                            stub(method, [new MethodInsnNode(Opcodes.INVOKESTATIC, checks, 'initialize', '()V', false), new VarInsnNode(Opcodes.ALOAD, 0),
                                          new MethodInsnNode(Opcodes.INVOKESTATIC, prefix + 'test/BootsRefundChecks', 'tick', method.desc, false), new InsnNode(Opcodes.RETURN)])
                        }
                    }
                    if (suffix == 'mysticalrefunds/RefundChecks') {
                        node.methods.findAll { it.name == 'run' }.each { method ->
                            method.instructions.toArray().findAll { it.opcode == Opcodes.RETURN }.each { returned ->
                                def extra = new org.objectweb.asm.tree.InsnList()
                                extra.add(new VarInsnNode(Opcodes.ALOAD, 0))
                                extra.add(new MethodInsnNode(Opcodes.INVOKESTATIC, checks, 'extraBoots', '(Lnet/minecraft/server/MinecraftServer;)V', false))
                                method.instructions.insertBefore(returned, extra)
                            }
                        }
                    }
                    node.methods.findAll { it.name == 'verifyTransform' }.each { method ->
                        stub(method, [new VarInsnNode(Opcodes.ILOAD, 0), new MethodInsnNode(Opcodes.INVOKESTATIC, checks, 'verifyTransform', '(Z)V', false), new InsnNode(Opcodes.RETURN)])
                    }
                    node.methods.findAll { it.name == 'ready' && it.desc == '(Ljava/lang/String;)Z' }.each { method ->
                        stub(method, [new VarInsnNode(Opcodes.ALOAD, 0), new MethodInsnNode(Opcodes.INVOKESTATIC, checks, 'ready', '(Ljava/lang/String;)Z', false), new InsnNode(Opcodes.IRETURN)])
                    }
                }
            }
        }
        ['prepareMysticalRefundsServer', 'prepareJustDireRefundSeam'].each { name ->
            if (!project.tasks.findByName(name)) { return }
            project.tasks.named(name) {
                dependsOn compile
                doLast {
                    patchFixture()
                    def baseline = fabric ? root.fabric_loader_version : root.neoforge_version
                    def graph = root.findProperty('leggingsMaGraph') ?: 'alone'
                    def order = root.findProperty('leggingsMaOrder') ?: 'before'
                    def variant = root.findProperty('leggingsMaRefundVariant') ?: 'normal'
                    def absent = root.findProperty('leggingsMaAbsent') == 'true' ? '-absent' : ''
                    def label = name == 'prepareMysticalRefundsServer' ? "mystical-refunds-${graph}-${order}-${variant}${absent}"
                            : "jdt-refunds-${root.findProperty('leggingsRefundGraph') ?: 'both'}" + (root.findProperty('leggingsRefundFault') ? "-${root.findProperty('leggingsRefundFault')}" : '')
                    def mods = project.file("build/run/${baseline}/${label}/server/mods")
                    if (root.findProperty('sharedMaGraph') == 'core') {
                        project.copy { from root.project(":MismatchedThings:${loader}").tasks.named('jar').get().archiveFile; into mods }
                    }
                    mods.listFiles().findAll { it.name.toLowerCase().startsWith('mismatched') }.each { file ->
                        if (root.findProperty('sharedMaGraph') in ['boots', 'core'] && file.name.startsWith('MismatchedLeggings')) { file.delete(); return }
                        if (root.findProperty('sharedMaGraph') == 'core' && file.name.startsWith('MismatchedBoots')) { file.delete(); return }
                        if (root.findProperty('sharedMaBaseline') != 'true') { file.bytes = rewriteZip(file.bytes, file.name.toLowerCase().startsWith('mismatchedthings')) }
                    }
                    new File(spike, "build/${loader}-${baseline}-${label}-staging.txt").text = "Isolated candidate; patched staged copies only\n${mods}\n"
                }
            }
        }
    }
}
