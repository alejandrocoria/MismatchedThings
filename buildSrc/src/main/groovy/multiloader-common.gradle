plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

repositories {
    // used for local mods in the libs folder
    flatDir {
        dirs 'libs'
    }

    def localRepository = providers.gradleProperty('useMavenLocal').map { it.toBoolean() }.getOrElse(false)
            ? mavenLocal() : null
    mavenCentral()
    exclusiveContent {
        def networkingRepository = maven {
            name = 'CommonNetworking'
            url = 'https://jm.gserv.me/repository/maven-public/'
        }
        forRepositories(*(localRepository == null?[networkingRepository]
                : [localRepository, networkingRepository]) )
        filter {
            includeGroupAndSubgroups('mysticdrew')
        }
    }
    // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = "NeoForge"
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroupAndSubgroups("maven.modrinth")
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'BlameJared'
                url = 'https://maven.blamejared.com'
            }
        }
        filter {
            includeGroupAndSubgroups('mezz.jei')
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Shedaniel'
                url = 'https://maven.shedaniel.me'
            }
        }
        filter {
            includeGroupAndSubgroups('me.shedaniel')
            includeGroupAndSubgroups('me.shedaniel.cloth')
            includeGroupAndSubgroups('dev.architectury')
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Fabric'
                url = 'https://maven.fabricmc.net'
            }
        }
        filter {
            includeGroupAndSubgroups('net.fabricmc')
        }
    }
}

if (project.path in [':Common', ':Fabric', ':NeoForge']) {
    dependencies {
        // Advanced Netherite 2.4.1 Fabric, exact Modrinth version: https://modrinth.com/mod/CFX9ftUJ/version/vudH2Rjv
        compileOnly('maven.modrinth:CFX9ftUJ:vudH2Rjv') {
            transitive = false
        }
        compileOnly 'org.ow2.asm:asm-tree:9.9.1'
    }
}

// Declare capabilities on the outgoing configurations.
// Read more about capabilities here: https://docs.gradle.org/current/userguide/component_capabilities.html#sec:declaring-additional-capabilities-for-a-local-component
['apiElements', 'runtimeElements', 'sourcesElements'/*, 'javadocElements'*/].each { variant ->
    def configuration = configurations.findByName(variant)
    if (configuration == null) {
        return
    }
    configuration.outgoing {
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def expandProps = [
            "version"                      : version,
            "group"                        : project.group, //Else we target the task's group.
            "java_version"                 : java_version,
            "minecraft_version"            : minecraft_version,
            "minecraft_version_range"      : minecraft_version_range,
            "pack_format"                  : pack_format,
            "mod_name"                     : mod_name,
            "mod_author"                   : mod_author,
            "mod_id"                       : mod_id,
            "mod_description"              : mod_description,
            "mod_email"                    : mod_email,
            "mod_homepage"                 : mod_homepage,
            "mod_issues"                   : mod_issues,
            "mod_sources"                  : mod_sources,
            "mod_credits"                  : mod_credits,
            "mod_license"                  : mod_license,
            "mod_logo"                     : mod_logo,
            "fabric_api_version"           : fabric_api_version,
            "fabric_api_min_version"       : fabric_api_min_version,
            "fabric_loader_version"        : fabric_loader_version,
            "neoforge_version"             : neoforge_version,
            "neoforge_version_range"       : neoforge_version_range,
            "neoforge_loader_version_range": neoforge_loader_version_range,
            "common_networking_version"    : common_networking_version
    ]

    filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/neoforge.mods.toml', '*.mixins.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}
