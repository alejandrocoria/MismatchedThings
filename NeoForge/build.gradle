import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'idea'
    id 'net.darkhax.curseforgegradle' version '1.1.28'
    id "com.modrinth.minotaur" version "2.9.0"
}

base.archivesName = "${project.mod_name}-${project.minecraft_version}-neoforge"

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':Common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
            gameDirectory = project.file('runs/client')
        }
        server {
            server()
            gameDirectory = project.file('runs/server')
            programArgument('--nogui')
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }

    dependencies {
        implementation "mysticdrew:common-networking-neoforge:${common_networking_version}"
        implementation "com.electronwill.night-config:core:${nightconfig_version}"
        implementation "com.electronwill.night-config:toml:${nightconfig_version}"
        jarJar "mysticdrew:common-networking-neoforge:[${common_networking_version}]"
        jarJar "com.electronwill.night-config:core:[${nightconfig_version}]"
        jarJar "com.electronwill.night-config:toml:[${nightconfig_version}]"
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('jarJar')
}

dependencies {
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}"
    compileOnly "dev.architectury:architectury-neoforge:${architectury_version}"
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"
    compileOnly "net.fabricmc:fabric-loader:${fabric_loader_version}"
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    def justDireGuardArtifact = providers.gradleProperty('justDireGuardJar')
    if (justDireGuardArtifact.isPresent()) {
        systemProperty 'mismatchedboots.test.justDireGuardJar', rootProject.file(justDireGuardArtifact.get()).absolutePath
    }
    def justDireTransformed = providers.gradleProperty('justDireTransformedClass')
    def justDireArmorWearTransformed = providers.gradleProperty('justDireArmorWearTransformedClass')
    def justDireRefundTransformed = providers.gradleProperty('justDireRefundTransformedClass')
    if (justDireRefundTransformed.isPresent()) {
        systemProperty 'mismatchedboots.test.justDireRefundTransformedClass', rootProject.file(justDireRefundTransformed.get()).absolutePath
    }
    if (justDireArmorWearTransformed.isPresent()) {
        systemProperty 'mismatchedboots.test.justDireArmorWearTransformedClass', rootProject.file(justDireArmorWearTransformed.get()).absolutePath
    }
    if (justDireTransformed.isPresent()) {
        systemProperty 'mismatchedboots.test.justDireTransformedClass', rootProject.file(justDireTransformed.get()).absolutePath
    }
    def justDireSettingsTransformed = providers.gradleProperty('justDireSettingsTransformedClass')
    if (justDireSettingsTransformed.isPresent()) {
        systemProperty 'mismatchedboots.test.justDireSettingsTransformedClass', rootProject.file(justDireSettingsTransformed.get()).absolutePath
    }
    def justDireCooldownHudTransformed = providers.gradleProperty('justDireCooldownHudTransformedClass')
    if (justDireCooldownHudTransformed.isPresent()) {
        systemProperty 'mismatchedboots.test.justDireCooldownHudTransformedClass', rootProject.file(justDireCooldownHudTransformed.get()).absolutePath
    }
    def guardArtifact = providers.gradleProperty('iceAndFireGuardJar')
    if (guardArtifact.isPresent()) {
        systemProperty 'mismatchedboots.test.iceAndFireGuardJar', rootProject.file(guardArtifact.get()).absolutePath
    }
    def oritechArtifact = providers.gradleProperty('oritechGuardJar')
    if (oritechArtifact.isPresent()) {
        systemProperty 'mismatchedboots.test.oritechGuardJar', rootProject.file(oritechArtifact.get()).absolutePath
    }
}

idea {
    module {
        excludeDirs += file('runs')
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

registerProcessDocsTask(
        "NeoForge",
        neoforge_version,
        ""
)

tasks.register('publishCurseForge', TaskPublishCurseForge) {
    apiToken = "${curseForgeApiKey}"
    def mainFile = upload(curseforge_project_id, jar)
    mainFile.displayName = "${minecraft_version}-${version}-neoforge"
    mainFile.releaseType = release_type
    mainFile.addModLoader("NeoForge")
    mainFile.addJavaVersion("Java 25")
    mainFile.addGameVersion("${minecraft_version}")
    mainFile.addEnvironment("Server", "Client")
    mainFile.changelogType = "markdown"
    mainFile.changelog = file("$project.buildDir/doc/changelog.md")
}

modrinth {
//    debugMode.set(true)
    token = "${modrinthApiKey}"
    projectId = modrinth_project_id
    versionNumber = "${minecraft_version}-${version}-neoforge"
    versionName = "${mod_name}-${minecraft_version}-${version}-neoforge"
    versionType = release_type
    uploadFile = jar
    gameVersions = ["${minecraft_version}"]
    loaders = ["neoforge"]
    changelog.set(providers.provider {
        file("$project.buildDir/doc/changelog.md").text
    })
}
