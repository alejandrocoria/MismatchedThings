pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        if (providers.gradleProperty('useMavenLocal').map { it.toBoolean() }.getOrElse(false)) {
            mavenLocal()
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroup('net.fabricmc')
                includeGroup('net.fabricmc.unpick')
                includeGroup('net.fabricmc.fabric-loom')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = uri('https://repo.spongepowered.org/repository/maven-public')
                }
            }
            filter {
                includeGroupAndSubgroups("org.spongepowered")
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// The family build name is independent of the Minecraft-version checkout directory.
rootProject.name = 'MismatchedThings'
include('MismatchedBoots')
project(':MismatchedBoots').projectDir = file('mods/MismatchedBoots')

['Common', 'Fabric', 'NeoForge', 'RuntimeTests:Fabric', 'RuntimeTests:NeoForge'].each { path ->
    include("MismatchedBoots:${path}")
}

include('MismatchedThings')
project(':MismatchedThings').projectDir = file('mods/MismatchedThings')
['Common', 'Fabric', 'NeoForge', 'RuntimeTests:Fabric', 'RuntimeTests:NeoForge'].each { path ->
    include("MismatchedThings:${path}")
}

['Fabric', 'NeoForge'].each { loader ->
    include("MismatchedThings:RuntimeTests:Consumers:${loader}")
}

include('MismatchedLeggings')
project(':MismatchedLeggings').projectDir = file('mods/MismatchedLeggings')
['Common', 'Fabric', 'NeoForge', 'RuntimeTests:Fabric', 'RuntimeTests:NeoForge'].each { path ->
    include("MismatchedLeggings:${path}")
}

// Disposable rendering research, excluded from normal builds and publication.
if (providers.gradleProperty('leggingsSpike').map { it.toBoolean() }.getOrElse(false)) {
    include('LeggingsSpike')
    project(':LeggingsSpike').projectDir = file('mods/MismatchedLeggings/spikes/rendering')
    ['Fabric', 'NeoForge'].each { loader ->
        include("LeggingsSpike:${loader}")
        project(":LeggingsSpike:${loader}").projectDir = file("mods/MismatchedLeggings/spikes/rendering/${loader}")
    }
}
